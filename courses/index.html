async function boot(){
  try{
    DBH = await dbOpen();
    const [ps, as, ts, ls, ss] = await Promise.all(['products', 'aliases', 'tickets', 'list', 'settings'].map(n => store.all(n)));
    ps.forEach(p => S.products.set(p.id, p)); as.forEach(a => S.aliases.set(a.label, a));
    ts.forEach(t => S.tickets.set(t.id, t)); ls.forEach(l => S.list.set(l.id, l));
    const main = ss.find(s => s.k === 'main'); if(main) S.settings = main;
  }catch(e){ console.error(e); $('#app').innerHTML = '<p class="muted" style="text-align:center;padding:60px 0">Stockage indisponible sur ce navigateur 😕</p>'; return; }
    if(!S.settings.fmt5) migrate5();
  if(!S.settings.price11){
    for(const p of S.products.values()) if(p.priceManual && p.price != null && p.unit !== 'kg' && packOf(p) > 1){ p.price = +(p.price / packOf(p)).toFixed(4); saveP(p); }
    S.settings.price11 = true; saveSet();
  }
  render();
  if('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
}

/* ---------- Accueil ---------- */
function monthInfo(off){
  const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() - off);
  const y = d.getFullYear(), m = d.getMonth();
  const ts = [...S.tickets.values()].filter(t => { const x = new Date(t.date); return x.getFullYear() === y && x.getMonth() === m; });
  const sum = ts.reduce((s, t) => s + (t.total || 0), 0);
  return {d, n: ts.length, sum, long: cap(d.toLocaleDateString('fr-FR', {month:'long'})), short: cap(d.toLocaleDateString('fr-FR', {month:'short'}))};
}
function itemsByRayon(items){
  const g = new Map(RAYONS.map(([r]) => [r, []]));
  for(const it of items){ const p = S.products.get(it.pid); if(!p) continue; (g.get(p.rayon) || g.get('autre')).push({it, p}); }
  return g;
}
function nextShop(){
  let sum = 0, n = 0, miss = 0;
  const seen = new Set();
  for(const it of S.list.values()){ if(it.checked) continue; const p = S.products.get(it.pid); if(!p) continue; seen.add(p.id); n++; const pr = itemPrice(it, p); if(pr == null) miss++; else sum += pr; }
  for(const [pid, q] of PLAN.need){ if(seen.has(pid)) continue; const p = S.products.get(pid); if(!p) continue; n++; const u = priceOf(p); if(u == null) miss++; else sum += u * q; }
  return {sum, n, miss};
}
function render(){
  buildPrices();
  syncAuto();
  const months = [0, 1].map(monthInfo);
  const ns = nextShop();
  const recent = [...S.tickets.values()].filter(t => t.date > Date.now() - 90 * DAY && t.total != null);
  const low = [...S.products.values()].filter(p => { const pc = stockPct(p), d = daysLeft(p); return pc != null && (pc < 20 || (d != null && d < 2)); }).sort((a, b) => stockPct(a) - stockPct(b));
  const lowStrip = low.length ? `<div class="wx-low"><span class="wx-low-t">🪫 Presque vide</span>${low.map(p => `<button type="button" class="lowchip" data-act="pfiche" data-id="${p.id}">${emojiOf(p)} ${esc(p.name)}</button>`).join('')}</div>` : '';
  const avg = recent.length ? recent.reduce((s, t) => s + t.total, 0) / recent.length : null;
  const items = [...S.list.values()];
  const checkedN = items.filter(i => i.checked).length;
  const groups = itemsByRayon(items);
  const order = {today:0, tomorrow:1};
  const cards = [];
  for(const [r, arr] of groups){
    if(!arr.length) continue;
    arr.sort((a, b) => (a.it.checked - b.it.checked) || a.p.name.localeCompare(b.p.name, 'fr'));
    const left = arr.filter(x => !x.it.checked).length;
    const rows = arr.map(({it, p}) => {
      const pct = stockPct(p);
      return `<div class="brow${it.checked ? ' done' : ''}"><label class="bchk"><input type="checkbox" data-act="check" data-id="${it.id}"${it.checked ? ' checked' : ''}><span class="bnm">${nameE(p)}</span></label><div class="bmeta"><button type="button" class="bqt${it.format || it.label ? ' alt' : ''}" data-act="item" data-id="${it.id}" aria-label="Quantité de ${esc(p.name)}">${esc(it.label || fmtQty(it.qty, it.format ? {unit: p.unit, format: it.format} : p))}</button>${(() => { const pr = itemPrice(it, p); return pr != null ? `<span class="bpr">${fmt2(pr)} €</span>` : ''; })()}</div>${pct != null && !it.checked ? `<span class="sbar" aria-hidden="true"><i style="width:${Math.max(3, pct)}%"></i></span>` : ''}</div>`;
    }).join('');
    cards.push({r, n: arr.length, html: `<h3 class="bento-h"><span>${RAYON[r]}</span><span class="bento-n">${left}</span></h3><div class="bento-rows">${rows}</div>`});
  }
  // Grandes catégories sur toute la largeur, petites en demi-cartes ; une demi-carte seule s'élargit
  const half = cards.filter(c => c.n < 4).length;
  let halfSeen = 0;
  const bento = cards.map(c => {
    let wide = c.n >= 4;
    if(!wide){ halfSeen++; if(half % 2 && halfSeen === half) wide = true; }
    return `<section class="bento-card rc-${c.r}${wide ? ' wide' : ''}">${c.html}</section>`;
  }).join('');
  const leftN = items.length - checkedN;
  $('#app').innerHTML = `
    <div class="wx">
      <button type="button" class="wx-open" data-act="tickets" aria-label="Historique des tickets">
        <span class="wx-day">Prochaines courses</span>
        <span class="wx-main"><span class="wx-temp"><span class="wx-approx">≈</span>${Math.round(ns.sum)} €</span></span>
        <span class="wx-sub">${ns.n} produit${ns.n > 1 ? 's' : ''} · ${PLAN.F ? cap(PLAN.F.toLocaleDateString('fr-FR', {weekday:'long'})) : ''}${ns.miss ? ` · ${ns.miss} sans prix` : ''} 💸</span>
      </button>
      <div class="wx-days" aria-label="Statistiques">${months.map(m => `<span class="chip-btn stat">${m.short} · ${Math.round(m.sum)} €</span>`).join('')}${avg != null ? `<span class="chip-btn stat">≈ ${Math.round(avg)} € / course</span>` : ''}</div>
      ${lowStrip}
    </div>
    <nav class="quick" aria-label="Raccourcis">
      <button type="button" class="q" data-act="scan"><span class="q-ico">${SVG.camera}</span><span class="q-l">Scanner ticket</span></button>
      <button type="button" class="q" data-act="newp"><span class="q-ico">${SVG.tag}</span><span class="q-l">Nouveau produit</span></button>
      <button type="button" class="q" data-act="products"><span class="q-ico">${SVG.box}</span><span class="q-l">Produits</span></button>
      <button type="button" class="q" data-act="tickets"><span class="q-ico">${SVG.ticket}</span><span class="q-l">Tickets</span></button>
    </nav>
    <div class="group-title"><span>Ma liste${leftN ? ' · ' + leftN : ''}</span>${PLAN.fridayN ? (PLAN.soon ? `<span class="best">🗓️ courses ${PLAN.toF < 0.5 ? "aujourd'hui" : 'vendredi'}</span>` : `<button type="button" class="chip-btn fri" data-act="fri" aria-pressed="${PLAN.show}">🗓️ ${PLAN.show ? 'Masquer' : 'Voir'} vendredi · ${PLAN.fridayN}</button>`) : ''}</div>
    <button type="button" class="addline addtop" data-act="add">＋ Ajouter un produit</button>
    ${items.length ? `<div class="bento">${bento}</div>` : ''}
    ${checkedN ? `<button type="button" class="btn primary wide checkout" data-act="checkout">Acheté · ${checkedN} coché${checkedN > 1 ? 's' : ''} ✔️</button>` : ''}
    <button type="button" class="linkish foot-link" data-act="backup">Sauvegarde · version ${APP_VERSION}</button>`;
}
$('#app').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.dataset.act === 'check') return;
  const a = b.dataset.act;
  if(a === 'month'){ S.month = +b.dataset.m; render(); }
  else if(a === 'fold'){ const r = b.dataset.r; S.open.has(r) ? S.open.delete(r) : S.open.add(r); render(); }
  else if(a === 'item') openItem(S.list.get(b.dataset.id));
  else if(a === 'checkout') checkout();
  else if(a === 'scan') openCam();
  else if(a === 'add') openAdd();
  else if(a === 'fri'){ S.settings.showFri = PLAN.show ? null : PLAN.key; saveSet(); render(); }
  else if(a === 'pfiche') openProduct(S.products.get(b.dataset.id), {onSaved: () => render()});
  else if(a === 'newp') openProduct(null, {onSaved: () => render()});
  else if(a === 'products') openProducts();
  else if(a === 'stock') openStock();
  else if(a === 'tickets') openTickets();
  else if(a === 'backup') openBackup();
});
$('#app').addEventListener('change', e => {
  const c = e.target.closest('[data-act="check"]'); if(!c) return;
  const it = S.list.get(c.dataset.id); if(!it) return;
  it.checked = c.checked; saveL(it); render();
});
function checkout(){
  const now = Date.now(); let n = 0;
  for(const it of [...S.list.values()]) if(it.checked){ const p = S.products.get(it.pid); if(p){ recordPurchase(p, itemStdQty(it, p), now); n++; } delL(it.id); }
  render(); toast(`${n} achat${n > 1 ? 's' : ''} noté${n > 1 ? 's' : ''} ✔️`);
}

/* ---------- Popups ---------- */
function openSheet(html, {onClick, onInput, onClose, cls = ''} = {}){
  const d = document.createElement('dialog');
  d.className = 'sheet-d ' + cls;
  d.innerHTML = `<form class="sheet" method="dialog" novalidate>${html}</form>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => {
    if(e.target === d){ d.close(); return; }
    const b = e.target.closest('[data-close]'); if(b){ e.preventDefault(); d.close(); return; }
    onClick && onClick(e, d);
  });
  onInput && d.addEventListener('input', e => onInput(e, d));
  onInput && d.addEventListener('change', e => { if(!/^(text|search)$/.test(e.target.type)) onInput(e, d); });
  d.addEventListener('submit', e => e.preventDefault());
  d.addEventListener('close', () => { onClose && onClose(d); d.remove(); });
  d.showModal();
  return d;
}
function confirmBox(title, text, ok = 'Supprimer', danger = true){
  return new Promise(res => {
    const d = document.createElement('dialog'); d.className = 'confirm-box';
    d.innerHTML = `<div class="cb-inner"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}<div class="cb-actions"><button class="btn grow" type="button" data-v="0">Annuler</button><button class="btn grow ${danger ? 'danger-solid' : 'primary'}" type="button" data-v="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(d);
    let v = false;
    d.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if(b){ v = b.dataset.v === '1'; d.close(); } else if(e.target === d) d.close(); });
    d.addEventListener('close', () => { d.remove(); res(v); });
    d.showModal();
  });
}
const foldHtml = (key, label, val, open, body) => `<div class="fold${open ? ' open' : ''}"><button type="button" class="frow" data-act="fold" data-r="${esc(key)}" aria-expanded="${open}"><span class="fl">${label}</span><span class="fv">${val} <span class="chev">›</span></span></button>${open ? `<div class="fold-body">${body}</div>` : ''}</div>`;

/* Ligne de la liste */
function openItem(it){
  if(!it) return; const p = S.products.get(it.pid); if(!p) return;
  const label = () => it.label || fmtQty(it.qty, it.format ? {unit: p.unit, format: it.format} : p);
  const priceLine = () => { const pr = itemPrice(it, p); return pr != null ? `${fmt2(pr)} €${priceSrc(p) ? `<small class="muted" style="font-weight:500"> · ${priceSrc(p)}</small>` : ''}` : '—'; };
  const refresh = d => { d.querySelector('#iq').textContent = label(); d.querySelector('#ipr').innerHTML = priceLine(); render(); };
  openSheet(`<div class="sheet-scroll"><h2>${emojiOf(p)} ${esc(p.name)}</h2>
    <div class="adjust"><div class="adj-row"><button type="button" class="adj-name" data-act="edit" id="iq" style="color:var(--denim)">${esc(label())}</button><button class="adj-btn" type="button" data-act="minus" aria-label="Moins">−</button><button class="adj-btn" type="button" data-act="plus" aria-label="Plus">+</button></div></div>
    <div class="frow"><span class="fl">Prix</span><span class="fv" id="ipr">${priceLine()}</span></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn grow" type="button" data-act="fiche">Fiche produit</button><button class="btn grow" type="button" data-act="remove" style="color:var(--warn)">Retirer…</button></div>
  </div><div class="sheet-actions"><button class="btn primary grow" type="button" data-close>OK</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const st = stepOf(p.unit);
      if(b.dataset.act === 'plus' || b.dataset.act === 'minus'){
        const q0 = itemStdQty(it, p);
        it.qty = Math.max(st, +((p.unit === 'kg' ? q0 : Math.round(q0 * 100) / 100) + (b.dataset.act === 'plus' ? st : -st)).toFixed(2));
        delete it.label; delete it.format; it.edited = true; saveL(it); refresh(d);
      } else if(b.dataset.act === 'edit'){
        openQtyEditor(p, {qty: itemStdQty(it, p), label: it.label}, r => { it.qty = r.qty; delete it.format; if(r.label) it.label = r.label; else delete it.label; it.edited = true; saveL(it); refresh(d); });
      } else if(b.dataset.act === 'remove'){ d.close(); openRemove(it, p); }
      else if(b.dataset.act === 'fiche'){ d.close(); openProduct(p); }
    }});
}
function openRemove(it, p){
  const F = PLAN.F ? PLAN.F.getTime() : Date.now();
  const thisTrip = !PLAN.soon && (PLAN.urgent.has(p.id) || !PLAN.need.has(p.id));
  const target = thisTrip ? F : F + 7 * DAY;
  const lbl = t => new Date(t).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'short'});
  const tomorrow = isoDay(Date.now() + DAY);
  const done = (msg) => { delL(it.id); render(); toast(msg); };
  openSheet(`<div class="sheet-scroll"><h2>Retirer ${emojiOf(p)} ${esc(p.name)} ?</h2>
    <button class="btn wide" type="button" data-act="next" style="margin-bottom:8px;text-align:left">🗓️ Aux prochaines courses <span class="muted" style="font-weight:500"> · ${lbl(target)}</span></button>
    <div class="frow" style="padding-right:8px"><span class="fl">📅 À une date</span><input type="date" name="when" min="${tomorrow}" value="${isoDay(target + 7 * DAY)}"><button class="btn primary" type="button" data-act="date" style="padding:8px 12px;margin-left:6px">OK</button></div>
    <button class="btn wide" type="button" data-act="never" style="margin-top:2px;text-align:left">🚫 Jamais <span class="muted" style="font-weight:500"> · ne plus le proposer</span></button>
  </div><div class="sheet-actions"><button class="btn grow" type="button" data-close>Annuler</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'next'){ p.forceAt = target - 1.5 * DAY; p.snooze = p.forceAt; saveP(p); d.close(); done(`Reprogrammé ${lbl(target)} 🗓️`); }
      else if(b.dataset.act === 'date'){
        const v = d.querySelector('[name=when]').value; if(!v) return;
        const t = new Date(v + 'T00:00').getTime(); if(isNaN(t) || t <= Date.now()){ toast('Choisis une date à venir 📅'); return; }
        p.forceAt = t; p.snooze = t; saveP(p); d.close(); done(`Reprogrammé ${lbl(t)} 📅`);
      }
      else if(b.dataset.act === 'never'){ p.never = true; delete p.forceAt; saveP(p); d.close(); done('Il ne sera plus proposé 🚫'); }
    }});
}

/* Ajouter à la liste */
function productRows(list, act){
  return list.map(p => {
    const sub = inList(p.id) ? '<small>dans la liste 🛒</small>' : '';
    return `<button type="button" class="trow" data-act="${act}" data-id="${p.id}"><span class="tx"><b>${nameE(p)}</b>${sub}</span><span class="chevr">›</span></button>`;
  }).join('');
}
function searchList(q, exclude){
  const all = [...S.products.values()].filter(p => !exclude || !exclude(p));
  if(!q.trim()) return all.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const nq = norm(q);
  return all.map(p => ({p, s: norm(p.name).includes(nq) ? 2 : similarity(q, p.name)})).filter(x => x.s >= 0.4).sort((a, b) => b.s - a.s).map(x => x.p);
}
function openAdd(){
  let q = '';
  const results = () => {
    const list = searchList(q, p => !!inList(p.id)).slice(0, 40);
    const exact = list.some(p => norm(p.name) === norm(q));
    return (q.trim() && !exact ? `<button type="button" class="addline" data-act="create">＋ Créer « ${esc(q.trim())} »</button>` : '') + `<div style="display:flex;flex-direction:column;gap:6px">${productRows(list, 'pick')}</div>`;
  };
  openSheet(`<div class="sheet-scroll"><h2>Ajouter à la liste 🛒</h2>
    <label class="frow search"><input type="search" name="q" placeholder="Chercher ou créer un produit" autocomplete="off" enterkeyhint="search"></label>
    <div id="res">${results()}</div></div>
    <div class="sheet-actions"><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onInput: (e, d) => { if(e.target.name === 'q'){ q = e.target.value; d.querySelector('#res').innerHTML = results(); } },
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'pick'){ const p = S.products.get(b.dataset.id); addToList(p); render(); d.close(); toast(`${p.name} ajouté 🛒`); }
      else if(b.dataset.act === 'create'){ d.close(); openProduct(null, {name: cap(q.trim()), onSaved: p => { addToList(p); render(); toast(`${p.name} ajouté 🛒`); }}); }
    }});
}

/* Produits */
function rhythmShort(p){
  if(p.everyDays) return `${fmtQty(packOf(p), p)} tous les ${p.everyDays} j`;
  return learnedText(p);
}
function openProducts(){
  let q = ''; const closed = new Set();
  const row = p => {
    const pct = stockPct(p), pr = priceOf(p), inl = !!inList(p.id);
    const sub = [rhythmShort(p), pr != null ? (p.unit === 'kg' ? `${fmt2(pr)} €/kg` : `${fmt2(pr * packOf(p))} €`) : '', p.never ? '🚫 jamais proposé' : ''].filter(Boolean).join(' · ');
    return `<div class="prow"><button type="button" class="pmain" data-act="open" data-id="${p.id}"><span class="bnm">${nameE(p)}</span><small>${sub}</small>${pct != null ? `<span class="sbar"><i style="width:${Math.max(3, pct)}%"></i></span>` : ''}</button><button type="button" class="padd${inl ? ' on' : ''}" data-act="${inl ? 'noop' : 'tolist'}" data-id="${p.id}" aria-label="${inl ? 'Déjà dans la liste' : 'Ajouter à la liste'}">${inl ? '✓' : '＋'}</button></div>`;
  };
  const body = () => {
    const list = searchList(q);
    let h = '';
    for(const [r, label] of RAYONS){
      const arr = list.filter(p => (p.rayon || 'autre') === r); if(!arr.length) continue;
      if(!q.trim()) arr.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
      const isC = closed.has(r) && !q.trim();
      h += `<section class="bento-card wide pcard rc-${r}${isC ? ' closed' : ''}"><button type="button" class="bento-h pfold" data-act="pfold" data-r="${r}" aria-expanded="${!isC}"><span>${label}</span><span class="bento-n">${arr.length} <span class="chev">›</span></span></button>${isC ? '' : arr.map(row).join('')}</section>`;
    }
    return h;
  };
  openSheet(`<div class="sheet-scroll"><div class="page-head"><h1>Produits</h1><span class="wx-sub">${S.products.size}</span></div>
    <label class="frow search"><input type="search" name="q" placeholder="Chercher un produit" autocomplete="off"></label>
    <div id="res" style="display:flex;flex-direction:column;gap:8px">${body()}</div></div>
    <div class="sheet-actions"><button class="btn grow" type="button" data-act="new">＋ Nouveau</button><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onInput: (e, d) => { if(e.target.name === 'q'){ q = e.target.value; d.querySelector('#res').innerHTML = body(); } },
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const refresh = () => { d.querySelector('#res').innerHTML = body(); };
      if(b.dataset.act === 'pfold'){ const r = b.dataset.r; closed.has(r) ? closed.delete(r) : closed.add(r); refresh(); }
      else if(b.dataset.act === 'open') openProduct(S.products.get(b.dataset.id), {onSaved: refresh});
      else if(b.dataset.act === 'tolist'){ const p = S.products.get(b.dataset.id); addToList(p, PLAN.need.get(p.id) ?? packOf(p)); render(); refresh(); toast(`${p.name} ajouté 🛒`); }
      else if(b.dataset.act === 'new') openProduct(null, {onSaved: refresh});
    }});
}

/* Fiche produit */
function openProduct(p, {name = '', onSaved} = {}){
  const isNew = !p;
  const P = p ? JSON.parse(JSON.stringify(p)) : {id: uid(), name, rayon: guessRayon(name), unit: 'u', format: guessFormat(name), pack: null, purchases: [], created: Date.now()};
  const st0 = stockAt(P);
  const priceStr0 = priceOf(P) != null ? fmt2(priceOf(P) * (P.unit === 'kg' ? 1 : packOf(P))) : '';
  const stockStr = st0 != null ? fmtNum(st0, 2) : '';
  const open = new Set();
  const aliases = () => [...S.aliases.values()].filter(a => a.pid === P.id);
  let emojiTouched = false, rayonTouched = false, fmtTouched = false;
  const extra = () => {
    const al = aliases(), hist = (P.purchases || []).slice().reverse();
    if(open.has('al')) return al.map(a => `<div class="trow"><span class="tx"><b style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(a.label)}</b></span><button type="button" class="mini-x" data-act="unalias" data-l="${esc(a.label)}" aria-label="Oublier ce libellé">✕</button></div>`).join('');
    if(open.has('hi')) return hist.slice(0, 30).map(h => `<div class="trow"><span class="tx"><b>${dayStr(h.d)}</b><small>${h.t ? 'ticket' : 'à la main'}</small></span><span class="am">${fmtQty(h.q, P)}</span></div>`).join('');
    return '';
  };
  const chips = () => {
    const al = aliases().length, hn = (P.purchases || []).length;
    return `${inList(P.id) ? '' : '<button type="button" class="chip-btn" data-act="tolist">🛒 À la liste</button>'}
      ${al ? `<button type="button" class="chip-btn" data-act="fold" data-r="al" aria-pressed="${open.has('al')}">🧾 ${al} libellé${al > 1 ? 's' : ''}</button>` : ''}
      ${hn ? `<button type="button" class="chip-btn" data-act="fold" data-r="hi" aria-pressed="${open.has('hi')}">🕓 ${hn} achat${hn > 1 ? 's' : ''}</button>` : ''}`;
  };
  const sel = (name, opts, v) => `<select name="${name}">${opts.map(([k, l]) => `<option value="${k}"${v === k ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  const html = `<div class="sheet-scroll">
    <div class="fhead"><input class="femoji" type="text" name="emoji" value="${esc(emojiOf(P))}" autocomplete="off" aria-label="Emoji"><input class="fname" type="text" name="name" value="${esc(P.name)}" placeholder="Nom du produit" autocomplete="off" aria-label="Nom"></div>
    <div class="fgrid">
      <label class="fcase"><span>Rayon</span>${sel('rayon', RAYONS, P.rayon)}</label>
      <label class="fcase"><span>Vendu</span>${sel('unit', UNITS, P.unit === 'kg' ? 'kg' : 'u')}</label>
      <label class="fcase" id="fmt"${P.unit === 'kg' ? ' hidden' : ''}><span>Format</span><input type="text" name="format" value="${esc(P.format || '')}" placeholder="500 g, 1 L…" autocomplete="off"></label>
      <label class="fcase"><span>Qté habituelle</span><input type="text" inputmode="decimal" name="pack" value="${P.pack != null ? fmtNum(P.pack, 2) : ''}" placeholder="${lastQty(P) != null ? fmtNum(lastQty(P), 2) : '1'}"></label>
      <label class="fcase"><span id="plbl">${esc(priceLabel(P.unit, P.format, packOf(P)))}</span><input type="text" inputmode="decimal" name="price" value="${priceStr0}" placeholder="?"></label>
      ${isNew ? '' : `<label class="fcase"><span>Stock</span><input type="text" inputmode="decimal" name="stock" value="${stockStr}" placeholder="?"></label>
      <div class="fcase span2"><span>Rythme</span><div class="frhy">${sel('mode', [['auto', 'Appris'], ['fixed', 'Fixe']], P.everyDays ? 'fixed' : 'auto')}
        <span id="learned" class="muted"${P.everyDays ? ' hidden' : ''}>${learnedText(P)}</span>
        <label id="every"${P.everyDays ? '' : ' hidden'}>tous les <input type="text" inputmode="numeric" name="every" value="${P.everyDays || ''}" placeholder="7"> j</label></div></div>
      <label class="fcase"><span>Proposé tout seul</span>${sel('auto', [['yes', 'Oui'], ['never', 'Jamais']], P.never ? 'never' : 'yes')}</label>
      ${P.forceAt ? `<div class="fcase" id="resched"><span>Reprogrammé</span><b style="font-size:15px;display:flex;align-items:center;justify-content:space-between">${new Date(P.forceAt).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}<button type="button" class="mini-x" data-act="unresched" aria-label="Annuler la reprogrammation">✕</button></b></div>` : ''}`}
    </div>
    ${isNew ? '' : `<div class="fchips" id="fchips">${chips()}</div><div class="fextra" id="extra">${extra()}</div>`}
  </div><div class="sheet-actions">${isNew ? '' : `<button class="btn icon-btn" type="button" data-act="del" aria-label="Supprimer le produit" style="color:var(--warn)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`}<button class="btn grow" type="button" data-close>Annuler</button><button class="btn primary grow" type="button" data-act="save">${isNew ? 'Créer' : 'Enregistrer'}</button></div>`;
  openSheet(html, {
    onInput: (e, d) => {
      if(e.target.name === 'mode'){ d.querySelector('#every').hidden = e.target.value !== 'fixed'; d.querySelector('#learned').hidden = e.target.value === 'fixed'; }
      if(e.target.name === 'emoji') emojiTouched = true;
      if(e.target.name === 'rayon') rayonTouched = true;
      if(e.target.name === 'name' && isNew && !rayonTouched){ const f = d.querySelector('form'); f.rayon.value = guessRayon(f.name.value); }
      if(e.target.name === 'format') fmtTouched = true;
      if(e.target.name === 'name' && isNew && !fmtTouched){ const f = d.querySelector('form'), g = guessFormat(f.name.value); if(g) f.format.value = g; }
      if(e.target.name === 'unit') d.querySelector('#fmt').hidden = e.target.value === 'kg';
      if(['unit', 'pack', 'format'].includes(e.target.name)){ const f = d.querySelector('form'); d.querySelector('#plbl').textContent = priceLabel(f.unit.value, f.format.value.trim(), num(f.pack.value) || packOf(P)); }
      if((e.target.name === 'name' || e.target.name === 'rayon') && !emojiTouched && !P.emoji){ const f = d.querySelector('form'); f.emoji.value = guessEmoji(f.name.value, f.rayon.value); }
    },
    onClick: async (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const a = b.dataset.act, f = d.querySelector('form');
      if(a === 'fold'){ const r = b.dataset.r, was = open.has(r); open.clear(); if(!was) open.add(r); d.querySelector('#extra').innerHTML = extra(); d.querySelector('#fchips').innerHTML = chips(); }
      else if(a === 'unresched'){ const cur = S.products.get(P.id); if(cur){ delete cur.forceAt; delete cur.snooze; saveP(cur); } d.querySelector('#resched').remove(); render(); }
      else if(a === 'unalias'){ S.aliases.delete(b.dataset.l); store.del('aliases', b.dataset.l); if(!aliases().length) open.clear(); d.querySelector('#extra').innerHTML = extra(); d.querySelector('#fchips').innerHTML = chips(); }
      else if(a === 'tolist'){ addToList(S.products.get(P.id) || P); render(); b.remove(); toast('Ajouté à la liste 🛒'); }
      else if(a === 'del'){
        if(!await confirmBox(`Supprimer « ${P.name} » ?`, 'Son historique et ses libellés de ticket seront effacés.')) return;
        S.products.delete(P.id); store.del('products', P.id);
        for(const al of aliases()){ S.aliases.delete(al.label); store.del('aliases', al.label); }
        for(const it of [...S.list.values()]) if(it.pid === P.id) delL(it.id);
        d.close(); render(); onSaved && onSaved(null); toast('Produit supprimé 🗑️');
      }
      else if(a === 'save'){
        const nm = f.name.value.trim(); if(!nm){ f.name.focus(); toast('Donne un nom au produit.'); return; }
        const cur = S.products.get(P.id) || P;
        cur.name = nm; cur.rayon = f.rayon.value; cur.unit = f.unit.value;
        const pv = f.price.value.trim(), per = f.unit.value === 'kg' ? 1 : (num(f.pack.value) || packOf(cur) || 1);
        if(pv !== priceStr0 || (f.unit.value !== 'kg' && pv && per !== (P.unit === 'kg' ? 1 : packOf(P)))){
          const n2 = num(pv);
          if(n2 != null){ cur.price = +(n2 / per).toFixed(4); cur.priceManual = true; } else { delete cur.price; delete cur.priceManual; }
        }
        if(f.auto && f.auto.value === 'never') cur.never = true; else delete cur.never;
        const fm = f.format.value.trim(); if(fm && cur.unit !== 'kg') cur.format = fm; else delete cur.format;
        const em = firstGrapheme(f.emoji.value); if(em && em !== guessEmoji(nm, cur.rayon)) cur.emoji = em; else delete cur.emoji;
        cur.pack = num(f.pack.value);
        cur.everyDays = f.mode && f.mode.value === 'fixed' ? (num(f.every.value) || null) : null;
        if(!cur.everyDays) delete cur.everyDays;
        if(f.stock && f.stock.value.trim() !== stockStr){ const s = num(f.stock.value); if(s != null){ cur.stockQty = s; cur.stockAt = Date.now(); } else if(!f.stock.value.trim()){ delete cur.stockQty; delete cur.stockAt; } }
        cur.purchases = cur.purchases || [];
        saveP(cur); d.close(); render(); onSaved && onSaved(cur);
        toast(isNew ? 'Produit créé ✨' : 'Produit mis à jour ✔️');
      }
    }});
}

/* Stock */
function openStock(){
  const open = new Set(['__low']);
  const body = () => {
    const ps = [...S.products.values()].filter(p => stockAt(p) != null);
    const srow = p => {
      const pct = Math.max(3, stockPct(p));
      return `<button type="button" class="srow rc-${p.rayon || 'autre'}" data-act="open" data-id="${p.id}"><span class="top"><span>${nameE(p)}</span>${inList(p.id) ? '<small class="muted">🛒</small>' : ''}</span><span class="bar"><i style="width:${pct}%"></i></span></button>`;
    };
    const byD = (a, b) => stockPct(a) - stockPct(b);
    let h = '';
    for(const [r, label] of RAYONS){
      const arr = ps.filter(p => (p.rayon || 'autre') === r).sort(byD); if(!arr.length) continue;
      h += foldHtml(r, label, arr.length, open.has(r), arr.map(srow).join(''));
    }
    return h;
  };
  const low = [...S.products.values()].filter(p => { const pc = stockPct(p), d = daysLeft(p); return pc != null && (pc < 20 || (d != null && d < 2)); }).sort((a, b) => stockPct(a) - stockPct(b));
  const lowBox = low.length ? `<div class="lowbox"><h3>Presque vide 🪫</h3><div class="lowchips">${low.map(p => `<button type="button" class="lowchip" data-act="open" data-id="${p.id}">${emojiOf(p)} ${esc(p.name)}</button>`).join('')}</div></div>` : '';
  openSheet(`<div class="sheet-scroll"><div class="page-head"><h1>Stock</h1></div>${lowBox}<div id="res">${body()}</div></div>
    <div class="sheet-actions"><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'fold'){ const r = b.dataset.r; open.has(r) ? open.delete(r) : open.add(r); d.querySelector('#res').innerHTML = body(); }
      else if(b.dataset.act === 'open') openProduct(S.products.get(b.dataset.id), {onSaved: () => { d.querySelector('#res').innerHTML = body(); }});
    }});
}

/* Tickets */
function openTickets(){
  const open = new Set([isoDay(Date.now()).slice(0, 7)]);
  const body = () => {
    const ts = [...S.tickets.values()].sort((a, b) => b.date - a.date);
    const groups = new Map();
    for(const t of ts){ const k = isoDay(t.date).slice(0, 7); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
    const thisYear = new Date().getFullYear();
    let h = '';
    for(const [k, arr] of groups){
      const d = new Date(+k.slice(0, 4), +k.slice(5) - 1, 1);
      const label = cap(d.toLocaleDateString('fr-FR', d.getFullYear() === thisYear ? {month:'long'} : {month:'long', year:'numeric'}));
      const sum = arr.reduce((s, t) => s + (t.total || 0), 0);
      h += foldHtml(k, label, fmtEur(sum), open.has(k), arr.map(t => `<button type="button" class="trow" data-act="open" data-id="${t.id}"><span class="tx"><b>${dayStr(t.date)}</b><small>${esc(t.store || 'Magasin ?')} · ${t.lines.length} article${t.lines.length > 1 ? 's' : ''}</small></span><span class="am">${t.total != null ? fmtEur(t.total) : ''}</span><span class="chevr">›</span></button>`).join(''));
    }
    return h;
  };
  openSheet(`<div class="sheet-scroll"><div class="page-head"><h1>Tickets</h1></div><div id="res">${body()}</div></div>
    <div class="sheet-actions"><button class="btn grow" type="button" data-act="scan">📸 Scanner</button><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'fold'){ const r = b.dataset.r; open.has(r) ? open.delete(r) : open.add(r); d.querySelector('#res').innerHTML = body(); }
      else if(b.dataset.act === 'open') openTicket(S.tickets.get(b.dataset.id), () => { d.querySelector('#res').innerHTML = body(); });
      else if(b.dataset.act === 'scan'){ d.close(); openCam(); }
    }});
}
function openTicket(t, refresh){
  if(!t) return;
  const lines = t.lines.map(l => { const p = S.products.get(l.pid); return `<div class="trow"><span class="tx"><b>${p ? nameE(p) : esc(cleanName(l.raw) || 'Produit supprimé')}</b>${l.raw ? `<small style="font-family:ui-monospace,Menlo,monospace">${esc(l.raw)}</small>` : ''}</span><span class="am">${fmtQty(l.qty, p || 'u')}</span></div>`; }).join('');
  openSheet(`<div class="sheet-scroll"><h2>Ticket du ${dayStr(t.date).toLowerCase()} 🧾</h2>
    <label class="frow"><span class="fl">Magasin</span><input type="text" name="store" value="${esc(t.store || '')}" placeholder="?" autocomplete="off"></label>
    <label class="frow"><span class="fl">Total payé</span><input type="text" inputmode="decimal" name="total" value="${t.total != null ? fmt2(t.total) : ''}" placeholder="0,00"></label>
    <div style="display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:12px;padding:8px;margin:0 0 8px">${lines}</div>
    <button class="btn danger-solid" type="button" data-act="del" style="width:100%;margin-top:10px">Supprimer le ticket</button>
  </div><div class="sheet-actions"><button class="btn grow" type="button" data-close>Annuler</button><button class="btn primary grow" type="button" data-act="save">Enregistrer</button></div>`, {
    onClick: async (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return; const f = d.querySelector('form');
      if(b.dataset.act === 'save'){ t.store = f.store.value.trim(); t.total = num(f.total.value); saveT(t); d.close(); render(); refresh && refresh(); toast('Ticket mis à jour ✔️'); }
      else if(b.dataset.act === 'del'){
        if(!await confirmBox('Supprimer ce ticket ?', 'Les achats qu’il contient seront retirés du stock.')) return;
        for(const p of S.products.values()){
          const mine = (p.purchases || []).filter(x => x.t === t.id); if(!mine.length) continue;
          const q = mine.reduce((s, x) => s + x.q, 0), s = stockAt(p);
          p.purchases = p.purchases.filter(x => x.t !== t.id);
          if(s != null){ p.stockQty = Math.max(0, s - q); p.stockAt = Date.now(); }
          saveP(p);
        }
        S.tickets.delete(t.id); store.del('tickets', t.id);
        d.close(); render(); refresh && refresh(); toast('Ticket supprimé 🗑️');
      }
    }});
}

/* ---------- Appareil photo ---------- */
let camStream = null;
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function openCam(){
  let d = $('#cam'); if(d) d.remove();
  d = document.createElement('dialog'); d.id = 'cam';
  d.innerHTML = `<div class="cam">
    <div class="cam-top"><button class="cam-x" type="button" data-act="x" aria-label="Fermer">✕</button><span class="cam-title">Ticket</span></div>
    <div class="cam-box"><video playsinline muted autoplay></video><div class="cam-guide"></div></div>
    <p class="cam-tip">Cadre le ticket en entier 🧾</p>
    <div class="cam-bottom">
      <label class="cam-side" aria-label="Choisir une photo">${SVG.image}<input type="file" accept="image/*"></label>
      <button class="cam-shot" type="button" data-act="shot" aria-label="Prendre la photo" disabled></button>
      <span class="cam-spacer"></span>
    </div></div>`;
  document.body.appendChild(d);
  const video = d.querySelector('video'), shot = d.querySelector('.cam-shot');
  const fail = () => {
    stopCam(); shot.disabled = true;
    d.querySelector('.cam-box').innerHTML = `<div class="cam-err"><span>Appareil photo indisponible 😕</span><label class="btn primary file-btn">Choisir une photo<input type="file" accept="image/*"></label></div>`;
  };
  d.addEventListener('close', () => { stopCam(); d.remove(); });
  d.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act === 'x') d.close();
    else if(b.dataset.act === 'shot' && video.videoWidth){
      const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0); d.close(); scanImage(c);
    }
  });
  d.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const img = new Image(); img.onload = () => { URL.revokeObjectURL(img.src); d.close(); scanImage(img); };
    img.onerror = () => toast('Photo illisible 😕'); img.src = URL.createObjectURL(f);
  });
  d.showModal();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fail(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:2560}}, audio:false})
    .then(s => { if(!d.isConnected){ s.getTracks().forEach(t => t.stop()); return; } camStream = s; video.srcObject = s; video.onloadedmetadata = () => { shot.disabled = false; }; })
    .catch(fail);
}

/* ---------- Lecture (OCR sur le téléphone) ---------- */
let worker = null, progCb = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); }); }
async function getWorker(){
  if(worker) return worker;
  if(!window.Tesseract) await loadScript(TESS_URL);
  worker = await Tesseract.createWorker('fra', 1, {cacheMethod:'none', logger: m => progCb && progCb(m)});
  await worker.setParameters({tessedit_pageseg_mode:'6', preserve_interword_spaces:'1'});
  return worker;
}
function prep(src){
  const w = src.naturalWidth || src.videoWidth || src.width, h = src.naturalHeight || src.videoHeight || src.height;
  const k = Math.min(2, 2000 / w);
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext('2d', {willReadFrequently:true}); g.drawImage(src, 0, 0, c.width, c.height);
  const im = g.getImageData(0, 0, c.width, c.height), px = im.data, hist = new Uint32Array(256);
  for(let i = 0; i < px.length; i += 4){ const y = (px[i] * 0.299 + px[i+1] * 0.587 + px[i+2] * 0.114) | 0; px[i] = y; hist[y]++; }
  const total = px.length / 4; let lo = 0, hi = 255, acc = 0;
  for(; lo < 255; lo++){ acc += hist[lo]; if(acc > total * 0.02) break; }
  acc = 0; for(; hi > 0; hi--){ acc += hist[hi]; if(acc > total * 0.02) break; }
  const span = Math.max(1, hi - lo);
  for(let i = 0; i < px.length; i += 4){ let v = (px[i] - lo) * 255 / span; v = v < 0 ? 0 : v > 255 ? 255 : v; px[i] = px[i+1] = px[i+2] = v; }
  g.putImageData(im, 0, 0);
  return c;
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
async function ocr(canvas, onProgress){
  progCb = m => {
    if(m.status === 'recognizing text') onProgress('read', m.progress);
    else onProgress('load', m.progress || 0);
  };
  onProgress('load', 0);
  const w = await withTimeout(getWorker(), 120000);
  const {data} = await withTimeout(w.recognize(canvas), 120000);
  progCb = null;
  return data.text;
}

/* ---------- Récap du ticket ---------- */
function resolveLine(it){
  const L = {raw: it.raw, count: it.count || 1, weight: it.weight || null, price: it.price ?? null, pid: null, qty: 1, state: 'unknown'};
  const a = S.aliases.get(norm(it.raw));
  if(a && a.pid === null){ L.state = 'ignored'; L.auto = true; return L; }
  const p = a && S.products.get(a.pid);
  if(p){ L.pid = p.id; L.state = 'ok'; L.qty = it.weight || +(L.count * (a.mult || 1)).toFixed(3); return L; }
  const g = bestProduct(it.raw);
  if(g){ L.pid = g.id; L.state = 'guess'; L.qty = guessQty(it, g); return L; }
  L.qty = guessQty(it, null);
  return L;
}
async function scanImage(src){
  const R = {date: isoDay(Date.now()), store: '', total: '', lines: [], loading: true, phase: 'load', prog: 0};
  const d = openRecap(R);
  let text = null;
  try{
    const c = prep(src);
    text = await ocr(c, (phase, p) => { R.phase = phase; R.prog = p; const el = d.querySelector('.reading'); if(el) el.outerHTML = readingHtml(R); });
  }catch(e){ console.warn(e); }
    if(text != null){
    const P = parseTicket(text);
    R.store = P.store || ''; if(P.date) R.date = isoDay(P.date); R.total = P.total != null ? fmt2(P.total) : '';
    R.lines = P.items.map(resolveLine);
    if(!R.lines.length) toast('Aucune ligne reconnue 😕 Ajoute-les à la main.');
  } else toast('Lecture impossible 😕 Ajoute les produits à la main.');
  R.loading = false;
  if(d.isConnected) d._render();
}
function readingHtml(R){
  const pct = Math.round((R.prog || 0) * 100);
  return `<div class="reading"><p>${R.phase === 'read' ? 'Lecture du ticket… 🔍' : 'Préparation de la lecture… ⏳'}</p><div class="bar"><i style="width:${R.phase === 'read' ? pct : Math.max(4, pct)}%"></i></div>${R.phase === 'read' ? '' : '<small>La première fois, ça télécharge environ 5 Mo.</small>'}</div>`;
}
function openRecap(R){
  const unitOf = L => { const p = S.products.get(L.pid); return p ? p.unit : (L.weight ? 'kg' : 'u'); };
  const lineHtml = (L, i) => {
    if(L.state === 'ignored') return `<div class="adjust ignored"><span class="raw">${esc(L.raw)}</span><button type="button" class="linkish" data-act="unign" data-i="${i}">remettre</button></div>`;
    const p = S.products.get(L.pid);
    const raw = L.raw ? `<div class="raw-row"><span class="raw">${esc(L.raw)}${L.price != null ? ' · ' + fmtEur(L.price) : ''}</span><button type="button" class="mini-x" data-act="ign" data-i="${i}" aria-label="Ignorer cette ligne">✕</button></div>` : '';
    const name = !p ? `<button type="button" class="pickbtn" data-act="pick" data-i="${i}">Choisir le produit… 🤔</button>` : `<button type="button" class="adj-name" data-act="pick" data-i="${i}">${nameE(p)}${L.state === 'guess' ? ' ?' : ''}</button>`;
    return `<div class="adjust${!p || L.state === 'guess' ? ' miss' : ''}">${raw}<div class="adj-row">${name}<button class="adj-btn" type="button" data-act="minus" data-i="${i}" aria-label="Moins">−</button><button type="button" class="adj-val linkq" data-act="qty" data-i="${i}">${esc(L.label || fmtQty(L.qty, p || unitOf(L)))}</button><button class="adj-btn" type="button" data-act="plus" data-i="${i}" aria-label="Plus">+</button></div></div>`;
  };
  const okN = () => R.lines.filter(L => L.state !== 'ignored' && L.pid).length;
  const html = () => R.loading ? `<div class="sheet-scroll"><h2>Ticket 🧾</h2>${readingHtml(R)}</div><div class="sheet-actions"><button class="btn grow" type="button" data-close>Annuler</button></div>`
    : `<div class="sheet-scroll"><h2>Ticket${R.store ? ' ' + esc(R.store) : ''} 🧾</h2>
      ${R.lines.map(lineHtml).join('')}
      <button type="button" class="addline" data-act="addl">＋ Ajouter un produit</button>
      <label class="frow"><span class="fl">Date</span><input type="date" name="date" value="${R.date}"></label>
      <label class="frow"><span class="fl">Magasin</span><input type="text" name="store" value="${esc(R.store)}" placeholder="?" autocomplete="off"></label>
      <label class="frow"><span class="fl">Total payé</span><input type="text" inputmode="decimal" name="total" value="${esc(R.total)}" placeholder="0,00"></label>
    </div><div class="sheet-actions"><button class="btn grow" type="button" data-act="cancel">Annuler</button><button class="btn primary grow" type="button" data-act="ok">Valider · ${okN()}</button></div>`;
  let d;
  const rerender = () => { const sc = d.querySelector('.sheet-scroll'), top = sc ? sc.scrollTop : 0; d.querySelector('form').innerHTML = html(); const s2 = d.querySelector('.sheet-scroll'); if(s2) s2.scrollTop = top; };
  d = openSheet(html(), {
    onInput: e => { const n = e.target.name; if(n === 'date' || n === 'store' || n === 'total') R[n] = e.target.value; },
    onClick: async (e) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const a = b.dataset.act, L = R.lines[+b.dataset.i];
      if(a === 'plus' || a === 'minus'){ const st = stepOf(unitOf(L), L.qty); L.qty = Math.max(st, +(L.qty + (a === 'plus' ? st : -st)).toFixed(3)); delete L.label; rerender(); }
      else if(a === 'qty'){ const p = S.products.get(L.pid); if(!p){ toast('Choisis d’abord le produit 🤔'); return; } openQtyEditor(p, {qty: L.qty, label: L.label}, r => { L.qty = r.qty; if(r.label) L.label = r.label; else delete L.label; rerender(); }); }
      else if(a === 'ign'){ L.state = 'ignored'; L.userIgn = true; rerender(); }
      else if(a === 'unign'){ L.state = L.pid ? 'ok' : 'unknown'; L.userIgn = false; if(L.auto){ L.auto = false; L.unignore = true; L.qty = guessQty(L, null); } rerender(); }
      else if(a === 'pick') openPicker(L.raw, L, p => { L.pid = p.id; L.state = 'ok'; L.qty = guessQty(L, p); rerender(); });
      else if(a === 'addl') openPicker('', null, p => { R.lines.push({raw: '', count: 1, pid: p.id, qty: packOf(p), state: 'ok', manual: true}); rerender(); });
      else if(a === 'cancel'){ if(!R.lines.length || await confirmBox('Abandonner ce ticket ?', '', 'Abandonner')) d.close(); }
      else if(a === 'ok') validateRecap(R, d);
    }});
  d._render = rerender;
  return d;
}
async function validateRecap(R, d){
  const ok = R.lines.filter(L => L.state !== 'ignored' && L.pid && S.products.get(L.pid));
  const unk = R.lines.filter(L => L.state !== 'ignored' && !L.pid);
  if(!ok.length){ toast('Rien à enregistrer 🤷'); return; }
  if(unk.length && !await confirmBox(`${unk.length} ligne${unk.length > 1 ? 's' : ''} sans produit`, 'Elles seront ignorées pour cette fois.', 'Continuer', false)) return;
  let date = R.date ? new Date(R.date + 'T12:00').getTime() : Date.now();
  if(isNaN(date)) date = Date.now();
  if(R.date === isoDay(Date.now())) date = Date.now();
  const tid = uid();
  let total = num(R.total);
  if(total == null){ const s = R.lines.filter(L => L.state !== 'ignored' && L.price != null).reduce((s, L) => s + L.price, 0); total = s ? +s.toFixed(2) : null; }
  for(const L of ok){
    const p = S.products.get(L.pid);
    recordPurchase(p, L.qty, date, tid);
    if(L.price != null && L.qty > 0){ p.price = +(L.price / L.qty).toFixed(3); delete p.priceManual; saveP(p); }
    if(L.raw) saveA({label: norm(L.raw), pid: p.id, mult: L.weight ? 1 : +(L.qty / (L.count || 1)).toFixed(3)});
  }
  for(const L of R.lines){
    if(L.raw && L.userIgn) saveA({label: norm(L.raw), pid: null});
    if(L.raw && L.unignore && !L.pid){ S.aliases.delete(norm(L.raw)); store.del('aliases', norm(L.raw)); }
  }
  saveT({id: tid, date, store: (R.store || '').trim(), total, lines: ok.map(L => ({raw: L.raw || null, pid: L.pid, qty: L.qty, price: L.price ?? null})), created: Date.now()});
  d.close(); S.month = 0; render();
  toast(`Ticket rangé ✔️ ${ok.length} produit${ok.length > 1 ? 's' : ''} à jour`);
}
function openPicker(raw, L, onPick){
  let q = raw ? cleanName(raw) : '';
  const results = () => {
    const list = searchList(q).slice(0, 30);
    const exact = list.some(p => norm(p.name) === norm(q));
    return (q.trim() && !exact ? `<button type="button" class="addline" data-act="create">＋ Créer « ${esc(q.trim())} »</button>` : '') + `<div style="display:flex;flex-direction:column;gap:6px">${productRows(list, 'pick')}</div>`;
  };
  openSheet(`<div class="sheet-scroll"><h2>Quel produit ? 🤔</h2>${raw ? `<p class="hint" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin-top:-6px">${esc(raw)}</p>` : ''}
    <label class="frow search"><input type="search" name="q" value="${esc(q)}" placeholder="Chercher ou créer" autocomplete="off"></label>
    <div id="res">${results()}</div></div>
    <div class="sheet-actions"><button class="btn grow" type="button" data-close>Annuler</button></div>`, {
    onInput: (e, d) => { if(e.target.name === 'q'){ q = e.target.value; d.querySelector('#res').innerHTML = results(); } },
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'pick'){ d.close(); onPick(S.products.get(b.dataset.id)); }
      else if(b.dataset.act === 'create'){
        const nm = cap(q.trim());
        const it = L || {raw: nm, count: 1};
        const unit = L ? guessUnit(L) : 'u';
        const p = {id: uid(), name: nm, rayon: guessRayon(raw || nm), unit, format: unit === 'u' ? guessFormat(raw || nm) : '', pack: null, purchases: [], created: Date.now()};
        p.pack = guessQty(it, p) || 1;
        saveP(p); d.close(); onPick(p); toast(`${nm} créé ✨ (${RAYON[p.rayon]})`);
      }
    }});
}

/* ---------- Sauvegarde ---------- */
function openBackup(){
  openSheet(`<div class="sheet-scroll"><h2>Sauvegarde 💾</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn grow" type="button" data-act="exp">Exporter</button><label class="btn grow file-btn">Importer<input type="file" accept="application/json,.json"></label></div>
    <p class="hint" style="margin:0">Version ${APP_VERSION}</p></div>
    <div class="sheet-actions"><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act="exp"]'); if(!b) return;
      const data = {app:'courses', version: APP_VERSION, exportedAt: new Date().toISOString(), products:[...S.products.values()], aliases:[...S.aliases.values()], tickets:[...S.tickets.values()], list:[...S.list.values()], settings:S.settings};
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
      a.download = `courses-${isoDay(Date.now())}.json`; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Sauvegarde exportée 💾');
    },
    onInput: async (e, d) => {
      if(e.type !== 'change' || e.target.type !== 'file') return;
      const f = e.target.files[0]; if(!f) return;
      let data; try{ data = JSON.parse(await f.text()); }catch(_){ toast('Fichier illisible 😕'); return; }
      if(!data || data.app !== 'courses'){ toast('Ce n’est pas une sauvegarde des courses 🤔'); return; }
      if(!await confirmBox('Remplacer toutes les données ?', 'Les courses actuelles seront remplacées par la sauvegarde.', 'Remplacer')) return;
      await txp(Object.keys(STORES), 'readwrite', t => {
        for(const n of Object.keys(STORES)) t.objectStore(n).clear();
        for(const n of ['products', 'aliases', 'tickets', 'list']) for(const v of data[n] || []) t.objectStore(n).put(v);
        t.objectStore('settings').put(Object.assign({}, data.settings || {}, {k:'main'}));
      });
      for(const n of ['products', 'aliases', 'tickets', 'list']) S[n].clear();
      (data.products || []).forEach(p => S.products.set(p.id, p)); (data.aliases || []).forEach(a => S.aliases.set(a.label, a));
      (data.tickets || []).forEach(t => S.tickets.set(t.id, t)); (data.list || []).forEach(l => S.list.set(l.id, l));
      S.settings = Object.assign({}, data.settings || {}, {k:'main'});
      d.close(); render(); toast('Sauvegarde importée ✔️');
    }});
}
