<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --warn:#A8432C;
  --today:#e8962e; --today-soft:#fff1dc; --tomorrow:#7b5cd6; --tomorrow-soft:#efe9ff;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B;
    --today:#f0a648; --today-soft:#3b2c15; --tomorrow:#a58cf0; --tomorrow-soft:#2a2342;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B;
  --today:#f0a648; --today-soft:#3b2c15; --tomorrow:#a58cf0; --tomorrow-soft:#2a2342;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.muted{color:var(--muted)}
.t-today{color:var(--today)}.t-tomorrow{color:var(--tomorrow)}

/* Carte du haut (même forme que la météo de la garde-robe) */
.wx{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:14px 12px 14px 16px;margin:0 0 14px}
.wx-open{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;color:var(--ink)}
.wx-day{font-size:17px;font-weight:600}
.wx-main{display:flex;align-items:baseline;gap:10px;margin:2px 0}
.wx-temp{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.wx-sub{font-size:14px;color:var(--muted)}
.wx-days{display:flex;flex-direction:column;gap:6px;flex:none}
.chip-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;line-height:1.2;color:var(--ink);white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.wx-days .chip-btn{min-width:104px;padding:8px 10px}

/* Raccourcis */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;margin:0 0 18px}
.q{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--ink);min-width:0}
.q-ico{position:relative;width:48px;height:48px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.q-ico svg{width:22px;height:22px}
.q-l{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:-.02em;line-height:1.15;text-align:center}
.q-dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--today);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

.group-title{font-family:var(--display);font-size:19px;font-weight:700;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.best{font-family:var(--body);font-size:12px;font-weight:600;color:var(--denim);background:var(--denim-soft);border-radius:99px;padding:3px 9px;white-space:nowrap}
.badge-today{background:var(--today);color:#fff}
.badge-tomorrow{background:var(--tomorrow);color:#fff}

/* Cases */
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 14px;background:var(--sunk);border-radius:12px;margin:0 0 8px;font-weight:600;font-size:15px;width:100%;border:0;text-align:left;color:var(--ink)}
.frow .fl{flex:none}
.frow .fv{color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;min-width:0;text-align:right}
.frow input[type=text],.frow input[type=number],.frow input[type=date],.frow input[type=search],.frow select{flex:1;min-width:0;border:0;background:transparent;text-align:right;font:500 15px/1.2 var(--body);color:var(--ink);padding:12px 0;outline:none}
.frow input[type=date]{text-align:right;min-height:44px}
.frow select{text-align-last:right;appearance:none;-webkit-appearance:none}
.frow input::placeholder{color:var(--muted)}
.fold{margin:0 0 6px}
.fold > .frow{margin:0}
.fold.open > .frow{border-radius:12px 12px 0 0}
.fold-body{background:var(--sunk);border-radius:0 0 12px 12px;padding:2px 8px 8px;display:flex;flex-direction:column;gap:6px}
.chev{font-size:13px;color:var(--muted);transition:transform .15s}
.fold.open .chev{transform:rotate(90deg)}

/* Lignes de liste */
.lrow{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;min-height:50px;padding:0 4px 0 0}
.lchk{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 0 8px 10px;cursor:pointer}
.lchk input{width:20px;height:20px;accent-color:var(--denim);flex:none;margin:0}
.nm{flex:1;min-width:0;font-weight:500;font-size:15px;line-height:1.25}
.nm small{display:block;font-size:12px;font-weight:600}
.lrow.done .lchk{opacity:.45}
.lrow.done .nm{text-decoration:line-through}
.qt{flex:none;border:0;background:var(--sunk);border-radius:9px;padding:7px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:48px}

.trow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:9px 12px;min-height:52px;width:100%;border:0;text-align:left;color:var(--ink)}
.trow .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.trow .tx b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tx small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .am{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;flex:none}
.chevr{font-size:20px;color:var(--muted);flex:none;line-height:1}

.srow{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;border:0;text-align:left;color:var(--ink)}
.srow .top{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:500}
.srow .top b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow small{font-weight:600;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px;background:var(--denim)}
.bar i.low{background:var(--today)}

.btn{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;color:var(--ink)}
.btn.primary{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.btn.grow{flex:1 1 0}
.btn.wide{width:100%}
.btn.danger-solid{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.linkish{border:0;background:none;color:var(--denim);font-weight:600;padding:4px 0;font-size:14px}
.foot-link{display:block;margin:22px auto 6px;font-size:12px;color:var(--muted)}
.checkout{margin:12px 0 0}


.pe{display:inline-block;margin-right:5px;font-style:normal;text-decoration:none}
/* Liste en bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;grid-auto-flow:row dense}
.bento-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px 4px;min-width:0}
.bento-card.wide{grid-column:1 / -1}
.bento-card.cols .bento-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
.bento-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14.5px;font-weight:700;margin:0 2px 2px}
.bento-h span:first-child{min-width:0;line-height:1.2}
.bento-n{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);flex:none}
.brow{display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;row-gap:3px;padding:7px 0;border-top:1px solid var(--line)}
.bento-rows > .brow:first-child{border-top:0}
.bento-card.cols .bento-rows > .brow:nth-child(2){border-top:0}
.bchk{flex:0 1 auto;min-width:0;display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:0 0 0 2px}
.bchk input{width:18px;height:18px;accent-color:var(--denim);flex:none;margin:1px 0 0}
.bnm{min-width:0;font-size:14px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bmeta{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:3px 6px;font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;min-width:0}
.bqt{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bqt{border:0;background:var(--sunk);border-radius:7px;padding:2px 8px;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);min-height:24px;white-space:nowrap}
.brow.done .bchk,.brow.done .bmeta{opacity:.45}.brow.done .bnm{text-decoration:line-through}


/* Couleur par rayon */
.rc-fl{--c:#3E9B5F}.rc-frais{--c:#2E8FB8}.rc-viande{--c:#C2504A}.rc-pain{--c:#B7832F}.rc-epicerie{--c:#C46A2B}
.rc-boissons{--c:#1F9E8A}.rc-surgeles{--c:#5B7FD6}.rc-hygiene{--c:#C04F8E}.rc-maison{--c:#7A5CC7}.rc-autre{--c:#6B7486}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rc-fl{--c:#6CC48A}:root:not([data-theme="light"]) .rc-frais{--c:#6BBFE0}:root:not([data-theme="light"]) .rc-viande{--c:#E58A84}:root:not([data-theme="light"]) .rc-pain{--c:#E0B266}:root:not([data-theme="light"]) .rc-epicerie{--c:#E89A63}:root:not([data-theme="light"]) .rc-boissons{--c:#5CCBB7}:root:not([data-theme="light"]) .rc-surgeles{--c:#93AEF0}:root:not([data-theme="light"]) .rc-hygiene{--c:#E68BBE}:root:not([data-theme="light"]) .rc-maison{--c:#A893E8}:root:not([data-theme="light"]) .rc-autre{--c:#A0A8B8}}
:root[data-theme="dark"] .rc-fl{--c:#6CC48A}:root[data-theme="dark"] .rc-frais{--c:#6BBFE0}:root[data-theme="dark"] .rc-viande{--c:#E58A84}:root[data-theme="dark"] .rc-pain{--c:#E0B266}:root[data-theme="dark"] .rc-epicerie{--c:#E89A63}:root[data-theme="dark"] .rc-boissons{--c:#5CCBB7}:root[data-theme="dark"] .rc-surgeles{--c:#93AEF0}:root[data-theme="dark"] .rc-hygiene{--c:#E68BBE}:root[data-theme="dark"] .rc-maison{--c:#A893E8}:root[data-theme="dark"] .rc-autre{--c:#A0A8B8}
.bento-card{background:color-mix(in srgb,var(--c) 11%,var(--surface));border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.bento-card .bento-h span:first-child{color:var(--c)}
.bento-card .brow{border-top-color:color-mix(in srgb,var(--c) 22%,var(--line))}
.bento-card .bqt{background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.bento-card .bchk input{accent-color:var(--c)}
.sbar{flex:0 0 100%;height:4px;border-radius:2px;margin:2px 0 0 26px;max-width:calc(100% - 26px);background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden}
.sbar i{display:block;height:4px;border-radius:2px;background:var(--c)}
.srow .bar i{background:var(--c)}

.addtop{margin:0 0 10px;background:var(--surface);border-style:dashed}

.group-title > span:first-child{white-space:nowrap}
.chip-btn.fri{font-family:var(--body);font-size:12.5px;font-weight:600;padding:5px 11px}
.lowbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;margin:0 0 12px}
.lowbox h3{font-size:15px;margin:0 0 8px}
.lowchips{display:flex;flex-wrap:wrap;gap:6px}
.lowchip{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--ink)}

.chip-btn.stat{cursor:default;font-size:12.5px;min-width:0;padding:6px 10px}
.wx-approx{font-size:30px;font-weight:700;margin-right:4px;color:var(--muted)}
.bqt.alt{box-shadow:inset 0 0 0 1.5px var(--c)}
.bpr{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard{padding:10px 8px 6px}
.prow{display:flex;align-items:center;gap:6px;border-top:1px solid color-mix(in srgb,var(--c) 22%,var(--line))}
.pcard .bento-h + .prow{border-top:0}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:8px 4px;text-align:left;color:var(--ink)}
.pmain small{font-size:12px;color:var(--muted);font-weight:500;line-height:1.25}
.pmain .sbar{margin:3px 0 0;max-width:100%;flex:none;width:100%}
.padd{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font-size:18px;font-weight:700;padding:0}
.padd.on{background:var(--c);color:var(--surface);border-color:var(--c);cursor:default}

.wx{flex-wrap:wrap}
.wx-low{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.wx-low-t{font-size:13px;font-weight:600;color:var(--muted);margin-right:2px}
.wx-low .lowchip{padding:4px 10px;font-size:13px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.linkq{border:0;background:none;color:var(--denim);text-decoration:underline dotted;text-underline-offset:3px;padding:6px 2px}

.fhead{display:flex;gap:8px;margin:0 0 8px}
.femoji{width:52px;height:52px;flex:none;text-align:center;font-size:26px;border:0;border-radius:14px;background:var(--sunk);padding:0;outline:none}
.fname{flex:1;min-width:0;border:0;border-radius:14px;background:var(--sunk);padding:0 14px;font:700 18px/1.2 var(--display);color:var(--ink);outline:none}
.fname::placeholder{color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fcase{display:flex;flex-direction:column;gap:1px;background:var(--sunk);border-radius:12px;padding:7px 12px 6px;min-width:0}
.fcase > span:first-child{font-size:11.5px;font-weight:600;color:var(--muted)}
.fcase input,.fcase select{border:0;background:transparent;font:600 15px/1.3 var(--body);color:var(--ink);padding:2px 0;width:100%;min-width:0;outline:none;-webkit-appearance:none;appearance:none}
.fcase input::placeholder{color:var(--muted);font-weight:500}
.fcase.span2{grid-column:1 / -1}
.frhy{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:14px}
.frhy select{width:auto;text-decoration:underline dotted;text-underline-offset:3px}
.frhy #every{display:flex;align-items:center;gap:4px;font-weight:600}
.frhy #every input{width:2.6em;text-align:center;border-bottom:1px solid var(--line)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.fchips:empty{display:none}
.fextra{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.icon-btn{width:46px;flex:none;padding:0!important;display:flex;align-items:center;justify-content:center}
.pfold{width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.pcard .pfold .chev{display:inline-block;transform:rotate(90deg);transition:transform .15s}
.pcard.closed .pfold .chev{transform:none}
.pcard.closed{padding-bottom:10px}

.nolines{background:var(--today-soft);border-radius:12px;padding:12px 14px;margin:0 0 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.nolines span{color:var(--muted)}
.rawtxt{white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace;background:var(--surface);border-radius:10px;padding:10px;margin:10px 0 0;max-height:40vh;overflow:auto;color:var(--ink)}

.peek{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px/1 var(--body)}
.peek svg{width:17px;height:17px}
.peek[aria-pressed="true"]{background:var(--denim-soft);border-color:var(--denim-soft);color:var(--denim)}

.brow.man{background:color-mix(in srgb,var(--denim) 16%,transparent);border-radius:10px;margin:3px -5px;padding:7px 5px;border-top-color:transparent}
.brow.man + .brow{border-top-color:transparent}
.padd.on.man{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.pview{padding-top:0}
.pv-hero{display:flex;align-items:center;gap:14px;margin:0 -18px 14px;padding:22px 18px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--surface)),color-mix(in srgb,var(--c) 6%,var(--surface)))}
.pv-emoji{width:64px;height:64px;flex:none;border-radius:20px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 2px 10px color-mix(in srgb,var(--c) 30%,transparent)}
.pv-id{min-width:0}
.pv-id h2{margin:0 0 6px;font-size:23px;line-height:1.15}
.pv-tags{display:flex;flex-wrap:wrap;gap:5px}
.pv-tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}
.pv-tag.on{background:var(--c);color:var(--surface)}
.pv-stock{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pv-bar{flex:1;height:10px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,var(--sunk));overflow:hidden}
.pv-bar i{display:block;height:100%;border-radius:5px;background:var(--c)}
.pv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.pv-tile{background:color-mix(in srgb,var(--c) 8%,var(--sunk));border-radius:16px;padding:11px 13px;display:flex;flex-direction:column;gap:1px;min-width:0}
.pv-tile span{font-size:11.5px;font-weight:600;color:var(--muted)}
.pv-tile b{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.2}
.pv-tile small{font-size:12px;color:var(--muted)}

<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const APP_VERSION = 24;
const DEMO = false;
const DB_NAME = 'courses';
const DAY = 864e5;
const RAYONS = [['fl','Fruits & légumes'],['frais','Frais'],['viande','Viande et poisson'],['pain','Boulangerie'],['epicerie','Épicerie'],['boissons','Boissons'],['surgeles','Surgelés'],['hygiene','Hygiène'],['maison','Maison'],['autre','Autre']];
const RAYON = Object.fromEntries(RAYONS);
const RC = [
  {fl:'#3E9B5F', frais:'#2E8FB8', viande:'#C2504A', pain:'#B7832F', epicerie:'#C46A2B', boissons:'#1F9E8A', surgeles:'#5B7FD6', hygiene:'#C04F8E', maison:'#7A5CC7', autre:'#6B7486'},
  {fl:'#6CC48A', frais:'#6BBFE0', viande:'#E58A84', pain:'#E0B266', epicerie:'#E89A63', boissons:'#5CCBB7', surgeles:'#93AEF0', hygiene:'#E68BBE', maison:'#A893E8', autre:'#A0A8B8'}];
const UNITS = [['u',"À l'article"],['kg','Au poids (vrac)']];

const SVG = {
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9"/></svg>',
  gauge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="6" height="18" rx="1.5"/><rect x="14" y="3" width="6" height="18" rx="1.5"/><path d="M4 14h6M14 9h6"/></svg>',
  ticket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 11.5h6M9 15h3"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><path d="M8.5 6.5v4M6.5 8.5h4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5c2 0 3.7.7 5.1 1.7M21.5 12s-1.2 2.2-3.4 4M14.1 18.2c-.7.2-1.4.3-2.1.3C6 18.5 2.5 12 2.5 12"/><path d="M3.5 3.5l17 17"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 15.5 15 10l-8 9.5"/></svg>',
};

/* ---------- Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { if(v == null || v === '') return null; const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const fmtNum = (n, d = 2) => Number(n.toFixed(d)).toLocaleString('fr-FR', {maximumFractionDigits: d});
const fmt2 = n => (n || 0).toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtEur = n => fmt2(n) + ' €';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function fmtQty(q, x){
  if(q == null) return '';
  const unit = x && typeof x === 'object' ? x.unit : x, f = x && typeof x === 'object' ? x.format : '';
  if(unit === 'kg') return fmtNum(q, 2) + ' kg';
  if(unit === 'L' && !f) return fmtNum(q, 2) + ' L';
  const n = fmtNum(q, 1);
  return f ? (Math.abs(q - 1) < 1e-9 ? f : `${f} × ${n}`) : '×' + n;
}
function fmtStock(q, unit){ return unit === 'u' || !unit ? fmtNum(q, 1) : fmtQty(q, unit); }
function stepOf(unit){ return unit === 'kg' ? 0.1 : 1; }
function dayStr(t){ return cap(new Date(t).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'})); }
function isoDay(t){ const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function norm(s){
  return String(s || '').replace(/œ/gi, 'oe').replace(/æ/gi, 'ae').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase()
    .replace(/[^A-Z0-9%]+/g, ' ').replace(/\s+/g, ' ').trim();
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- Base de données ---------- */
const STORES = {products:'id', aliases:'label', tickets:'id', list:'id', settings:'k'};
let DBH;
function dbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { const d = r.result; for(const [n, k] of Object.entries(STORES)) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:k}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function txp(names, mode, fn){
  return new Promise((res, rej) => {
    const t = DBH.transaction(names, mode); let out;
    out = fn(t);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const store = {
  all: n => txp(n, 'readonly', t => t.objectStore(n).getAll()),
  put: (n, v) => txp(n, 'readwrite', t => { t.objectStore(n).put(v); }).catch(err),
  del: (n, k) => txp(n, 'readwrite', t => { t.objectStore(n).delete(k); }).catch(err),
};
function err(e){ console.error(e); toast('Enregistrement impossible 😬'); }

const S = {products:new Map(), aliases:new Map(), tickets:new Map(), list:new Map(), settings:{k:'main'}, month:0, open:new Set()};
const saveP = p => { S.products.set(p.id, p); store.put('products', p); };
const saveL = it => { S.list.set(it.id, it); store.put('list', it); };
const delL = id => { S.list.delete(id); store.del('list', id); };
const saveA = a => { S.aliases.set(a.label, a); store.put('aliases', a); };
const saveT = t => { S.tickets.set(t.id, t); store.put('tickets', t); };
const saveSet = () => store.put('settings', S.settings);

/* ---------- Consommation ---------- */
const lastQty = p => (p.purchases || []).length ? p.purchases[p.purchases.length - 1].q : null;
const packOf = p => p.pack || lastQty(p) || 1;
function rate(p){
  if(p.everyDays > 0) return packOf(p) / p.everyDays;
  const ps = (p.purchases || []).slice().sort((a, b) => a.d - b.d);
  if(ps.length < 2) return null;
  const span = (ps[ps.length - 1].d - ps[0].d) / DAY;
  if(span < 1) return null;
  const used = ps.slice(0, -1).reduce((s, x) => s + x.q, 0);
  return used > 0 ? used / span : null;
}
function stockAt(p, t = Date.now()){
  if(p.stockAt == null) return null;
  const r = rate(p) || 0;
  return Math.max(0, (p.stockQty || 0) - r * Math.max(0, (t - p.stockAt) / DAY));
}
function stockPct(p){
  const s = stockAt(p); if(s == null) return null;
  const ref = Math.max(packOf(p), ...(p.purchases || []).map(x => x.q), p.stockQty || 0, 0.0001);
  return Math.max(0, Math.min(100, s / ref * 100));
}
function daysLeft(p){ const r = rate(p), s = stockAt(p); return r && s != null ? s / r : null; }
function urg(p){ const d = daysLeft(p); return d == null ? null : d < 1 ? 'today' : d < 2 ? 'tomorrow' : null; }
function dueText(d){ return d < 1 ? "aujourd'hui" : d < 2 ? 'demain' : `dans ${Math.round(d)} j`; }
function learnedText(p){
  const saved = p.everyDays; delete p.everyDays;
  const r = rate(p); if(saved) p.everyDays = saved;
  if(!r) return 'en apprentissage 🧠';
  const days = packOf(p) / r;
  const q = fmtQty(packOf(p), p);
  return days < 1.5 ? `${q} par jour` : `${q} tous les ${Math.round(days)} j`;
}
function rateText(p){
  const r = rate(p); if(!r) return null;
  const u = p.unit === 'u' ? '' : ' ' + p.unit;
  if(r >= 1) return `≈ ${fmtNum(r, 1)}${u} par jour`;
  if(r * 7 >= 1) return `≈ ${fmtNum(r * 7, 1)}${u} par semaine`;
  return `≈ ${fmtNum(r * 30, 1)}${u} par mois`;
}
function recordPurchase(p, q, d, tid){
  p.purchases = (p.purchases || []).concat({d, q, t: tid || null}).sort((a, b) => a.d - b.d);
  const before = p.stockAt != null ? stockAt(p, Math.max(d, p.stockAt)) : 0;   // rythme recalculé avec ce nouvel achat
  p.stockQty = before + q; p.stockAt = Math.max(d, p.stockAt || 0);
  delete p.snooze;
  saveP(p);
  for(const it of [...S.list.values()]) if(it.pid === p.id) delL(it.id);
}
function plannedDate(p){
  if(p.never) return null;
  if(p.forceAt) return p.forceAt;
  const r = rate(p), s = stockAt(p); if(!r || s == null) return null;
  const d = s / r, F = (PLAN.F || nextShopDay()).getTime(), toF = Math.max(0, (F - Date.now()) / DAY);
  if(d < toF - 0.25) return Date.now();
  for(let k = 0; k < 60; k++) if(d < toF + 7 * k + H - 0.5) return F + 7 * k * DAY;
  return null;
}
function inList(pid){ for(const it of S.list.values()) if(it.pid === pid) return it; return null; }
function addToList(p, qty, auto = false){
  if(inList(p.id)) return false;
  saveL({id: uid(), pid: p.id, qty: qty ?? packOf(p), checked: false, auto, at: Date.now()});
  return true;
}
/* Regrouper les achats : une course tous les ~H jours (appris des tickets).
   À chaque course on prend tout ce qui ne tiendrait pas jusqu'à la suivante,
   en quantité suffisante (quitte à doubler) pour tenir jusqu'à celle d'après. */
/* Grosses courses le vendredi, chaque semaine.
   Pour le vendredi qui vient, on prend tout ce qui ne tiendrait pas jusqu'au vendredi suivant,
   en quantité suffisante (quitte à doubler) pour tenir jusque-là.
   Ce qui serait vide AVANT vendredi apparaît tout de suite (dépannage). */
const SHOP_DAY = 5;           // 0 = dimanche … 5 = vendredi
const H = 7;
const PERISH = new Set(['fl', 'pain', 'viande', 'frais']);
function nextShopDay(){
  const d = new Date(); d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + (SHOP_DAY - d.getDay() + 7) % 7);
  return d;
}
function plan(){
  const now = Date.now(), F = nextShopDay(), key = isoDay(F.getTime());
  const toF = Math.max(0, (F.getTime() - now) / DAY);
  const need = new Map(), urgent = new Set();
  for(const p of S.products.values()){
    const r = rate(p), s = stockAt(p);
    if(!r || s == null || p.snooze > now || p.never) continue;
    const d = s / r;
    if(d >= toF + H - 0.5) continue;                     // tient jusqu'au vendredi suivant : on attend
    const want = r * (toF + H) - s;                      // de quoi tenir jusqu'au vendredi suivant
    const base = packOf(p), max = base * (PERISH.has(p.rayon) ? 2 : 4);
    const q = p.unit === 'kg' ? Math.ceil(want * 10 - 1e-6) / 10 : Math.ceil(want - 1e-6);
    need.set(p.id, +Math.min(max, Math.max(base, q)).toFixed(2));
    if(d < toF - 0.25) urgent.add(p.id);                // vide avant vendredi
  }
  const soon = toF <= 1.5;                               // à partir de la veille
  const show = soon || S.settings.showFri === key;
  return {F, key, toF, need, urgent, soon, show, fridayN: [...need.keys()].filter(id => !urgent.has(id)).length};
}
let PLAN = {need: new Map(), urgent: new Set(), show: false, fridayN: 0};
function syncAuto(){
  const now0 = Date.now();
  for(const p of S.products.values()) if(p.forceAt && now0 >= p.forceAt){ delete p.forceAt; delete p.snooze; p._force = true; saveP(p); }
  PLAN = plan();
  for(const p of S.products.values()){

function brandOf(name){ const n = norm(name); for(const b of BRANDS) if(b[0].test(n)) return b; return null; }
const RAYON_EMOJI = {fl:'🥬', frais:'🥛', viande:'🥩', pain:'🥖', epicerie:'🥫', boissons:'🥤', surgeles:'🧊', hygiene:'🧴', maison:'🏠', autre:'🛒'};
function guessEmoji(name, rayon){ const b = brandOf(name); if(b) return b[1]; const n = norm(name); for(const [rx, e] of EMOJI) if(rx.test(n)) return e; return RAYON_EMOJI[rayon] || '🛒'; }
const emojiOf = p => p.emoji || guessEmoji(p.name, p.rayon);
const nameE = p => `<span class="pe" aria-hidden="true">${emojiOf(p)}</span>${esc(p.name)}`;
function firstGrapheme(s){
  s = String(s || '').trim(); if(!s) return '';
  if(window.Intl && Intl.Segmenter){ const it = new Intl.Segmenter('fr', {granularity:'grapheme'}).segment(s)[Symbol.iterator]().next(); return it.value ? it.value.segment : ''; }
  return Array.from(s).slice(0, 2).join('');
}

function monthInfo(off){
  const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() - off);
  const y = d.getFullYear(), m = d.getMonth();
  const ts = [...S.tickets.values()].filter(t => { const x = new Date(t.date); return x.getFullYear() === y && x.getMonth() === m; });
  const sum = ts.reduce((s, t) => s + (t.total || 0), 0);
  return {d, n: ts.length, sum, long: cap(d.toLocaleDateString('fr-FR', {month:'long'})), short: cap(d.toLocaleDateString('fr-FR', {month:'short'}))};
}
function itemsByRayon(items){
  const g = new Map(RAYONS.map(([r]) => [r, []]));
  for(const it of items){ const p = S.products.get(it.pid); if(!p) continue; (g.get(p.rayon) || g.get('autre')).push({it, p}); }
  return g;
}
function nextShop(){
  let sum = 0, n = 0, miss = 0;
  const seen = new Set();
  for(const it of S.list.values()){ if(it.checked) continue; const p = S.products.get(it.pid); if(!p) continue; seen.add(p.id); n++; const pr = itemPrice(it, p); if(pr == null) miss++; else sum += pr; }
  return {sum, n, miss};
}
function render(){
  buildPrices();
  syncAuto();
  const months = [0, 1].map(monthInfo);
  const ns = nextShop();
  const recent = [...S.tickets.values()].filter(t => t.date > Date.now() - 90 * DAY && t.total != null);
  const low = [...S.products.values()].filter(p => { const pc = stockPct(p), d = daysLeft(p); return pc != null && (pc < 20 || (d != null && d < 2)); }).sort((a, b) => stockPct(a) - stockPct(b));
  // Ce mois : répartition par rayon + produits qui coûtent le plus
  const m0 = new Date(); m0.setDate(1); m0.setHours(0, 0, 0, 0);
  const byR = new Map(), byP = new Map(); let mTot = 0;

      byR.set(r, (byR.get(r) || 0) + l.price); mTot += l.price;

      <button type="button" class="wx-open" data-act="tickets" aria-label="Historique des tickets">
        <span class="wx-day">Ma liste</span>

      </button>
      ${monthStats}
      <div class="wx-days wx-pills" aria-label="Dépenses">${months.map(m => `<span class="chip-btn stat">${m.short} · ${Math.round(m.sum)} €</span>`).join('')}${avg != null ? `<span class="chip-btn stat">${Math.round(avg)} € / course</span>` : ''}</div>

    <div class="group-title"><span>Ma liste${leftN ? ' · ' + leftN : ''}</span>${PLAN.fridayN ? (PLAN.soon ? `<span class="best">🗓️ courses ${PLAN.toF < 0.5 ? "aujourd'hui" : 'vendredi'}</span>` : `<button type="button" class="peek" data-act="fri" aria-pressed="${PLAN.show}" aria-label="${PLAN.show ? 'Masquer' : 'Afficher'} les ${PLAN.fridayN} produits prévus vendredi" title="Prévus vendredi">${PLAN.show ? SVG.eye : SVG.eyeoff}<span>${PLAN.fridayN}</span></button>`) : ''}</div>
    <button type="button" class="addline addtop" data-act="add">＋ Ajouter un produit</button>
    ${items.length ? `<div class="bento">${bento}</div>` : ''}

    <button type="button" class="linkish foot-link" data-act="backup">Sauvegarde · version ${APP_VERSION}</button>`;
}

function checkout(){
  const now = Date.now(), tid = uid(), lines = [];
  for(const it of [...S.list.values()]) if(it.checked){
    const p = S.products.get(it.pid);
    if(p){ const q = itemStdQty(it, p), pr = itemPrice(it, p); lines.push({pid: p.id, qty: q, price: pr != null ? +pr.toFixed(2) : null}); recordPurchase(p, q, now, tid); }
    delL(it.id);
  }
  if(lines.length){
    const known = lines.filter(l => l.price != null);
    saveT({id: tid, date: now, store: '', total: known.length ? +known.reduce((s, l) => s + l.price, 0).toFixed(2) : null, lines, manual: true, created: now});
  }
  render(); toast(`Courses notées ✔️ ${lines.length} produit${lines.length > 1 ? 's' : ''}`);
}

/* ---------- Popups ---------- */
function openSheet(html, {onClick, onInput, onClose, cls = ''} = {}){
  const d = document.createElement('dialog');
  d.className = 'sheet-d ' + cls;
  d.innerHTML = `<form class="sheet" method="dialog" novalidate>${html}</form>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => {
    if(e.target === d){ d.close(); return; }
    const b = e.target.closest('[data-close]'); if(b){ e.preventDefault(); d.close(); return; }
    onClick && onClick(e, d);
  });
  onInput && d.addEventListener('input', e => onInput(e, d));
  onInput && d.addEventListener('change', e => { if(!/^(text|search)$/.test(e.target.type)) onInput(e, d); });
  d.addEventListener('submit', e => e.preventDefault());
  d.addEventListener('close', () => { onClose && onClose(d); d.remove(); });
  d.showModal();
  return d;
}
function confirmBox(title, text, ok = 'Supprimer', danger = true){
  return new Promise(res => {
    const d = document.createElement('dialog'); d.className = 'confirm-box';
    d.innerHTML = `<div class="cb-inner"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}<div class="cb-actions"><button class="btn grow" type="button" data-v="0">Annuler</button><button class="btn grow ${danger ? 'danger-solid' : 'primary'}" type="button" data-v="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(d);
    let v = false;
    d.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if(b){ v = b.dataset.v === '1'; d.close(); } else if(e.target === d) d.close(); });
    d.addEventListener('close', () => { d.remove(); res(v); });
    d.showModal();
  });
}

    <div class="adjust"><div class="adj-row"><button type="button" class="adj-name" data-act="edit" id="iq" style="color:var(--denim)">${esc(label())}</button><button class="adj-btn" type="button" data-act="minus" aria-label="Moins">−</button><button class="adj-btn" type="button" data-act="plus" aria-label="Plus">+</button></div></div>
    <div class="frow"><span class="fl">Prix</span><span class="fv" id="ipr">${priceLine()}</span></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn grow" type="button" data-act="fiche">Fiche produit</button><button class="btn grow" type="button" data-act="remove" style="color:var(--warn)">Retirer…</button></div>
  </div><div class="sheet-actions"><button class="btn primary grow" type="button" data-close>OK</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const st = stepOf(p.unit);
      if(b.dataset.act === 'plus' || b.dataset.act === 'minus'){
        const q0 = itemStdQty(it, p);
        it.qty = Math.max(st, +((p.unit === 'kg' ? q0 : Math.round(q0 * 100) / 100) + (b.dataset.act === 'plus' ? st : -st)).toFixed(2));
        delete it.label; delete it.format; it.edited = true; saveL(it); refresh(d);
      } else if(b.dataset.act === 'edit'){
        openQtyEditor(p, {qty: itemStdQty(it, p), label: it.label}, r => { it.qty = r.qty; delete it.format; if(r.label) it.label = r.label; else delete it.label; it.edited = true; saveL(it); refresh(d); });
      } else if(b.dataset.act === 'remove'){ d.close(); openRemove(it, p); }
      else if(b.dataset.act === 'fiche'){ d.close(); openView(p); }
    }});
}
function openRemove(it, p){
  const F = PLAN.F ? PLAN.F.getTime() : Date.now();
  const thisTrip = !PLAN.soon && (PLAN.urgent.has(p.id) || !PLAN.need.has(p.id));
  const target = thisTrip ? F : F + 7 * DAY;
  const lbl = t => new Date(t).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'short'});
  const tomorrow = isoDay(Date.now() + DAY);
  const done = (msg) => { delL(it.id); render(); toast(msg); };
  const pd = plannedDate(p), planNow = PLAN.need.has(p.id) && (PLAN.show || PLAN.urgent.has(p.id));
  const showPlanned = !p.forceAt && pd != null && pd > Date.now() + 0.5 * DAY && !planNow;
  openSheet(`<div class="sheet-scroll"><h2>Retirer ${emojiOf(p)} ${esc(p.name)} ?</h2>
    ${showPlanned ? `<button class="btn wide" type="button" data-act="planned" style="margin-bottom:8px;text-align:left">↩️ Au moment prévu <span class="muted" style="font-weight:500"> · ${lbl(pd)}</span></button>` : ''}
    <button class="btn wide" type="button" data-act="next" style="margin-bottom:8px;text-align:left">🗓️ Aux prochaines courses <span class="muted" style="font-weight:500"> · ${lbl(target)}</span></button>
    <div class="frow" style="padding-right:8px"><span class="fl">📅 À une date</span><input type="date" name="when" min="${tomorrow}" value="${isoDay(target + 7 * DAY)}"><button class="btn primary" type="button" data-act="date" style="padding:8px 12px;margin-left:6px">OK</button></div>
    <button class="btn wide" type="button" data-act="never" style="margin-top:2px;text-align:left">🚫 Jamais <span class="muted" style="font-weight:500"> · ne plus le proposer</span></button>
  </div><div class="sheet-actions"><button class="btn grow" type="button" data-close>Annuler</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'planned'){ delete p.snooze; saveP(p); d.close(); done(`Il reviendra ${lbl(pd)} ↩️`); }
      else if(b.dataset.act === 'next'){ p.forceAt = target - 1.5 * DAY; p.snooze = p.forceAt; saveP(p); d.close(); done(`Reprogrammé ${lbl(target)} 🗓️`); }
      else if(b.dataset.act === 'date'){
        const v = d.querySelector('[name=when]').value; if(!v) return;
        const t = new Date(v + 'T00:00').getTime(); if(isNaN(t) || t <= Date.now()){ toast('Choisis une date à venir 📅'); return; }
        p.forceAt = t; p.snooze = t; saveP(p); d.close(); done(`Reprogrammé ${lbl(t)} 📅`);
      }
      else if(b.dataset.act === 'never'){ p.never = true; delete p.forceAt; saveP(p); d.close(); done('Il ne sera plus proposé 🚫'); }
    }});
}

/* Ajouter à la liste */
function productRows(list, act){
  return list.map(p => {
    const sub = inList(p.id) ? '<small>dans la liste 🛒</small>' : '';
    return `<button type="button" class="trow" data-act="${act}" data-id="${p.id}"><span class="tx"><b>${nameE(p)}</b>${sub}</span><span class="chevr">›</span></button>`;
  }).join('');
}
function searchList(q, exclude){
  const all = [...S.products.values()].filter(p => !exclude || !exclude(p));
  if(!q.trim()) return all.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const nq = norm(q);
  return all.map(p => ({p, s: norm(p.name).includes(nq) ? 2 : similarity(q, p.name)})).filter(x => x.s >= 0.4).sort((a, b) => b.s - a.s).map(x => x.p);
}
function openAdd(){
  let q = '';
  const results = () => {
    const list = searchList(q, p => !!inList(p.id)).slice(0, 40);
    const exact = list.some(p => norm(p.name) === norm(q));
    return `<div style="display:flex;flex-direction:column;gap:6px">${productRows(list, 'pick')}</div>`;
  };
  openSheet(`<div class="sheet-scroll"><div class="page-head"><h1>Ajouter 🛒</h1><button type="button" class="chip-btn" data-act="create">＋ Nouveau produit</button></div>
    <label class="frow search"><input type="search" name="q" placeholder="Chercher ou créer un produit" autocomplete="off" enterkeyhint="search"></label>
    <div id="res">${results()}</div></div>
    <div class="sheet-actions"><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onInput: (e, d) => { if(e.target.name === 'q'){ q = e.target.value; d.querySelector('#res').innerHTML = results(); } },
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'pick'){ const p = S.products.get(b.dataset.id); addToList(p); render(); d.close(); toast(`${p.name} ajouté 🛒`); }
      else if(b.dataset.act === 'create'){ d.close(); openProduct(null, {name: cap(q.trim()), onSaved: p => { if(p){ addToList(p); render(); toast(`${p.name} ajouté à la liste 🛒`); } }}); }
    }});
}

/* Produits */
function rhythmShort(p){
  if(p.everyDays) return `${fmtQty(packOf(p), p)} tous les ${p.everyDays} j`;
  return learnedText(p);
}
function openProducts(){
  let q = ''; const closed = new Set();
  const row = p => {
    const pct = stockPct(p), pr = priceOf(p), inl = !!inList(p.id);
    const sub = [rhythmShort(p), pr != null ? (p.unit === 'kg' ? `${fmt2(pr)} €/kg` : `${fmt2(pr * packOf(p))} €`) : '', p.never ? '🚫 jamais proposé' : ''].filter(Boolean).join(' · ');
    return `<div class="prow"><button type="button" class="pmain" data-act="open" data-id="${p.id}"><span class="bnm">${nameE(p)}</span><small>${sub}</small>${pct != null ? `<span class="sbar"><i style="width:${Math.max(3, pct)}%"></i></span>` : ''}</button><button type="button" class="padd${inl ? ' on' + (inList(p.id).auto ? '' : ' man') : ''}" data-act="${inl ? 'unlist' : 'tolist'}" data-id="${p.id}" aria-label="${inl ? 'Retirer de la liste' : 'Ajouter à la liste'}">${inl ? '✓' : '＋'}</button></div>`;
  };
  const body = () => {
    const list = searchList(q);
    let h = '';
    for(const [r, label] of RAYONS){
      const arr = list.filter(p => (p.rayon || 'autre') === r); if(!arr.length) continue;
      if(!q.trim()) arr.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
      const isC = closed.has(r) && !q.trim();
      h += `<section class="bento-card wide pcard rc-${r}${isC ? ' closed' : ''}"><button type="button" class="bento-h pfold" data-act="pfold" data-r="${r}" aria-expanded="${!isC}"><span>${label}</span><span class="bento-n">${arr.length} <span class="chev">›</span></span></button>${isC ? '' : arr.map(row).join('')}</section>`;
    }
    return h;
  };
  openSheet(`<div class="sheet-scroll"><div class="page-head"><h1>Produits</h1><span class="wx-sub">${S.products.size}</span></div>
    <label class="frow search"><input type="search" name="q" placeholder="Chercher un produit" autocomplete="off"></label>
    <div id="res" style="display:flex;flex-direction:column;gap:8px">${body()}</div></div>
    <div class="sheet-actions"><button class="btn grow" type="button" data-act="new">＋ Nouveau</button><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onInput: (e, d) => { if(e.target.name === 'q'){ q = e.target.value; d.querySelector('#res').innerHTML = body(); } },
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const refresh = () => { d.querySelector('#res').innerHTML = body(); };
      if(b.dataset.act === 'pfold'){ const r = b.dataset.r; closed.has(r) ? closed.delete(r) : closed.add(r); refresh(); }
      else if(b.dataset.act === 'open') openView(S.products.get(b.dataset.id), refresh);
      else if(b.dataset.act === 'unlist'){ const p = S.products.get(b.dataset.id), it = inList(p.id); if(!it) return; if(!it.auto){ delL(it.id); render(); refresh(); toast('Retiré de la liste 👋'); } else openRemove(it, p); }
      else if(b.dataset.act === 'tolist'){ const p = S.products.get(b.dataset.id); addToList(p, PLAN.need.get(p.id) ?? packOf(p)); render(); refresh(); toast(`${p.name} ajouté 🛒`); }
      else if(b.dataset.act === 'new') openProduct(null, {onSaved: refresh});
    }});
}

/* Fiche produit (lecture) */
function openView(p, refresh){
  if(!p) return;
  const r = p.rayon || 'autre';
  const body = () => {
    const it = inList(p.id), pct = stockPct(p), pr = priceOf(p), pd = plannedDate(p), last = (p.purchases || []).slice(-1)[0];
    const stockLbl = pct == null ? '' : pct < 20 ? 'Presque vide 🪫' : pct < 55 ? 'Entamé' : 'Bien rempli 👌';
    const when = p.never ? 'Jamais 🚫' : pd == null ? 'En apprentissage 🧠' : pd <= Date.now() + 0.5 * DAY ? 'Dès maintenant' : cap(new Date(pd).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'}));
    const tile = (k, v, small) => `<div class="pv-tile"><span>${k}</span><b>${v}</b>${small ? `<small>${small}</small>` : ''}</div>`;
    return `<div class="pv-hero"><div class="pv-emoji">${emojiOf(p)}</div><div class="pv-id"><h2>${esc(p.name)}</h2>
        <div class="pv-tags"><span class="pv-tag">${RAYON[r]}</span>${p.unit === 'kg' ? '<span class="pv-tag">Vrac</span>' : p.format ? `<span class="pv-tag">${esc(p.format)}</span>` : ''}${it ? `<span class="pv-tag on">🛒 Dans la liste</span>` : ''}</div></div></div>
      ${pct != null ? `<div class="pv-stock"><div class="pv-bar"><i style="width:${Math.max(3, pct)}%"></i></div><span>${stockLbl}</span></div>` : ''}
      <div class="pv-grid">
        ${tile('Rythme', p.everyDays ? `tous les ${p.everyDays} j` : rate(p) ? learnedText(p).replace(/^.* tous les /, 'tous les ') : '—', p.everyDays ? 'fixé' : rate(p) ? fmtQty(packOf(p), p) : '')}
        ${tile('Prix', pr != null ? (p.unit === 'kg' ? `${fmt2(pr)} €/kg` : `${fmt2(pr * packOf(p))} €`) : '—', pr != null && p.unit !== 'kg' ? fmtQty(packOf(p), p) : '')}
        ${tile('Prochain passage', when, p.forceAt ? 'reprogrammé' : '')}
        ${tile('Dernier achat', last ? cap(new Date(last.d).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})) : '—', last ? fmtQty(last.q, p) : '')}
      </div>`;
  };
  const actions = () => { const it = inList(p.id); return `<button class="btn grow" type="button" data-act="list">${it ? 'Retirer de la liste' : '🛒 À la liste'}</button><button class="btn primary grow" type="button" data-act="edit">✏️ Modifier</button>`; };
  const d = openSheet(`<div class="sheet-scroll pview rc-${r}">${body()}</div><div class="sheet-actions">${actions()}</div>`, {
    onClick: (e, dd) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const redraw = () => { dd.querySelector('.pview').innerHTML = body(); dd.querySelector('.sheet-actions').innerHTML = actions(); refresh && refresh(); };
      if(b.dataset.act === 'edit'){ dd.close(); openProduct(p, {onSaved: np => { render(); refresh && refresh(); if(np) openView(np, refresh); }}); }
      else if(b.dataset.act === 'list'){
        const it = inList(p.id);
        if(!it){ addToList(p, PLAN.need.get(p.id) ?? packOf(p)); render(); redraw(); toast(`${p.name} ajouté 🛒`); }
        else if(!it.auto){ delL(it.id); render(); redraw(); toast('Retiré de la liste 👋'); }
        else { dd.close(); openRemove(it, p); }
      }
    }});
  return d;
}

/* Fiche produit */
function openProduct(p, {name = '', onSaved} = {}){
  const isNew = !p;
  const P = p ? JSON.parse(JSON.stringify(p)) : {id: uid(), name, rayon: guessRayon(name), unit: 'u', format: guessFormat(name), pack: null, purchases: [], created: Date.now()};
  const st0 = stockAt(P);
  const priceStr0 = priceOf(P) != null ? fmt2(priceOf(P) * (P.unit === 'kg' ? 1 : packOf(P))) : '';
  const stockStr = st0 != null ? fmtNum(st0, 2) : '';
  const open = new Set();
  const aliases = () => [...S.aliases.values()].filter(a => a.pid === P.id);
  let emojiTouched = false, rayonTouched = false, fmtTouched = false;
  const extra = () => {
    const al = aliases(), hist = (P.purchases || []).slice().reverse();
    if(open.has('al')) return al.map(a => `<div class="trow"><span class="tx"><b style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(a.label)}</b></span><button type="button" class="mini-x" data-act="unalias" data-l="${esc(a.label)}" aria-label="Oublier ce libellé">✕</button></div>`).join('');
    if(open.has('hi')) return hist.slice(0, 30).map(h => `<div class="trow"><span class="tx"><b>${dayStr(h.d)}</b><small>${h.t ? 'ticket' : 'à la main'}</small></span><span class="am">${fmtQty(h.q, P)}</span></div>`).join('');
    return '';
  };
  const chips = () => {
    const al = aliases().length, hn = (P.purchases || []).length;
    return `${inList(P.id) ? '' : '<button type="button" class="chip-btn" data-act="tolist">🛒 À la liste</button>'}
      ${al ? `<button type="button" class="chip-btn" data-act="fold" data-r="al" aria-pressed="${open.has('al')}">🧾 ${al} libellé${al > 1 ? 's' : ''}</button>` : ''}
      ${hn ? `<button type="button" class="chip-btn" data-act="fold" data-r="hi" aria-pressed="${open.has('hi')}">🕓 ${hn} achat${hn > 1 ? 's' : ''}</button>` : ''}`;
  };
  const sel = (name, opts, v) => `<select name="${name}">${opts.map(([k, l]) => `<option value="${k}"${v === k ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  const html = `<div class="sheet-scroll"${isNew ? '' : ' tabindex="-1" autofocus style="outline:none"'}>
    <div class="fhead"><input class="femoji" type="text" name="emoji" value="${esc(emojiOf(P))}" autocomplete="off" aria-label="Emoji"><input class="fname" type="text" name="name" value="${esc(P.name)}" placeholder="Nom du produit" autocomplete="off" aria-label="Nom"${isNew ? ' autofocus' : ''}></div>
    <div class="fgrid">
      <label class="fcase"><span>Rayon</span>${sel('rayon', RAYONS, P.rayon)}</label>
      <label class="fcase"><span>Vendu</span>${sel('unit', UNITS, P.unit === 'kg' ? 'kg' : 'u')}</label>
      <label class="fcase" id="fmt"${P.unit === 'kg' ? ' hidden' : ''}><span>Format</span><input type="text" name="format" value="${esc(P.format || '')}" placeholder="500 g, 1 L…" autocomplete="off"></label>
      <label class="fcase"><span>Qté habituelle</span><input type="text" inputmode="decimal" name="pack" value="${P.pack != null ? fmtNum(P.pack, 2) : ''}" placeholder="${lastQty(P) != null ? fmtNum(lastQty(P), 2) : '1'}"></label>
      <label class="fcase"><span id="plbl">${esc(priceLabel(P.unit, P.format, packOf(P)))}</span><input type="text" inputmode="decimal" name="price" value="${priceStr0}" placeholder="?"></label>
      ${isNew ? '' : `      <div class="fcase span2"><span>Rythme</span><div class="frhy">${sel('mode', [['auto', 'Appris'], ['fixed', 'Fixe']], P.everyDays ? 'fixed' : 'auto')}
        <span id="learned" class="muted"${P.everyDays ? ' hidden' : ''}>${learnedText(P)}</span>
        <label id="every"${P.everyDays ? '' : ' hidden'}>tous les <input type="text" inputmode="numeric" name="every" value="${P.everyDays || ''}" placeholder="7"> j</label></div></div>
      <label class="fcase"><span>Proposé tout seul</span>${sel('auto', [['yes', 'Oui'], ['never', 'Jamais']], P.never ? 'never' : 'yes')}</label>
      ${P.forceAt ? `<div class="fcase" id="resched"><span>Reprogrammé</span><b style="font-size:15px;display:flex;align-items:center;justify-content:space-between">${new Date(P.forceAt).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}<button type="button" class="mini-x" data-act="unresched" aria-label="Annuler la reprogrammation">✕</button></b></div>` : ''}`}
    </div>
  </div><div class="sheet-actions">${isNew ? '' : `<button class="btn icon-btn" type="button" data-act="del" aria-label="Supprimer le produit" style="color:var(--warn)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`}<button class="btn grow" type="button" data-close>Annuler</button><button class="btn primary grow" type="button" data-act="save">${isNew ? 'Créer' : 'Enregistrer'}</button></div>`;
  openSheet(html, {
    onInput: (e, d) => {
      if(e.target.name === 'mode'){ d.querySelector('#every').hidden = e.target.value !== 'fixed'; d.querySelector('#learned').hidden = e.target.value === 'fixed'; }
      if(e.target.name === 'emoji') emojiTouched = true;
      if(e.target.name === 'rayon') rayonTouched = true;
      if(e.target.name === 'name' && isNew && !rayonTouched){ const f = d.querySelector('form'); f.rayon.value = guessRayon(f.name.value); }
      if(e.target.name === 'format') fmtTouched = true;
      if(e.target.name === 'name' && isNew && !fmtTouched){ const f = d.querySelector('form'), g = guessFormat(f.name.value); if(g) f.format.value = g; }
      if(e.target.name === 'unit') d.querySelector('#fmt').hidden = e.target.value === 'kg';
      if(['unit', 'pack', 'format'].includes(e.target.name)){ const f = d.querySelector('form'); d.querySelector('#plbl').textContent = priceLabel(f.unit.value, f.format.value.trim(), num(f.pack.value) || packOf(P)); }
      if((e.target.name === 'name' || e.target.name === 'rayon') && !emojiTouched && !P.emoji){ const f = d.querySelector('form'); f.emoji.value = guessEmoji(f.name.value, f.rayon.value); }
    },
    onClick: async (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      const a = b.dataset.act, f = d.querySelector('form');
      if(a === 'fold'){ const r = b.dataset.r, was = open.has(r); open.clear(); if(!was) open.add(r); d.querySelector('#extra').innerHTML = extra(); d.querySelector('#fchips').innerHTML = chips(); }
      else if(a === 'unresched'){ const cur = S.products.get(P.id); if(cur){ delete cur.forceAt; delete cur.snooze; saveP(cur); } d.querySelector('#resched').remove(); render(); }
      else if(a === 'unalias'){ S.aliases.delete(b.dataset.l); store.del('aliases', b.dataset.l); if(!aliases().length) open.clear(); d.querySelector('#extra').innerHTML = extra(); d.querySelector('#fchips').innerHTML = chips(); }
      else if(a === 'tolist'){ addToList(S.products.get(P.id) || P); render(); b.remove(); toast('Ajouté à la liste 🛒'); }
      else if(a === 'del'){
        if(!await confirmBox(`Supprimer « ${P.name} » ?`, 'Son historique et ses libellés de ticket seront effacés.')) return;
        S.products.delete(P.id); store.del('products', P.id);
        for(const al of aliases()){ S.aliases.delete(al.label); store.del('aliases', al.label); }
        for(const it of [...S.list.values()]) if(it.pid === P.id) delL(it.id);
        d.close(); render(); onSaved && onSaved(null); toast('Produit supprimé 🗑️');
      }
      else if(a === 'save'){
        const nm = f.name.value.trim(); if(!nm){ f.name.focus(); toast('Donne un nom au produit.'); return; }
        const cur = S.products.get(P.id) || P;
        cur.name = nm; cur.rayon = f.rayon.value; cur.unit = f.unit.value;
        const pv = f.price.value.trim(), per = f.unit.value === 'kg' ? 1 : (num(f.pack.value) || packOf(cur) || 1);
        if(pv !== priceStr0 || (f.unit.value !== 'kg' && pv && per !== (P.unit === 'kg' ? 1 : packOf(P)))){
          const n2 = num(pv);
          if(n2 != null){ cur.price = +(n2 / per).toFixed(4); cur.priceManual = true; } else { delete cur.price; delete cur.priceManual; }
        }
        if(f.auto && f.auto.value === 'never') cur.never = true; else delete cur.never;
        const fm = f.format.value.trim(); if(fm && cur.unit !== 'kg') cur.format = fm; else delete cur.format;
        const em = firstGrapheme(f.emoji.value); if(em && em !== guessEmoji(nm, cur.rayon)) cur.emoji = em; else delete cur.emoji;
        cur.pack = num(f.pack.value);
        cur.everyDays = f.mode && f.mode.value === 'fixed' ? (num(f.every.value) || null) : null;
        if(!cur.everyDays) delete cur.everyDays;
        if(f.stock && f.stock.value.trim() !== stockStr){ const s = num(f.stock.value); if(s != null){ cur.stockQty = s; cur.stockAt = Date.now(); } else if(!f.stock.value.trim()){ delete cur.stockQty; delete cur.stockAt; } }
        cur.purchases = cur.purchases || [];
        saveP(cur); d.close(); render(); onSaved && onSaved(cur);
        toast(isNew ? 'Produit créé ✨' : 'Produit mis à jour ✔️');
      }
    }});
}

/* Stock */
function openStock(){
  const open = new Set(['__low']);
  const body = () => {
    const ps = [...S.products.values()].filter(p => stockAt(p) != null);
    const srow = p => {
      const pct = Math.max(3, stockPct(p));
      return `<button type="button" class="srow rc-${p.rayon || 'autre'}" data-act="open" data-id="${p.id}"><span class="top"><span>${nameE(p)}</span>${inList(p.id) ? '<small class="muted">🛒</small>' : ''}</span><span class="bar"><i style="width:${pct}%"></i></span></button>`;
    };
    const byD = (a, b) => stockPct(a) - stockPct(b);
    let h = '';
    for(const [r, label] of RAYONS){
      const arr = ps.filter(p => (p.rayon || 'autre') === r).sort(byD); if(!arr.length) continue;
      h += foldHtml(r, label, arr.length, open.has(r), arr.map(srow).join(''));
    }
    return h;
  };
  const low = [...S.products.values()].filter(p => { const pc = stockPct(p), d = daysLeft(p); return pc != null && (pc < 20 || (d != null && d < 2)); }).sort((a, b) => stockPct(a) - stockPct(b));
  const lowBox = low.length ? `<div class="lowbox"><h3>Presque vide 🪫</h3><div class="lowchips">${low.map(p => `<button type="button" class="lowchip" data-act="open" data-id="${p.id}">${emojiOf(p)} ${esc(p.name)}</button>`).join('')}</div></div>` : '';
  openSheet(`<div class="sheet-scroll"><div class="page-head"><h1>Stock</h1></div>${lowBox}<div id="res">${body()}</div></div>
    <div class="sheet-actions"><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'fold'){ const r = b.dataset.r; open.has(r) ? open.delete(r) : open.add(r); d.querySelector('#res').innerHTML = body(); }
      else if(b.dataset.act === 'open') openProduct(S.products.get(b.dataset.id), {onSaved: () => { d.querySelector('#res').innerHTML = body(); }});
    }});
}

/* Tickets */
function openTickets(){
  const open = new Set([isoDay(Date.now()).slice(0, 7)]);
  const body = () => {
    const ts = [...S.tickets.values()].sort((a, b) => b.date - a.date);
    const groups = new Map();
    for(const t of ts){ const k = isoDay(t.date).slice(0, 7); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
    const thisYear = new Date().getFullYear();
    let h = '';
    for(const [k, arr] of groups){
      const d = new Date(+k.slice(0, 4), +k.slice(5) - 1, 1);
      const label = cap(d.toLocaleDateString('fr-FR', d.getFullYear() === thisYear ? {month:'long'} : {month:'long', year:'numeric'}));
      const sum = arr.reduce((s, t) => s + (t.total || 0), 0);
      h += foldHtml(k, label, fmtEur(sum), open.has(k), arr.map(t => `<button type="button" class="trow" data-act="open" data-id="${t.id}"><span class="tx"><b>${dayStr(t.date)}</b><small>${t.store ? esc(t.store) + ' · ' : ''}${t.lines.length} produit${t.lines.length > 1 ? 's' : ''}</small></span><span class="am">${t.total != null ? fmtEur(t.total) : ''}</span><span class="chevr">›</span></button>`).join(''));
    }
    return h;
  };
  openSheet(`<div class="sheet-scroll"><div class="page-head"><h1>Historique</h1></div><div id="res">${body()}</div></div>
    <div class="sheet-actions"><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act === 'fold'){ const r = b.dataset.r; open.has(r) ? open.delete(r) : open.add(r); d.querySelector('#res').innerHTML = body(); }
      else if(b.dataset.act === 'open') openTicket(S.tickets.get(b.dataset.id), () => { d.querySelector('#res').innerHTML = body(); });
    }});
}
function openTicket(t, refresh){
  if(!t) return;
  const lines = t.lines.map(l => { const p = S.products.get(l.pid); return `<div class="trow"><span class="tx"><b>${p ? nameE(p) : esc(cleanName(l.raw) || 'Produit supprimé')}</b></span><span class="am">${fmtQty(l.qty, p || 'u')}${l.price != null ? `<small class="muted" style="display:block;font-weight:500;font-size:12px">${fmt2(l.price)} €</small>` : ''}</span></div>`; }).join('');
  openSheet(`<div class="sheet-scroll"><h2>Courses du ${dayStr(t.date).toLowerCase()} 🛒</h2>
    <label class="frow"><span class="fl">Magasin</span><input type="text" name="store" value="${esc(t.store || '')}" placeholder="?" autocomplete="off"></label>
    <label class="frow"><span class="fl">Total payé</span><input type="text" inputmode="decimal" name="total" value="${t.total != null ? fmt2(t.total) : ''}" placeholder="0,00"></label>
    <div style="display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:12px;padding:8px;margin:0 0 8px">${lines}</div>
    <button class="btn danger-solid" type="button" data-act="del" style="width:100%;margin-top:10px">Supprimer ces courses</button>
  </div><div class="sheet-actions"><button class="btn grow" type="button" data-close>Annuler</button><button class="btn primary grow" type="button" data-act="save">Enregistrer</button></div>`, {
    onClick: async (e, d) => {
      const b = e.target.closest('[data-act]'); if(!b) return; const f = d.querySelector('form');
      if(b.dataset.act === 'save'){ t.store = f.store.value.trim(); t.total = num(f.total.value); saveT(t); d.close(); render(); refresh && refresh(); toast('Mis à jour ✔️'); }
      else if(b.dataset.act === 'del'){
        if(!await confirmBox('Supprimer ces courses ?', 'Les achats qu’elles contiennent seront retirés du stock.')) return;
        for(const p of S.products.values()){
          const mine = (p.purchases || []).filter(x => x.t === t.id); if(!mine.length) continue;
          const q = mine.reduce((s, x) => s + x.q, 0), s = stockAt(p);
          p.purchases = p.purchases.filter(x => x.t !== t.id);
          if(s != null){ p.stockQty = Math.max(0, s - q); p.stockAt = Date.now(); }
          saveP(p);
        }
        S.tickets.delete(t.id); store.del('tickets', t.id);
        d.close(); render(); refresh && refresh(); toast('Supprimé 🗑️');
      }
    }});
}

/* ---------- Sauvegarde ---------- */
function openBackup(){
  openSheet(`<div class="sheet-scroll"><h2>Sauvegarde 💾</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn grow" type="button" data-act="exp">Exporter</button><label class="btn grow file-btn">Importer<input type="file" accept="application/json,.json"></label></div>
    <p class="hint" style="margin:0">Version ${APP_VERSION}</p></div>
    <div class="sheet-actions"><button class="btn primary grow" type="button" data-close>Fermer</button></div>`, {
    onClick: (e, d) => {
      const b = e.target.closest('[data-act="exp"]'); if(!b) return;
      const data = {app:'courses', version: APP_VERSION, exportedAt: new Date().toISOString(), products:[...S.products.values()], aliases:[...S.aliases.values()], tickets:[...S.tickets.values()], list:[...S.list.values()], settings:S.settings};
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
      a.download = `courses-${isoDay(Date.now())}.json`; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Sauvegarde exportée 💾');
    },
    onInput: async (e, d) => {
      if(e.type !== 'change' || e.target.type !== 'file') return;
      const f = e.target.files[0]; if(!f) return;
      let data; try{ data = JSON.parse(await f.text()); }catch(_){ toast('Fichier illisible 😕'); return; }
      if(!data || data.app !== 'courses'){ toast('Ce n’est pas une sauvegarde des courses 🤔'); return; }
      if(!await confirmBox('Remplacer toutes les données ?', 'Les courses actuelles seront remplacées par la sauvegarde.', 'Remplacer')) return;
      await txp(Object.keys(STORES), 'readwrite', t => {
        for(const n of Object.keys(STORES)) t.objectStore(n).clear();
        for(const n of ['products', 'aliases', 'tickets', 'list']) for(const v of data[n] || []) t.objectStore(n).put(v);
        t.objectStore('settings').put(Object.assign({}, data.settings || {}, {k:'main'}));
      });
      for(const n of ['products', 'aliases', 'tickets', 'list']) S[n].clear();
      (data.products || []).forEach(p => S.products.set(p.id, p)); (data.aliases || []).forEach(a => S.aliases.set(a.label, a));
      (data.tickets || []).forEach(t => S.tickets.set(t.id, t)); (data.list || []).forEach(l => S.list.set(l.id, l));
      S.settings = Object.assign({}, data.settings || {}, {k:'main'});
      d.close(); render(); toast('Sauvegarde importée ✔️');
    }});
}


boot();
