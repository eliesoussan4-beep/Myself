      </details>
      <label class="frow"><span class="fl">Marque</span><input type="text" name="brand" value="${esc(p.brand || '')}" placeholder="Uniqlo, Carhartt…" autocomplete="off" list="brands"></label>
      <datalist id="brands">${[...new Set([...S.pieces.values()].map(q => q.brand).filter(Boolean))].sort().map(b => `<option value="${esc(b)}">`).join('')}</datalist>
      <label class="frow"><span class="fl">Nom</span><input type="text" name="name" value="${esc(p.name)}" placeholder="Blanc, rayé bleu…" autocomplete="off"></label>
      <label class="frow"><span class="fl">Variante de</span><select name="group"></select></label>
      <details class="frow-d" ${p.category ? '' : 'open'} id="catBox"><summary class="frow"><span class="fl">Catégorie</span><span class="fv" id="catVal">${p.category ? esc(catLabel(p.category)) : 'à choisir'}</span></summary>
        <div class="frow-body">
        ${CAT_GROUPS.map(([g, ids]) => `<div class="cat-group"><span class="cat-g">${g}</span><div class="chips">${ids.map(id => CATS.find(c => c.id === id)).filter(Boolean).map(c => `<label class="chip"><input type="radio" name="cat" value="${c.id}" ${p.category===c.id?'checked':''}><span>${c.label}</span></label>`).join('')}</div></div>`).join('')}
        </div>
      </details>
      ${existing ? `<label class="toggle frow"><span class="fl">Au sale</span><input type="checkbox" name="dirty" ${p.dirty?'checked':''}></label>` : ''}
      ${existing?'<button class="btn danger-solid" type="button" id="del" style="width:100%;margin-top:10px">Supprimer définitivement</button>':''}
    </div>
    <div class="sheet-actions">
      <button class="btn grow" type="button" data-close>Annuler</button>
      <button class="btn primary grow" type="submit" id="save">Enregistrer</button>
    </div></form>`;
  openSheet(html, form => {
    if(busy){ toast('La photo est encore en cours de traitement.'); return false; }
    const name = form.name.value.trim();
    if(!name){ form.name.focus(); toast('Donne un nom à la pièce.'); return false; }
    const cat = form.querySelector('input[name=cat]:checked');
    if(!cat){ toast('Choisis une catégorie.'); return false; }
    p.brand = (form.brand.value || '').trim() || undefined;
    p.name = name; p.category = cat.value; p.dirty = form.dirty ? form.dirty.checked : false;
    if(!existing) store.saveSettings({lastCat:p.category});
    const g = form.group.value;
    if(g){ p.group = g; const head = S.pieces.get(g); if(head && !head.group) store.savePiece({...head, group:g}); } else delete p.group;
    store.savePiece(p); toast(existing ? tx('Pièce mise à jour.', 'Pièce mise à jour ✔️') : tx('Pièce ajoutée.', 'Pièce rangée dans la penderie 👕'));
  }, form => {
    const drop = form.querySelector('#drop'), tools = form.querySelector('#cutTools'), save = form.querySelector('#save');
    const paint = (busyText) => {
      const cut = cutSrc(p), orig = photoSrc(p);
      drop.classList.toggle('checker', !!cut);
      drop.innerHTML = cut ? `<img src="${esc(cut)}" alt="Pièce détourée">` : orig ? `<img src="${esc(orig)}" alt="Photo de la pièce">` : `<div class="noimg">${ICON.camera}<span>Photographie la pièce toujours au même endroit, sur un fond uni</span></div>`;
      if(busyText) drop.insertAdjacentHTML('beforeend', `<span class="busy">${busyText}</span>`);
      tools.innerHTML = !orig ? '' : cut
        ? '<button type="button" class="btn" data-cut="retouch">Retoucher le détourage</button> <button type="button" class="linkish" data-cut="remove">Annuler le détourage</button>'
        : '<button type="button" class="linkish" data-cut="run">Détourer cette photo</button>';
    };
    const setBusy = b => { busy = b; save.disabled = b; };
    const runCut = async (img) => {
      let cut = null;
      const label = t => { const b = drop.querySelector('.busy'); if(b) b.textContent = t; };
      try{
        if(!IA.lib && !S.settings.iaReady) toast('Premier détourage intelligent : téléchargement du modèle (~40 Mo), une seule fois.');
        label('Détourage intelligent…');
        cut = await aiCut(img, guideKey(p.photo), f => label(f < 0.999 ? `Préparation de l'IA… ${Math.round(f * 100)} %` : 'Détourage intelligent…'));
        if(cut && !S.settings.iaReady) store.saveSettings({iaReady:true});
      }catch(err){
        console.warn('IA indisponible', err);
        toast('Détourage intelligent indisponible pour l\'instant : méthode simple utilisée.');
      }
      if(!cut){ label('Détourage…'); cut = cutout(img, guideKey(p.photo)); }
      if(cut){ p.photo.cut = await metaWithLines(p.photo, cut); toast(tx('Pièce détourée.', 'Détourage réussi ✂️')); }
      else { delete p.photo.cut; toast("Détourage impossible : le fond n'est pas assez uni ou trop proche de la couleur du vêtement."); }
    };
    const useImage = async (img, guideCat) => {
      setBusy(true); paint('Traitement…');
      try{
        const old = p.photo;
        p.photo = await processPhoto(img);
        if(guideCat){ p.photo.guide = guideCat; if(guideCat === 'chaussures') p.photo.shoeView = 'face'; if(LINES[guideCat]) p.photo.lines = {top:LINES[guideCat].top, bottom:LINES[guideCat].bottom, mid:LINES[guideCat].mid ? 0.5 : null}; }
        paint('Détourage…');
        if(old && old.assetId && store.assets && old.assetId !== p.photo.assetId) store.assets.delete(old.assetId).catch(()=>{});
        if(form.detour.checked) await runCut(img);
      }catch(e){ toast('Photo illisible, réessaie.'); }
      setBusy(false); paint();
    };
    // « Variante de » : seulement les pièces de la même catégorie (une par groupe de variantes)
    const fillGroups = cat => {
      const sel = form.group, keep = sel.value || p.group || '', seen = new Set();
      const opts = [...S.pieces.values()].filter(q => q.id !== p.id && q.category === cat && (q.group || q.id) !== p.id)
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fr'))
        .filter(q => { const g = q.group || q.id; if(seen.has(g)) return false; seen.add(g); return true; });
      sel.innerHTML = `<option value="">Aucune</option>` + opts.map(q => `<option value="${esc(q.group || q.id)}">${esc(plabel(q))}</option>`).join('');
      sel.value = opts.some(q => (q.group || q.id) === keep) ? keep : '';
    };
    fillGroups(p.category || (shot && shot.cat) || '');
    form.querySelectorAll('input[name=cat]').forEach(r => r.addEventListener('change', () => {
      form.querySelector('#catVal').textContent = catLabel(r.value); form.querySelector('#catBox').open = false;
      fillGroups(r.value);
    }));
    form.querySelectorAll('[data-photo]').forEach(b => b.addEventListener('click', () => (b.dataset.photo === 'cam' ? form.querySelector('#camBtn') : form.querySelector('#albIn')).click()));
    if(shot){
      // photo prise depuis l'accueil : on la traite tout de suite (la catégorie est déjà choisie)
      const r = form.querySelector(`input[name=cat][value="${shot.cat}"]`); if(r) r.checked = true;
      form.querySelector('#catVal').textContent = catLabel(shot.cat); form.querySelector('#catBox').open = false;
      useImage(shot.canvas, shot.cat);
      setTimeout(() => form.name.focus(), 300);
    }
    form.querySelector('#camBtn').addEventListener('click', () => {
      const checked = form.querySelector('input[name=cat]:checked');
      openCamera(checked ? checked.value : 'tshirt', (canvas, cat) => {
        const r = form.querySelector(`input[name=cat][value="${cat}"]`); if(r) r.checked = true;
        useImage(canvas, cat);
      }, () => form.querySelector('#camIn').click());
    });
    const onFile = async input => {
      const f = input.files && input.files[0]; if(!f) return;
      setBusy(true); paint('Traitement…');
      try{
        const img = await loadImage(f);
        const old = p.photo;
        p.photo = await processPhoto(img);
        if(old && old.assetId && store.assets && old.assetId !== p.photo.assetId) store.assets.delete(old.assetId).catch(()=>{});
        paint('Détourage…');
        if(form.detour.checked) await runCut(img);
      }catch(e){ toast('Photo illisible, essaie une autre image.'); }
      setBusy(false); paint(); input.value = '';
    };
    form.querySelector('#camIn').addEventListener('change', e => onFile(e.target));
    form.querySelector('#albIn').addEventListener('change', e => onFile(e.target));
    form.detour.addEventListener('change', async () => {
      store.saveSettings({detour: form.detour.checked});
      if(!p.photo) return;
      if(!form.detour.checked){ delete p.photo.cut; paint(); return; }
      if(p.photo.cut) return;
      setBusy(true); paint('Détourage…');
      try{
        const img = new Image(); img.crossOrigin = 'anonymous';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = photoSrc(p); });
        await runCut(img);
        if(!p.photo.cut) form.detour.checked = false;
      }catch(err){ toast('Impossible de relire la photo.'); }
      setBusy(false); paint();
    });
    tools.addEventListener('click', async e => {
      const b = e.target.closest('[data-cut]'); if(!b) return;
      if(b.dataset.cut === 'retouch'){
        try{ await openRetouch(p.photo, cut => { p.photo.cut = cut; paint(); }); }
        catch(err){ toast('Impossible d\'ouvrir la retouche.'); }
        return;
      }
      if(b.dataset.cut === 'remove'){ delete p.photo.cut; paint(); return; }
      setBusy(true); paint('Détourage…');
      try{
        const img = new Image(); img.crossOrigin = 'anonymous';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = photoSrc(p); });
        await runCut(img);
      }catch(err){ toast('Impossible de relire la photo.'); }
      setBusy(false); paint();
    });
    paint();
    const del = form.querySelector('#del');
    if(del) del.addEventListener('click', () => {
      const n = [...S.outfits.values()].filter(o => (o.pieceIds||[]).includes(p.id)).length;
      confirmBox('Supprimer le vêtement ?', `« ${plabel(p)} » sera supprimé${n ? ` et retiré de ${n} tenue${n > 1 ? 's' : ''}` : ''}.`, 'Supprimer', () => { store.deletePiece(p.id); sheet.close(); toast('Vêtement supprimé.'); });
    });
  });
}

function outfitSheet(existing, preset){
  if(!S.pieces.size){ toast("Ajoute d'abord des pièces."); S.section='pieces'; render(); return; }
  const o = existing ? {...existing} : {id:uid('o'), name:'', pieceIds:[], lastWorn:null, createdAt:Date.now(), ...(preset || {})};
  const fromShuffle = !!(preset && preset.fromShuffle); delete o.fromShuffle;
  const pieces = [...S.pieces.values()].filter(p => !isExtraCat(p.category)).sort((a,b) => catOrder(a.category) - catOrder(b.category) || (a.name||'').localeCompare(b.name||'','fr'));
  const html = `<form class="sheet" novalidate>
    <div class="sheet-scroll">
      <h2>${existing ? 'Modifier la tenue' : fromShuffle ? tx('Enregistrer la tenue aléatoire', 'On la garde ? Dernières retouches') : 'Nouvelle tenue'}</h2>
      <label class="field"><span>Nom</span><input type="text" name="name" value="${esc(o.name)}" placeholder="Bureau décontracté" autocomplete="off"></label>
      ${fromShuffle ? `<p class="hint" style="margin:-6px 0 12px">${esc(o.pieceIds.map(id => (S.pieces.get(id) || {}).name).filter(Boolean).join(' + '))}</p>` : ''}
      ${(() => {
        const pick = (p, name, on) => `<label class="pick"><input type="checkbox" name="${name}" value="${esc(p.id)}" ${on ? 'checked' : ''}><span class="box"><span class="ph">${thumbSrc(p)?`<img src="${esc(thumbSrc(p))}" alt="" loading="lazy">`:ICON.hanger}</span><span class="l">${esc(p.name || catLabel(p.category))}${p.brand ? `<small class="brand">${esc(p.brand)}</small>` : ''}</span></span></label>`;
        // chaque sous-catégorie est repliée : tu l'ouvres pour voir ses vêtements
        const fold = (c, list, name, isOn) => { const n = list.filter(isOn).length;
          return `<details class="fold"><summary class="frow"><span class="fl">${esc(catLabel(c))}</span><span class="fv" data-count>${n ? `${n} coché${n > 1 ? 's' : ''}` : list.length}</span></summary><div class="picker fold-body">${list.map(p => pick(p, name, isOn(p))).join('')}</div></details>`; };
        const byCat = cats => { const m = new Map(); for(const p of pieces) if(cats.includes(LAYER[p.category])){ if(!m.has(p.category)) m.set(p.category, []); m.get(p.category).push(p); } return [...m.entries()].sort((a, b) => pieceOrder(a[0]) - pieceOrder(b[0])); };
        const onCore = p => o.pieceIds.includes(p.id) || (o.under || []).includes(p.id);
        const hautCats = byCat(['under', 'mid', 'outer']), basCats = byCat(['bottom']);
        const extra = (cat, title) => { const list = [...S.pieces.values()].filter(p => p.category === cat).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fr')); return list.length ? fold(cat, list, 'ex', p => (o.allowed || []).includes(p.id)).replace(esc(catLabel(cat)), title) : ''; };
        return `<div ${fromShuffle ? 'hidden' : ''}>
          ${hautCats.length ? `<h3 class="ov-h">Haut</h3>${hautCats.map(([c, l]) => fold(c, l, 'pc', onCore)).join('')}` : ''}
          ${basCats.length ? `<h3 class="ov-h">Bas</h3>${basCats.map(([c, l]) => fold(c, l, 'pc', onCore)).join('')}` : ''}
        </div>
        <h3 class="ov-h">Vestes, manteaux et chaussures qui vont avec</h3>
        ${extra('veste', 'Vestes')}${extra('manteau', 'Manteaux')}${extra('chaussures', 'Chaussures')}`; })()}

      ${existing?'<button class="btn danger-solid" type="button" id="del" style="width:100%;margin-top:10px">Supprimer définitivement</button>':''}
    </div>
    <div class="sheet-actions">
      <button class="btn grow" type="button" data-close>Annuler</button>
      <button class="btn primary grow" type="submit">Enregistrer</button>
    </div></form>`;
  openSheet(html, form => {
    const name = form.name.value.trim();
    const ids = [...form.querySelectorAll('input[name=pc]:checked')].map(i => i.value);
    if(!name){ form.name.focus(); toast('Donne un nom à la tenue.'); return false; }
    if(!ids.length){ toast('Choisis au moins une pièce.'); return false; }
    o.name = name; o.pieceIds = coreIds(ids); o.under = hiddenIds(ids);
    // même haut visible + même bas qu'une tenue existante : on regroupe au lieu de créer un doublon
    const twin = [...S.outfits.values()].find(x => x.id !== o.id && sameOutfitKey(x.pieceIds) === sameOutfitKey(o.pieceIds));
    if(twin){
      store.saveOutfit({...twin, allowed:[...new Set([...allowedOf(twin), ...[...form.querySelectorAll('input[name=ex]:checked')].map(i => i.value)])], under:[...new Set([...(twin.under || []), ...o.under])]});
      if(existing) store.deleteOutfit(o.id);
      if(fromShuffle){ S.shuffle = null; S.shuffleLocks = new Set(); S.shuffleWx = null; render(); }
      toast(`Même haut et même bas que « ${twin.name} » : regroupées.`); return;
    }
    o.allowed = [...form.querySelectorAll('input[name=ex]:checked')].map(i => i.value); delete o.prefer;
    delete o.bands; delete o.rainOk;   // le temps se déduit de la chaleur des pièces ; la pluie, des capuches
    store.saveOutfit(o);
    if(fromShuffle){ S.shuffle = null; S.shuffleLocks = new Set(); S.shuffleWx = null; render(); }
    toast(existing ? tx('Tenue mise à jour.', 'Tenue mise à jour ✔️') : tx('Tenue créée.', 'Nouvelle tenue, stylé 😎'));
  }, form => {
    // le compteur « N cochés » de chaque sous-catégorie se met à jour
    form.addEventListener('change', e => { const d = e.target.closest('details.fold'); if(!d) return; const all = d.querySelectorAll('input[type=checkbox]'), n = [...all].filter(i => i.checked).length; d.querySelector('[data-count]').textContent = n ? `${n} coché${n > 1 ? 's' : ''}` : all.length; });
    if(fromShuffle) setTimeout(() => { form.name.focus(); form.name.select(); }, 60);
    const del = form.querySelector('#del');
    if(del) del.addEventListener('click', () => {
      confirmBox('Supprimer la tenue ?', `« ${o.name} » sera supprimée. Les pièces restent dans ta penderie.`, 'Supprimer', () => { store.deleteOutfit(o.id); sheet.close(); toast('Tenue supprimée.'); });
    });
  });
}

/* ---------- Actions ---------- */
document.addEventListener('click', e => {
  const sec = e.target.closest('[data-section]');
  if(sec){ S.section = sec.dataset.section; render(); window.scrollTo({top:0}); return; }
  const el = e.target.closest('[data-act]'); if(!el || sheet.contains(el)) return;
  const id = el.dataset.id;
  switch(el.dataset.act){
    case 'new-piece': pieceSheet(); break;
    case 'export': exportData(); break;
    case 'settings': settingsSheet(); break;
    case 'laundry': laundrySheet(); break;
    case 'pieces-sheet': piecesSheet(); break;
    case 'quick-piece': quickAddPiece(); break;
    case 'under-pick': underSheet(el.dataset.k, id); break;
    case 'plan-toggle': S.planOpen = {...(S.planOpen || {}), [el.dataset.k]: !(S.planOpen || {})[el.dataset.k]}; render(); break;
    case 'outfits-sheet': outfitsSheet(); break;
    case 'worn': wornSheet(el.dataset.date); break;
    case 'missed': if(missedDays().length) missedSheet(); else toast(tx('Rien à noter.', 'Rien à noter, tout est à jour 👌')); break;
    case 'feel': {
      // ressenti noté depuis la 2e carte de la tenue du jour
      const k = keyIn(0), o = S.outfits.get(plansOf()[k]); if(!o) break;
      const w = S.weatherDays[k], f = el.dataset.feel, prev = logsOf().find(l => l.date === k);
      const dayIds = planPieceIds(k);
      if(prev && prev.feel === f){ store.saveSettings({wearLog:logsOf().filter(l => l.date !== k)}); toast(tx('Ressenti effacé.', 'Ressenti effacé 🙃')); break; }
      const entry = {date:k, pieceIds:dayIds, outfitId:o.id, label:o.name, feel:f, temp:dayTemp(w),
        weather: w ? {min:w.min, max:w.max, feelMin:w.feelMin, feelMax:w.feelMax, rainProb:w.rainProb, code:w.code, city:cityOf().name} : null};
      store.saveSettings({wearLog:[...logsOf().filter(l => l.date !== k), entry].slice(-400)});
      toast(tx('Ressenti noté.', f === 'parfait' ? 'Parfait, noté 👌' : 'Noté, je m\'en souviendrai 🧠')); break;
    }
    case 'weather-sheet': weatherSheet(); fetchWeather().then(() => { if(sheet.open && sheet.querySelector('#cityIn') && !sheet.querySelector('#cityIn').value) weatherSheet(); }); break;
    case 'recut-all': recutAll(); break;
    case 'edit-piece': pieceSheet(S.pieces.get(id)); break;
    case 'fpath': { const d = +el.dataset.depth, p = (S.fpath || []).slice(0, d); if(el.dataset.id) p.push(el.dataset.id); S.fpath = p; S.filter = 'all'; render(); break; }
    case 'group': groupSheet(id); break;
    case 'new-outfit': outfitSheet(); break;
    case 'edit-outfit': outfitView(S.outfits.get(id)); break;
    case 'filter': S.filter = el.dataset.cat; render(); break;
    case 'toggle-dirty': { const p = S.pieces.get(id); if(p) store.savePiece({...p, dirty:!p.dirty}); break; }
    case 'all-clean': for(const p of S.pieces.values()) if(p.dirty) store.savePiece({...p, dirty:false}); toast(tx('Tout est propre.', 'Tout est propre ✨')); break;
    case 'band': {
      const w = tomorrowWeather();
      store.saveSettings({manual:{date:tomorrowKey(), band:el.dataset.band, rain: w ? w.rain : false}}); S.alt = 0; break;
    }
    case 'rain': {
      const w = tomorrowWeather();
      store.saveSettings({manual:{date:tomorrowKey(), band: w ? w.band : 'doux', rain: !(w && w.rain)}}); S.alt = 0; break;
    }
    case 'auto-weather': refreshWeather(); break;
    case 'day': S.dayChoice = +el.dataset.off; S.alt = 0; render(); break;
    case 'another': S.alt++; render(); break;
    case 'plan': {
      const o = S.outfits.get(id); if(!o) break;
      const n = +el.dataset.day || 0, k = keyIn(n), plans = plansOf(), label = n === 0 ? "aujourd'hui" : 'demain';
      if(dayOffset() === n) S.alt = 0;   // la tenue choisie revient au début du carrousel
      delete plans[undefined];
      if(plans[k] === id){
        // retoucher le même bouton : on annule
        delete plans[k];
        if(o.lastWorn === k) store.saveOutfit({...o, lastWorn:o.prevWorn ?? null});
        store.saveSettings({plans, planned:null}); render(); toast(tx(`Plus rien de prévu ${label}.`, `Annulé pour ${label} 🙃`)); break;
      }
      const prev = plans[k] && S.outfits.get(plans[k]);
      if(prev && prev.lastWorn === k) store.saveOutfit({...prev, lastWorn:prev.prevWorn ?? null});
      plans[k] = id;
      { const w0 = n === 0 && dayOffset() === 0 ? tomorrowWeather() : (S.weatherDays[k] ? {band:bandFor(S.weatherDays[k].max), rain:S.weatherDays[k].rain} : tomorrowWeather());
        const core = resolveCore(o, w0); store.saveSettings({planExtras:{...(S.settings.planExtras || {}), [k]: {...extrasFor({...o, pieceIds:core}, w0), core}}}); }
      for(const key of Object.keys(plans)) if(key < keyIn(-14)) delete plans[key];   // on garde 2 semaines pour les rappels
      store.saveOutfit({...S.outfits.get(id), prevWorn:o.lastWorn ?? null, lastWorn:k});
      store.saveSettings({plans, planned:null});
      render(); toast(tx(`C'est noté pour ${label}.`, `Validé pour ${label} 👌`)); break;
    }

    case 'openmode': S.openBy = {...(S.openBy || {}), [el.dataset.key]: el.dataset.mode}; render(); break;   // seulement cette carte
    case 'extra': {
      const kind = el.dataset.kind, oo = S.outfits.get(el.dataset.scope === 'plan' ? plansOf()[el.dataset.k] : id), al = new Set(allowedOf(oo));
      const clean = [...S.pieces.values()].filter(p => !p.dirty && al.has(p.id));
      const list = kind === 'under' ? (oo ? underCandidates(oo) : []) : kind === 'outer' ? clean.filter(p => p.category === 'veste' || p.category === 'manteau') : clean.filter(p => p.category === 'chaussures');
      if(!list.length && kind !== 'under'){ if(oo){ toast(kind === 'outer' ? 'Aucune veste ni manteau associé à cette tenue : choisis-les ici.' : 'Aucunes chaussures associées : choisis-les ici.'); outfitSheet(oo); } break; }
      if(el.dataset.scope === 'plan'){
        const k = el.dataset.k, o = S.outfits.get(plansOf()[k]); if(!o) break;
        const cur = planExtrasOf(k) || chooseExtras(o, tomorrowWeather());
        store.saveSettings({planExtras:{...(S.settings.planExtras || {}), [k]: {...cur, [kind]: cycleExtra(list, cur[kind], kind !== 'shoes')}}});
      } else {
        const o = S.outfits.get(id); if(!o) break;
        const cur = extrasFor(o, tomorrowWeather());
        S.cardExtras = {...(S.cardExtras || {}), [id]: {...((S.cardExtras || {})[id] || {}), [kind]: cycleExtra(list, cur[kind], kind !== 'shoes')}};
        render();
      }
      break;
    }
    case 'head': { const k = el.dataset.key; S.headBy = {...(S.headBy || {}), [k]: ((S.headBy || {})[k] || 0) + 1}; render(); break; }   // seulement cette carte
    case 'shuffle': {
      const ids = randomOutfit(S.shuffle ? S.shuffleLocks : null);
      if(!S.shuffle) S.shuffleLocks = new Set();
      if(!ids){ toast("Pas assez de pièces propres pour composer une tenue (il faut au moins un haut et un bas)."); break; }
      S.shuffle = ids; S.shuffleAdj = {}; S.adjustKey = null; render(); break;
    }
    case 'shuffle-del': if(S.shuffle && S.shuffle.length > 1){ S.shuffle = S.shuffle.filter(x => x !== id); if(S.shuffleLocks) S.shuffleLocks.delete(id); render(); } break;
    case 'shuffle-cancel': S.shuffle = null; S.shuffleLocks = new Set(); S.shuffleWx = null; render(); break;
    case 'lock': { S.shuffleLocks = S.shuffleLocks || new Set(); if(S.shuffleLocks.has(id)) S.shuffleLocks.delete(id); else S.shuffleLocks.add(id); render(); break; }
    case 'shuffle-ok': {
      // on ouvre l'éditeur complet : nom, haut + bas, et les vestes / manteaux / chaussures qui vont avec
      const w = S.shuffleWx || tomorrowWeather(), n = [...S.outfits.values()].filter(o => /^Tenue (au hasard|aléatoire)/.test(o.name || '')).length + 1;
      const ids = S.shuffle.slice();
      outfitSheet(null, {fromShuffle:true, name:`Tenue aléatoire ${n}`, pieceIds:coreIds(ids), under:hiddenIds(ids), allowed:ids.filter(id => !baseIds(ids).includes(id)),
        sizeAdj:{...(S.shuffleAdj || {})}});
      break;
    }
    case 'adjust': S.adjustKey = S.adjustKey === el.dataset.key ? null : el.dataset.key; render(); break;
    case 'sh-wx': {
      const v = el.dataset.v;
      if(v === 'auto') S.shuffleWx = null;
      else if(v === 'rain'){ if(S.shuffleWx) S.shuffleWx = {...S.shuffleWx, rain:!S.shuffleWx.rain}; }
      else S.shuffleWx = {band:v, rain:!!(S.shuffleWx && S.shuffleWx.rain)};
      const ids = randomOutfit(S.shuffleLocks); if(ids) S.shuffle = ids;   // on relance avec cette météo
      render(); break;
    }
    case 'size': {
      S.shuffleAdj = S.shuffleAdj || {};
      const v = Math.min(2, Math.max(0.4, Math.round(((S.shuffleAdj[id] || 1) + (+el.dataset.d) * 0.1) * 100) / 100));
      S.shuffleAdj[id] = v; render(); break;
    }
    case 'size-reset': {
      S.shuffleAdj = {};
      for(const p of S.pieces.values()) if(p.sizeAdj && p.sizeAdj !== 1){ const q = {...p}; delete q.sizeAdj; store.savePiece(q); }
      render(); toast('Toutes les tailles sont revenues à 100 %.'); break;
    }
    case 'legs': S.legShift = (S.legShift || 0) + 1; render(); break;
    case 'dirty-planned': {
      const o = S.outfits.get(id || plansOf()[keyIn(0)]); if(!o) break;
      planPieceIds(keyIn(0)).forEach(pid => { const p = S.pieces.get(pid); if(p && !p.dirty) store.savePiece({...p, dirty:true}); });
      toast(tx('Pièces mises au sale.', 'Direction la machine 🧺')); break;
    }
  }
});

render();
store.init().then(() => { migrateOutfits(); setTimeout(upgradeCuts, 300); });
fetchWeather();
// Rafraîchit la météo quand on revient sur l'app
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') fetchWeather(); });
// Demande à Chrome de ne jamais effacer tes photos et tenues
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
// Application installable + fonctionne hors connexion
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(r => r.update()).catch(()=>{}));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(!reloaded){ reloaded = true; location.reload(); } });
}
</script>
