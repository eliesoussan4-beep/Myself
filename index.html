<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon quotidien">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mêmes couleurs que les apps : sombre par défaut si le téléphone est en sombre */
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --warn:#A8432C; --sun:#E9A92C; --rain:#4F82C9;
  --today:#E8962E; --today-soft:#FFF1DC; --tomorrow:#7B5CD6; --tomorrow-soft:#EFE9FF; --tomorrow-card:#F3EEFF; --box:#B3BBC8;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B; --sun:#F2BD4E; --rain:#7EA8E6;
    --today:#F0A648; --today-soft:#3B2C15; --tomorrow:#A58CF0; --tomorrow-soft:#2A2342; --tomorrow-card:#221D35; --box:#4A5468;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B; --sun:#F2BD4E; --rain:#7EA8E6;
  --today:#F0A648; --today-soft:#3B2C15; --tomorrow:#A58CF0; --tomorrow-soft:#2A2342; --tomorrow-card:#221D35; --box:#4A5468;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}

/* ---------- Vues : l'accueil + une fenêtre par app ---------- */
#vues{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.vue{position:absolute;left:0;top:env(safe-area-inset-top,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;margin:0;background:var(--bg);visibility:hidden}
.vue.on{visibility:visible;z-index:1}
/* App affichée par-dessus l'accueil : juste sa fenêtre, sur tout l'écran, fond transparent */
body.superposition #vues{z-index:50}   /* au-dessus de la barre du bas et du crayon */
.vue.superpose{position:fixed;inset:0;top:0;width:100%;height:100%;visibility:visible;z-index:40;background:transparent}
#v-accueil{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---------- Barre du bas ---------- */
#barre{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#onglets{display:grid;max-width:640px;margin:0 auto;height:var(--nav-h)}
#onglets button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0;padding:0 2px}
#onglets button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#onglets button[aria-current="page"]{color:var(--denim)}
#onglets.serre button{font-size:10.5px;letter-spacing:-.02em}

/* ---------- Accueil ---------- */
main{max-width:640px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2px 6px}
.tete{align-items:center}
.tete h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,7vw,40px);line-height:1;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rond{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.bloc{--c:var(--c-c,var(--denim));width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--ink);transition:transform .12s;cursor:pointer;position:relative;overflow:hidden}
:root[data-theme="dark"] .bloc{--c:var(--c-s,var(--denim))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bloc{--c:var(--c-s,var(--denim))}}
.bloc::before{content:none}
/* Tableau de bord uniforme : les cartes se fondent dans le fond, seuls leurs contenus ressortent */
.bloc{background:none;border:0;border-radius:0;padding:0;overflow:visible}
main{gap:22px}
.bloc:active{transform:scale(.985)}
.bloc-t{display:flex;align-items:center;gap:10px}
.bloc-ico{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.bloc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bloc-t{font-family:var(--display);font-weight:700;font-size:17px}
.bloc-t small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.bloc-ouvrir{border:0;background:none;color:var(--c);padding:4px;margin:-4px;display:flex}
.vide{margin:0;font-size:14px;color:var(--muted)}
.bientot{display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:center}
/* Carte du haut et carte de la tenue : même hauteur, compacte */
:root{--carte-h:132px}
.gr2.compact{align-items:center}
[data-bloc="jour"] .gr2.compact{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.bientot.defile{height:var(--carte-h);box-sizing:border-box;background:var(--sunk);border-radius:16px;padding:8px 10px;gap:4px;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;overscroll-behavior-x:auto;touch-action:pan-x pan-y;justify-content:flex-start;scroll-snap-type:y proximity;scrollbar-width:none}
.bientot.defile::-webkit-scrollbar{display:none}
.bientot.defile .bt{scroll-snap-align:start;flex:none;min-height:36px;justify-content:center}
[data-bloc="jour"] .gr2.compact{align-items:start}
.mt-wrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.mt-slides{height:var(--carte-h)}
.slide.meteo{background:var(--sunk);padding:8px 6px;gap:2px;align-items:center;justify-content:center;text-align:center}
.mt-v{font-family:var(--display);font-size:17px;font-weight:800;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-j{font-size:11px;font-weight:600;color:var(--muted);text-transform:none}
.mt-l{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:2px;flex-wrap:nowrap;max-width:100%}
.mt-i{font-size:24px;line-height:1;align-self:center}
.mt-l b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.mt-min{font-size:13px;color:var(--muted);font-weight:600}
.mt-p{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;padding:0 4px;font-size:12px;font-weight:600;color:var(--rain);margin-top:4px}
.mt-p span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.mt-p .mt-vent{color:var(--muted)}
.mt-p small{font-size:9.5px;font-weight:600;margin-left:1px}
@media (max-width:400px){.mt-p{font-size:11px;padding:0}}
.bt{--sc:var(--muted);display:flex;flex-direction:column;border-left:3px solid var(--sc);padding:2px 0 2px 9px;min-width:0}
.bt-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-q{font-size:12px;color:var(--muted)}
.sky{position:relative;overflow:hidden;isolation:isolate}
.sky > .sky-bg{position:absolute;inset:0 0 0 auto;width:62%;z-index:-1;pointer-events:none;
  -webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.35) 30%,#000 75%);mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.35) 30%,#000 75%)}
.sky > .sky-deco{position:absolute;top:0;right:0;height:100%;width:84px;z-index:-1;pointer-events:none}
.sky-matin > .sky-bg{background:linear-gradient(170deg,#7FA6D6 0%,#E9B7B0 55%,#F6C38E 100%)}
.sky-aprem > .sky-bg{background:linear-gradient(180deg,#3E8EDC 0%,#7DB8EC 70%,#B4D7F2 100%)}
.sky-soir > .sky-bg{background:linear-gradient(180deg,#141A3C 0%,#2A2461 60%,#3D2F72 100%)}
.sky-ma > .sky-bg{background:linear-gradient(to right,#F2BE97 0%,#E7B9B3 30%,#7DB8EC 75%,#5FA2E4 100%)}
.sky-as > .sky-bg{background:linear-gradient(to right,#6FB0EA 0%,#E79A72 45%,#4A2F6E 75%,#1A1D45 100%)}
.sky-ms > .sky-bg{background:linear-gradient(to right,#F2BE97 0%,#C79AB8 40%,#3A2C6C 75%,#161B40 100%)}
.sky-jour > .sky-bg{background:linear-gradient(to right,#F2BE97 0%,#7DB8EC 35%,#5FA2E4 55%,#E58E6C 72%,#2B2461 88%,#141A3C 100%)}
.sky .etoile{animation:scintille 3.2s ease-in-out infinite}
.sky .etoile:nth-child(2n){animation-delay:1.3s}
.sky .etoile:nth-child(3n){animation-delay:2.1s}
@keyframes scintille{0%,100%{opacity:.85}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.sky .etoile{animation:none}}
/* « Bientôt » : chaque événement est une petite carte avec son ciel */
.bt.sky{border-radius:10px;border-left-width:3px;padding:4px 30px 4px 9px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.bt.sky > .sky-bg{width:70%}
.bt.sky > .sky-deco{width:56px}
.bientot.defile .bt.sky{min-height:38px}
.bt.ferie{--sc:#3A6FD8;border-radius:10px;padding:4px 9px;background:linear-gradient(90deg,color-mix(in srgb,#3A6FD8 26%,var(--surface)),var(--surface) 55%,color-mix(in srgb,#E1574F 26%,var(--surface)))}
.bientot.defile .bt.ferie{min-height:38px}
/* Aujourd'hui, carte « Événements » */
.ligne.ev.sky{margin:0 -4px;padding:0 44px 0 4px;border-radius:10px}
.ligne.ev.sky > .sky-deco{width:64px}
.bt-plus{font-size:12px;color:var(--muted);padding-left:12px}
.gr2{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:12px;align-items:stretch}
.wx2{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;background:var(--sunk);border-radius:16px;padding:12px;height:100%;box-sizing:border-box}
.wx2 .wx-ico{font-size:34px;margin-bottom:2px}
.wx2 .pastille{margin-top:6px}
.tenue2{display:flex;flex-direction:column;gap:6px;min-width:0}
.tenue2 .slides.mini{flex:1}
[data-bloc="garde-robe"] .slides.mini,[data-bloc="duo"] .slides.mini{height:var(--gr-h);flex:none}
[data-bloc="garde-robe"] .co-slides .slide,[data-bloc="duo"] .co-slides .slide{padding:8px 10px;gap:4px}
[data-bloc="garde-robe"] .co-slides .slide.resume,[data-bloc="duo"] .co-slides .slide.resume{padding:12px}
[data-bloc="garde-robe"] .tenue2{gap:4px}
[data-bloc="garde-robe"] .slides.mini .slide{flex-basis:100%;scroll-snap-align:start;padding:6px;gap:4px}
.tenue-co{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:stretch}
.co-carre{display:flex;flex-direction:column;gap:6px;min-width:0}
.dispo-carre{min-width:0;display:flex;flex-direction:column;gap:6px}
.dp-slides .slide{background:var(--sunk);padding:12px;gap:6px;justify-content:space-between}
.dp-btns{display:flex;flex-direction:column;gap:5px}
.dp-mois{display:flex;align-items:center;justify-content:space-between;gap:4px}
.dp-mois b{font-family:var(--display);font-size:16px;font-weight:800}
.dp-m{border:0;background:var(--surface);color:var(--ink);width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0}
.dp-m:disabled{opacity:.3}
.dp-jours{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex:1;align-content:center}
.dp-jours .dp-b{padding:10px 0}
.dmois{align-items:center;gap:12px}
.dmois b{font-size:15px}
.chip-d:disabled{opacity:.35}
.dp-b{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 0;font:700 13px/1 var(--body)}
.dp-b.on{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.dp-plus{border:0;background:none;color:var(--muted);font:600 11.5px/1 var(--body);display:flex;align-items:center;justify-content:center;gap:3px;padding:2px 0}
.dp-res .dp-l{overflow-y:auto;overscroll-behavior-y:contain;touch-action:pan-x pan-y;scrollbar-width:none}
.dp-res .dp-l::-webkit-scrollbar{display:none}
.dp-l > div{display:flex;flex-direction:column;flex:none}
.dp-n{font-style:normal;font-size:11px;font-weight:600;color:var(--today);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:14px}
.dp-partager{border:0;border-radius:10px;background:var(--denim);color:var(--on-denim);font:700 13px/1 var(--body);padding:8px 0;display:flex;align-items:center;justify-content:center;gap:6px}
.dliste small{display:block;font-size:11.5px;font-weight:600;color:var(--today);margin-top:2px}
.dp-h{display:flex;flex-direction:column}
.ligne.simple{padding-left:12px}
.l-note{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:auto;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.dp-hl{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-pl .dp-h b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-pl .dp-l{overflow-y:auto;overscroll-behavior-y:contain;touch-action:pan-x pan-y;scrollbar-width:none}
.dp-pl .dp-l::-webkit-scrollbar{display:none}
.dp-h b{font-family:var(--display);font-size:16px;font-weight:800}
.dp-h span{font-size:11.5px;font-weight:700;color:var(--denim)}
.dp-l{flex:1;display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
.dp-l > div > span{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-l > div > span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7CC992;margin-right:7px;vertical-align:1px}
.dp-l .vide::before{display:none}
[data-bloc="duo"] .dp-slides{height:var(--gr-h)}
.dp-pied{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
#dispos{overflow:hidden}
#dispos .feuille.dispos-f{height:min(760px,90dvh);box-sizing:border-box}
.dcrit{display:flex;flex-direction:column;gap:6px}
.dlab{font-size:12px;font-weight:700;color:var(--muted)}
.drow{display:flex;flex-wrap:wrap;gap:6px}
.drow.jours .chip-d{flex:1;padding:8px 0;text-align:center}
.chip-d{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:7px 12px;font:600 13px/1 var(--body)}
.chip-d.on{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.dcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center;row-gap:10px;padding-top:4px}
.dcal em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted)}
.dj{position:relative;font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:7px;padding:5px 0}
.dj.libre{background:color-mix(in srgb,#7CC992 30%,var(--surface));color:var(--ink)}
.dj i{position:absolute;top:-10px;left:2px;font-style:normal;font-size:8.5px;font-weight:700;color:var(--denim);text-transform:uppercase}
.dres{font-size:14px}
.dliste{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:4px}
.dliste div{display:flex;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600}
.dliste em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}
.co-h{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:30px}
.co-h b{font-family:var(--display);font-size:20px;font-weight:800}
.obtn.petit{padding:6px 10px;font-size:12.5px;gap:4px}
.co-slides{flex:none;height:var(--gr-h)}
.co-slides .liste{height:132px}
.slide.resume{align-items:center;justify-content:center;text-align:center;gap:2px;background:var(--sunk);position:relative}
.re-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slide.resume .re-total{font-size:34px;margin:2px 0}
.re-ajout{margin-top:10px;width:100%;border:0;border-radius:12px;background:color-mix(in srgb,var(--vert) 22%,var(--surface));color:var(--vert);font:700 14px/1 var(--body);padding:10px 0;display:flex;align-items:center;justify-content:center;gap:6px}
.re-warn{position:absolute;top:8px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--warn);color:var(--surface);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.re-haut{display:flex;flex-direction:column;gap:2px}
.re-sous{font-size:11.5px;font-weight:600;color:var(--muted)}
.re-pied{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.re-alerte{color:var(--warn)}
.re-gl{display:inline-flex;align-items:center;gap:2px}
.re-total{font-family:var(--display);font-size:32px;font-weight:800;line-height:1}
.re-bas2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slide.resume{--vert:#2F7A4A}
:root[data-theme="dark"] .slide.resume{--vert:#7CC992}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slide.resume{--vert:#7CC992}}
.re-plus{border:0;border-radius:14px;background:color-mix(in srgb,var(--vert) 26%,var(--surface));color:var(--vert);display:flex;align-items:center;justify-content:center;min-height:58px}
.re-nb{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--surface);min-height:58px}
.re-nb b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;color:var(--vert)}
.re-nb span{font-size:11px;font-weight:600;color:var(--muted)}
.re-l{font-size:12.5px;color:var(--muted);font-weight:600}
.re-bas{color:var(--warn)}
.slide.resume .obtn{margin-top:8px}
.co-slides .slide.rayon{padding:8px 10px}
.co-slides .slide-cat{font-size:12.5px}
.co-slides .art{gap:7px}
.co-slides .art .coche{width:22px;height:22px;border-radius:7px}
.co-slides .art-n{font-size:13.5px}
.co-slides .art-q{font-size:11.5px}
[data-bloc="garde-robe"] .tenue2 .slides.mini{height:var(--gr-h)}

<body>
<div id="vues">
  <section id="v-accueil" class="vue" aria-label="Accueil"><main id="accueil"></main></section>
</div>
<nav id="barre" aria-label="Applications"><div id="onglets"></div></nav>

<button type="button" id="retour-btn" aria-label="Noter une modif" hidden></button>
<input type="file" id="fichier" accept="application/json,.json" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const APPS = self.APPS || [];
const VERSION = self.VERSION_QUOTIDIEN || 1;
const ICONE_ACCUEIL = '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/>';
const svg = (inner, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

/* ---------- Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const plur = (n, un, plusieurs) => `${n} ${n > 1 ? plusieurs : un}`;
const pause = ms => new Promise(r => setTimeout(r, ms));
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }

/* ---------- Thème (Auto / Sombre / Clair), appliqué aussi aux apps ---------- */
const CLE_THEME = 'quotidien-theme';
function themeChoisi(){ try{ return localStorage.getItem(CLE_THEME) || 'auto'; }catch(e){ return 'auto'; } }
function appliquerTheme(doc){
  if(!doc) return;
  const t = themeChoisi(), el = doc.documentElement;
  if(t === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', t);
}
function appliquerPartout(){
  appliquerTheme(document);
  for(const f of frames.values()){ try{ appliquerTheme(f.contentDocument); }catch(e){} }
}

/* ---------- Vues et barre ---------- */
const frames = new Map();     // id → <iframe>
const cacheeDepuis = new Map();
let actif = null;

function creerFrame(app, query = ''){
  let f = frames.get(app.id);
  if(f) return f;
  f = document.createElement('iframe');
  f.className = 'vue';
  f.title = app.nom;
  f.dataset.app = app.id;
  f.inert = true;
  f.setAttribute('allow', 'camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *; web-share *; fullscreen *');
  f.charge = new Promise(res => f.addEventListener('load', res, {once:true}));
  f.addEventListener('load', () => {
    try{ appliquerTheme(f.contentDocument); }catch(e){}
    try{ sansClavierAuto(f.contentWindow); }catch(e){}
    brancherHistorique(f, app);
    planifierAccueil(1500);   // ex. les Courses complètent leur liste à l'ouverture
  });
  f.src = app.dossier + query;
  $('#vues').appendChild(f);
  frames.set(app.id, f);
  return f;
}
/* Jamais de clavier qui s'ouvre tout seul : une app ne peut plus placer le curseur dans un champ texte
   (seul un appui sur le champ l'ouvre). Vaut aussi pour les fenêtres qui s'ouvrent avec le curseur dans le 1er champ. */
function sansClavierAuto(w){
  try{
    if(!w || w.__sansClavier) return; w.__sansClavier = true;
    const texte = el => !!el && (el.tagName === 'TEXTAREA' || el.isContentEditable || (el.tagName === 'INPUT' && !/^(checkbox|radio|range|button|submit|reset|file|color|hidden|image)$/i.test(el.type || '')));
    let touche = null, toucheAt = 0;
    w.document.addEventListener('pointerdown', e => { touche = e.target; toucheAt = Date.now(); }, true);
    for(const C of [w.HTMLInputElement, w.HTMLTextAreaElement]){
      const orig = C.prototype.focus;
      C.prototype.focus = function(...a){ if(texte(this) && !(touche === this && Date.now() - toucheAt < 800)) return; return orig.apply(this, a); };
    }
    const sm = w.HTMLDialogElement && w.HTMLDialogElement.prototype.showModal;
    if(sm) w.HTMLDialogElement.prototype.showModal = function(...a){ const r = sm.apply(this, a); const ae = w.document.activeElement; if(texte(ae) && this.contains(ae)) ae.blur(); return r; };
  }catch(e){ console.warn('clavier', e); }
}
sansClavierAuto(window);
/* Bouton « retour » : les apps ne créent plus d'entrées d'historique dans leur fenêtre.
   Leur history.pushState / back passe par la coquille, qui garde une seule pile (fiable sur Android). */
function brancherHistorique(f, app){
  let w; try{ w = f.contentWindow; if(!w || w.__quotidienHist) return; w.__quotidienHist = true; }catch(e){ return; }
  const h = w.history, origReplace = h.replaceState.bind(h);
  let base = null; f.pile = [];
  try{
    Object.defineProperty(h, 'state', {configurable:true, get:() => f.pile.length ? f.pile[f.pile.length - 1] : base});
    h.pushState = st => {
      if(f.superpose){ f.pile.push(st === undefined ? null : st); history.pushState({app:app.id, p:f.pile.length, sup:true}, '', location.href); return; }
      if(actif !== app.id) return;
      f.pile.push(st === undefined ? null : st);
      history.pushState({app:app.id, p:f.pile.length}, '', location.pathname + '#' + app.id);
    };
    h.replaceState = (st, titre, url) => {
      if(f.pile.length) f.pile[f.pile.length - 1] = st === undefined ? null : st; else base = st === undefined ? null : st;
      if(url != null){ try{ origReplace(null, '', url); }catch(e){} }
    };
    h.back = () => { if(f.pile.length) history.back(); };
    h.go = n => { if(n < 0 && f.pile.length) history.go(Math.max(n, -f.pile.length)); };
  }catch(e){ console.warn('historique', e); }
}
function vueDe(id){ return id === 'accueil' ? $('#v-accueil') : frames.get(id); }
function montrer(id, {query = '', historique = false} = {}){
  if(id === actif){   // 2e appui sur l'onglet actif : retour en haut
    try{ (id === 'accueil' ? $('#v-accueil') : frames.get(id).contentWindow).scrollTo({top:0, behavior:'smooth'}); }catch(e){}
    return;
  }
  const avant = vueDe(actif);
  if(avant && avant.pile) avant.pile.length = 0;   // on quitte l'app : ses niveaux internes ne sont plus dans l'historique
  if(avant){ avant.classList.remove('on'); avant.inert = true; if(actif !== 'accueil') cacheeDepuis.set(actif, Date.now()); }
  actif = id;
  let v;
  if(id === 'accueil'){ v = $('#v-accueil'); rafraichirAccueil(); }
  else {
    const app = APPS.find(a => a.id === id);
    v = creerFrame(app, query);
    if(app.toujoursAccueil && !historique){ try{ v.contentWindow.quotidienAccueil && v.contentWindow.quotidienAccueil(); }catch(e){} if(v.pile) v.pile.length = 0; }
    const t = cacheeDepuis.get(id);
    // Une app cachée ne sait pas qu'on revient : on la prévient comme si on rouvrait l'app (météo, agendas…)
    if(t && Date.now() - t > 30000){ try{ v.contentDocument.dispatchEvent(new Event('visibilitychange')); }catch(e){} }
    cacheeDepuis.delete(id);
  }
  v.classList.add('on'); v.inert = false;

  document.querySelectorAll('#onglets button').forEach(b => { if(b.dataset.id === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  // Bouton « retour » d'Android : depuis une app, il ramène à l'Accueil (au lieu de fermer Mon quotidien)
  if(!historique){
    const url = location.pathname + (id === 'accueil' ? '' : '#' + id);
    try{
      if(id !== 'accueil' && !(history.state && history.state.app)) history.pushState({app:id, p:0}, '', url);
      else history.replaceState(id === 'accueil' ? null : {app:id, p:0}, '', url);
    }catch(e){}
  }
}
function construireBarre(){
  const items = [{id:'accueil', nom:'Accueil', icone:ICONE_ACCUEIL}, ...APPS.filter(a => !a.cache)];
  const o = $('#onglets');
  o.style.gridTemplateColumns = `repeat(${items.length}, minmax(0, 1fr))`;
  o.classList.toggle('serre', items.length > 4);
  o.innerHTML = items.map(a => `<button type="button" data-id="${esc(a.id)}">${svg(a.icone)}<span>${esc(a.nom)}</span></button>`).join('');
  o.addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if(b) montrer(b.dataset.id); });
}
// Les apps sont chargées en arrière-plan, une par une : ensuite, passer de l'une à l'autre est instantané
function precharger(){
  let i = 0;
  const suite = () => {
    const app = APPS[i++]; if(!app) return;
    if(app.cache){ suite(); return; }
    creerFrame(app).charge.then(() => setTimeout(suite, 600));
  };
  setTimeout(suite, 900);
}

/* ---------- Lecture des bases des apps (sans jamais rien créer ni modifier) ---------- */
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function baseExiste(nom){
  if(indexedDB.databases){ try{ return (await indexedDB.databases()).some(d => d.name === nom); }catch(e){} }
  return null;   // inconnu : ouvrir() s'en charge
}
function ouvrir(nom){
  return new Promise(res => {
    let r;
    try{ r = indexedDB.open(nom); }catch(e){ return res(null); }
    let neuve = false;
    // La base n'existe pas encore : on annule, pour ne surtout pas créer une base vide à la place de l'app
    r.onupgradeneeded = () => { neuve = true; try{ r.transaction.abort(); }catch(e){} };
    r.onsuccess = () => { const db = r.result; if(neuve){ db.close(); return res(null); } db.onversionchange = () => db.close(); res(db); };
    r.onerror = e => { if(e && e.preventDefault) e.preventDefault(); res(null); };
  });
}
async function ouvrirBase(nom){ return (await baseExiste(nom)) === false ? null : ouvrir(nom); }
async function lire(nom, fn){
  const db = await ouvrirBase(nom);
  if(!db) return null;
  try{ return await fn(db); } finally{ db.close(); }   // jamais de base laissée ouverte
}
const aTable = (db, t) => db.objectStoreNames.contains(t);
const tout = (db, t) => aTable(db, t) ? req(db.transaction(t).objectStore(t).getAll()) : Promise.resolve([]);
// Apps qui rangent leurs données dans localStorage (ex. Backstage) : toutes les clés qui commencent par leur préfixe
const clesLocales = app => { const out = []; try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith(app.prefixe)) out.push(k); } }catch(e){} return out; };
const estLocale = app => app.stockage === 'localStorage' && !!app.prefixe;
const un = (db, t, k) => aTable(db, t) && k != null ? req(db.transaction(t).objectStore(t).get(k)) : Promise.resolve(undefined);

/* ---------- Garde-robe : météo et tenue prévue ---------- */
const WMO = c => c == null ? null :
  c === 0 ? ['☀️', 'Ciel dégagé'] : c === 1 ? ['🌤️', 'Plutôt ensoleillé'] : c === 2 ? ['⛅', 'Partiellement nuageux'] : c === 3 ? ['☁️', 'Couvert'] :
  c <= 48 ? ['🌫️', 'Brouillard'] : c <= 55 ? ['🌦️', 'Bruine'] : c <= 57 ? ['🌧️', 'Bruine verglaçante'] :
  c === 61 ? ['🌧️', 'Pluie faible'] : c === 63 ? ['🌧️', 'Pluie modérée'] : c === 65 ? ['🌧️', 'Forte pluie'] : c <= 67 ? ['🌧️', 'Pluie verglaçante'] :
  c <= 75 ? ['🌨️', 'Neige'] : c === 77 ? ['🌨️', 'Grains de neige'] : c <= 82 ? ['🌦️', 'Averses'] : c <= 86 ? ['🌨️', 'Averses de neige'] :
  c === 95 ? ['⛈️', 'Orage'] : ['⛈️', 'Orage avec grêle'];
let meteoMem = null;
async function meteo(v){
  const cle = v.lat + ',' + v.lon;
  if(meteoMem && meteoMem.cle === cle && Date.now() - meteoMem.t < 20 * 60e3) return meteoMem.jours;
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 8000);
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${v.lat}&longitude=${v.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=2`;
    const d = (await (await fetch(url, {signal:ctrl.signal})).json()).daily, jours = {};
    d.time.forEach((j, i) => { jours[j] = {max:Math.round(d.temperature_2m_max[i]), min:Math.round(d.temperature_2m_min[i]), pluie:d.precipitation_probability_max[i] ?? 0, code:d.weather_code[i], vent:d.wind_speed_10m_max ? Math.round(d.wind_speed_10m_max[i]) : null}; });
    meteoMem = {cle, t:Date.now(), jours};
    return jours;
  }catch(e){ return null; } finally{ clearTimeout(to); }
}
// La garde-robe calcule elle-même la tenue (silhouette avec la tête emoji) et ses propositions
async function attendreApp(id, test){
  const app = APPS.find(a => a.id === id); if(!app) return null;
  const f = creerFrame(app); await f.charge;
  for(let i = 0; i < 40; i++){ try{ const w = f.contentWindow; if(test(w)) return w; }catch(e){} await pause(150); }
  return null;
}
async function lireGardeRobe(){
  const reg = await lire('garde-robe', db => un(db, 'kv', 'settings'));
  if(reg === null) return null;   // pas de garde-robe sur ce téléphone
  const n = new Date().getHours() >= 18 ? 1 : 0;   // le soir, on prépare demain
  const dj = new Date(); dj.setDate(dj.getDate() + n);
  const w = await attendreApp('garde-robe', w => w.quotidienGR && w.quotidienGR.pret());
  let tenue = null, props = [], vide = false;
  if(w){
    tenue = w.quotidienGR.jour(n);
    if(!tenue) props = w.quotidienGR.propositions(n);
    vide = !w.quotidienGR.nbPieces();

function calculerDispos(crit){

const SCENE_RE = /sc[eè]ne/i;   // pas « Stand-up » (écriture…) : seulement les scènes
async function lireScenesAgenda(avant, apres){
  const r = await lire('organisation', async db => {
    const [tasks, themes] = await Promise.all([tout(db, 'tasks'), tout(db, 'themes')]);
    const nomDe = id => (themes.find(x => x.id === id) || {}).name || '';
    const ids = new Set(themes.filter(th => SCENE_RE.test(th.name || '') || (th.parentId && SCENE_RE.test(nomDe(th.parentId)))).map(th => th.id));
    if(!ids.size) return [];
    const out = [], t0 = new Date();
    for(let i = -avant + 1; i <= apres; i++){
      const x = new Date(t0); x.setDate(x.getDate() + i); const d = iso(x);
      tasks.filter(k => ids.has(k.themeId) && occursOn(k, d)).forEach(k => out.push({titre:k.title, date:d, heure:(k.time || '').replace(':', 'h').replace(/h00$/, 'h')}));
    }
    return out.sort((a, b) => (a.date + a.heure) < (b.date + b.heure) ? -1 : 1);
  });
  return r || [];
}

function ciel(ev){

  const lune = (x, y, r) => [2.2, 1.6].map((k, i) => `<circle cx="${x}" cy="${y}" r="${r * k}" fill="#E9E4FF" opacity="${[0.07, 0.12][i]}"/>`).join('')
    + `<path fill="#F3F0FF" d="M${x + r * 0.3} ${y - r} A${r} ${r} 0 0 0 ${x + r * 0.3} ${y + r} A${r * 1.25} ${r * 1.25} 0 0 1 ${x + r * 0.3} ${y - r} Z"/>`;
  const etoiles = pts => pts.map(([x, y, r]) => `<circle class="etoile" cx="${x}" cy="${y}" r="${r}" fill="#FFFFFF"/>`).join('');
  const dessins = {
    'sky-matin':astre(70, 50, 9, '#FFD58A'), 'sky-aprem':astre(66, 16, 8, '#FFE9A6'),
    'sky-soir':lune(66, 20, 8) + etoiles([[36, 12, 0.9], [46, 34, 0.7], [76, 42, 0.8], [54, 8, 0.6], [30, 40, 0.6]]),
    'sky-ma':astre(64, 22, 8, '#FFE2A0'), 'sky-as':astre(48, 30, 7, '#FFC78A') + lune(72, 18, 6) + etoiles([[62, 40, 0.7], [78, 36, 0.6]]),

  };
  return {cls:'sky ' + cls, deco:`<span class="sky-bg" aria-hidden="true"></span><svg class="sky-deco" viewBox="0 0 84 56" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${dessins[cls]}</svg>`};

/* ---------- Ajouter un produit à la liste de courses, sans quitter l'accueil ---------- */
let produitsCO = [];
async function ouvrirAjoutCourse(){
  const dlg = $('#ajout-course');
  dlg.innerHTML = `<div class="feuille"><h2 tabindex="-1" autofocus>Ajouter aux courses</h2>
    <label class="champ"><input id="ac-q" type="search" placeholder="Chercher un produit…" autocomplete="off" enterkeyhint="search"></label>
    <div id="ac-res" class="ac-res"><p class="hint">Chargement…</p></div>
    <button type="button" class="btn" data-ac="fermer">Fermer</button></div>`;
  dlg.showModal();
  const h = dlg.querySelector('h2'); if(h) h.focus({preventScroll:true});   // pas de clavier tant qu'on ne touche pas la recherche
  const w = await attendreApp('courses', w => !!w.quotidienCO);
  produitsCO = w ? w.quotidienCO.produits() : [];
  majAjoutCourse();   // le clavier ne s'ouvre que quand tu touches la barre de recherche
}
const sansAccent = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function majAjoutCourse(){
  const box = $('#ac-res'); if(!box) return;
  const q = sansAccent($('#ac-q').value);
  const liste = produitsCO.filter(p => !q || sansAccent(p.nom).includes(q)).slice(0, 30);
  const exact = q && produitsCO.some(p => sansAccent(p.nom) === q);
  box.innerHTML = liste.map(p => `<button type="button" class="ac-p${p.dans ? ' dans' : ''}" data-ac="ajouter" data-id="${esc(p.id)}"${p.dans ? ' disabled' : ''}><span>${esc(p.emoji)} ${esc(p.nom)}</span><span class="ac-e">${p.dans ? 'dans la liste' : '＋'}</span></button>`).join('')
    + (q && !exact ? `<button type="button" class="ac-p nouveau" data-ac="creer"><span>＋ Nouveau produit « ${esc($('#ac-q').value.trim())} »</span><span class="ac-e">dans Courses</span></button>` : '')
    + (!liste.length && !q ? '<p class="hint">Aucun produit pour l’instant.</p>' : '');
}
$('#ajout-course').addEventListener('input', e => { if(e.target.id === 'ac-q') majAjoutCourse(); });
$('#ajout-course').addEventListener('click', async e => {
  const dlg = $('#ajout-course');
  if(e.target === dlg){ dlg.close(); return; }
  const b = e.target.closest('[data-ac]'); if(!b) return;
  if(b.dataset.ac === 'fermer') dlg.close();
  else if(b.dataset.ac === 'ajouter'){
    const w = await attendreApp('courses', w => !!w.quotidienCO); if(!w) return;
    w.quotidienCO.ajouter(b.dataset.id);
    const p = produitsCO.find(x => x.id === b.dataset.id); if(p) p.dans = true;
    $('#ac-q').value = ''; majAjoutCourse();
    toast(`${p ? p.nom : 'Produit'} ajouté 🛒`); planifierAccueil(300);
  }
  else if(b.dataset.ac === 'creer'){
    const nom = $('#ac-q').value.trim(); dlg.close();
    window.quotidien.ouvrir('courses', {action:'ajouter', nom});
  }
});

/* ---------- Le mois (calendrier de l'Organisation), en fenêtre par-dessus l'accueil ---------- */
const MOIS_N = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let moisDecalage = 0, moisJour = null, moisDonnees = null;
async function chargerMois(){
  moisDonnees = await lire('organisation', async db => {
    const [tasks, themes] = await Promise.all([tout(db, 'tasks'), tout(db, 'themes')]);
    return {tasks:tasks.filter(x => !x.free), themes:new Map(themes.map(th => [th.id, th]))};
  });
}
function elementsDu(d){
  if(!moisDonnees) return [];
  const els = moisDonnees.tasks.filter(x => occursOn(x, d)).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1);
  if(d !== iso(new Date())) return els;
  // Aujourd'hui : les tâches pas faites d'un jour précédent, reportées automatiquement
  const retard = lateEntries(moisDonnees.tasks, d).filter(e => !isDone(e.t, e.d) && !els.includes(e.t)).map(e => ({...e.t, __retard:e.d}));
  return [...retard, ...els];
}
function dessinerMois(){
  const dlg = $('#mois'), t0 = iso(new Date());
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + moisDecalage);
  const y = base.getFullYear(), m = base.getMonth(), nb = new Date(y, m + 1, 0).getDate(), dec = (new Date(y, m, 1).getDay() + 6) % 7;
  if(!moisJour || moisJour.slice(0, 7) !== iso(base).slice(0, 7)) moisJour = moisDecalage === 0 ? t0 : iso(base);
  const coul = x => { const th = moisDonnees && moisDonnees.themes.get(x.themeId); return `var(--c-${th ? th.color || 'slate' : 'slate'})`; };
  let cases = '';
  for(let i = 0; i < dec; i++) cases += '<span></span>';
  for(let j = 1; j <= nb; j++){
    const d = iso(new Date(y, m, j)), els = elementsDu(d);
    cases += `<button type="button" class="mj${d === t0 ? ' auj' : ''}${d === moisJour ? ' sel' : ''}" data-mj="${d}"><b>${j}</b><span class="mpts">${els.slice(0, 3).map(x => `<i style="background:${coul(x)}"></i>`).join('')}</span></button>`;
  }
  const els = elementsDu(moisJour), jd = parseD(moisJour);
  dlg.innerHTML = `<div class="feuille mois-f"><div class="poignee" aria-hidden="true"></div>
    <div class="mois-h"><button type="button" class="rond petit" data-mn="-1" aria-label="Mois précédent">${svg('<path d="M15 6l-6 6 6 6"/>', 18)}</button><h2>${cap(MOIS_N[m])} ${y}</h2><button type="button" class="rond petit" data-mn="1" aria-label="Mois suivant">${svg('<path d="M9 6l6 6-6 6"/>', 18)}</button></div>
    <div class="mgrille">${['L','M','M','J','V','S','D'].map(x => `<em>${x}</em>`).join('')}${cases}</div>
    <h3>${cap(jd.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}))}</h3>
    <div class="mliste">${els.length ? els.map(x => `<button type="button" class="ml" data-mt="${esc(x.id)}" style="--sc:${coul(x)}"><span class="ml-t">${esc(x.title)}</span>${x.__retard ? `<em class="ml-r">en retard · ${esc(shortDate(x.__retard))}</em>` : x.time ? `<b>${esc(x.time.replace(':', 'h').replace(/h00$/, 'h'))}</b>` : ''}</button>`).join('') : '<p class="hint">Rien de prévu ce jour-là.</p>'}</div>
    <button type="button" class="btn" data-mf="ajouter">${svg('<path d="M12 5v14M5 12h14"/>', 16)} Ajouter ce jour-là</button>
  </div>`;
}
async function ouvrirMois(){
  moisDecalage = 0; moisJour = iso(new Date());
  await chargerMois(); dessinerMois();
  const dlg = $('#mois'); dlg.showModal();
}
function fermerMois(){ const dlg = $('#mois'); if(!dlg.open) return; const f = dlg.querySelector('.feuille'); dlg.classList.add('ferme'); setTimeout(() => { dlg.close(); dlg.classList.remove('ferme'); if(f) f.style.transform = ''; }, 180); }

/* ---------- Sauvegarde globale ---------- */
async function collecter(){
  const bases = {};
  for(const app of APPS){
    if(!app.base) continue;
    const c = await lire(app.base, async db => {
      const tables = {};
      for(const n of Array.from(db.objectStoreNames)){
        const os = db.transaction(n).objectStore(n);
        if(os.keyPath == null){   // table « clé → valeur » (ex. les réglages de la garde-robe)
          const [ks, vs] = await Promise.all([req(os.getAllKeys()), req(os.getAll())]);
          tables[n] = {cle:null, paires:ks.map((k, i) => [k, vs[i]])};
        } else tables[n] = {cle:os.keyPath, valeurs:await req(os.getAll())};
      }
      return {version:db.version, tables};
    });
    if(c) bases[app.base] = c;
  }
  const locaux = {};
  for(const app of APPS.filter(estLocale)){
    const ks = clesLocales(app);
    if(ks.length) locaux[app.id] = Object.fromEntries(ks.map(k => [k, localStorage.getItem(k)]));
  }
  return {bases, locaux, retours:lireRetours()};
}
async function exporterTout(){
  toast('Préparation de la sauvegarde…');
  const {bases, locaux, retours} = await collecter();
  if(!Object.keys(bases).length && !Object.keys(locaux).length){ toast('Aucune donnée à sauvegarder sur ce téléphone.'); return; }
  const data = {app:'mon-quotidien-tout', version:2, date:new Date().toISOString(), bases, locaux, retours};
  const nom = `mon-quotidien-${iso(new Date())}.json`;
  const fichier = new File([JSON.stringify(data)], nom, {type:'application/json'});
  // Sur téléphone : feuille de partage (Enregistrer dans Fichiers, Drive…) ; sinon téléchargement
  // Android : enregistré directement dans Téléchargements. iPhone : feuille de partage.
  if(!/Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[fichier]})){
    try{ await navigator.share({files:[fichier], title:nom}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(fichier), a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Sauvegarde enregistrée dans Téléchargements.');
}
// Reconnaît la sauvegarde globale ET les sauvegardes faites dans chaque app
function planImport(data){
  if(!data || typeof data !== 'object') return null;
  const tab = v => Array.isArray(v) ? v : [];
  if(data.app === 'mon-quotidien-tout' && (data.bases || data.locaux || Array.isArray(data.retours))){
    return [...Object.entries(data.bases || {}).map(([base, c]) => ({base, tables:Object.fromEntries(Object.entries(c.tables || {}).map(([n, t]) =>
      [n, t.cle == null ? {vider:true, paires:tab(t.paires)} : {vider:true, valeurs:tab(t.valeurs)}]))})),
      ...Object.entries(data.locaux || {}).map(([id, cles]) => ({local:id, vider:true, cles})),
      ...(Array.isArray(data.retours) && data.retours.length ? [{retours:data.retours}] : [])];
  }
  if(data.app === 'backstage' || (Array.isArray(data.scenes) && data.exportedAt)){   // sauvegarde faite dans Backstage
    const cles = {backstage_scenes_v1:JSON.stringify(tab(data.scenes)), backstage_goals_v1:JSON.stringify(data.goals || {}), backstage_texts_v1:JSON.stringify(tab(data.texts))};
    if(data.rotation2) cles.backstage_rotation2_v1 = JSON.stringify(data.rotation2);
    if(Array.isArray(data.plateaux)) cles.backstage_plateaux_v1 = JSON.stringify(data.plateaux);
    if(data.plateauxCity) cles.backstage_plateaux_city_v1 = data.plateauxCity;
    return [{local:'backstage', vider:false, cles}];
  }
  if(data.app === 'courses'){
    return [{base:'courses', tables:{products:{vider:true, valeurs:tab(data.products)}, aliases:{vider:true, valeurs:tab(data.aliases)},
      tickets:{vider:true, valeurs:tab(data.tickets)}, list:{vider:true, valeurs:tab(data.list)},
      settings:{vider:true, valeurs:[Object.assign({}, data.settings || {}, {k:'main'})]}}}];
  }
  if(data.app === 'organisation' && Array.isArray(data.tasks)){
    const t = {};
    for(const n of ['themes', 'tasks', 'lists', 'items', 'routines']) t[n] = {vider:true, valeurs:tab(data[n])};
    const m = data.meta || {}, meta = [{key:'monthView', value:!!m.monthView}];
    if(Array.isArray(m.timelog)) meta.push({key:'timelog', value:m.timelog});
    if(Array.isArray(m.feeds)) meta.push({key:'feeds', value:m.feeds});
    t.meta = {vider:false, valeurs:meta};
    return [{base:'organisation', tables:t}];
  }
  if(data.app === 'mon-quotidien' && Array.isArray(data.pieces)){   // sauvegarde faite dans la garde-robe
    return [{base:'garde-robe', tables:{pieces:{vider:true, valeurs:data.pieces}, outfits:{vider:true, valeurs:tab(data.outfits)},
      kv:{vider:false, paires:[['settings', data.settings || {}]]}}}];
  }
  return null;
}
async function attendreBase(nom){
  for(let i = 0; i < 40; i++){
    const db = await ouvrir(nom);
    if(db && db.objectStoreNames.length) return db;
    if(db) db.close();
    await pause(250);
  }
  return null;
}
async function ecrire(p){
  if(p.retours){   // notes de modifs : ajoutées à celles déjà présentes
    const l = lireRetours(), ids = new Set(l.map(r => r.id));
    ecrireRetours([...l, ...p.retours.filter(r => r && r.id && !ids.has(r.id))]);
    return;
  }
  if(p.local){
    const app = APPS.find(a => a.id === p.local);
    if(!app || !estLocale(app)) throw new Error(`app « ${p.local} » inconnue`);
    if(p.vider) clesLocales(app).forEach(k => localStorage.removeItem(k));
    for(const [k, v] of Object.entries(p.cles || {})) if(k.startsWith(app.prefixe) && typeof v === 'string') localStorage.setItem(k, v);
    const f = frames.get(app.id);
    if(f){ try{ f.contentWindow.location.reload(); }catch(e){} }
    return;
  }
  const app = APPS.find(a => a.base === p.base);
  let db = await ouvrirBase(p.base);
  if(!db && app){ await creerFrame(app).charge; db = await attendreBase(p.base); }   // l'app crée d'abord sa base
  if(!db) throw new Error(`base « ${p.base} » introuvable`);
  try{
    const noms = Object.keys(p.tables).filter(n => aTable(db, n));
    await new Promise((res, rej) => {
      const tx = db.transaction(noms, 'readwrite');
      for(const n of noms){
        const t = p.tables[n], os = tx.objectStore(n);
        if(t.vider) os.clear();
        for(const v of t.valeurs || []) os.put(v);
        for(const [k, v] of t.paires || []) os.put(v, k);
      }
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  } finally{ db.close(); }
  const f = app && frames.get(app.id);
  if(f){ try{ f.contentWindow.location.reload(); }catch(e){} }   // l'app relit ses données
}
async function importerFichiers(files){
  for(const f of files){
    let data;
    try{ data = JSON.parse(await f.text()); }catch(e){ toast(`« ${f.name} » est illisible.`); continue; }
    const plan = planImport(data);
    if(!plan || !plan.length){ toast(`« ${f.name} » n’est pas une sauvegarde reconnue.`); continue; }
    const noms = plan.map(p => p.retours ? 'Notes de modifs' : (APPS.find(a => p.local ? a.id === p.local : a.base === p.base) || {nom:p.base || p.local}).nom).join(', ');
    if(!confirm(`Importer : ${noms}\ndepuis « ${f.name} » ?\n\nLes données actuelles de ${plan.length > 1 ? 'ces apps' : 'cette app'} sur ce téléphone seront remplacées.`)) continue;
    try{
      for(const p of plan) await ecrire(p);
      toast(`${noms} : sauvegarde importée.`);
    }catch(e){ console.error(e); toast(`Import impossible (${e && e.message ? e.message : 'erreur'}).`); }
    await pause(400);
  }
  majEtat(); planifierAccueil(800);
}

/* ---------- Sauvegarde automatique sur Google Drive (via un script Google Apps Script) ----------
   Dès que l'app est ouverte et que la dernière sauvegarde a plus de 12 h, toutes les apps partent
   dans UN SEUL fichier (« tout »), le même que « Tout exporter » : « Tout importer » le relit.
   Les apps masquées (cache: true, ex. la Garde-robe et ses photos) n'y sont pas : elles ne changent plus,
   et leurs dernières sauvegardes restent sur le Drive. Si le script refuse le fichier unique (ancienne
   version du script), on revient à un fichier par app. */
const CLE_DRIVE = 'quotidien-drive';
const INTERVALLE_DRIVE = 12 * 3600e3, PAUSE_APRES_ECHEC = 30 * 60e3;
function lireDrive(){ try{ return JSON.parse(localStorage.getItem(CLE_DRIVE) || '{}') || {}; }catch(e){ return {}; } }
function ecrireDrive(maj){ const d = {...lireDrive(), ...maj}; try{ localStorage.setItem(CLE_DRIVE, JSON.stringify(d)); }catch(e){} return d; }
const driveActif = d => !!(d.url && d.code);
function ilYa(ts){
  const m = Math.round((Date.now() - ts) / 60e3);
  if(m < 1) return 'à l’instant';
  if(m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60); if(h < 48) return `il y a ${h} h`;
  return `il y a ${Math.round(h / 24)} jours`;
}
async function envoyerDrive(d, corps){
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 120e3);
  try{
    const r = await fetch(d.url, {method:'POST', body:JSON.stringify({code:d.code, ...corps}), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal:ctrl.signal});
    let j = null; try{ j = await r.json(); }catch(e){}
    if(!j) throw new Error('réponse illisible (adresse du script correcte ? déployé avec l’accès « Tout le monde » ?)');
    if(!j.ok) throw new Error(j.erreur || 'refusé par le script');
    return j;
  }catch(e){
    throw new Error(e.name === 'AbortError' ? 'délai dépassé (connexion lente ?)' : (e.message || 'pas de connexion'));
  }finally{ clearTimeout(to); }
}
let driveEnCours = false;
async function sauvegarderDrive(manuel){
  const d = lireDrive();
  if(!driveActif(d) || driveEnCours) return;
  driveEnCours = true; majEtatDrive('Sauvegarde en cours…');
  ecrireDrive({essai:Date.now()});
  try{
    const {bases, locaux, retours} = await collecter(), date = new Date().toISOString(), envois = [];
    // 1) Un seul fichier avec toutes les apps visibles
    const visibles = APPS.filter(a => !a.cache), tout = {app:'mon-quotidien-tout', version:2, date, bases:{}, locaux:{}, retours};
    visibles.forEach(a => { if(a.base && bases[a.base]) tout.bases[a.base] = bases[a.base]; else if(estLocale(a) && locaux[a.id]) tout.locaux[a.id] = locaux[a.id]; });
    if(!Object.keys(tout.bases).length && !Object.keys(tout.locaux).length) throw new Error('aucune donnée sur ce téléphone');
    let unique = true;
    try{ await envoyerDrive(d, {app:'tout', contenu:JSON.stringify(tout)}); }
    catch(err){ if(/délai|connexion|illisible/.test(err.message)) throw err; unique = false; }   // refusé par le script : on essaie l'ancienne façon
    if(unique){
      ecrireDrive({derniere:Date.now(), echecs:0, erreur:'', unique:true});
      if(manuel) majEtatDrive('Sauvegarde envoyée sur Drive ✓ (un seul fichier)');
      return;
    }
    // 2) Ancienne façon : un fichier par app
    for(const app of APPS.filter(a => !a.cache)){
      if(app.base && bases[app.base]) envois.push({app:app.id, data:{app:'mon-quotidien-tout', version:2, date, bases:{[app.base]:bases[app.base]}}});
      else if(estLocale(app) && locaux[app.id]) envois.push({app:app.id, data:{app:'mon-quotidien-tout', version:2, date, locaux:{[app.id]:locaux[app.id]}}});
    }
    if(retours.length) envois.push({app:'notes', data:{app:'mon-quotidien-tout', version:2, date, retours}});
    if(!envois.length) throw new Error('aucune donnée sur ce téléphone');
    for(const e of envois){
      try{ await envoyerDrive(d, {app:e.app, contenu:JSON.stringify(e.data)}); }
      catch(err){ throw new Error(`${(APPS.find(a => a.id === e.app) || {nom:'Notes'}).nom} : ${err.message}`); }
    }
    ecrireDrive({derniere:Date.now(), echecs:0, erreur:'', unique:false});
    if(manuel) majEtatDrive('Sauvegarde envoyée sur Drive ✓ (un fichier par app : ton script n’accepte pas encore le fichier unique)');
  }catch(err){
    const n = (lireDrive().echecs || 0) + 1;
    ecrireDrive({echecs:n, erreur:err.message});
    if(manuel) majEtatDrive('Échec : ' + err.message);
  }finally{
    driveEnCours = false; majEtatDrive(); alerteDrive();
  }
}
function verifierDrive(){
  const d = lireDrive();
  if(!driveActif(d) || driveEnCours) return;
  if(d.derniere && Date.now() - d.derniere < INTERVALLE_DRIVE) return;
  if(d.essai && d.echecs && Date.now() - d.essai < PAUSE_APRES_ECHEC) return;
  sauvegarderDrive(false);
}
function texteEtatDrive(){
  const d = lireDrive();
  if(!driveActif(d)) return 'Pas encore configurée.';
  let s = d.derniere ? `Dernière sauvegarde : ${ilYa(d.derniere)} ✓` : 'Aucune sauvegarde envoyée pour l’instant.';
  if(d.echecs) s += `\nDernier essai raté : ${d.erreur || 'erreur'}`;
  return s;
}
function majEtatDrive(msg){
  const el = $('#drive-etat'); if(!el) return;
  el.textContent = msg || texteEtatDrive();
}
// Alerte sur l'accueil si aucune sauvegarde réussie depuis 2 jours (ou si les envois échouent)
function alerteDrive(){
  const el = $('#alerte-drive'); if(!el) return;
  const d = lireDrive();
  const enRetard = driveActif(d) && (d.echecs >= 2 || (d.derniere && Date.now() - d.derniere > 48 * 3600e3));
  el.hidden = !enRetard;
  if(enRetard) el.innerHTML = `<b>Sauvegarde Drive en retard</b><span>${d.derniere ? 'Dernière réussie ' + ilYa(d.derniere) : 'Aucune sauvegarde réussie'}${d.erreur ? ' · ' + esc(d.erreur.replace(/\.$/, '')) : ''}. Touche pour voir.</span>`;
}

  navigator.serviceWorker.getRegistrations().then(regs => {
