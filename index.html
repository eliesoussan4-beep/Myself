  chaussures:{view:'face', far:0.04, hull:true, hullClip:0.015, bgBelow:true, topCut:0.015, bottomCut:0.012, d:'M110 184 Q123 176 136 184 L145 230 Q149 252 147 263 Q145 268 139 268 L107 268 Q101 268 99 263 Q97 252 101 230 Z M164 184 Q177 176 190 184 L199 230 Q203 252 201 263 Q199 268 193 268 L161 268 Q155 268 153 263 Q151 252 155 230 Z', tip:'Pointes vers toi, un doigt d\'écart ; téléphone posé au sol devant elles, sur un fond dégagé (idéalement un mur uni derrière)'},
  // Ancien contour (vue de dessus), gardé pour redétourer les photos prises avant
  chaussures_dessus:{hull:true, view:'dessus', d:'M102 175 a20 20 0 0 1 40 0 v75 a20 20 0 0 1 -40 0 Z M158 175 a20 20 0 0 1 40 0 v75 a20 20 0 0 1 -40 0 Z', tip:'La paire côte à côte, vue de dessus, pointes en bas'},
  accessoire:{d:'M100 150 h100 a16 16 0 0 1 16 16 v68 a16 16 0 0 1 -16 16 h-100 a16 16 0 0 1 -16 -16 v-68 a16 16 0 0 1 16 -16 Z', tip:"L'accessoire au centre"},
};
/* Quel contour a servi pour cette photo ? (les chaussures photographiées avant la vue de face gardent l'ancien) */
function guideKey(photo){
  if(!photo || !photo.guide) return undefined;
  if(photo.guide === 'chaussures' && photo.shoeView !== 'face') return 'chaussures_dessus';
  return photo.guide;
}
const cam = $('#cam');
let camStream = null;
function stopCamera(){ if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
cam.addEventListener('close', stopCamera);
function guideSvg(cat){
  const g = GUIDES[cat] || GUIDES.tshirt;
  const paths = `<path d="${g.d}"/>${g.extra ? `<path d="${g.extra}"/>` : ''}`;
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="rgba(0,0,0,.55)" stroke-width="5" stroke-linejoin="round">${paths}</g>
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="7 5" stroke-linejoin="round">${paths}</g>
    <g stroke="#fff" stroke-width="3" fill="none"><path d="M6 30V6h24M270 6h24v24M294 370v24h-24M30 394H6v-24"/></g></svg>`;
}
async function openCamera(cat, onShot, onFallback){
  let current = GUIDES[cat] ? cat : 'tshirt';
  cam.innerHTML = `<div class="cam">
    <div class="cam-top">
      <button type="button" class="cam-x" data-cam="close" aria-label="Fermer">✕</button>
      <div class="cam-cats">${CATS.map(c => `<button type="button" class="chip-btn" data-cam-cat="${c.id}" aria-pressed="${c.id===current}">${c.label}</button>`).join('')}</div>
    </div>
    <div class="cam-box"><video playsinline muted autoplay></video><div class="cam-guide">${guideSvg(current)}</div></div>
    <p class="cam-tip" id="camTip">${esc(GUIDES[current].tip)}. Remplis le contour.</p>
    <div class="cam-bottom"><button type="button" class="cam-shot" data-cam="shot" aria-label="Prendre la photo" disabled></button></div>
  </div>`;
  cam.showModal();
  const video = cam.querySelector('video'), shot = cam.querySelector('.cam-shot');
  cam.querySelector('.cam-cats [aria-pressed="true"]')?.scrollIntoView({inline:'center', block:'nearest'});
  cam.onclick = e => {
    const c = e.target.closest('[data-cam-cat]');
    if(c){
      current = c.dataset.camCat;
      cam.querySelectorAll('[data-cam-cat]').forEach(b => b.setAttribute('aria-pressed', b === c));
      cam.querySelector('.cam-guide').innerHTML = guideSvg(current);
      cam.querySelector('#camTip').textContent = GUIDES[current].tip + '. Remplis le contour.';
      return;
    }
    const a = e.target.closest('[data-cam]'); if(!a) return;
    if(a.dataset.cam === 'close') cam.close();
    if(a.dataset.cam === 'native'){ cam.close(); onFallback(); }
    if(a.dataset.cam === 'shot'){
      const vw = video.videoWidth, vh = video.videoHeight; if(!vw) return;
      let sx = 0, sy = 0, sw = vw, sh = vh;
      if(vw / vh > 0.75){ sw = vh * 0.75; sx = (vw - sw) / 2; } else { sh = vw / 0.75; sy = (vh - sh) / 2; }
      const c = document.createElement('canvas'); c.width = 900; c.height = 1200;
      c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, 900, 1200);
      cam.close();
      onShot(c, current);
    }
  };
  try{
    camStream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1440}}});
    if(!cam.open){ stopCamera(); return; }
    video.srcObject = camStream;
    await video.play().catch(()=>{});
    shot.disabled = false;
  }catch(err){
    cam.querySelector('.cam-box').innerHTML = `<div class="cam-err"><p>L'app n'a pas accès à la caméra. Autorise-la dans les réglages de Chrome (cadenas ou ⋮, Paramètres du site, Caméra), ou utilise l'appareil photo du téléphone, sans contour.</p><button type="button" class="btn primary" data-cam="native">Ouvrir l'appareil photo du téléphone</button></div>`;
  }
}

function pieceSheet(existing){
  const p = existing ? {...existing, photo: existing.photo ? {...existing.photo} : null} : {id:uid('p'), name:'', category:'', dirty:false, photo:null, createdAt:Date.now()};
  if(p.category === 'bas') p.category = 'pantalon';
  let busy = false;
  const detourDefault = S.settings.detour !== false;
  const html = `<form class="sheet" novalidate>
    <div class="sheet-scroll">
      <h2>${existing?'Modifier la pièce':'Nouvelle pièce'}</h2>
      <div class="photo-drop" id="drop"></div>
      <div class="photo-btns">
        <button type="button" class="btn primary" id="camBtn">Prendre une photo</button>
        <input type="file" accept="image/*" capture="environment" class="sr" id="camIn" tabindex="-1" aria-hidden="true">
        <label class="btn">Choisir dans l'album<input type="file" accept="image/*" class="sr" id="albIn"></label>
      </div>
      <label class="toggle">Détourer automatiquement<input type="checkbox" name="detour" ${detourDefault?'checked':''}></label>
      <div id="cutTools" class="cut-tools"></div>
      <label class="field"><span>Nom</span><input type="text" name="name" value="${esc(p.name)}" placeholder="Chemise en lin bleue" autocomplete="off"></label>
      <fieldset><legend class="legend">Catégorie</legend><div class="chips">
        ${CATS.map(c => `<label class="chip"><input type="radio" name="cat" value="${c.id}" ${p.category===c.id?'checked':''}><span>${c.label}</span></label>`).join('')}
      </div></fieldset>
      <label class="toggle">Au sale<input type="checkbox" name="dirty" ${p.dirty?'checked':''}></label>
      ${existing?'<button class="linkish del-link" type="button" id="del">Supprimer définitivement</button>':''}
    </div>
    <div class="sheet-actions">
      <button class="btn grow" type="button" data-close>Annuler</button>
      <button class="btn primary grow" type="submit" id="save">Enregistrer</button>
    </div></form>`;
  openSheet(html, form => {
    if(busy){ toast('La photo est encore en cours de traitement.'); return false; }
    const name = form.name.value.trim();
    if(!name){ form.name.focus(); toast('Donne un nom à la pièce.'); return false; }
    const cat = form.querySelector('input[name=cat]:checked');
    if(!cat){ toast('Choisis une catégorie.'); return false; }
    p.name = name; p.category = cat.value; p.dirty = form.dirty.checked;
    store.savePiece(p); toast(existing ? 'Pièce mise à jour.' : 'Pièce ajoutée.');
  }, form => {
    const drop = form.querySelector('#drop'), tools = form.querySelector('#cutTools'), save = form.querySelector('#save');
    const paint = (busyText) => {
      const cut = cutSrc(p), orig = photoSrc(p);
      drop.classList.toggle('checker', !!cut);
      drop.innerHTML = cut ? `<img src="${esc(cut)}" alt="Pièce détourée">` : orig ? `<img src="${esc(orig)}" alt="Photo de la pièce">` : `<div class="noimg">${ICON.camera}<span>Photographie la pièce toujours au même endroit, sur un fond uni</span></div>`;
      if(busyText) drop.insertAdjacentHTML('beforeend', `<span class="busy">${busyText}</span>`);
      tools.innerHTML = !orig ? '' : cut
        ? '<button type="button" class="btn" data-cut="retouch">Retoucher le détourage</button> <button type="button" class="linkish" data-cut="remove">Annuler le détourage</button>'
        : '<button type="button" class="linkish" data-cut="run">Détourer cette photo</button>';
    };
    const setBusy = b => { busy = b; save.disabled = b; };
    const runCut = async (img) => {
      let cut = null;
      const label = t => { const b = drop.querySelector('.busy'); if(b) b.textContent = t; };
      try{
        if(!IA.lib && !S.settings.iaReady) toast('Premier détourage intelligent : téléchargement du modèle (~40 Mo), une seule fois.');
        label('Détourage intelligent…');
        cut = await aiCut(img, guideKey(p.photo), f => label(f < 0.999 ? `Préparation de l'IA… ${Math.round(f * 100)} %` : 'Détourage intelligent…'));
        if(cut && !S.settings.iaReady) store.saveSettings({iaReady:true});
      }catch(err){
        console.warn('IA indisponible', err);
        toast('Détourage intelligent indisponible pour l\'instant : méthode simple utilisée.');
      }
      if(!cut){ label('Détourage…'); cut = cutout(img, guideKey(p.photo)); }
      if(cut){ p.photo.cut = cut; toast('Pièce détourée.'); }
      else { delete p.photo.cut; toast("Détourage impossible : le fond n'est pas assez uni ou trop proche de la couleur du vêtement."); }
    };
    const useImage = async (img, guideCat) => {
      setBusy(true); paint('Traitement…');
      try{
        const old = p.photo;
        p.photo = await processPhoto(img);
        if(guideCat){ p.photo.guide = guideCat; if(guideCat === 'chaussures') p.photo.shoeView = 'face'; }
        paint('Détourage…');
        if(old && old.assetId && store.assets && old.assetId !== p.photo.assetId) store.assets.delete(old.assetId).catch(()=>{});
        if(form.detour.checked) await runCut(img);
      }catch(e){ toast('Photo illisible, réessaie.'); }
      setBusy(false); paint();
    };
    form.querySelector('#camBtn').addEventListener('click', () => {
      const checked = form.querySelector('input[name=cat]:checked');
      openCamera(checked ? checked.value : 'tshirt', (canvas, cat) => {
        const r = form.querySelector(`input[name=cat][value="${cat}"]`); if(r) r.checked = true;
        useImage(canvas, cat);
      }, () => form.querySelector('#camIn').click());
    });
    const onFile = async input => {
      const f = input.files && input.files[0]; if(!f) return;
      setBusy(true); paint('Traitement…');
      try{
        const img = await loadImage(f);
        const old = p.photo;
        p.photo = await processPhoto(img);
        if(old && old.assetId && store.assets && old.assetId !== p.photo.assetId) store.assets.delete(old.assetId).catch(()=>{});
        paint('Détourage…');
        if(form.detour.checked) await runCut(img);
      }catch(e){ toast('Photo illisible, essaie une autre image.'); }
      setBusy(false); paint(); input.value = '';
    };
    form.querySelector('#camIn').addEventListener('change', e => onFile(e.target));
    form.querySelector('#albIn').addEventListener('change', e => onFile(e.target));
    form.detour.addEventListener('change', async () => {
      store.saveSettings({detour: form.detour.checked});
      if(!p.photo) return;
      if(!form.detour.checked){ delete p.photo.cut; paint(); return; }
      if(p.photo.cut) return;
      setBusy(true); paint('Détourage…');
      try{
        const img = new Image(); img.crossOrigin = 'anonymous';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = photoSrc(p); });
        await runCut(img);
        if(!p.photo.cut) form.detour.checked = false;
      }catch(err){ toast('Impossible de relire la photo.'); }
      setBusy(false); paint();
    });
    tools.addEventListener('click', async e => {
      const b = e.target.closest('[data-cut]'); if(!b) return;
      if(b.dataset.cut === 'retouch'){
        try{ await openRetouch(p.photo, cut => { p.photo.cut = cut; paint(); }); }
        catch(err){ toast('Impossible d\'ouvrir la retouche.'); }
        return;
      }
      if(b.dataset.cut === 'remove'){ delete p.photo.cut; paint(); return; }
      setBusy(true); paint('Détourage…');
      try{
        const img = new Image(); img.crossOrigin = 'anonymous';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = photoSrc(p); });
        await runCut(img);
      }catch(err){ toast('Impossible de relire la photo.'); }
      setBusy(false); paint();
    });
    paint();
    const del = form.querySelector('#del');
    if(del) del.addEventListener('click', () => {
      const n = [...S.outfits.values()].filter(o => (o.pieceIds||[]).includes(p.id)).length;
      if(confirm(`Supprimer « ${p.name} » ?${n?` Elle sera retirée de ${n} tenue${n>1?'s':''}.`:''}`)){ store.deletePiece(p.id); sheet.close(); toast('Pièce supprimée.'); }
    });
  });
}

function outfitSheet(existing){
  if(!S.pieces.size){ toast("Ajoute d'abord des pièces."); S.section='pieces'; render(); return; }
  const o = existing ? {...existing} : {id:uid('o'), name:'', pieceIds:[], bands:[], rainOk:false, lastWorn:null, createdAt:Date.now()};
  const pieces = [...S.pieces.values()].sort((a,b) => catOrder(a.category) - catOrder(b.category) || (a.name||'').localeCompare(b.name||'','fr'));
  const html = `<form class="sheet" novalidate>
    <div class="sheet-scroll">
      <h2>${existing?'Modifier la tenue':'Nouvelle tenue'}</h2>
      <label class="field"><span>Nom</span><input type="text" name="name" value="${esc(o.name)}" placeholder="Bureau décontracté" autocomplete="off"></label>
      <fieldset><legend class="legend">Pièces</legend><div class="picker">
        ${pieces.map(p => `<label class="pick"><input type="checkbox" name="pc" value="${esc(p.id)}" ${o.pieceIds.includes(p.id)?'checked':''}><span class="box"><span class="ph">${thumbSrc(p)?`<img src="${esc(thumbSrc(p))}" alt="" loading="lazy">`:ICON.hanger}</span><span class="l">${esc(p.name)}</span></span></label>`).join('')}
      </div></fieldset>
      <fieldset><legend class="legend">Pour quel temps ?</legend><div class="chips">
        ${BANDS.map(b => `<label class="chip"><input type="checkbox" name="band" value="${b.id}" ${(o.bands||[]).includes(b.id)?'checked':''}><span>${b.label} <small>${b.hint}</small></span></label>`).join('')}
      </div></fieldset>
      <label class="toggle">Convient sous la pluie<input type="checkbox" name="rainOk" ${o.rainOk?'checked':''}></label>
      ${existing?'<button class="linkish del-link" type="button" id="del">Supprimer définitivement</button>':''}
    </div>
    <div class="sheet-actions">
      <button class="btn grow" type="button" data-close>Annuler</button>
      <button class="btn primary grow" type="submit">Enregistrer</button>
    </div></form>`;
  openSheet(html, form => {
    const name = form.name.value.trim();
    const ids = [...form.querySelectorAll('input[name=pc]:checked')].map(i => i.value);
    if(!name){ form.name.focus(); toast('Donne un nom à la tenue.'); return false; }
    if(!ids.length){ toast('Choisis au moins une pièce.'); return false; }
    o.name = name; o.pieceIds = ids;
    o.bands = [...form.querySelectorAll('input[name=band]:checked')].map(i => i.value);
    o.rainOk = form.rainOk.checked;
    store.saveOutfit(o); toast(existing ? 'Tenue mise à jour.' : 'Tenue créée.');
  }, form => {
    const del = form.querySelector('#del');
    if(del) del.addEventListener('click', () => {
      if(confirm(`Supprimer la tenue « ${o.name} » ? Les pièces restent dans ta penderie.`)){ store.deleteOutfit(o.id); sheet.close(); toast('Tenue supprimée.'); }
    });
  });
}

/* ---------- Actions ---------- */
document.addEventListener('click', e => {
  const sec = e.target.closest('[data-section]');
  if(sec){ S.section = sec.dataset.section; render(); window.scrollTo({top:0}); return; }
  const el = e.target.closest('[data-act]'); if(!el || sheet.contains(el)) return;
  const id = el.dataset.id;
  switch(el.dataset.act){
    case 'new-piece': pieceSheet(); break;
    case 'export': exportData(); break;
    case 'edit-piece': pieceSheet(S.pieces.get(id)); break;
    case 'new-outfit': outfitSheet(); break;
    case 'edit-outfit': outfitSheet(S.outfits.get(id)); break;
    case 'filter': S.filter = el.dataset.cat; render(); break;
    case 'toggle-dirty': { const p = S.pieces.get(id); if(p) store.savePiece({...p, dirty:!p.dirty}); break; }
    case 'all-clean': for(const p of S.pieces.values()) if(p.dirty) store.savePiece({...p, dirty:false}); toast('Tout est propre.'); break;
    case 'band': {
      const w = tomorrowWeather();
      store.saveSettings({manual:{date:tomorrowKey(), band:el.dataset.band, rain: w ? w.rain : false}}); S.alt = 0; break;
    }
    case 'rain': {
      const w = tomorrowWeather();
      store.saveSettings({manual:{date:tomorrowKey(), band: w ? w.band : 'doux', rain: !(w && w.rain)}}); S.alt = 0; break;
    }
    case 'auto-weather': refreshWeather(); break;
    case 'day': S.dayChoice = +el.dataset.off; S.alt = 0; render(); break;
    case 'another': S.alt++; render(); break;
    case 'plan': {
      const o = S.outfits.get(id); if(!o) break;
      store.saveOutfit({...o, prevWorn:o.lastWorn ?? null, lastWorn:tomorrowKey()});
      store.saveSettings({planned:{date:tomorrowKey(), outfitId:id}});
      toast(`C'est noté pour ${dayWord()}.`); break;
    }
    case 'unplan': {
      const pl = S.settings.planned; const o = pl && S.outfits.get(pl.outfitId);
      if(o && o.lastWorn === tomorrowKey()) store.saveOutfit({...o, lastWorn:o.prevWorn ?? null});
      store.saveSettings({planned:null}); S.alt = 0; break;
    }
    case 'openmode': store.saveSettings({openMode: el.dataset.mode}); break;
    case 'dirty-planned': {
      const pl = S.settings.planned; const o = pl && S.outfits.get(pl.outfitId); if(!o) break;
      (o.pieceIds||[]).forEach(pid => { const p = S.pieces.get(pid); if(p && !p.dirty) store.savePiece({...p, dirty:true}); });
      toast('Pièces mises au sale.'); break;
    }
  }
});

render();
store.init().then(() => setTimeout(upgradeCuts, 300));
fetchWeather();
// Rafraîchit la météo quand on revient sur l'app
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') fetchWeather(); });
// Demande à Chrome de ne jamais effacer tes photos et tenues
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
// Application installable + fonctionne hors connexion
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(r => r.update()).catch(()=>{}));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(!reloaded){ reloaded = true; location.reload(); } });
}
</script>
