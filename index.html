<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --sun:#E9A92C; --rain:#4F82C9; --warn:#A8432C;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --sun:#F2BD4E; --rain:#7EA8E6; --warn:#E3826B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --sun:#F2BD4E; --rain:#7EA8E6; --warn:#E3826B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{max-width:640px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px)}

/* Section switcher */
.switcher{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.seg .count{font-size:11px;background:var(--warn);color:#fff;border-radius:99px;padding:0 6px;margin-left:4px;vertical-align:1px}

h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 16px}
.page-head h1{font-size:28px;font-weight:700}
.muted{color:var(--muted)}

/* Tomorrow hero */
.tomorrow{margin:18px 0 6px}
.tomorrow .day{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.92;letter-spacing:-.03em}
.tomorrow .date{color:var(--muted);font-size:15px;margin-top:6px;text-transform:none}

.weather{margin:18px 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.weather-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.weather-now{display:flex;align-items:center;gap:10px;font-weight:600}
.weather-now svg{flex:none}
.linkish{border:0;background:none;color:var(--denim);font-weight:600;padding:4px 0;font-size:14px}
.band-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span,.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;line-height:1.2}
.chip input:checked + span,.chip-btn[aria-pressed="true"]{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.chip input:focus-visible + span{outline:2px solid var(--denim);outline-offset:2px}
.chip small{opacity:.75;font-size:12px}

/* Look */
.look-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:8px}
.look-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.look-head h2{font-size:24px;font-weight:700}
.why{color:var(--muted);font-size:14px;margin:0 0 14px}
.look{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:170px;gap:8px}
.look.n1{grid-template-columns:1fr;grid-auto-rows:320px}
.look.n3 .tile:first-child{grid-row:span 2}
.look.odd .tile:last-child{grid-column:span 2}
.look.n3 .tile:last-child{grid-column:auto}
.tile{background:var(--sunk);border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:contain}
.tile .cap{position:absolute;left:8px;bottom:8px;right:8px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:fit-content;max-width:calc(100% - 16px)}
.noimg{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:13px;padding:10px;text-align:center}
.look-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.btn.grow{flex:1}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.planned{display:inline-flex;align-items:center;gap:6px;background:var(--denim-soft);color:var(--denim);font-weight:600;font-size:13px;border-radius:99px;padding:4px 10px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:26px 20px;text-align:center}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{margin:0 0 16px;color:var(--muted)}

/* Grids */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.piece{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:6px}
.piece .ph{aspect-ratio:3/4;background:var(--sunk);border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.piece .ph img{width:100%;height:100%;object-fit:contain}
.piece .nm{font-weight:600;font-size:14px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece .ct{font-size:12px;color:var(--muted);padding:0 4px 2px;margin-top:-6px}
.badge{position:absolute;top:6px;left:6px;background:var(--warn);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px}
.piece.is-dirty .ph img{opacity:.45}

.outfits{display:flex;flex-direction:column;gap:10px}
.outfit{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;width:100%}
.outfit .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.outfit h3{font-size:18px;font-weight:700}
.outfit .meta{font-size:13px;color:var(--muted);margin-top:2px}
.o-body{display:flex;align-items:stretch;gap:10px;margin-top:10px}
.o-body .strip{margin-top:0}
.o-core{flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden}
.outfit .row h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.outfit .row .muted{flex:none;white-space:nowrap}
.outfit .o-body{min-height:70px}
.o-core .th{flex:1 1 0;min-width:0;max-width:56px}
.o-sep{width:1px;background:var(--line);flex:none}
.o-extra{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.o-line{display:flex;flex-direction:column;gap:3px}
.o-l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.o-line .strip{flex-wrap:nowrap;overflow:hidden}
.outfit .o-line .th{width:34px;height:40px;flex:none}
.o-none{font-size:12px;color:var(--muted);font-style:italic}
.o-acc{flex-wrap:nowrap;gap:5px;overflow:hidden;align-items:flex-start}
.o-acc .acc{flex:1 1 0;min-width:0;max-width:46px}
.o-acc .more{flex:none;align-self:center;font-size:12px;font-weight:600;color:var(--muted)}
.acc{border-top:3px solid var(--line);border-radius:3px 3px 9px 9px;padding-top:2px}
.acc-manteau{border-top-color:#5b6fd6}
.acc-veste{border-top-color:#1f9e8a}
.acc-chaussures{border-top-color:#e08a1e}
.outfit .acc .th{width:100%;height:54px}
.thermal-line{margin:-4px 0 6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{display:flex;gap:6px;margin-top:10px;overflow:hidden}
.strip .th{width:56px;height:70px;border-radius:9px;background:var(--sunk);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.strip .th img{width:100%;height:100%;object-fit:contain}
.strip .th.dirty img{opacity:.35}
.warnline{color:var(--warn);font-size:13px;font-weight:600;margin-top:8px}

.group-title{font-family:var(--display);font-size:19px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 12px}

/* Bottom nav */
.tabbar.hidden-for-now{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:640px;height:var(--nav-h)}
.tabbar li{flex:1}
.tabbar button{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--denim)}
.tabbar button:disabled{opacity:.45;cursor:default}

/* Sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;margin:auto auto 0;overflow:hidden}
@media (min-width:600px){dialog{border-radius:22px;margin:auto}}
dialog::backdrop{background:rgba(10,14,22,.5)}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-scroll{overflow-y:auto;padding:20px 18px 8px}
.sheet h2{font-size:22px;font-weight:700;margin-bottom:14px}
.sheet-actions .btn{padding:11px 12px;min-width:0}
.del-link{color:var(--warn);display:block;margin:4px 0 12px}
.sheet-actions .btn.grow{flex:1 1 0}
.sheet-actions{display:flex;gap:8px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.field{display:block;margin-bottom:16px}
.field > span,.legend{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px}
fieldset{border:0;margin:0 0 16px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.photo-drop{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--sunk);border:1px dashed var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden;cursor:pointer;position:relative}
.photo-drop img{width:100%;height:100%;object-fit:contain}
.photo-drop .busy{position:absolute;inset:auto 10px 10px auto;background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--sunk);border-radius:12px;margin-bottom:16px;font-weight:600;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--denim)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{position:relative;display:block;cursor:pointer}
.pick input{position:absolute;opacity:0}
.pick .box{display:block;border:2px solid transparent;border-radius:12px;background:var(--sunk);overflow:hidden}
.pick .box .ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.pick .box img{width:100%;height:100%;object-fit:contain}
.pick .box .l{display:block;font-size:12px;font-weight:600;padding:3px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick input:checked + .box{border-color:var(--denim);background:var(--denim-soft)}
.pick input:focus-visible + .box{outline:2px solid var(--denim);outline-offset:2px}

.photo-btns{display:flex;gap:8px;margin:-6px 0 12px}
.photo-btns .btn{flex:1;text-align:center;position:relative;cursor:pointer}
.photo-drop{cursor:default}
.checker{background-color:var(--sunk);background-image:conic-gradient(var(--line) 25%,transparent 0 50%,var(--line) 0 75%,transparent 0);background-size:18px 18px}
.cut-tools{margin:-8px 0 12px}
.sil-wrap{background:var(--sunk);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;box-sizing:content-box;height:var(--silh, 58vh)}
.sil-wrap .sil{flex:none}
.sil{position:relative;margin:0 auto;container-type:inline-size}
.sil .legs{position:absolute;border:0;background:none;padding:0;cursor:pointer}
.sil .legs svg{display:block}
.sil .head{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.sil img{position:absolute;max-width:none;object-fit:fill}
.sil .part{position:absolute;overflow:hidden}
.sil .sh{position:absolute;filter:drop-shadow(0 0 2px rgba(0,0,0,.35))}
.sil .mk{position:absolute;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.sil-wrap .strip{margin-top:12px}
#cam{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#000;color:#fff}
#cam::backdrop{background:#000}
.cam{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cam-top{display:flex;align-items:center;gap:8px;padding:10px 10px 8px}
.cam-x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px}
.cam-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cam-cats::-webkit-scrollbar{display:none}
.cam-cats .chip-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;white-space:nowrap}
.cam-cats .chip-btn[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.cam-box{position:relative;width:min(100vw, calc((100dvh - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .75));aspect-ratio:3/4;margin:0 auto;background:#111;overflow:hidden}
.cam-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-guide,.cam-guide svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-tip{text-align:center;font-size:14px;margin:10px 16px 0;color:rgba(255,255,255,.85)}
.cam-bottom{flex:1;display:flex;align-items:center;justify-content:center;min-height:96px}
.cam-shot{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);padding:0}
.cam-shot:active{background:#fff}
.cam-shot:disabled{opacity:.4}
.cam-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-size:15px}
.version{text-align:center;font-size:12px;color:var(--muted);margin:28px 0 0}
#retouch{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#0d1117;color:#fff}
#retouch::backdrop{background:#000}
.rt{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px}
.rt-top strong{font-family:var(--display);font-size:18px}
.rt-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px}
.rt-box{position:relative;background:conic-gradient(#2a3140 25%,#1c2230 0 50%,#2a3140 0 75%,#1c2230 0) 0 0/18px 18px}
.rt-box canvas{position:absolute;inset:0;width:100%;height:100%}
.rt-mask{opacity:.6;touch-action:none;cursor:crosshair}
.rt-tools{padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
.rt-tools .seg{background:rgba(255,255,255,.08);border-color:transparent}
.rt-tools .seg button{color:rgba(255,255,255,.7)}
.rt-tools .seg button[aria-current="true"]{background:#fff;color:#111}
.rt-row{display:flex;gap:6px;flex-wrap:wrap}
.rt-row .chip-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.rt-row .chip-btn[aria-pressed="true"]{background:#fff;color:#111}
.rt-hint{margin:0;font-size:13px;color:rgba(255,255,255,.7)}
.cut-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.carousel{display:flex;align-items:stretch;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -16px 0;padding:0 16px 4px;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.carousel .slide{flex:0 0 calc((100vw - 40px) / 2);scroll-snap-align:center;margin-top:0;padding:12px;transition:opacity .25s,transform .25s;opacity:.55;transform:scale(.94)}
.carousel .slide.center{opacity:1;transform:none}
.carousel .slide h2{font-size:18px}
.carousel .slide .why{font-size:12px;margin-bottom:8px}
.carousel .slide .best{font-size:11px;padding:2px 7px}
.carousel .slide .btn{font-size:14px;padding:9px 10px}
.carousel .slide .chip-btn{font-size:12px;padding:5px 9px}
.carousel .slide .sil-wrap{padding:8px 6px}
.carousel .slide{--silh:30vh;height:calc(var(--silh) + 248px);box-sizing:border-box}
.shuffle-card{--silh:30vh}
.best{font-size:12px;font-weight:600;color:var(--denim);background:var(--denim-soft);border-radius:99px;padding:3px 9px;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.dot.on{width:20px;border-radius:4px;background:var(--denim)}
.swipe-hint{text-align:center;margin:8px 0 0}
.backup{margin-top:28px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.backup h3{font-size:17px;margin-bottom:6px}
.backup .hint{margin:0 0 12px}
.backup .btn{position:relative;cursor:pointer}
.adjust{margin-top:8px;padding:10px 12px;background:var(--sunk);border-radius:12px}
.adj-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.adj-name{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adj-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600;line-height:1}
.adj-val{width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.shuffle-btn{width:100%;margin:0 0 14px;font-size:16px}
.shuffle-card{margin:0 0 18px;border:2px solid var(--denim)}

const LS_KEY = 'garde-robe-v1';

/* Stockage dans le téléphone (IndexedDB) : une fiche par pièce et par tenue.
   Modifier une pièce ne réécrit qu'elle, même avec des centaines de pièces. */
const idb = {
  open(){
    if(this._p) return this._p;
    this._p = new Promise((res, rej) => {
      const r = indexedDB.open('garde-robe', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if(!db.objectStoreNames.contains('pieces')) db.createObjectStore('pieces', {keyPath:'id'});
        if(!db.objectStoreNames.contains('outfits')) db.createObjectStore('outfits', {keyPath:'id'});
      };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._p;
  },
  async req(storeName, mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(storeName, mode), st = tx.objectStore(storeName), q = fn(st);
      tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  getAll(name){ return this.req(name, 'readonly', st => st.getAll()); },
  getKv(key){ return this.req('kv', 'readonly', st => st.get(key)); },
  put(name, v){ return this.req(name, 'readwrite', st => st.put(v)); },
  del(name, id){ return this.req(name, 'readwrite', st => st.delete(id)); },
  putKv(key, v){ return this.req('kv', 'readwrite', st => st.put(v, key)); },
  delKv(key){ return this.req('kv', 'readwrite', st => st.delete(key)); },
  async load(){
    let pieces = await this.getAll('pieces'), outfits = await this.getAll('outfits');
    let settings = await this.getKv('settings');
    // Ancien format (versions 1 à 20) : tout dans un seul bloc « state » → on le répartit une fois
    const legacy = await this.getKv('state');
    if(legacy && !pieces.length && !outfits.length){
      pieces = legacy.pieces || []; outfits = legacy.outfits || []; settings = legacy.settings || {};
      for(const pc of pieces) await this.put('pieces', pc);
      for(const o of outfits) await this.put('outfits', o);
      await this.putKv('settings', settings);
      await this.delKv('state');
    }
    return {pieces, outfits, settings: settings || {}};
  },
};
const store = {
  mode:'local', base:null, assets:null,
  async init(){
    let db=null, user=null, assets=null;
    if(window.claude && typeof window.claude.use === 'function'){
      try{ [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]); }catch(e){}
    }
    this.assets = assets;
    if(db && user){
      let id = null;
      try{ id = await user.id(); }catch(e){}
      if(id){
        this.mode = 'db';
        this.base = db.doc('data/users/' + id + '/wardrobe');
        let pending = 3;
        const done = () => { if(--pending === 0){ S.ready = true; render(); } };
        const onErr = e => { if(e && e.code === 'revoked') toast("L'accès aux données a été retiré."); };
        let first1=true, first2=true, first3=true;
        this.base.collection('pieces').onSnapshot(snap => {
          S.pieces = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
          if(first1){ first1=false; done(); } else render();
        }, onErr);
        this.base.collection('outfits').onSnapshot(snap => {
          S.outfits = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
          if(first2){ first2=false; done(); } else render();
        }, onErr);
        this.base.collection('meta').doc('settings').onSnapshot(d => {
          S.settings = d.exists ? {...d.data()} : {};
          if(first3){ first3=false; done(); } else render();
        }, onErr);
        return;
      }
    }
    this.mode = 'local';
    let j = null;
    try{ j = await idb.load(); }catch(e){ console.warn(e); }
    if(!j || (!j.pieces.length && !j.outfits.length)){
      try{ const raw = localStorage.getItem(LS_KEY); if(raw){ j = JSON.parse(raw); this.writeAllLocal(j); localStorage.removeItem(LS_KEY); } }catch(e){}
    }
    if(j){
      (j.pieces||[]).forEach(p => S.pieces.set(p.id, p));
      (j.outfits||[]).forEach(o => S.outfits.set(o.id, o));
      S.settings = j.settings || {};
    }
    let migrated = false;
    for(const pc of S.pieces.values()){ if(pc.category === 'bas'){ pc.category = 'pantalon'; migrated = true; } }
    S.ready = true; render();
    if(migrated) for(const pc of S.pieces.values()) this.local('put', 'pieces', pc);
  },
  local(op, name, v){
    const job = op === 'put' ? idb.put(name, v) : op === 'del' ? idb.del(name, v) : idb.putKv('settings', v);
    job.catch(e => {
      console.warn(e);
      toast(e && e.name === 'QuotaExceededError' ? "Le téléphone n'a plus de place : libère de l'espace." : "Enregistrement impossible, réessaie.");
    });
  },
  writeAllLocal(j){
    (j.pieces || []).forEach(pc => this.local('put', 'pieces', pc));
    (j.outfits || []).forEach(o => this.local('put', 'outfits', o));
    this.local('kv', 'settings', j.settings || {});
  },
  async write(fn){
    try{ await fn(); }
    catch(e){
      if(e && e.code === 'quota_exceeded') toast("Espace de stockage plein.");
      else toast("Enregistrement impossible, réessaie.");
    }
  },
  savePiece(p){
    S.pieces.set(p.id, p); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('pieces').doc(p.id).set(p));
    this.local('put', 'pieces', p);
  },
  deletePiece(id){
    const p = S.pieces.get(id);
    S.pieces.delete(id);
    for(const o of S.outfits.values()){
      if((o.pieceIds||[]).includes(id)) this.saveOutfit({...o, pieceIds:o.pieceIds.filter(x => x !== id)});
    }
    render();
    if(p && p.photo && p.photo.assetId && this.assets){ this.assets.delete(p.photo.assetId).catch(()=>{}); }
    if(this.mode === 'db') return this.write(() => this.base.collection('pieces').doc(id).delete());
    this.local('del', 'pieces', id);
  },
  saveOutfit(o){
    S.outfits.set(o.id, o); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('outfits').doc(o.id).set(o));
    this.local('put', 'outfits', o);
  },
  deleteOutfit(id){
    S.outfits.delete(id); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('outfits').doc(id).delete());
    this.local('del', 'outfits', id);
  },
  saveSettings(patch){
    S.settings = {...S.settings, ...patch}; render();
    if(this.mode === 'db') return this.write(() => this.base.collection('meta').doc('settings').set(S.settings));
    this.local('kv', 'settings', S.settings);
  },
};

/* ---------- Photos ---------- */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); setTimeout(()=>URL.revokeObjectURL(url), 1000); };
    img.onerror = rej; img.src = url;
  });
}
function drawScaled(img, max){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const r = Math.min(1, max / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.round(iw * r); c.height = Math.round(ih * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function processPhoto(fileOrImg){
  const img = fileOrImg instanceof Blob ? await loadImage(fileOrImg) : fileOrImg;
  if(store.assets){
    try{
      const c = drawScaled(img, 1000);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.84));
      const res = await store.assets.upload(blob, {type:'image/jpeg'});
      return {assetId: res.id};
    }catch(e){ /* repli ci-dessous */ }
  }
  return {dataUrl: drawScaled(img, store.mode === 'local' ? 800 : 480).toDataURL('image/jpeg', store.mode === 'local' ? 0.8 : 0.74)};
}

/* ---------- Détourage ----------
   Photo prise dans l'app : le contour sert de guide.
   - loin à l'extérieur du contour : forcément du fond ;
   - bien à l'intérieur : forcément le vêtement (ombres comprises) ;
   - entre les deux : on compare la couleur du pixel aux couleurs du fond
     et à celles du vêtement, avec un bonus selon qu'on est dedans ou dehors.
   Ensuite : on retire les taches isolées et on bouche les trous (ombres, reflets).
   Photo de l'album : on part des bords de la photo, puis même nettoyage. */
function distMap(src, W, H){
  const N = W * H, d = new Float32Array(N), INF = 1e9, D = 1.4142;
  for(let i = 0; i < N; i++) d[i] = src[i] ? 0 : INF;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){

  if(IA.lib) return Promise.resolve(IA.lib);

    IA.loading = new Promise((res, rej) => {
      const sc = document.createElement('script'); sc.src = './detourage-ia.js';
      sc.onload = () => window.DetourageIA ? res(IA.lib = window.DetourageIA) : rej(new Error('module IA absent'));
      sc.onerror = () => rej(new Error('detourage-ia.js introuvable'));

    const a = new Float32Array(N); for(let p = 0; p < N; p++) a[p] = d[p*4+ch] * inner[p];

    if(!alpha[p] || inner[p]) continue;

  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1); x1 = Math.min(W - 1, x1 + 1); y1 = Math.min(H - 1, y1 + 1);

  if(!url.startsWith('data:image/webp')) url = out.toDataURL('image/png');

/* ---------- Suggestion ---------- */
/* ---------- Journal du porté ----------
   Chaque soir (ou quand tu veux), tu dis ce que tu as porté et si tu as eu froid ou chaud.
   L'app garde la météo du jour avec. Ensuite, pour chaque tenue (ou à défaut chaque pièce),
   elle estime la température où tu es bien : porté à 12° avec « j'ai eu froid » ⇒ plutôt faite
   pour ~18° ; « parfait » ⇒ ~12°. Les propositions privilégient ce qui colle à la température du jour. */
const FEELS = [['froid', '🥶', "J'ai eu froid", -2], ['frais', '😬', 'Un peu froid', -1], ['parfait', '🙂', 'Parfait', 0], ['tiede', '😅', 'Un peu chaud', 1], ['chaud', '🥵', "J'ai eu chaud", 2]];
const feelVal = id => (FEELS.find(f => f[0] === id) || [0, 0, 0, 0])[3];
const logsOf = () => S.settings.wearLog || [];
const dayTemp = w => w ? (w.feelMax != null ? (w.feelMax + w.feelMin) / 2 * 0.5 + (w.max + w.min) / 2 * 0.5 : (w.max + w.min) / 2) : null;
function comfortTemp(pieceIds){
  // température « idéale » estimée d'après les retours : tenue identique d'abord, sinon pièces en commun
  // la chaleur vient surtout des hauts : on compare les hauts entre eux (le pantalon et les chaussures changent peu)
  const topsOf = ids => ids.filter(id => { const p = S.pieces.get(id); return p && (LAYER[p.category] in LAYER_RANK); });
  const logs = logsOf().filter(l => l.temp != null && l.feel), set = new Set(pieceIds), tops = new Set(topsOf(pieceIds));
  const est = l => l.temp - feelVal(l.feel) * 4;
  const same = logs.filter(l => l.pieceIds.length === set.size && l.pieceIds.every(id => set.has(id)));
  if(same.length) return {t: same.reduce((a, l) => a + est(l), 0) / same.length, n: same.length, exact: true};
  let wsum = 0, tsum = 0;
  for(const l of logs){
    const lt = topsOf(l.pieceIds); if(!lt.length || !tops.size) continue;
    const common = lt.filter(id => tops.has(id)).length; if(!common) continue;
    const wgt = common / Math.max(tops.size, lt.length);
    if(wgt < 0.5) continue;
    wsum += wgt; tsum += wgt * est(l);
  }
  return wsum ? {t: tsum / wsum, n: wsum, exact: false} : null;
}
/* Une TENUE = le bas + ce qu'on porte sous une veste ou un manteau (t-shirt, pull, sweat,
   t-shirt + chemise ouverte, gilet…). La veste ou le manteau, et les chaussures, sont des
   ACCOMPAGNEMENTS choisis chaque jour selon la météo : plusieurs vestes vont avec la même tenue. */
const isExtraCat = c => c === 'veste' || c === 'manteau' || c === 'chaussures' || c === 'sous_pull' || c === 'collant';
/* Sous un pull ou un sweat, le t-shirt ne se voit pas : il ne fait pas partie de la tenue,
   il se choisit chaque jour (parmi ceux associés à la tenue, sinon n'importe quel t-shirt propre). */
/* Le t-shirt sous un pull, un sweat ou une chemise ne fait pas partie de l'identité de la tenue :
   « chemise + pantalon » est UNE tenue, quel que soit le t-shirt dessous.
   - pull / sweat : le t-shirt est caché, l'app le choisit (parmi ceux portés avec ce bas) ;
   - chemise : il se voit quand elle est ouverte, donc ce sont les t-shirts que tu as associés à la tenue
     (cochés avec la chemise dans l'éditeur), et tu peux le changer dans la carte du jour. */

const baseIds = ids => (ids || []).filter(id => { const p = S.pieces.get(id); return p && !isExtraCat(p.category); });
const hidesUnder = ids => baseIds(ids).some(id => HIDING.has(S.pieces.get(id).category));
const coreIds = ids => { const b = baseIds(ids); return hidesUnder(b) ? b.filter(id => !UNDER_CATS.has(S.pieces.get(id).category)) : b; };   // ce qui se voit
const hiddenIds = ids => { const b = baseIds(ids); return hidesUnder(b) ? b.filter(id => UNDER_CATS.has(S.pieces.get(id).category)) : []; };
const groupKey = id => { const p = S.pieces.get(id); return p ? (p.group || p.id) : id; };
const sameOutfitKey = ids => coreIds(ids).map(groupKey).sort().join('|');
/* Variantes : une tenue avec « t-shirt blanc » veut dire « l'un de mes t-shirts blancs ».
   Au moment de proposer, l'app prend la variante (propre) qui colle le mieux à la température :
   chaque variante a sa propre chaleur, apprise avec tes retours. */
function variantsOf(id){
  const p = S.pieces.get(id); if(!p) return [];
  return p.group ? [...S.pieces.values()].filter(q => (q.group || q.id) === p.group) : [p];
}
function resolveCore(o, w){

  let combos = [[]];
  for(const sl of slots){ const next = []; for(const c of combos) for(const p of sl) next.push([...c, p.id]); combos = next.slice(0, 24); }
  let best = null, bestCost = Infinity;

    const cost = Math.abs(T - idealTemp([...c, ex.under, ex.outer, ...(ex.thermal || [])].filter(Boolean)).t);
    if(cost < bestCost - 0.01){ bestCost = cost; best = c; }
  }

/* ---------- Chaleur de chaque pièce ----------
   Chaque haut (t-shirt, chemise, pull, sweat, gilet, veste, manteau) a une « chaleur » en degrés :
   ce qu'il retranche à la température où tu es bien. Avec juste un t-shirt, tu es bien vers 24° ;
   t-shirt + pull + manteau ≈ 24 − (0 + 6 + 10) = 8°.
   Au départ, chaque pièce a la chaleur type de sa catégorie. Chaque journée notée est une équation :
   « ces hauts, à T°, ressenti R » ⇒ la somme de leurs chaleurs ≈ 24 − T − 4×R (R : −2 froid … +2 chaud).
   Avec les journées qui s'accumulent (même tenue avec ou sans manteau, à d'autres températures…),
   l'app ajuste la chaleur de chaque pièce pour coller au mieux à tous tes retours (moindres carrés,

const BASE_T = 25.5;   // t-shirt + short ≈ 25,5° ; t-shirt + pantalon ≈ 24°

const isTop = p => p && ((LAYER[p.category] in LAYER_RANK) || ['pantalon', 'short', 'bas', 'sous_pull', 'collant'].includes(p.category));   // hauts + bas (pas les chaussures)
const hasHood = p => !!p && (HOODED.has(p.category) || !!(p.photo && p.photo.cut && p.photo.cut.meta && p.photo.cut.meta.hood > 0));
function warmModel(){
  const logs = logsOf().filter(l => l.temp != null && l.feel);
  const sig = logs.length + '|' + logs.map(l => l.date + l.feel + l.pieceIds.length).join(',') + '|' + S.pieces.size;
  if(S._warm && S._warm.sig === sig) return S._warm;
  const w = {}, n = {};
  for(const p of S.pieces.values()) if(isTop(p)){ w[p.id] = WARM_PRIOR[p.category] ?? 3; n[p.id] = 0; }
  const rows = logs.map(l => ({ids:l.pieceIds.filter(id => id in w), y:BASE_T - l.temp + 4 * feelVal(l.feel)})).filter(r => r.ids.length);
  rows.forEach(r => r.ids.forEach(id => n[id]++));
  const LAMBDA = 1.5;   // poids de la valeur type (≈ 1,5 journée « fictive »)
  for(let it = 0; it < 60; it++){   // Gauss-Seidel sur (AᵀA + λI) w = Aᵀy + λ·w₀
    for(const id of Object.keys(w)){
      const prior = WARM_PRIOR[S.pieces.get(id).category] ?? 3;
      let num = LAMBDA * prior, den = LAMBDA;
      for(const r of rows){ if(!r.ids.includes(id)) continue; const others = r.ids.reduce((a, j) => a + (j === id ? 0 : w[j]), 0); num += r.y - others; den += 1; }

function idealTemp(ids){

/* t-shirts qu'on peut mettre sous le pull / sweat d'une tenue : ceux que tu portes déjà avec ce bas */
function underCandidates(o){
  if(isShirtOnly(o.pieceIds)) return (o.under || []).map(id => S.pieces.get(id)).filter(p => p && !p.dirty);   // chemise : tes t-shirts associés
  const bottoms = baseIds(o.pieceIds).filter(id => LAYER[S.pieces.get(id).category] === 'bottom');
  const ids = new Set(o.under || []);
  for(const x of S.outfits.values()) if(x.id !== o.id && baseIds(x.pieceIds).some(id => bottoms.includes(id)))
    [...baseIds(x.pieceIds), ...(x.under || []).filter(id => S.pieces.has(id))].forEach(id => { if(UNDER_CATS.has(S.pieces.get(id).category)) ids.add(id); });   // y compris les t-shirts sous une chemise
  const own = [...ids].map(id => S.pieces.get(id)).filter(p => p && !p.dirty);

function chooseExtras(o, w){
  const allowed = new Set(allowedOf(o));
  const clean = [...S.pieces.values()].filter(p => !p.dirty && allowed.has(p.id));
  const lru = list => list.slice().sort((a, b) => (lastWornKey(a.id) < lastWornKey(b.id) ? -1 : 1));
  const band = w && w.band, rain = !!(w && w.rain);
  const outers = clean.filter(p => p.category === 'veste' || p.category === 'manteau');

  const shirtOnly = o && isShirtOnly(o.pieceIds) && !underCandidates(o).length;   // chemise sans t-shirt associé : portée seule
  const unders = o && hidesUnder(o.pieceIds) ? [...(shirtOnly ? [null] : []), ...lru(underCandidates(o))] : [];   // sous une chemise : « sans t-shirt » est possible
  let under = unders[0] || null;
  const need = band === 'froid' ? 'manteau' : band === 'frais' ? 'veste' : (rain && band !== 'chaud') ? 'veste' : null;
  let outer = null;

  if(T != null && o){
    // on essaie chaque t-shirt dessous possible × « sans dessus » / chaque veste / manteau associé :
    // on garde la combinaison qui colle le mieux à la température (à égalité, la moins portée récemment)
    let best = Infinity;
    for(const u of (unders.length ? unders : [null])) for(const c of [null, ...lru(outers)]){

function extrasFor(o, w){ const ov = (S.cardExtras || {})[o.id]; return ov ? {...chooseExtras(o, w), ...ov} : chooseExtras(o, w); }
/* une manche longue qui couvre le sous-pull : t-shirt manches longues, chemise, pull, sweat, gilet (pas la veste ni le manteau, qu'on enlève) */
const LONG_COVER = new Set(['tshirt_ml', 'chemise', 'pull', 'sweat', 'sweat_capuche', 'gilet', 'gilet_capuche']);

/* Anciennes tenues : on sort la veste, le manteau et les chaussures (gardés comme préférences) */

    items.push({head:true, emoji:HEADS[(hsh + ((S.headBy || {})[cardKey] || 0)) % HEADS.length], x:hx - hs / 2, y:hy, w:hs, h:hs, z:90});
  }
  const minX = Math.min(...items.map(it => it.x)), maxX = Math.max(...items.map(it => it.x + it.w));
  const minY = Math.min(0, ...items.map(it => it.y)), maxY = Math.max(...items.map(it => it.y + it.h));
  const TW = maxX - minX, TH = maxY - minY;
  const ratio = TW / TH;
  const imgs = items.sort((a,b) => a.z - b.z).map(it => {
    const clip = it.clip ? `clip-path:${it.clip};-webkit-clip-path:${it.clip};` : '';
    const pos = `left:${((it.x-minX)/TW*100).toFixed(2)}%;top:${((it.y-minY)/TH*100).toFixed(2)}%;width:${(it.w/TW*100).toFixed(2)}%;height:${(it.h/TH*100).toFixed(2)}%;`;
    if(it.legs) return `<button type="button" class="legs" data-act="legs" aria-label="Jambes : ${it.animal.name} — toucher pour changer" style="${pos}">${legsSVG(it.animal, it.w, it.h, it.legList)}</button>`;
    if(it.head) return `<button type="button" class="head" data-act="head" data-key="${esc(cardKey || '')}" aria-label="Changer de tête" style="${pos}font-size:${(it.h / TW * 100).toFixed(2)}cqw">${it.emoji}</button>`;
    if(it.part){
      const pt = it.part;
      return `<div class="part" style="${pos}"><img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:${(-pt.x/pt.w*100).toFixed(2)}%;top:${(-pt.y/pt.h*100).toFixed(2)}%;width:${(100/pt.w).toFixed(2)}%;height:${(100/pt.h).toFixed(2)}%"></div>`;
    }
    const rot = (it.tf ? `transform:${it.tf};transform-origin:${it.origin};` : '') + (it.dark ? 'filter:brightness(.4);' : '');
    if(it.mask){
      // Haut du dessous : découpé à la silhouette de la pièce extérieure (masque)
      const m = it.mask, mp = `left:${((m.x-minX)/TW*100).toFixed(2)}%;top:${((m.y-minY)/TH*100).toFixed(2)}%;width:${(m.w/TW*100).toFixed(2)}%;height:${(m.h/TH*100).toFixed(2)}%;`;
      const mi = `url('${esc(m.url)}')`;
      return `<div class="mk" style="${mp}-webkit-mask-image:${mi};mask-image:${mi};"><img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:${((it.x-m.x)/m.w*100).toFixed(2)}%;top:${((it.y-m.y)/m.h*100).toFixed(2)}%;width:${(it.w/m.w*100).toFixed(2)}%;height:${(it.h/m.h*100).toFixed(2)}%;${clip}${rot}"></div>`;
    }
    if(it.shadow) return `<div class="sh" style="${pos}"><img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:0;top:0;width:100%;height:100%;${clip}${rot}"></div>`;
    return `<img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:${((it.x-minX)/TW*100).toFixed(2)}%;top:${((it.y-minY)/TH*100).toFixed(2)}%;width:${(it.w/TW*100).toFixed(2)}%;height:${(it.h/TH*100).toFixed(2)}%;${clip}${rot}">`;
  }).join('');
  const acc = pcs.filter(p => L(p) === 'acc');
  return `<div class="sil-wrap"><div class="sil" style="aspect-ratio:${TW.toFixed(4)}/${TH.toFixed(4)};width:min(100%, calc(var(--silh, 58vh) * ${ratio.toFixed(4)}))">${imgs}</div>
    ${acc.length ? `<div class="strip" style="justify-content:center">${acc.map(p => `<div class="th">${thumbSrc(p)?`<img src="${esc(thumbSrc(p))}" alt="${esc(p.name)}">`:ICON.hanger}</div>`).join('')}</div>` : ''}</div>`;
}

function openMode(){
  if(S.settings.openMode) return S.settings.openMode;
  return S.settings.jacketSide ? 'side' : 'open';
}
function withAdj(pcs, adj){ return pcs.map(p => ({...p, sizeAdj:(adj && adj[p.id]) || 1})); }
function lookView(pcs, opts){
  const rk = p => TOP_RANK[p.category] ?? 0;
  const tops = pcs.filter(p => p.category in TOP_RANK);
  const visibleOpen = p => OPEN_FRONT.has(p.category) && tops.some(q => rk(q) < rk(p)) && !tops.some(q => rk(q) > rk(p) && !OPEN_FRONT.has(q.category));   // pas cachée sous un pull fermé
  const opener = tops.find(visibleOpen);
  const cardKey = pcs.map(p => p.id).join('|');
  const mode = (S.openBy && S.openBy[cardKey]) || (openMode() === 'closed' ? 'closed' : 'open');
  const sil = silhouette(pcs, mode, cardKey);
  if(sil){
    const nm = opener ? catLabel(opener.category).toLowerCase() : '';
    const fem = opener && ['chemise','veste'].includes(opener.category);
    // plusieurs pièces qui s'ouvrent (chemise sous une veste…) : trois choix
    const openersAll = tops.filter(visibleOpen).sort((a, b) => rk(a) - rk(b));
    const outerName = openersAll.length ? catLabel(openersAll[openersAll.length - 1].category).toLowerCase().replace('gilet zippé à capuche', 'gilet').replace('gilet zippé', 'gilet') : '';
    const choices = openersAll.length > 1
      ? [['closed', 'Rien'], ['outer', outerName.charAt(0).toUpperCase() + outerName.slice(1)], ['open', 'Tout']]
      : [['open', fem ? 'Ouverte' : 'Ouvert'], ['closed', fem ? 'Fermée' : 'Fermé']];
    const toggle = opener ? `<div class="band-row open-row" style="margin:0 0 10px" role="group" aria-label="Porter la ${esc(nm)}">${openersAll.length > 1 ? '<span class="open-l">Ouvrir</span>' : ''}
      ${choices.map(([m, l]) =>
        `<button type="button" class="chip-btn" data-act="openmode" data-mode="${m}" data-key="${esc(cardKey)}" aria-pressed="${mode === m}">${l}</button>`).join('')}</div>` : '<div class="band-row toggle-ph" aria-hidden="true" style="margin:0 0 10px"><span class="chip-btn">·</span></div>';
    // Réglage de la taille de chaque pièce dans la tenue (mémorisé sur la pièce, donc valable partout)
    const key = pcs.map(p => p.id).join('|');
    const sized = pcs.filter(p => p.photo && p.photo.cut && LAYER[p.category] !== 'acc');
    if(opts && opts.bare) return '<div class="band-row toggle-ph" aria-hidden="true" style="margin:0 0 10px"><span class="chip-btn">·</span></div>' + sil;   // même hauteur que les propositions
    if(opts && opts.controls) return toggle;
    if(!(opts && opts.adjust)) return toggle + sil;
    const panel = S.adjustKey === key ? `<div class="adjust">
      ${sized.map(p => `<div class="adj-row"><span class="adj-name">${esc(plabel(p))}</span>
        <button type="button" class="adj-btn" data-act="size" data-id="${esc(p.id)}" data-d="-1" aria-label="Plus petit">−</button>
        <span class="adj-val">${Math.round((p.sizeAdj || 1) * 100)} %</span>
        <button type="button" class="adj-btn" data-act="size" data-id="${esc(p.id)}" data-d="1" aria-label="Plus grand">+</button></div>`).join('')}
      <button type="button" class="btn" data-act="size-reset" style="margin-top:8px;width:100%">Tout remettre à 100 %</button>
      <p class="hint" style="margin:8px 0 0">Ces tailles ne valent que pour cette tenue au hasard (et la suivent si tu la valides).</p></div>` : '';
    const adjBtn = `<button type="button" class="linkish" data-act="adjust" data-key="${esc(key)}">${S.adjustKey === key ? 'Terminer le réglage des tailles' : 'Ajuster les tailles'}</button>`;
    if(opts && opts.panelOnly) return panel;
    if(opts && opts.adjustOnly) return adjBtn + panel;
    return toggle + sil + adjBtn + panel;
  }
  const missing = pcs.filter(p => LAYER[p.category] !== 'acc' && !(p.photo && p.photo.cut)).length;
  return lookGrid(pcs) + (missing ? `<p class="hint" style="margin:10px 0 0">Pour voir la tenue assemblée, détoure la photo de ${missing} pièce${missing>1?'s':''} (onglet Pièces).</p>` : '');
}

/* ---------- Tenue au hasard ----------
   Compose une tenue plausible avec des pièces propres, selon la météo du jour choisi :
   un haut de base, un bas, des chaussures, et des couches en plus quand il fait frais ou froid. */
function randomOutfit(locked){
  const existing = new Set([...S.outfits.values()].map(o => coreIds(o.pieceIds).slice().sort().join('|')));
  let ids = null;
  for(let t = 0; t < 40; t++){
    ids = randomOutfitOnce(locked);
    if(!ids || !existing.has(coreIds(ids).slice().sort().join('|'))){ S.shuffleDup = false; return ids; }
  }
  S.shuffleDup = true;   // toutes les combinaisons possibles existent déjà (souvent à cause des verrous)
  return ids;
}
function randomOutfitOnce(locked){
  const clean = [...S.pieces.values()].filter(p => !p.dirty && p.photo && p.photo.cut);
  const of = (...cats) => clean.filter(p => cats.includes(p.category));
  const pick = arr => arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;
  const chance = x => Math.random() < x;
  const w = S.shuffleWx ? {...S.shuffleWx} : tomorrowWeather(), band = (w && w.band) || pick(['frais', 'doux']);
  const ids = [];
  // haut de base
  let base = band === 'chaud' ? pick(of('tshirt')) || pick(of('tshirt_ml', 'chemise'))
           : band === 'froid' ? pick(of('tshirt_ml', 'tshirt', 'chemise')) : pick(of('tshirt', 'tshirt_ml', 'chemise'));
  if(!base) base = pick(of('pull', 'sweat', 'sweat_capuche'));
  if(!base) return null;
  ids.push(base.id);
  // bas
  const pants = of('pantalon'), shorts = of('short');
  const bottom = band === 'chaud' && shorts.length && (chance(0.7) || !pants.length) ? pick(shorts) : pick(pants) || pick(shorts);
  if(!bottom) return null;
  ids.push(bottom.id);
  // couches selon la météo
  const mids = of('pull', 'sweat', 'sweat_capuche', 'gilet', 'gilet_capuche').filter(p => p.id !== base.id);
  const overshirt = base.category !== 'chemise' ? of('chemise') : [];
  const outers = band === 'froid' ? (of('manteau').length ? of('manteau') : of('veste')) : of('veste');
  if(band === 'froid'){
    const o = pick(outers); if(o) ids.push(o.id);
    if(chance(0.6)){ const m = pick(mids); if(m) ids.push(m.id); }
  } else if(band === 'frais'){
    const m = chance(0.65) ? pick(mids) : null; if(m) ids.push(m.id);
    if(!m || chance(0.35)){ const o = pick(of('veste')) || pick(overshirt); if(o) ids.push(o.id); }
  } else if(band === 'doux'){
    if(chance(0.45)){ const o = pick([...overshirt, ...of('gilet', 'gilet_capuche', 'veste')]); if(o) ids.push(o.id); }
  }
  // pluie : un manteau ou une veste si possible
  if(w && w.rain && !ids.some(id => ['manteau', 'veste'].includes(S.pieces.get(id).category))){
    const o = pick(of('manteau', 'veste')); if(o && band !== 'chaud') ids.push(o.id);
  }
  const shoes = pick(of('chaussures')); if(shoes) ids.push(shoes.id);
  // pièces verrouillées : elles restent, et remplacent ce qui occupait la même place (haut, bas, couche…)
  if(locked && locked.size){
    const slot = id => { const p = S.pieces.get(id); return p ? (LAYER[p.category] || 'acc') : 'acc'; };
    const lockedIds = [...locked].filter(id => S.pieces.has(id));
    const taken = new Set(lockedIds.map(slot));
    return [...lockedIds, ...ids.filter(id => !locked.has(id) && !taken.has(slot(id)))];
  }
  return ids;
}

      <div class="side-list">${pcs.map(p => { const on = S.shuffleLocks && S.shuffleLocks.has(p.id);
        return `<div class="lock-row"><button type="button" class="side-row${on ? ' on' : ''}" data-act="lock" data-id="${esc(p.id)}" aria-pressed="${!!on}"><span class="sr-ico">${on ? '🔒' : '🔓'}</span><span class="sr-name">${esc(plabel(p))}</span></button><button type="button" class="miss-x" data-act="shuffle-del" data-id="${esc(p.id)}" aria-label="Retirer cette pièce">×</button></div>`; }).join('')}</div>

      ${lookView(pcs, {adjust:true, adjustOnly:true})}
    </article>`;
  return pairRow(left, right, 'shuffle-pair');
}
/* Tenues prévues (aujourd'hui, demain) : la tenue + une carte pour cocher ce qui part au sale */
function missedDays(){
  // tenues prévues les 7 derniers jours, jamais notées
  const plans = plansOf(), logs = logsOf(), out = [];
  // aujourd'hui, à partir de 17 h, si aucune tenue n'était prévue (sinon le ressenti se note dans sa carte)
  const k0 = keyIn(0);
  if(new Date().getHours() >= 17 && !plans[k0] && !logs.some(l => l.date === k0) && !(S.settings.skipped || []).includes(k0)) out.push({k:k0, d:0, o:null});
  for(let d = 1; d <= 7; d++){
    const k = keyIn(-d), o = S.outfits.get(plans[k]);
    if(o && !logs.some(l => l.date === k) && !(S.settings.skipped || []).includes(k)) out.push({k, d, o});
  }
  return out;
}

function wornDates(pid){
  const dates = new Set(), today = keyIn(0);
  for(const l of logsOf()) if(l.pieceIds.includes(pid)) dates.add(l.date);
  const plans = plansOf();
  for(const [k, oid] of Object.entries(plans)){   // jours passés prévus : la tenue + ce qui avait été choisi avec (sans recalcul)
    const o = S.outfits.get(oid); if(k >= today || !o) continue;

  return [...dates].sort();
}

const PIECES_ORDER = ['tshirt', 'tshirt_ml', 'chemise', 'pantalon', 'short', 'pull', 'sweat', 'sweat_capuche', 'gilet', 'gilet_capuche', 'sous_pull', 'collant', 'veste', 'manteau', 'chaussures', 'accessoire'];
const pieceOrder = c => { const i = PIECES_ORDER.indexOf(c); return i < 0 ? 99 : i; };
const FILTER_TREE = [
  {id:'hauts', label:'Hauts', children:[
    {id:'tshirts', label:'T-shirts', cats:['tshirt','tshirt_ml'], children:[{id:'tshirt', label:'Manches courtes', cats:['tshirt']}, {id:'tshirt_ml', label:'Manches longues', cats:['tshirt_ml']}]},

const nodeCats = n => n.cats || (n.children || []).flatMap(nodeCats);
function renderPieces(){
  const all = [...S.pieces.values()];
  const dv = S.dirtyView || 'all';
  const head = `<div class="page-head"><h1>Vêtements</h1><div class="seg-mini">${[['all', 'Tous'], ['clean', 'Propres'], ['dirty', 'Au sale']].map(([v, l]) => `<button type="button" class="chip-btn" data-act="dirty-view" data-v="${v}" aria-pressed="${dv === v}">${l}</button>`).join('')}</div></div>`;
  if(!all.length) return head + `<div class="empty"><h3>${tx('Ta penderie est vide', 'Rien dans la penderie 🫥')}</h3><p>Photographie une pièce sur un fond uni : c'est cette photo qui apparaîtra dans tes tenues.</p><button class="btn primary" type="button" data-act="new-piece">Prendre une photo</button></div>`;
  // filtres du plus général au plus précis : Hauts › T-shirts › Manches longues
  const path = S.fpath || [], has = n => all.some(p => nodeCats(n).includes(p.category));
  const rows = []; let level = FILTER_TREE.filter(has), sel = null;
  rows.push(`<div class="filters"><button type="button" class="chip-btn" data-act="fpath" data-depth="0" data-id="" aria-pressed="${!path.length && S.filter !== 'sleep'}">Tout (${all.length})</button>${level.map(n => `<button type="button" class="chip-btn" data-act="fpath" data-depth="0" data-id="${n.id}" aria-pressed="${path[0] === n.id}">${n.label}</button>`).join('')}</div>`);
  for(let d = 0; d < path.length; d++){
    sel = level.find(n => n.id === path[d]); if(!sel) break;
    const kids = (sel.children || []).filter(has);
    if(kids.length > 1) rows.push(`<div class="filters sub"><button type="button" class="chip-btn" data-act="fpath" data-depth="${d + 1}" data-id="" aria-pressed="${path.length === d + 1}">Tous</button>${kids.map(n => `<button type="button" class="chip-btn" data-act="fpath" data-depth="${d + 1}" data-id="${n.id}" aria-pressed="${path[d + 1] === n.id}">${n.label}</button>`).join('')}</div>`);
    level = kids;
  }
  const filters = rows.join('');
  const allowedCats = sel ? nodeCats(sel) : null;
  const shown = all.filter(p => (S.filter === 'sleep' || !allowedCats || allowedCats.includes(p.category)) && (dv === 'all' || (dv === 'dirty' ? p.dirty : !p.dirty)))
    .sort((a,b) => catOrder(a.category) - catOrder(b.category) || (a.name||'').localeCompare(b.name||'', 'fr'));
  // une seule tuile par groupe de variantes
  const seen = new Map();
  for(const p of shown){ const g = p.group || p.id; if(!seen.has(g)) seen.set(g, []); seen.get(g).push(p); }
  const sleeping = sleepingPieces();
  const sleepNote = sleeping.length ? `<button type="button" class="sleep-note" data-act="filter" data-cat="sleep">${sleeping.length} pièce${sleeping.length > 1 ? 's' : ''} pas portée${sleeping.length > 1 ? 's' : ''} depuis 2 mois · à vendre ou donner ?</button>` : '';
  const groupsList = S.filter === 'sleep' ? sleeping.map(p => [p.id, [p]]) : [...seen.entries()];
  // rangées par catégorie, avec un titre, même dans « Tout »
  const byCat = new Map();
  for(const [g, l] of groupsList){ const c = l[0].category; if(!byCat.has(c)) byCat.set(c, []); byCat.get(c).push([g, l]); }
  const blocks = [...byCat.entries()].sort((a, b) => pieceOrder(a[0]) - pieceOrder(b[0]))
    .map(([c, list]) => `${byCat.size > 1 ? `<h3 class="cat-title">${esc(catLabel(c))} <span>${list.length}</span></h3>` : ''}<div class="pieces">${list.map(([g, l]) => l.length > 1 ? groupCard(g, l) : pieceCard(l[0], 'edit-piece')).join('')}</div>`).join('');
  return head + sleepNote + filters + blocks;
}

/* Recherche de ville : service Open-Meteo, et OpenStreetMap en secours s'il ne répond pas */
async function findCities(q){
  const get = async (url, ms = 7000) => {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms);
    try{ const r = await fetch(url, {signal:ctrl.signal}); if(!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally{ clearTimeout(t); }
  };
  try{
    const j = await get(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=fr&format=json`);
    return (j.results || []).map(c => ({name:c.name, latitude:c.latitude, longitude:c.longitude, admin1:c.admin1, country:c.country}));
  }catch(e){
    const j = await get(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&accept-language=fr&q=${encodeURIComponent(q)}`);
    return j.map(c => ({name:(c.address && (c.address.city || c.address.town || c.address.village || c.address.municipality)) || c.display_name.split(',')[0],
      latitude:+c.lat, longitude:+c.lon, admin1:c.address && (c.address.state || c.address.county), country:c.address && c.address.country}));
  }
}

  toast(fails ? `Terminé, ${fails} pièce${fails>1?'s':''} à vérifier.` : 'Toutes les pièces sont redétourées.');
}
async function exportData(){
  const data = {app:'mon-quotidien', version:APP_VERSION, date:new Date().toISOString(),
    pieces:[...S.pieces.values()], outfits:[...S.outfits.values()], settings:S.settings};
  const name = `garde-robe-${todayKey()}.json`;
  const file = new File([JSON.stringify(data)], name, {type:'application/json'});
  // Sur téléphone : feuille de partage (Drive, WhatsApp, mail…) ; sinon téléchargement
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Fichier enregistré dans Téléchargements.');
}
async function importData(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.app !== 'mon-quotidien' || !Array.isArray(data.pieces)){ toast("Ce fichier n'est pas une sauvegarde de l'app."); return; }
    const np = data.pieces.length, no = (data.outfits || []).length;
    if(!confirm(`Importer ${np} pièce${np>1?'s':''} et ${no} tenue${no>1?'s':''} ? Celles qui existent déjà seront remplacées.`)) return;
    for(const pc of data.pieces) if(pc && pc.id) store.savePiece(pc);
    for(const o of (data.outfits || [])) if(o && o.id) store.saveOutfit(o);
    toast('Sauvegarde importée.');
    migrateOutfits(); setTimeout(upgradeCuts, 300);
  }catch(e){ toast('Fichier illisible.'); }
}

/* ---------- Retouche du détourage (gomme / restaurer) ---------- */
const rt = $('#retouch');
function loadSrc(src){
  return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function maskFromCut(photo, img, W, H){
  const cut = photo.cut;
  if(cut && cut.x !== undefined){
    const k = W / cut.W, m = document.createElement('canvas'); m.width = W; m.height = H;
    const ci = await loadSrc(cut.dataUrl);
    const mx = m.getContext('2d', {willReadFrequently:true});
    mx.drawImage(ci, cut.x * k, cut.y * k, ci.width * k, ci.height * k);
    const a = mx.getImageData(0, 0, W, H).data, fg = new Uint8Array(W * H);
    for(let p = 0; p < W * H; p++) fg[p] = a[p*4+3] > 60 ? 1 : 0;
    return fg;
  }
  const r = cutout(img, guideKey(photo), true);
  return r ? r.fg : new Uint8Array(W * H).fill(1);
}
async function openRetouch(photo, onDone){
  const img = await loadSrc(photoSrc({photo}));
  const base = drawScaled(img, 720), W = base.width, H = base.height;
  const fg = await maskFromCut(photo, img, W, H);
  const ratio = W / H;
  rt.innerHTML = `<div class="rt">
    <div class="rt-top">
      <button type="button" class="cam-x" data-rt="cancel" aria-label="Fermer sans enregistrer">✕</button>

    </div>
    <div class="rt-stage"><div class="rt-box" style="width:min(calc(100vw - 16px), calc((100dvh - 260px) * ${ratio.toFixed(4)}));aspect-ratio:${W}/${H}">
      <canvas class="rt-photo" width="${W}" height="${H}"></canvas><canvas class="rt-mask" width="${W}" height="${H}"></canvas>
    </div></div>
    <div class="rt-tools">
      <div class="seg"><button type="button" data-mode="erase" aria-current="true">Gommer</button><button type="button" data-mode="keep" aria-current="false">Restaurer</button></div>
      <div class="rt-row">
        <button type="button" class="chip-btn" data-size="7" aria-pressed="false">Fin</button>
        <button type="button" class="chip-btn" data-size="16" aria-pressed="true">Moyen</button>
        <button type="button" class="chip-btn" data-size="34" aria-pressed="false">Large</button>
        <button type="button" class="chip-btn" data-rt="undo">Annuler le trait</button>
      </div>
      <p class="rt-hint">Passe le doigt sur ce qui doit disparaître : ça devient rouge. « Restaurer » fait revenir une zone coupée par erreur.</p>
    </div></div>`;
  rt.showModal();
  rt.querySelector('.rt-photo').getContext('2d').drawImage(base, 0, 0);
  const mc = rt.querySelector('.rt-mask'), mx = mc.getContext('2d', {willReadFrequently:true});
  const init = mx.createImageData(W, H);
  for(let p = 0; p < W * H; p++) if(!fg[p]){ init.data[p*4] = 225; init.data[p*4+1] = 45; init.data[p*4+2] = 45; init.data[p*4+3] = 255; }
  mx.putImageData(init, 0, 0);
  let mode = 'erase', size = 16, last = null;
  const undo = [];
  const pos = e => { const r = mc.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  const dab = (a, b) => {
    mx.globalCompositeOperation = mode === 'erase' ? 'source-over' : 'destination-out';
    mx.strokeStyle = mx.fillStyle = 'rgb(225,45,45)'; mx.lineWidth = size; mx.lineCap = 'round';
    mx.beginPath(); mx.moveTo(a[0], a[1]); mx.lineTo(b[0], b[1]); mx.stroke();
  };
  mc.addEventListener('pointerdown', e => {
    e.preventDefault(); mc.setPointerCapture(e.pointerId);
    undo.push(mx.getImageData(0, 0, W, H)); if(undo.length > 8) undo.shift();
    last = pos(e); dab(last, last);
  });
  mc.addEventListener('pointermove', e => { if(!last) return; const p2 = pos(e); dab(last, p2); last = p2; });
  const end = () => { last = null; };
  mc.addEventListener('pointerup', end); mc.addEventListener('pointercancel', end);
  rt.onclick = e => {
    const m = e.target.closest('[data-mode]');
    if(m){ mode = m.dataset.mode; rt.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-current', b === m)); return; }
    const z = e.target.closest('[data-size]');
    if(z){ size = +z.dataset.size; rt.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-pressed', b === z)); return; }
    const a = e.target.closest('[data-rt]'); if(!a) return;
    if(a.dataset.rt === 'undo'){ const u = undo.pop(); if(u){ mx.globalCompositeOperation = 'source-over'; mx.putImageData(u, 0, 0); } return; }
    if(a.dataset.rt === 'cancel'){ rt.close(); return; }
    if(a.dataset.rt === 'ok'){
      const al = mx.getImageData(0, 0, W, H).data, out = new Uint8Array(W * H);
      for(let p = 0; p < W * H; p++) out[p] = al[p*4+3] < 128 ? 1 : 0;
      const cut = finalizeCut(base, out, false);
      rt.close();
      if(cut){ onDone(cut); toast('Retouche enregistrée.'); } else toast('Il ne reste presque rien : retouche annulée.');
    }
  };
}

/* Quel contour a servi pour cette photo ? (les chaussures photographiées avant la vue de face gardent l'ancien) */
/* Repères de l'appareil photo : une ligne pour le haut (col / ceinture), une pour le bas
   (ourlet / bas du pantalon), et une ligne verticale au milieu pour ce qui s'ouvre.
   Tu cadres pour poser le col sur la ligne du haut et l'ourlet sur celle du bas. */
const LINES = {
  tshirt:{top:.22, bottom:.8, tl:'col', bl:'ourlet'}, tshirt_ml:{top:.22, bottom:.8, tl:'col', bl:'ourlet'},
  chemise:{top:.22, bottom:.8, mid:true, tl:'col', bl:'ourlet'}, pull:{top:.22, bottom:.8, tl:'col', bl:'bas du pull'},
  sweat:{top:.22, bottom:.8, tl:'col', bl:'bas du sweat'}, sweat_capuche:{top:.33, bottom:.86, tl:'col (sous la capuche)', bl:'bas du sweat'},
  gilet:{top:.22, bottom:.8, mid:true, tl:'col', bl:'bas du gilet'}, gilet_capuche:{top:.33, bottom:.86, mid:true, tl:'col (sous la capuche)', bl:'bas du gilet'},
  veste:{top:.22, bottom:.82, mid:true, tl:'col', bl:'bas de la veste'}, manteau:{top:.28, bottom:.9, mid:true, tl:'col (sous la capuche s\'il y en a une)', bl:'bas du manteau'},
  pantalon:{top:.06, bottom:.95, tl:'ceinture', bl:'bas des jambes'}, short:{top:.18, bottom:.78, tl:'ceinture', bl:'bas du short'},

/* Zone de détourage déduite des lignes : un rectangle large autour (les manches peuvent être n'importe où) */
function lineGuide(key){
  const cat = key.slice(6), L = LINES[cat]; if(!L) return null;
  const top = Math.max(0.01, L.top - (['sweat_capuche', 'gilet_capuche', 'manteau'].includes(cat) ? 0.3 : 0.08)) * 400, bot = Math.min(0.99, L.bottom + 0.05) * 400;
  return {d:`M8 ${top.toFixed(0)} H292 V${bot.toFixed(0)} H8 Z`, far:0.1};
}
const guideOf = key => key && (GUIDES[key] || (key.startsWith('lines:') ? lineGuide(key) : null));
function guideKey(photo){
  if(photo && photo.lines && photo.guide) return 'lines:' + photo.guide;
  if(!photo || !photo.guide) return undefined;
  if(photo.guide === 'chaussures' && photo.shoeView !== 'face') return 'chaussures_dessus';
  return photo.guide;
}

function guideSvg(cat){

    const line = (y, label) => `<path d="M0 ${y}H300" stroke="rgba(0,0,0,.55)" stroke-width="5"/><path d="M0 ${y}H300" stroke="#fff" stroke-width="2.2" stroke-dasharray="9 6"/>

    return `<svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true" fill="none">${line(ty, L.tl)}${line(by, L.bl)}${mid}

}
