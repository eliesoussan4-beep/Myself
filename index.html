<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --sun:#E9A92C; --rain:#4F82C9; --warn:#A8432C;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --sun:#F2BD4E; --rain:#7EA8E6; --warn:#E3826B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --sun:#F2BD4E; --rain:#7EA8E6; --warn:#E3826B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{max-width:640px;margin:0 auto;padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}

/* Section switcher */
.switcher{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.seg .count{font-size:11px;background:var(--warn);color:#fff;border-radius:99px;padding:0 6px;margin-left:4px;vertical-align:1px}

h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 16px}
.page-head h1{font-size:28px;font-weight:700}
.muted{color:var(--muted)}

/* Tomorrow hero */
.tomorrow{margin:18px 0 6px}
.tomorrow .day{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.92;letter-spacing:-.03em}
.tomorrow .date{color:var(--muted);font-size:15px;margin-top:6px;text-transform:none}

.weather{margin:18px 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.weather-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.weather-now{display:flex;align-items:center;gap:10px;font-weight:600}
.weather-now svg{flex:none}
.linkish{border:0;background:none;color:var(--denim);font-weight:600;padding:4px 0;font-size:14px}
.band-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span,.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;line-height:1.2}
.chip input:checked + span,.chip-btn[aria-pressed="true"]{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.chip input:focus-visible + span{outline:2px solid var(--denim);outline-offset:2px}
.chip small{opacity:.75;font-size:12px}

/* Look */
.look-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:8px}
.look-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.look-head h2{font-size:24px;font-weight:700}
.why{color:var(--muted);font-size:14px;margin:0 0 14px}
.look{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:170px;gap:8px}
.look.n1{grid-template-columns:1fr;grid-auto-rows:320px}
.look.n3 .tile:first-child{grid-row:span 2}
.look.odd .tile:last-child{grid-column:span 2}
.look.n3 .tile:last-child{grid-column:auto}
.tile{background:var(--sunk);border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:contain}
.tile .cap{position:absolute;left:8px;bottom:8px;right:8px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:fit-content;max-width:calc(100% - 16px)}
.noimg{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:13px;padding:10px;text-align:center}
.look-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.btn.grow{flex:1}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.planned{display:inline-flex;align-items:center;gap:6px;background:var(--denim-soft);color:var(--denim);font-weight:600;font-size:13px;border-radius:99px;padding:4px 10px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:26px 20px;text-align:center}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{margin:0 0 16px;color:var(--muted)}

/* Grids */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.piece{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:6px}
.piece .ph{aspect-ratio:3/4;background:var(--sunk);border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.piece .ph img{width:100%;height:100%;object-fit:contain}
.piece .nm{font-weight:600;font-size:14px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece .ct{font-size:12px;color:var(--muted);padding:0 4px 2px;margin-top:-6px}
.badge{position:absolute;top:6px;left:6px;background:var(--warn);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px}
.piece.is-dirty .ph img{opacity:.45}

.outfits{display:flex;flex-direction:column;gap:10px}
.outfit{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;width:100%}
.outfit .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.outfit h3{font-size:18px;font-weight:700}
.outfit .meta{font-size:13px;color:var(--muted);margin-top:2px}
.strip{display:flex;gap:6px;margin-top:10px;overflow:hidden}
.strip .th{width:56px;height:70px;border-radius:9px;background:var(--sunk);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.strip .th img{width:100%;height:100%;object-fit:contain}
.strip .th.dirty img{opacity:.35}
.warnline{color:var(--warn);font-size:13px;font-weight:600;margin-top:8px}

.group-title{font-family:var(--display);font-size:19px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 12px}

/* Bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:640px;height:var(--nav-h)}
.tabbar li{flex:1}
.tabbar button{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--denim)}
.tabbar button:disabled{opacity:.45;cursor:default}

/* Sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;margin:auto auto 0;overflow:hidden}
@media (min-width:600px){dialog{border-radius:22px;margin:auto}}
dialog::backdrop{background:rgba(10,14,22,.5)}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-scroll{overflow-y:auto;padding:20px 18px 8px}
.sheet h2{font-size:22px;font-weight:700;margin-bottom:14px}
.sheet-actions .btn{padding:11px 12px;min-width:0}
.del-link{color:var(--warn);display:block;margin:4px 0 12px}
.sheet-actions .btn.grow{flex:1 1 0}
.sheet-actions{display:flex;gap:8px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.field{display:block;margin-bottom:16px}
.field > span,.legend{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px}
fieldset{border:0;margin:0 0 16px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.photo-drop{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--sunk);border:1px dashed var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden;cursor:pointer;position:relative}
.photo-drop img{width:100%;height:100%;object-fit:contain}
.photo-drop .busy{position:absolute;inset:auto 10px 10px auto;background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--sunk);border-radius:12px;margin-bottom:16px;font-weight:600;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--denim)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{position:relative;display:block;cursor:pointer}
.pick input{position:absolute;opacity:0}
.pick .box{display:block;border:2px solid transparent;border-radius:12px;background:var(--sunk);overflow:hidden}
.pick .box .ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.pick .box img{width:100%;height:100%;object-fit:contain}
.pick .box .l{display:block;font-size:12px;font-weight:600;padding:3px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick input:checked + .box{border-color:var(--denim);background:var(--denim-soft)}
.pick input:focus-visible + .box{outline:2px solid var(--denim);outline-offset:2px}

.photo-btns{display:flex;gap:8px;margin:-6px 0 12px}
.photo-btns .btn{flex:1;text-align:center;position:relative;cursor:pointer}
.photo-drop{cursor:default}
.checker{background-color:var(--sunk);background-image:conic-gradient(var(--line) 25%,transparent 0 50%,var(--line) 0 75%,transparent 0);background-size:18px 18px}
.cut-tools{margin:-8px 0 12px}
.sil-wrap{background:var(--sunk);border-radius:16px;padding:16px 12px}
.sil{position:relative;margin:0 auto}
.sil img{position:absolute;max-width:none;object-fit:fill}
.sil .part{position:absolute;overflow:hidden}
.sil .mk{position:absolute;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.sil-wrap .strip{margin-top:12px}
#cam{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#000;color:#fff}
#cam::backdrop{background:#000}
.cam{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cam-top{display:flex;align-items:center;gap:8px;padding:10px 10px 8px}
.cam-x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px}
.cam-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cam-cats::-webkit-scrollbar{display:none}
.cam-cats .chip-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;white-space:nowrap}
.cam-cats .chip-btn[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.cam-box{position:relative;width:min(100vw, calc((100dvh - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .75));aspect-ratio:3/4;margin:0 auto;background:#111;overflow:hidden}
.cam-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-guide,.cam-guide svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-tip{text-align:center;font-size:14px;margin:10px 16px 0;color:rgba(255,255,255,.85)}
.cam-bottom{flex:1;display:flex;align-items:center;justify-content:center;min-height:96px}
.cam-shot{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);padding:0}
.cam-shot:active{background:#fff}
.cam-shot:disabled{opacity:.4}
.cam-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-size:15px}
.version{text-align:center;font-size:12px;color:var(--muted);margin:28px 0 0}
#retouch{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#0d1117;color:#fff}
#retouch::backdrop{background:#000}
.rt{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px}
.rt-top strong{font-family:var(--display);font-size:18px}
.rt-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px}
.rt-box{position:relative;background:conic-gradient(#2a3140 25%,#1c2230 0 50%,#2a3140 0 75%,#1c2230 0) 0 0/18px 18px}
.rt-box canvas{position:absolute;inset:0;width:100%;height:100%}
.rt-mask{opacity:.6;touch-action:none;cursor:crosshair}
.rt-tools{padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
.rt-tools .seg{background:rgba(255,255,255,.08);border-color:transparent}
.rt-tools .seg button{color:rgba(255,255,255,.7)}
.rt-tools .seg button[aria-current="true"]{background:#fff;color:#111}
.rt-row{display:flex;gap:6px;flex-wrap:wrap}
.rt-row .chip-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.rt-row .chip-btn[aria-pressed="true"]{background:#fff;color:#111}
.rt-hint{margin:0;font-size:13px;color:rgba(255,255,255,.7)}
.cut-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -16px 0;padding:0 16px 4px;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.carousel .slide{flex:0 0 calc(100% - 24px);scroll-snap-align:start;margin-top:0}
.carousel .slide:only-child{flex-basis:100%}
.best{font-size:12px;font-weight:600;color:var(--denim);background:var(--denim-soft);border-radius:99px;padding:3px 9px;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.dot.on{width:20px;border-radius:4px;background:var(--denim)}
.swipe-hint{text-align:center;margin:8px 0 0}
.backup{margin-top:28px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.backup h3{font-size:17px;margin-bottom:6px}
.backup .hint{margin:0 0 12px}
.backup .btn{position:relative;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.soon{padding:60px 10px;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><p class="loading">Ouverture de ta garde-robe…</p></main>

<nav class="tabbar" aria-label="Pages">
  <ul>
    <li><button type="button" aria-current="page" data-tab="vetements">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5 4 6 2.5 10.5 6 12v8.5h12V12l3.5-1.5L20 6l-5-2.5a3 3 0 0 1-6 0Z"/></svg>
      Vêtements</button></li>
    <li><button type="button" data-tab="soon2" disabled aria-label="Onglet à venir">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/><path d="M12 8.5v7M8.5 12h7"/></svg>
      Bientôt</button></li>
    <li><button type="button" data-tab="soon3" disabled aria-label="Onglet à venir">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/><path d="M12 8.5v7M8.5 12h7"/></svg>
      Bientôt</button></li>
  </ul>
</nav>

<dialog id="sheet"></dialog>
<dialog id="cam" aria-label="Appareil photo"></dialog>
<dialog id="retouch" aria-label="Retoucher le détourage"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Constantes ---------- */
const APP_VERSION = 21;
const CATS = [
  {id:'manteau', label:'Manteau', order:0},
  {id:'veste', label:'Veste', order:1},
  {id:'gilet_capuche', label:'Gilet zippé à capuche', order:2},
  {id:'gilet', label:'Gilet zippé', order:3},
  {id:'sweat_capuche', label:'Sweat à capuche', order:4},
  {id:'sweat', label:'Sweat', order:5},
  {id:'pull', label:'Pull', order:6},
  {id:'chemise', label:'Chemise', order:7},
  {id:'tshirt_ml', label:'T-shirt manches longues', order:8},
  {id:'tshirt', label:'T-shirt manches courtes', order:9},
  {id:'pantalon', label:'Pantalon', order:10},
  {id:'short', label:'Short', order:11},
  {id:'chaussures', label:'Chaussures', order:12},
  {id:'accessoire', label:'Accessoire', order:13},
];
/* Couches pour l'assemblage : dessous < intermédiaire < dessus */
const LAYER = {tshirt:'under', tshirt_ml:'under', sweat_capuche:'mid', gilet_capuche:'mid', short:'bottom', chemise:'under', haut:'under', robe:'under', pull:'mid', sweat:'mid', gilet:'mid', veste:'outer', manteau:'outer', pantalon:'bottom', bas:'bottom', chaussures:'shoes', accessoire:'acc'};
const LAYER_RANK = {under:0, mid:1, outer:2};
const OPEN_FRONT = new Set(['chemise','gilet','gilet_capuche','veste','manteau']);
/* Pièces avec capuche : la capuche reste entière, derrière la nuque */
const HOODED = new Set(['sweat_capuche','gilet_capuche']);

const LS_KEY = 'garde-robe-v1';
/* Hors de claude.ai : tout est gardé dans IndexedDB (bien plus de place que localStorage pour les photos) */
/* Stockage dans le téléphone (IndexedDB) : une fiche par pièce et par tenue.
   Modifier une pièce ne réécrit qu'elle, même avec des centaines de pièces. */
const idb = {
  open(){
    if(this._p) return this._p;
    this._p = new Promise((res, rej) => {
      const r = indexedDB.open('garde-robe', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if(!db.objectStoreNames.contains('pieces')) db.createObjectStore('pieces', {keyPath:'id'});
        if(!db.objectStoreNames.contains('outfits')) db.createObjectStore('outfits', {keyPath:'id'});
      };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._p;
  },
  async req(storeName, mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(storeName, mode), st = tx.objectStore(storeName), q = fn(st);
      tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  getAll(name){ return this.req(name, 'readonly', st => st.getAll()); },
  getKv(key){ return this.req('kv', 'readonly', st => st.get(key)); },
  put(name, v){ return this.req(name, 'readwrite', st => st.put(v)); },
  del(name, id){ return this.req(name, 'readwrite', st => st.delete(id)); },
  putKv(key, v){ return this.req('kv', 'readwrite', st => st.put(v, key)); },
  delKv(key){ return this.req('kv', 'readwrite', st => st.delete(key)); },
  async load(){
    let pieces = await this.getAll('pieces'), outfits = await this.getAll('outfits');
    let settings = await this.getKv('settings');
    // Ancien format (versions 1 à 20) : tout dans un seul bloc « state » → on le répartit une fois
    const legacy = await this.getKv('state');
    if(legacy && !pieces.length && !outfits.length){
      pieces = legacy.pieces || []; outfits = legacy.outfits || []; settings = legacy.settings || {};
      for(const pc of pieces) await this.put('pieces', pc);
      for(const o of outfits) await this.put('outfits', o);
      await this.putKv('settings', settings);
      await this.delKv('state');
    }
    return {pieces, outfits, settings: settings || {}};
  },
};
const store = {
  mode:'local', base:null, assets:null,
  async init(){
    let db=null, user=null, assets=null;
    if(window.claude && typeof window.claude.use === 'function'){
      try{ [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]); }catch(e){}
    }
    this.assets = assets;
    if(db && user){
      let id = null;
      try{ id = await user.id(); }catch(e){}
      if(id){
        this.mode = 'db';
        this.base = db.doc('data/users/' + id + '/wardrobe');
        let pending = 3;
        const done = () => { if(--pending === 0){ S.ready = true; render(); } };
        const onErr = e => { if(e && e.code === 'revoked') toast("L'accès aux données a été retiré."); };
        let first1=true, first2=true, first3=true;
        this.base.collection('pieces').onSnapshot(snap => {
          S.pieces = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
          if(first1){ first1=false; done(); } else render();
        }, onErr);
        this.base.collection('outfits').onSnapshot(snap => {
          S.outfits = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
          if(first2){ first2=false; done(); } else render();
        }, onErr);
        this.base.collection('meta').doc('settings').onSnapshot(d => {
          S.settings = d.exists ? {...d.data()} : {};
          if(first3){ first3=false; done(); } else render();
        }, onErr);
        return;
      }
    }
    this.mode = 'local';
    let j = null;
    try{ j = await idb.load(); }catch(e){ console.warn(e); }
    if(!j || (!j.pieces.length && !j.outfits.length)){
      try{ const raw = localStorage.getItem(LS_KEY); if(raw){ j = JSON.parse(raw); this.writeAllLocal(j); localStorage.removeItem(LS_KEY); } }catch(e){}
    }
    if(j){
      (j.pieces||[]).forEach(p => S.pieces.set(p.id, p));
      (j.outfits||[]).forEach(o => S.outfits.set(o.id, o));
      S.settings = j.settings || {};
    }
    let migrated = false;
    for(const pc of S.pieces.values()){ if(pc.category === 'bas'){ pc.category = 'pantalon'; migrated = true; } }
    S.ready = true; render();
    if(migrated) for(const pc of S.pieces.values()) this.local('put', 'pieces', pc);
  },
  local(op, name, v){
    const job = op === 'put' ? idb.put(name, v) : op === 'del' ? idb.del(name, v) : idb.putKv('settings', v);
    job.catch(e => {
      console.warn(e);
      toast(e && e.name === 'QuotaExceededError' ? "Le téléphone n'a plus de place : libère de l'espace." : "Enregistrement impossible, réessaie.");
    });
  },
  writeAllLocal(j){
    (j.pieces || []).forEach(pc => this.local('put', 'pieces', pc));
    (j.outfits || []).forEach(o => this.local('put', 'outfits', o));
    this.local('kv', 'settings', j.settings || {});
  },
  async write(fn){
    try{ await fn(); }
    catch(e){
      if(e && e.code === 'quota_exceeded') toast("Espace de stockage plein.");
      else toast("Enregistrement impossible, réessaie.");
    }
  },
  savePiece(p){
    S.pieces.set(p.id, p); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('pieces').doc(p.id).set(p));
    this.local('put', 'pieces', p);
  },
  deletePiece(id){
    const p = S.pieces.get(id);
    S.pieces.delete(id);
    for(const o of S.outfits.values()){
      if((o.pieceIds||[]).includes(id)) this.saveOutfit({...o, pieceIds:o.pieceIds.filter(x => x !== id)});
    }
    render();
    if(p && p.photo && p.photo.assetId && this.assets){ this.assets.delete(p.photo.assetId).catch(()=>{}); }
    if(this.mode === 'db') return this.write(() => this.base.collection('pieces').doc(id).delete());
    this.local('del', 'pieces', id);
  },
  saveOutfit(o){
    S.outfits.set(o.id, o); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('outfits').doc(o.id).set(o));
    this.local('put', 'outfits', o);
  },
  deleteOutfit(id){
    S.outfits.delete(id); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('outfits').doc(id).delete());
    this.local('del', 'outfits', id);
  },
  saveSettings(patch){
    S.settings = {...S.settings, ...patch}; render();
    if(this.mode === 'db') return this.write(() => this.base.collection('meta').doc('settings').set(S.settings));
    this.local('kv', 'settings', S.settings);
  },
};

/* ---------- Photos ---------- */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); setTimeout(()=>URL.revokeObjectURL(url), 1000); };
    img.onerror = rej; img.src = url;
  });
}
function drawScaled(img, max){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const r = Math.min(1, max / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.round(iw * r); c.height = Math.round(ih * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function processPhoto(fileOrImg){
  const img = fileOrImg instanceof Blob ? await loadImage(fileOrImg) : fileOrImg;
  if(store.assets){
    try{
      const c = drawScaled(img, 1000);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.84));
      const res = await store.assets.upload(blob, {type:'image/jpeg'});
      return {assetId: res.id};
    }catch(e){ /* repli ci-dessous */ }
  }
  return {dataUrl: drawScaled(img, store.mode === 'local' ? 800 : 480).toDataURL('image/jpeg', store.mode === 'local' ? 0.8 : 0.74)};
}

/* ---------- Détourage ----------
   Photo prise dans l'app : le contour sert de guide.
   - loin à l'extérieur du contour : forcément du fond ;
   - bien à l'intérieur : forcément le vêtement (ombres comprises) ;
   - entre les deux : on compare la couleur du pixel aux couleurs du fond
     et à celles du vêtement, avec un bonus selon qu'on est dedans ou dehors.
   Ensuite : on retire les taches isolées et on bouche les trous (ombres, reflets).
   Photo de l'album : on part des bords de la photo, puis même nettoyage. */
function distMap(src, W, H){
  const N = W * H, d = new Float32Array(N), INF = 1e9, D = 1.4142;
  for(let i = 0; i < N; i++) d[i] = src[i] ? 0 : INF;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    const i = y * W + x; let v = d[i]; if(v === 0) continue;
    if(x > 0) v = Math.min(v, d[i-1] + 1);
    if(y > 0){ v = Math.min(v, d[i-W] + 1); if(x > 0) v = Math.min(v, d[i-W-1] + D); if(x < W-1) v = Math.min(v, d[i-W+1] + D); }
    d[i] = v;
  }
  for(let y = H - 1; y >= 0; y--) for(let x = W - 1; x >= 0; x--){
    const i = y * W + x; let v = d[i]; if(v === 0) continue;
    if(x < W-1) v = Math.min(v, d[i+1] + 1);
    if(y < H-1){ v = Math.min(v, d[i+W] + 1); if(x < W-1) v = Math.min(v, d[i+W+1] + D); if(x > 0) v = Math.min(v, d[i+W-1] + D); }
    d[i] = v;
  }
  return d;
}
function kmeans(F, idx, k){
  if(!idx.length) return [];
  const step = Math.max(1, Math.floor(idx.length / 3000)), smp = [];
  for(let n = 0; n < idx.length; n += step) smp.push(idx[n]);
  const byL = [...smp].sort((a,b) => F[a*3] - F[b*3]);
  let C = []; for(let c = 0; c < k; c++){ const p = byL[Math.floor((c + .5) / k * byL.length)]; C.push([F[p*3], F[p*3+1], F[p*3+2]]); }
  for(let it = 0; it < 8; it++){
    const acc = C.map(() => [0,0,0,0]);
    for(const p of smp){
      let best = 0, bd = Infinity;
      for(let c = 0; c < C.length; c++){ const a = F[p*3]-C[c][0], b = F[p*3+1]-C[c][1], e = F[p*3+2]-C[c][2], dd = a*a+b*b+e*e; if(dd < bd){ bd = dd; best = c; } }
      const A = acc[best]; A[0] += F[p*3]; A[1] += F[p*3+1]; A[2] += F[p*3+2]; A[3]++;
    }
    C = C.map((c, n) => acc[n][3] ? [acc[n][0]/acc[n][3], acc[n][1]/acc[n][3], acc[n][2]/acc[n][3]] : c);
    C.forEach((c, n) => c.share = acc[n][3] / smp.length);
  }
  return C;
}
function nearest(F, p, C){
  let bd = Infinity;
  for(const c of C){ const a = F[p*3]-c[0], b = F[p*3+1]-c[1], e = F[p*3+2]-c[2], dd = a*a+b*b+e*e; if(dd < bd) bd = dd; }
  return Math.sqrt(bd);
}
/* Composantes connexes (4 voisins) des pixels où mask === val */
function components(mask, val, W, H){
  const N = W * H, lab = new Int32Array(N).fill(-1), q = new Int32Array(N), info = [];
  for(let s0 = 0; s0 < N; s0++){
    if(mask[s0] !== val || lab[s0] !== -1) continue;
    const id = info.length, it = {size:0, border:false, px:[]};
    let h = 0, t = 0; q[t++] = s0; lab[s0] = id;
    while(h < t){
      const p = q[h++], x = p % W, y = (p / W) | 0; it.size++;
      if(x === 0 || y === 0 || x === W-1 || y === H-1) it.border = true;
      if(x > 0 && mask[p-1] === val && lab[p-1] === -1){ lab[p-1] = id; q[t++] = p-1; }
      if(x < W-1 && mask[p+1] === val && lab[p+1] === -1){ lab[p+1] = id; q[t++] = p+1; }
      if(y > 0 && mask[p-W] === val && lab[p-W] === -1){ lab[p-W] = id; q[t++] = p-W; }
      if(y < H-1 && mask[p+W] === val && lab[p+W] === -1){ lab[p+W] = id; q[t++] = p+W; }
    }
    info.push(it);
  }
  return {lab, info};
}
/* Croissance de régions : chaque pixel indécis prend l'étiquette du voisin
   qui lui ressemble le plus, en commençant par les plus ressemblants. */
function growRegions(lab, F, W, H, penalty){
  const N = W * H, buckets = Array.from({length:256}, () => []);
  const cost = (q, from, l) => {
    const i = q * 3, j = from * 3;
    const c = (Math.abs(F[i]-F[j]) + Math.abs(F[i+1]-F[j+1]) + Math.abs(F[i+2]-F[j+2])) * 1.5 + penalty(q, l);
    return Math.min(255, c | 0);
  };
  const pushAround = (p, floor) => {
    const l = lab[p], x = p % W;
    const nb = [x > 0 ? p-1 : -1, x < W-1 ? p+1 : -1, p >= W ? p-W : -1, p < N-W ? p+W : -1];
    for(const q of nb) if(q >= 0 && lab[q] === 0) buckets[Math.max(floor, cost(q, p, l))].push(q * 2 + (l - 1));
  };
  for(let p = 0; p < N; p++) if(lab[p]) pushAround(p, 0);
  for(let c = 0; c < 256; c++){
    const b = buckets[c];
    for(let k = 0; k < b.length; k++){
      const v = b[k], q = v >> 1;
      if(lab[q]) continue;
      lab[q] = (v & 1) + 1;
      pushAround(q, c);
    }
    buckets[c] = null;
  }
  for(let p = 0; p < N; p++) if(!lab[p]) lab[p] = 2;
}
/* Remplit l'enveloppe convexe du masque autour de chaque forme du contour
   (une par chaussure). Chaque pixel est rattaché à la forme la plus proche. */
function peelEdges(fg, Fs, bgC, fgC, W, H, ratio = 1.15, depthFrac = 0.08, maxDB = Infinity){
  const N = W * H, maxDepth = Math.round(depthFrac * W), depth = new Int16Array(N).fill(-1), q = new Int32Array(N);
  let h = 0, t = 0;
  for(let p = 0; p < N; p++){
    if(!fg[p]) continue;
    const x = p % W;
    if((x > 0 && !fg[p-1]) || (x < W-1 && !fg[p+1]) || (p >= W && !fg[p-W]) || (p < N-W && !fg[p+W])){ depth[p] = 0; q[t++] = p; }
  }
  while(h < t){
    const p = q[h++];
    const dB = nearest(Fs, p, bgC);
    if(!(dB < maxDB && dB < nearest(Fs, p, fgC) * ratio)) continue;   // c'est du tissu : on s'arrête là
    fg[p] = 0;
    if(depth[p] >= maxDepth) continue;
    const x = p % W;
    for(const n of [x > 0 ? p-1 : -1, x < W-1 ? p+1 : -1, p >= W ? p-W : -1, p < N-W ? p+W : -1]){
      if(n >= 0 && fg[n] && depth[n] < 0){ depth[n] = depth[p] + 1; q[t++] = n; }
    }
  }
}
function fillHulls(fg, d, W, H, clip){
  const parts = d.split(/(?=M)/).map(x => x.trim()).filter(Boolean);
  if(parts.length < 1) return;
  const maps = parts.map(part => {
    const gc = document.createElement('canvas'); gc.width = W; gc.height = H;
    const gx = gc.getContext('2d'); gx.scale(W / 300, H / 400); gx.fill(new Path2D(part));
    const a = gx.getImageData(0, 0, W, H).data, m = new Uint8Array(W * H);
    for(let p = 0; p < W * H; p++) m[p] = a[p*4+3] > 127 ? 1 : 0;
    return distMap(m, W, H);
  });
  const reach = 0.1 * W;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const ox = out.getContext('2d'); ox.fillStyle = '#000';
  parts.forEach((_, k) => {
    const pts = [];
    for(let y = 0; y < H; y++){
      let lo = -1, hi = -1;
      for(let x = 0; x < W; x++){

    // L'IA garde parfois un bout de sol collé à la pièce (entre deux objets, sous l'ourlet…).
    // On apprend la couleur du sol autour (là où l'IA voit du fond) et celle du vêtement
    // (au cœur du contour), puis on « épluche » depuis le bord ce qui ressemble nettement au sol.
    const d = c.getContext('2d', {willReadFrequently:true}).getImageData(0, 0, W, H).data;
    const F = colorFeatures(d, N), bgIdx = [], coreIdx = [];
    for(let p = 0; p < N; p++){
      if(!inside[p] && dOut[p] > 0.04 * W && dOut[p] < 0.3 * W && alpha[p] < 40 && (!guide.bgBelow || (p / W | 0) >= top)) bgIdx.push(p);
      else if(inside[p] && dIn[p] > 0.05 * W && alpha[p] > 200) coreIdx.push(p);
    }
    let bgC = kmeans(F, bgIdx, 6); const mainBg = bgC.filter(q => q.share >= 0.07); if(mainBg.length) bgC = mainBg;
    let fgC = kmeans(F, coreIdx, 4);
    const pure = fgC.filter(q => Math.min(...bgC.map(b => Math.hypot(q[0]-b[0], q[1]-b[1], q[2]-b[2]))) > 10);
    if(pure.length) fgC = pure;
    // …et inversement : une « couleur du fond » presque identique à une couleur du vêtement
    // vient d'un bout de vêtement ou d'un objet semblable : on ne s'en sert pas pour éplucher.
    const clean = bgC.filter(b => Math.min(...fgC.map(q => Math.hypot(q[0]-b[0], q[1]-b[1], q[2]-b[2]))) > 12);
    if(clean.length) bgC = clean;
    if(bgC.length && fgC.length){
      const Fs = new Float32Array(N * 3);
      for(let ch = 0; ch < 3; ch++){
        const one = new Float32Array(N); for(let p = 0; p < N; p++) one[p] = F[p*3+ch];
        const bl = blurBox(one, W, H, 2); for(let p = 0; p < N; p++) Fs[p*3+ch] = bl[p];
      }
      peelEdges(fg, Fs, bgC, fgC, W, H, 0.8, 0.25, 22);
    }
    ({lab, info} = components(fg, 1, W, H));
    keep = new Uint8Array(info.length);
    for(let p = 0; p < N; p++) if(lab[p] >= 0 && inside[p]) keep[lab[p]] = 1;
  } else {
    // Photo de l'album : on garde les objets principaux (les plus grands)
    ({lab, info} = components(fg, 1, W, H));
    const big = info.length ? Math.max(...info.map(it => it.size)) : 0;
    keep = new Uint8Array(info.length);
    info.forEach((it, n) => keep[n] = it.size >= big * 0.15 ? 1 : 0);
  }
  if(!info.length) return null;
  for(let p = 0; p < N; p++) if(fg[p] && !keep[lab[p]]) fg[p] = 0;
  let count = 0; for(let p = 0; p < N; p++) count += fg[p];
  if(count < N * 0.005) return null;
  // Bords doux de l'IA conservés, mais seulement autour de ce qu'on garde
  const near = blurBox(Float32Array.from(fg), W, H, 2);
  for(let p = 0; p < N; p++){
    if(!(near[p] > 0.01) || (!fg[p] && orig[p])) alpha[p] = 0;   // retiré volontairement : totalement transparent
    else if(!fg[p]) alpha[p] = Math.min(alpha[p], 127);
  }
  return finalizeCut(c, fg, false, alpha);
}

/* Les pièces détourées avant cette version n'ont pas ces repères : on les calcule une fois. */
async function upgradeCuts(){
  for(const p of [...S.pieces.values()]){
    const c = p.photo && p.photo.cut; if(!c || (c.meta && c.meta.mid !== undefined)) continue;
    try{
      const img = await loadSrc(c.dataUrl);
      const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
      cv.getContext('2d').drawImage(img, 0, 0);
      store.savePiece({...p, photo:{...p.photo, cut:{...c, meta:analyzeCut(cv)}}});
    }catch(e){}
  }
}
function finalizeCut(c, fgIn, shrink, softAlpha){
  const W = c.width, H = c.height, N = W * H;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  const id = ctx.getImageData(0, 0, W, H), d = id.data;
  if(softAlpha) return packCut(c, id, softAlpha);
  // Lissage du contour : on floute le masque puis on le recoupe à mi-hauteur.
  // Les crans et petites bosses plus petits que le flou disparaissent,
  // la forme générale du vêtement reste. Le seuil un peu au-dessus de 0,5
  // rogne légèrement le bord pour ne pas garder de liseré de sol.
  const R = Math.max(2, Math.round(W / 150));
  let m = new Float32Array(N);
  for(let p = 0; p < N; p++) m[p] = fgIn[p];
  m = blurBox(blurBox(m, W, H, R), W, H, R);
  const fg = new Uint8Array(N), cut = shrink ? 0.58 : 0.5;
  for(let p = 0; p < N; p++) fg[p] = m[p] > cut ? 1 : 0;
  // Bord doux (anticrénelage) : transition sur ~2 pixels
  const soft = blurBox(Float32Array.from(fg), W, H, 1);
  const alpha = new Uint8Array(N);
  for(let p = 0; p < N; p++) alpha[p] = Math.round(255 * Math.min(1, Math.max(0, (soft[p] - 0.15) / 0.7)));
  return packCut(c, id, alpha);
}
function packCut(c, id, alpha){
  const W = c.width, H = c.height, d = id.data;
  let x0 = W, x1 = -1, y0 = H, y1 = -1;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    const p = y * W + x, a = alpha[p] < 12 ? 0 : alpha[p];
    d[p*4+3] = a;
    if(a > 0){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  }
  if(x1 - x0 < 10 || y1 - y0 < 10) return null;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1); x1 = Math.min(W - 1, x1 + 1); y1 = Math.min(H - 1, y1 + 1);
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
  tmp.getContext('2d').putImageData(id, 0, 0);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const out = document.createElement('canvas'); out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(tmp, x0, y0, cw, ch, 0, 0, cw, ch);
  let url = out.toDataURL('image/webp', 0.86);
  if(!url.startsWith('data:image/webp')) url = out.toDataURL('image/png');
  const M = Math.max(W, H);
  return {dataUrl:url, w:cw / M, h:ch / M, x:x0, y:y0, W, H, meta:analyzeCut(out)};
}

/* ---------- Météo (Paris) ---------- */
const PARIS = {lat:48.8566, lon:2.3522};
S.weatherState = 'loading'; // loading | ok | blocked
function tomorrowWeather(){
  const k = tomorrowKey(), m = S.settings.manual;
  if(m && m.date === k) return {band:m.band, rain:!!m.rain, source:'manual'};
  const a = S.weatherDays[k];
  if(a) return {band:bandFor(a.max), rain:a.rain, source:'auto', ...a};
  return null;
}
async function fetchWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${PARIS.lat}&longitude=${PARIS.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=Europe%2FParis&forecast_days=2`;
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch(url, {signal:ctrl.signal});
    const j = await r.json();
    const d = j.daily;
    S.weatherDays = {};
    d.time.forEach((day, i) => {
      const prob = d.precipitation_probability_max[i] ?? 0, mm = d.precipitation_sum[i] ?? 0;
      S.weatherDays[day] = {date:day, max:Math.round(d.temperature_2m_max[i]), min:Math.round(d.temperature_2m_min[i]), rainProb:prob, rainMm:Math.round(mm*10)/10, rain: prob >= 50 || mm >= 1};
    });
    S.weatherState = 'ok';
  }catch(e){ S.weatherState = 'blocked'; }
  finally{ clearTimeout(t); render(); }
}
async function refreshWeather(){
  S.weatherState = 'loading'; render();
  await fetchWeather();
  if(S.weatherState === 'ok'){
    if(S.settings.manual && S.settings.manual.date === tomorrowKey()) store.saveSettings({manual:null});
    toast('Météo de Paris mise à jour.');
  } else toast('Météo automatique bloquée sur cette page : choisis à la main.');
}

/* ---------- Suggestion ---------- */
function rankOutfits(w){
  const bi = w ? BANDS.findIndex(b => b.id === w.band) : -1;
  const all = [...S.outfits.values()].map(o => {
    const pcs = (o.pieceIds||[]).map(id => S.pieces.get(id)).filter(Boolean);
    if(!pcs.length) return null;
    const dirty = pcs.filter(p => p.dirty);
    let score = 0; const why = [];
    if(w){
      const ob = (o.bands||[]).map(b => BANDS.findIndex(x => x.id === b));
      if(ob.includes(bi)){ score += 10; why.push(`Pensée pour ${BANDS[bi].words}`); }
      else if(ob.some(i => Math.abs(i - bi) === 1)) score += 3;
      else if(ob.length) score -= 4;
      if(w.rain){ if(o.rainOk){ score += 3; why.push('ok sous la pluie'); } else score -= 5; }
    }
    const d = daysSince(o.lastWorn);
    if(d === null){ score += 7; why.push('jamais portée'); }
    else { score += Math.min(Math.max(d,0), 14) * 0.5; if(d >= 3) why.push(`pas portée depuis ${d} jours`); }
    return {o, pcs, dirty, score, why};
  }).filter(Boolean);
  return {
    ok: all.filter(x => !x.dirty.length).sort((a,b) => b.score - a.score),
    blocked: all.filter(x => x.dirty.length),
  };
}
function sentence(parts){
  if(!parts.length) return 'Une tenue propre de ta garde-robe.';
  const s = parts.join(', ');
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}

/* ---------- Rendu ---------- */
function render(){

  if(!S.ready){ app.innerHTML = '<p class="loading">Ouverture de ta garde-robe…</p>'; return; }
  const dirtyCount = [...S.pieces.values()].filter(p => p.dirty).length;
  const tabs = [['demain','Ma tenue'],['tenues','Tenues'],['pieces','Pièces'],['linge','Linge']];
  const sw = `<div class="switcher"><div class="seg" role="tablist">${tabs.map(([id,l]) =>
    `<button type="button" data-section="${id}" aria-current="${S.section===id}">${l}${id==='linge'&&dirtyCount?`<span class="count">${dirtyCount}</span>`:''}</button>`).join('')}</div></div>`;
  const body = {demain:renderDemain, tenues:renderTenues, pieces:renderPieces, linge:renderLinge}[S.section]();
  app.innerHTML = sw + body + `<p class="version">Version ${APP_VERSION}</p>`;
  const car = document.getElementById('carousel');
  if(car){
    const step = () => { const sl = car.querySelector('.slide'); return sl ? sl.offsetWidth + 12 : car.clientWidth; };
    car.scrollLeft = (+car.dataset.start || 0) * step();
    let raf = 0;
    car.addEventListener('scroll', () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const n = Math.round(car.scrollLeft / step());
        if(n !== S.alt){ S.alt = n; document.querySelectorAll('.dots .dot').forEach((d, k) => d.classList.toggle('on', k === n)); }
      });
    }, {passive:true});
  }
}

function lookGrid(pcs){
  const sorted = [...pcs].sort((a,b) => catOrder(a.category) - catOrder(b.category));
  const n = sorted.length;
  const cls = n === 1 ? 'n1' : n === 3 ? 'n3' : (n % 2 ? 'odd' : '');
  return `<div class="look ${cls}">${sorted.map(p => `<div class="tile">${pieceVisual(p)}<span class="cap">${esc(p.name)}</span></div>`).join('')}</div>`;
}

/* Tenue assemblée : hauts en haut, pantalon dessous, chaussures en bas,
   tous à la même échelle. Veste/gilet/manteau ouverts au milieu, ou posés à côté. */
function silhouette(pcs, openMode){
  const L = p => LAYER[p.category] || 'acc';
  const main = pcs.filter(p => L(p) !== 'acc');
  if(!main.length || main.some(p => !(p.photo && p.photo.cut))) return null;
  const rankOf = p => TOP_RANK[p.category] ?? 0;
  const tops = main.filter(p => L(p) in LAYER_RANK).sort((a,b) => rankOf(a) - rankOf(b));
  // Une chemise, un gilet, une veste… ne s'ouvre que s'il y a un haut en dessous
  const opens = p => OPEN_FRONT.has(p.category) && tops.some(q => rankOf(q) < rankOf(p));
  const mode = openMode === 'closed' ? 'closed' : 'open';
  const torso = tops, beside = [];
  const items = [];
  let torsoW = 0;
  // La pièce la plus extérieure définit la silhouette du buste : les hauts du dessous
  // n'apparaissent qu'à l'intérieur de cette silhouette (jamais au-delà des épaules ou de l'ourlet).
  const outer = torso.length > 1 ? torso[torso.length - 1] : null;
  const axisOf = p => (p.photo.cut.meta && p.photo.cut.meta.mid) || 0.5;
  const yOf = p => HOODED.has(p.category) ? -HOOD_FRAC * p.photo.cut.h : 0;
  const outerRect = outer ? {url:outer.photo.cut.dataUrl, x:-axisOf(outer) * outer.photo.cut.w, y:yOf(outer), w:outer.photo.cut.w, h:outer.photo.cut.h} : null;
  torso.forEach((p, i) => {
    const c = p.photo.cut; torsoW = Math.max(torsoW, c.w);
    const z = 10 + rankOf(p) * 10 + i, axis = axisOf(p), x0 = -axis * c.w, y0 = yOf(p);
    const mask = outer && p !== outer ? outerRect : null;
    if(mode === 'open' && opens(p) && OPEN_STYLE[p.category] === 'full'){
      // Ouverte de haut en bas : chaque pan garde son bord extérieur (épaule, manche) en place
      // et se resserre vers l'extérieur, ce qui dégage le milieu sur toute la hauteur,
      // col compris, comme un gilet ou une veste dézippé. La silhouette ne s'élargit pas.
      const gap = OPEN_GAP[p.category] || 0.16;
      const kl = Math.max(0.5, 1 - gap / (2 * axis)), kr = Math.max(0.5, 1 - gap / (2 * (1 - axis)));
      if(HOODED.has(p.category)){
        // La capuche (en haut, au centre) reste entière et passe derrière le haut du dessous ;
        // seuls les pans s'ouvrent, sous la capuche.
        const hc = 0.22, a = (Math.max(0, axis - 0.13) * 100).toFixed(1), b = (Math.min(1, axis + 0.13) * 100).toFixed(1), m = (axis * 100).toFixed(1), hp = (hc * 100).toFixed(1);
        // la capuche couvre aussi l'espace laissé par les pans resserrés, pour ne laisser aucun trou
        const ha = (Math.max(0, axis - 0.13) * kl * 100).toFixed(1), hb = ((1 - (1 - Math.min(1, axis + 0.13)) * kr) * 100).toFixed(1);
        items.push({p, x:x0, y:y0, w:c.w, h:c.h, z:9, clip:`polygon(${ha}% 0,${hb}% 0,${hb}% ${hp}%,${ha}% ${hp}%)`});
        items.push({p, x:x0, y:y0, w:c.w, h:c.h, z, mask, clip:`polygon(0 0,${a}% 0,${a}% ${hp}%,${m}% ${hp}%,${m}% 100%,0 100%)`, tf:`scaleX(${kl.toFixed(4)})`, origin:'0% 50%'});
        items.push({p, x:x0, y:y0, w:c.w, h:c.h, z, mask, clip:`polygon(${b}% 0,100% 0,100% 100%,${m}% 100%,${m}% ${hp}%,${b}% ${hp}%)`, tf:`scaleX(${kr.toFixed(4)})`, origin:'100% 50%'});
      } else {
        items.push({p, x:x0, y:y0, w:c.w, h:c.h, z, mask, clip:`inset(0 ${((1 - axis) * 100).toFixed(1)}% 0 0)`, tf:`scaleX(${kl.toFixed(4)})`, origin:'0% 50%'});
        items.push({p, x:x0, y:y0, w:c.w, h:c.h, z, mask, clip:`inset(0 0 0 ${(axis * 100).toFixed(1)}%)`, tf:`scaleX(${kr.toFixed(4)})`, origin:'100% 50%'});
      }
    } else if(mode === 'open' && opens(p)){
      // Photo prise fermée : on la coupe au milieu (un peu à droite pour garder la patte
      // de boutonnage entière à gauche) et chaque pan pivote autour du col.
      // Le col reste en place, l'ouverture s'élargit vers le bas en V, comme portée ouverte.
      const cutAt = Math.min(0.9, axis + 0.02);
      const deg = Math.atan(((OPEN_GAP[p.category] || 0.15) * c.w / 2) / (c.h * 0.85)) * 180 / Math.PI;
      const origin = `${(cutAt * 100).toFixed(1)}% 12%`;
      items.push({p, x:x0, y:y0, w:c.w, h:c.h, z, mask, clip:`inset(0 ${((1 - cutAt) * 100).toFixed(1)}% 0 0)`, tf:`rotate(${deg.toFixed(2)}deg)`, origin});
      items.push({p, x:x0, y:y0, w:c.w, h:c.h, z, mask, clip:`inset(0 0 0 ${(cutAt * 100).toFixed(1)}%)`, tf:`rotate(${(-deg).toFixed(2)}deg)`, origin});
    } else {
      let clip;
      // Sous un gilet à capuche ouvert, le haut du dessous ne commence que sous la capuche
      if(mask && mode === 'open' && outer && HOODED.has(outer.category) && opens(outer)){
        const hoodBottom = yOf(outer) + 0.22 * outer.photo.cut.h;
        const t = Math.max(0, (hoodBottom - y0) / c.h);
        if(t > 0) clip = `inset(${(t * 100).toFixed(1)}% 0 0 0)`;
      }
      items.push({p, x:x0, y:y0, w:c.w, h:c.h, z, mask, clip});
    }
  });
  const innerH = torso.length ? Math.min(...torso.map(p => p.photo.cut.h + yOf(p))) : 0;   // hauteur sous le col
  let y = torso.length ? innerH * 0.8 : 0, pantsBottom = y, legX = null, onlyShorts = true;
  main.filter(p => L(p) === 'bottom').forEach((p, i) => {
    const c = p.photo.cut; items.push({p, x:-c.w/2, y, w:c.w, h:c.h, z:5 + i});
    // Avec un short, les pieds restent là où finirait un pantalon (jambes non dessinées)
    if(p.category === 'short') pantsBottom = Math.max(pantsBottom, y + LEG_LEN);
    else { pantsBottom = Math.max(pantsBottom, y + c.h); onlyShorts = false; }
    if(i === 0){
      const lg = c.meta && c.meta.legs;
      legX = lg ? lg.map(f => -c.w/2 + f * c.w) : [-c.w * 0.22, c.w * 0.22];
    }
  });
  const hasPants = main.some(p => L(p) === 'bottom');
  // Chaussures : chacune sous sa jambe, l'arrière glissé sous l'ourlet du pantalon
  const topY = hasPants ? pantsBottom : (torso.length ? Math.max(...torso.map(p => p.photo.cut.h)) + 0.02 : 0);
  main.filter(p => L(p) === 'shoes').slice(0, 1).forEach(p => {
    const c = p.photo.cut, parts = c.meta && c.meta.parts;
    // Vue de face : l'ourlet recouvre le haut de la chaussure (languette, col) ; vue de dessus : juste le talon
    const tuck = (hasPants && onlyShorts) ? 0.1 : p.photo.shoeView === 'face' ? 0.4 : 0.3;
    if(parts && parts.length === 2){
      const centers = legX || [-c.w * 0.25, c.w * 0.25];
      parts.forEach((pt, k) => {
        const w = pt.w * c.w, h = pt.h * c.h;
        items.push({p, part:pt, x:centers[k] - w/2, y:topY - (hasPants ? h * tuck : 0), w, h, z:1 + k});
      });
    } else {
      items.push({p, x:-c.w/2, y:topY - (hasPants ? c.h * tuck * 0.8 : 0), w:c.w, h:c.h, z:1});
    }
  });
  let bx = torsoW / 2 + 0.03;
  beside.forEach(p => { const c = p.photo.cut; items.push({p, x:bx, y:0, w:c.w, h:c.h, z:40}); bx += c.w + 0.03; });
  const minX = Math.min(...items.map(it => it.x)), maxX = Math.max(...items.map(it => it.x + it.w));
  const minY = Math.min(0, ...items.map(it => it.y)), maxY = Math.max(...items.map(it => it.y + it.h));
  const TW = maxX - minX, TH = maxY - minY;
  const ratio = TW / TH;
  const imgs = items.sort((a,b) => a.z - b.z).map(it => {
    const clip = it.clip ? `clip-path:${it.clip};-webkit-clip-path:${it.clip};` : '';
    const pos = `left:${((it.x-minX)/TW*100).toFixed(2)}%;top:${((it.y-minY)/TH*100).toFixed(2)}%;width:${(it.w/TW*100).toFixed(2)}%;height:${(it.h/TH*100).toFixed(2)}%;`;
    if(it.part){
      const pt = it.part;
      return `<div class="part" style="${pos}"><img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:${(-pt.x/pt.w*100).toFixed(2)}%;top:${(-pt.y/pt.h*100).toFixed(2)}%;width:${(100/pt.w).toFixed(2)}%;height:${(100/pt.h).toFixed(2)}%"></div>`;
    }
    const rot = it.tf ? `transform:${it.tf};transform-origin:${it.origin};` : '';
    if(it.mask){
      // Haut du dessous : découpé à la silhouette de la pièce extérieure (masque)
      const m = it.mask, mp = `left:${((m.x-minX)/TW*100).toFixed(2)}%;top:${((m.y-minY)/TH*100).toFixed(2)}%;width:${(m.w/TW*100).toFixed(2)}%;height:${(m.h/TH*100).toFixed(2)}%;`;
      const mi = `url('${esc(m.url)}')`;
      return `<div class="mk" style="${mp}-webkit-mask-image:${mi};mask-image:${mi};"><img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:${((it.x-m.x)/m.w*100).toFixed(2)}%;top:${((it.y-m.y)/m.h*100).toFixed(2)}%;width:${(it.w/m.w*100).toFixed(2)}%;height:${(it.h/m.h*100).toFixed(2)}%;${clip}${rot}"></div>`;
    }
    return `<img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:${((it.x-minX)/TW*100).toFixed(2)}%;top:${((it.y-minY)/TH*100).toFixed(2)}%;width:${(it.w/TW*100).toFixed(2)}%;height:${(it.h/TH*100).toFixed(2)}%;${clip}${rot}">`;
  }).join('');
  const acc = pcs.filter(p => L(p) === 'acc');
  return `<div class="sil-wrap"><div class="sil" style="aspect-ratio:${TW.toFixed(4)}/${TH.toFixed(4)};width:min(100%, calc(58vh * ${ratio.toFixed(4)}))">${imgs}</div>

}

function openMode(){
  if(S.settings.openMode) return S.settings.openMode;
  return S.settings.jacketSide ? 'side' : 'open';
}
function lookView(pcs){
  const rk = p => TOP_RANK[p.category] ?? 0;
  const tops = pcs.filter(p => p.category in TOP_RANK);
  const opener = tops.find(p => OPEN_FRONT.has(p.category) && tops.some(q => rk(q) < rk(p)));
  const mode = openMode() === 'closed' ? 'closed' : 'open';
  const sil = silhouette(pcs, mode);
  if(sil){
    const nm = opener ? catLabel(opener.category).toLowerCase() : '';
    const fem = opener && ['chemise','veste'].includes(opener.category);
    const toggle = opener ? `<div class="band-row" style="margin:0 0 10px" role="group" aria-label="Porter la ${esc(nm)}">
      ${[['open', fem ? 'Ouverte' : 'Ouvert'], ['closed', fem ? 'Fermée' : 'Fermé']].map(([m, l]) =>
        `<button type="button" class="chip-btn" data-act="openmode" data-mode="${m}" aria-pressed="${mode === m}">${l}</button>`).join('')}</div>` : '';
    return toggle + sil;
  }
  const missing = pcs.filter(p => LAYER[p.category] !== 'acc' && !(p.photo && p.photo.cut)).length;
  return lookGrid(pcs) + (missing ? `<p class="hint" style="margin:10px 0 0">Pour voir la tenue assemblée, détoure la photo de ${missing} pièce${missing>1?'s':''} (onglet Pièces).</p>` : '');
}

function renderDemain(){
  const td = tomorrowDate();
  const dateStr = td.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  const w = tomorrowWeather();
  let wline;
  if(w && w.source === 'auto') wline = `${w.rain?ICON.rain:ICON.sun}<span>Paris : ${w.min}° à ${w.max}°, ${w.rain?`pluie (${w.rainProb} %${w.rainMm?`, ${String(w.rainMm).replace('.',',')} mm`:''})`:`pas de pluie (${w.rainProb} %)`}</span>`;
  else if(w) wline = `${w.rain?ICON.rain:ICON.sun}<span>${esc(BANDS.find(b=>b.id===w.band).label)}${w.rain?', avec de la pluie':', sans pluie'}${S.weatherDays[tomorrowKey()]?' (ton choix)':''}</span>`;
  else if(S.weatherState === 'loading') wline = `${ICON.unknown}<span>Météo de Paris en cours…</span>`;

      <button type="button" class="chip-btn" data-act="rain" aria-pressed="${!!(w && w.rain)}">Pluie</button></div>
  </section>`;

  const off = dayOffset();
  const head = `<div class="tomorrow"><div class="day">${off===0?"Aujourd'hui":'Demain'}</div><div class="date">${esc(dateStr)}</div>
    <div class="band-row" role="group" aria-label="Jour de la tenue">
      <button type="button" class="chip-btn" data-act="day" data-off="0" aria-pressed="${off===0}">Aujourd'hui</button>
      <button type="button" class="chip-btn" data-act="day" data-off="1" aria-pressed="${off===1}">Demain</button>
    </div></div>`;

  if(!S.pieces.size) return head + weather + `<div class="empty"><h3>Commence par tes pièces</h3><p>Prends en photo tes vêtements un par un, puis assemble-les en tenues.</p><button class="btn primary" type="button" data-act="new-piece">Ajouter une pièce</button></div>`;
  if(!S.outfits.size) return head + weather + `<div class="empty"><h3>Aucune tenue pour l'instant</h3><p>Assemble tes pièces en tenues : c'est parmi elles que je choisirai.</p><button class="btn primary" type="button" data-act="new-outfit">Créer une tenue</button></div>`;

  const planned = S.settings.planned && S.settings.planned.date === tomorrowKey() ? S.outfits.get(S.settings.planned.outfitId) : null;
  if(planned){
    const pcs = (planned.pieceIds||[]).map(id => S.pieces.get(id)).filter(Boolean);
    const anyClean = pcs.some(p => !p.dirty);
    return head + weather + `<article class="look-card">
      <div class="look-head"><h2>${esc(planned.name)}</h2><span class="planned">Prévue</span></div>
      <p class="why">C'est la tenue que tu as choisie pour ${dayWord()}.</p>
      ${lookView(pcs)}
      <div class="look-actions">
        ${anyClean ? `<button class="btn grow" type="button" data-act="dirty-planned">Mettre au sale après</button>` : `<span class="muted" style="align-self:center;flex:1">Pièces déjà au sale</span>`}
        <button class="btn" type="button" data-act="unplan">Changer</button>
      </div></article>`;
  }

  const {ok, blocked} = rankOutfits(w);
  if(!ok.length) return head + weather + `<div class="empty"><h3>Tout est au sale</h3><p>Chaque tenue contient au moins une pièce à laver (${blocked.length} tenue${blocked.length>1?'s':''}).</p><button class="btn primary" type="button" data-section="linge">Voir le linge</button></div>`;
  const list = ok.slice(0, 12);

      <div class="look-head"><h2>${esc(x.o.name)}</h2>${n === 0 ? '<span class="best">Meilleur choix</span>' : ''}</div>
      <p class="why">${esc(sentence(x.why))}</p>
      ${lookView(x.pcs)}
      <div class="look-actions"><button class="btn primary grow" type="button" data-act="plan" data-id="${esc(x.o.id)}">Je la porte ${dayWord()}</button></div>
    </article>`).join('');
  const nav = list.length > 1 ? `<div class="dots" aria-hidden="true">${list.map((_, n) => `<span class="dot${n === cur ? ' on' : ''}"></span>`).join('')}</div>
    <p class="hint swipe-hint">Fais glisser pour voir les ${list.length} tenues possibles.</p>` : '';

    const pcs = (o.pieceIds||[]).map(id => S.pieces.get(id)).filter(Boolean).sort((a,b) => catOrder(a.category) - catOrder(b.category));

async function exportData(){
  const data = {app:'mon-quotidien', version:APP_VERSION, date:new Date().toISOString(),
    pieces:[...S.pieces.values()], outfits:[...S.outfits.values()], settings:S.settings};
  const name = `garde-robe-${todayKey()}.json`;
  const file = new File([JSON.stringify(data)], name, {type:'application/json'});
  // Sur téléphone : feuille de partage (Drive, WhatsApp, mail…) ; sinon téléchargement
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Fichier enregistré dans Téléchargements.');
}
async function importData(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.app !== 'mon-quotidien' || !Array.isArray(data.pieces)){ toast("Ce fichier n'est pas une sauvegarde de l'app."); return; }
    const np = data.pieces.length, no = (data.outfits || []).length;
    if(!confirm(`Importer ${np} pièce${np>1?'s':''} et ${no} tenue${no>1?'s':''} ? Celles qui existent déjà seront remplacées.`)) return;
    for(const pc of data.pieces) if(pc && pc.id) store.savePiece(pc);
    for(const o of (data.outfits || [])) if(o && o.id) store.saveOutfit(o);
    toast('Sauvegarde importée.');
  }catch(e){ toast('Fichier illisible.'); }
}

/* ---------- Retouche du détourage (gomme / restaurer) ---------- */
const rt = $('#retouch');
function loadSrc(src){
  return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function maskFromCut(photo, img, W, H){
  const cut = photo.cut;
  if(cut && cut.x !== undefined){
    const k = W / cut.W, m = document.createElement('canvas'); m.width = W; m.height = H;
    const ci = await loadSrc(cut.dataUrl);
    const mx = m.getContext('2d', {willReadFrequently:true});
    mx.drawImage(ci, cut.x * k, cut.y * k, ci.width * k, ci.height * k);
    const a = mx.getImageData(0, 0, W, H).data, fg = new Uint8Array(W * H);
    for(let p = 0; p < W * H; p++) fg[p] = a[p*4+3] > 60 ? 1 : 0;
    return fg;
  }
  const r = cutout(img, guideKey(photo), true);
  return r ? r.fg : new Uint8Array(W * H).fill(1);
}
async function openRetouch(photo, onDone){
  const img = await loadSrc(photoSrc({photo}));
  const base = drawScaled(img, 720), W = base.width, H = base.height;
  const fg = await maskFromCut(photo, img, W, H);
  const ratio = W / H;
  rt.innerHTML = `<div class="rt">
    <div class="rt-top">
      <button type="button" class="cam-x" data-rt="cancel" aria-label="Fermer sans enregistrer">✕</button>
      <strong>Retoucher</strong>
      <button type="button" class="btn primary" data-rt="ok">Valider</button>
    </div>
    <div class="rt-stage"><div class="rt-box" style="width:min(calc(100vw - 16px), calc((100dvh - 260px) * ${ratio.toFixed(4)}));aspect-ratio:${W}/${H}">
      <canvas class="rt-photo" width="${W}" height="${H}"></canvas><canvas class="rt-mask" width="${W}" height="${H}"></canvas>
    </div></div>
    <div class="rt-tools">
      <div class="seg"><button type="button" data-mode="erase" aria-current="true">Gommer</button><button type="button" data-mode="keep" aria-current="false">Restaurer</button></div>
      <div class="rt-row">
        <button type="button" class="chip-btn" data-size="7" aria-pressed="false">Fin</button>
        <button type="button" class="chip-btn" data-size="16" aria-pressed="true">Moyen</button>
        <button type="button" class="chip-btn" data-size="34" aria-pressed="false">Large</button>
        <button type="button" class="chip-btn" data-rt="undo">Annuler le trait</button>
      </div>
      <p class="rt-hint">Passe le doigt sur ce qui doit disparaître : ça devient rouge. « Restaurer » fait revenir une zone coupée par erreur.</p>
    </div></div>`;
  rt.showModal();
  rt.querySelector('.rt-photo').getContext('2d').drawImage(base, 0, 0);
  const mc = rt.querySelector('.rt-mask'), mx = mc.getContext('2d', {willReadFrequently:true});
  const init = mx.createImageData(W, H);
  for(let p = 0; p < W * H; p++) if(!fg[p]){ init.data[p*4] = 225; init.data[p*4+1] = 45; init.data[p*4+2] = 45; init.data[p*4+3] = 255; }
  mx.putImageData(init, 0, 0);
  let mode = 'erase', size = 16, last = null;
  const undo = [];
  const pos = e => { const r = mc.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  const dab = (a, b) => {
    mx.globalCompositeOperation = mode === 'erase' ? 'source-over' : 'destination-out';
    mx.strokeStyle = mx.fillStyle = 'rgb(225,45,45)'; mx.lineWidth = size; mx.lineCap = 'round';
    mx.beginPath(); mx.moveTo(a[0], a[1]); mx.lineTo(b[0], b[1]); mx.stroke();
  };
  mc.addEventListener('pointerdown', e => {
    e.preventDefault(); mc.setPointerCapture(e.pointerId);
    undo.push(mx.getImageData(0, 0, W, H)); if(undo.length > 8) undo.shift();
    last = pos(e); dab(last, last);
  });
  mc.addEventListener('pointermove', e => { if(!last) return; const p2 = pos(e); dab(last, p2); last = p2; });
  const end = () => { last = null; };
  mc.addEventListener('pointerup', end); mc.addEventListener('pointercancel', end);
  rt.onclick = e => {
    const m = e.target.closest('[data-mode]');
    if(m){ mode = m.dataset.mode; rt.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-current', b === m)); return; }
    const z = e.target.closest('[data-size]');
    if(z){ size = +z.dataset.size; rt.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-pressed', b === z)); return; }
    const a = e.target.closest('[data-rt]'); if(!a) return;
    if(a.dataset.rt === 'undo'){ const u = undo.pop(); if(u){ mx.globalCompositeOperation = 'source-over'; mx.putImageData(u, 0, 0); } return; }
    if(a.dataset.rt === 'cancel'){ rt.close(); return; }
    if(a.dataset.rt === 'ok'){
      const al = mx.getImageData(0, 0, W, H).data, out = new Uint8Array(W * H);
      for(let p = 0; p < W * H; p++) out[p] = al[p*4+3] < 128 ? 1 : 0;
      const cut = finalizeCut(base, out, false);
      rt.close();
      if(cut){ onDone(cut); toast('Retouche enregistrée.'); } else toast('Il ne reste presque rien : retouche annulée.');
    }
  };
}
