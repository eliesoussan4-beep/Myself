<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon quotidien">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mêmes couleurs que les apps : sombre par défaut si le téléphone est en sombre */
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --warn:#A8432C; --sun:#E9A92C; --rain:#4F82C9;
  --today:#E8962E; --today-soft:#FFF1DC; --tomorrow:#7B5CD6; --tomorrow-soft:#EFE9FF; --tomorrow-card:#F3EEFF; --box:#B3BBC8;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B; --sun:#F2BD4E; --rain:#7EA8E6;
    --today:#F0A648; --today-soft:#3B2C15; --tomorrow:#A58CF0; --tomorrow-soft:#2A2342; --tomorrow-card:#221D35; --box:#4A5468;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B; --sun:#F2BD4E; --rain:#7EA8E6;
  --today:#F0A648; --today-soft:#3B2C15; --tomorrow:#A58CF0; --tomorrow-soft:#2A2342; --tomorrow-card:#221D35; --box:#4A5468;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}

/* ---------- Vues : l'accueil + une fenêtre par app ---------- */
#vues{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.vue{position:absolute;left:0;top:env(safe-area-inset-top,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;margin:0;background:var(--bg);visibility:hidden}
.vue.on{visibility:visible;z-index:1}
#v-accueil{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---------- Barre du bas ---------- */
#barre{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#onglets{display:grid;max-width:640px;margin:0 auto;height:var(--nav-h)}
#onglets button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0;padding:0 2px}
#onglets button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#onglets button[aria-current="page"]{color:var(--denim)}
#onglets.serre button{font-size:10.5px;letter-spacing:-.02em}

/* ---------- Accueil ---------- */
main{max-width:640px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2px 6px}
.tete{align-items:center}
.tete h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,8.4vw,40px);line-height:1;letter-spacing:-.025em}
.rond{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.bloc{--c:var(--c-c,var(--denim));width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--ink);transition:transform .12s;cursor:pointer;position:relative;overflow:hidden}
:root[data-theme="dark"] .bloc{--c:var(--c-s,var(--denim))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bloc{--c:var(--c-s,var(--denim))}}
.bloc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.bloc{padding-top:18px}
.bloc:active{transform:scale(.985)}
.bloc-t{display:flex;align-items:center;gap:10px}
.bloc-ico{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.bloc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bloc-t{font-family:var(--display);font-weight:700;font-size:17px}
.bloc-t small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.bloc-ouvrir{border:0;background:none;color:var(--c);padding:4px;margin:-4px;display:flex}
.vide{margin:0;font-size:14px;color:var(--muted)}
.gr2{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:12px;align-items:stretch}
.wx2{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;background:var(--sunk);border-radius:16px;padding:12px;height:100%;box-sizing:border-box}
.wx2 .wx-ico{font-size:34px;margin-bottom:2px}
.wx2 .pastille{margin-top:6px}
.tenue2{display:flex;flex-direction:column;gap:6px;min-width:0}
.tenue2 .slides.mini{flex:1}
.tenue2 .slides.mini .slide{justify-content:space-between}
.piece-img{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.piece-img img{max-width:100%;max-height:170px;object-fit:contain}
.slide.piece.sale .piece-img{opacity:.45}
.ts-b.off{background:var(--line);color:var(--ink)}
.tenue2 .tenue-n{font-size:14px;font-weight:600}
.sil-box{--silh:190px;display:flex;justify-content:center}
.sil-box .sil-wrap{width:100%;box-sizing:border-box;padding:10px 8px}
.slides.mini{margin:0;padding:0;gap:8px}
.slides.mini .slide{padding:8px;gap:6px;align-items:stretch;background:var(--sunk)}
.tslide .sil-box{--silh:180px}
.ts-n{font-size:13px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-b{border:0;border-radius:10px;background:var(--c);color:var(--on-denim);font:600 13px/1 var(--body);padding:9px 10px}
/* Silhouette de la garde-robe (mêmes règles que dans l'app) */
:root{--rod1:#e9ecef;--rod2:#a7aeb7}
:root[data-theme="dark"]{--rod1:#9aa1aa;--rod2:#5d646d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rod1:#9aa1aa;--rod2:#5d646d}}
.sil-wrap{background:var(--sunk);border-radius:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;box-sizing:content-box;height:var(--silh,58vh)}
.sil-wrap .sil{flex:none}
.sil{position:relative;margin:0 auto;container-type:inline-size}
.sil .legs,.sil .head{position:absolute;border:0;background:none;padding:0;pointer-events:none}
.sil .legs svg{display:block;overflow:visible}
.sil .head{display:flex;align-items:center;justify-content:center;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.sil img{position:absolute;max-width:none;object-fit:fill}
.sil .part{position:absolute;overflow:hidden}
.sil .sh{position:absolute;filter:drop-shadow(0 0 2px rgba(0,0,0,.35))}
.sil .mk{position:absolute;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.sil-wrap .strip{display:flex;gap:6px;margin-top:8px}
.sil-wrap .th{width:28px;height:28px;border-radius:8px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sil-wrap .th img{width:100%;height:100%;object-fit:contain}
.wx{display:flex;align-items:center;gap:14px}
.wx-ico{font-size:40px;line-height:1}
.wx-t{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.wx-s{font-size:14px;color:var(--muted)}
.tenue{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tenue-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tenue-n{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;color:var(--today);background:var(--today-soft)}
.pastille.demain{color:var(--tomorrow);background:var(--tomorrow-soft)}
.vignettes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vignettes > *{aspect-ratio:3/4;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600;overflow:hidden}
.vignettes img{width:100%;height:100%;object-fit:contain}
.vignettes .plus{background:none;border:1px dashed var(--line)}
.evts{display:flex;flex-direction:column;gap:6px}
.ocs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px;overscroll-behavior-x:contain}
.ocs::-webkit-scrollbar{display:none}
.oc{flex:0 0 calc(45% - 4px);scroll-snap-align:start;min-height:84px;border-radius:14px;background:var(--sunk);padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;font-size:14.5px;min-width:0}
.oc .oc-t{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.oc em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--warn)}
.oc-ev{background:var(--tomorrow-card)}
.oc-ev b{font-size:13px;color:var(--tomorrow)}
.oc.faite .oc-t{text-decoration:line-through;color:var(--muted);font-weight:500}
.slide.tache{flex-direction:row;align-items:center;gap:12px;padding:14px;border-bottom:0}
.slide-cat{font-size:12px;font-weight:600;color:var(--sc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minut{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:99px;background:var(--sc);color:var(--on-denim);font:700 12px/1 var(--body);padding:6px 10px;margin-left:8px}
.slide-h{flex-wrap:wrap}
.obar{display:flex;justify-content:space-between;gap:8px}
.obtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:99px;padding:7px 13px;font:600 13px/1 var(--body)}
.obtn svg{color:var(--c)}
.slide-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.slide.tache .coche{width:40px;height:40px;border-radius:12px;border-color:var(--sc);margin:0}
.slide.tache.faite .coche{background:var(--sc);border-color:var(--sc)}
.slide.tache.faite .slide-n{text-decoration:line-through;color:var(--muted)}
/* Couleurs des catégories de l'Organisation (mêmes valeurs que dans l'app) */
:root{--c-forest:#1E5E33; --c-mint:#237A5C; --c-cyan:#0E7480; --c-indigo:#3A41A8; --c-plum:#7D2E68; --c-rose:#B03A5B; --c-red:#B42D2D; --c-orange:#B25A12; --c-amber:#946200; --c-olive:#66611C; --c-brown:#6E4426; --c-gray:#5F6670; --c-sky:#146C93; --c-lime:#5A7A12; --c-fuchsia:#96309F; --c-sand:#8A6334; --c-green:#2F7A4A; --c-pink:#A83E6E; --c-teal:#1F7C78; --c-yellow:#8A6A0E; --c-purple:#6A4BC4; --c-coral:#B4532F; --c-blue:#2F4C78;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-forest:#4FAE6A; --c-mint:#8EE3C4; --c-cyan:#4FD8E6; --c-indigo:#8C93F0; --c-plum:#C77BB0; --c-rose:#F4A3B8; --c-red:#F07272; --c-orange:#F5A25D; --c-amber:#FFC24D; --c-olive:#BDB76B; --c-brown:#C29572; --c-gray:#C9CDD4; --c-sky:#63C7EE; --c-lime:#B8D65A; --c-fuchsia:#D47FE0; --c-sand:#D6B48C; --c-green:#7CC992; --c-pink:#E98BB5; --c-teal:#5EC4C0; --c-yellow:#E3C35A; --c-purple:#A58CF0; --c-coral:#EE9A7A; --c-blue:#8FB0E3;}}
:root[data-theme="dark"]{--c-forest:#4FAE6A; --c-mint:#8EE3C4; --c-cyan:#4FD8E6; --c-indigo:#8C93F0; --c-plum:#C77BB0; --c-rose:#F4A3B8; --c-red:#F07272; --c-orange:#F5A25D; --c-amber:#FFC24D; --c-olive:#BDB76B; --c-brown:#C29572; --c-gray:#C9CDD4; --c-sky:#63C7EE; --c-lime:#B8D65A; --c-fuchsia:#D47FE0; --c-sand:#D6B48C; --c-green:#7CC992; --c-pink:#E98BB5; --c-teal:#5EC4C0; --c-yellow:#E3C35A; --c-purple:#A58CF0; --c-coral:#EE9A7A; --c-blue:#8FB0E3;}

.evt{display:flex;align-items:center;gap:12px;background:var(--tomorrow-card);border-radius:12px;padding:9px 12px;font-size:15px}
.evt b{font-size:14px;color:var(--tomorrow);min-width:44px}
.taches{display:flex;flex-direction:column}
.tache{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.tache:last-child{border-bottom:0}
.oc.tache{border-bottom:0;padding:10px 12px}
.coche{width:26px;height:26px;border-radius:8px;border:2px solid var(--box);flex:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:var(--on-denim);margin:-3px 0}
.tache.prio .coche{border-color:var(--today)}
.tache.faite .coche{background:var(--c);border-color:var(--c)}
.tache.faite span{text-decoration:line-through;color:var(--muted)}
.tache span{flex:1;min-width:0}
.tache em{font-style:normal;font-size:12px;font-weight:600;color:var(--warn);white-space:nowrap}

.encore{font-size:13px;color:var(--muted);padding-top:6px}
.total{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.total b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.total span{font-size:14px;color:var(--muted)}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;background:var(--sunk);border-radius:99px;padding:5px 11px;max-width:100%}
.puce.plus{background:none;border:1px dashed var(--line);color:var(--muted)}
.bas{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.bas b{color:var(--warn);font-weight:600;white-space:nowrap}
.bas span{color:var(--muted)}
.alerte{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface));color:var(--ink);border-radius:16px;padding:12px 14px}
.alerte b{color:var(--warn);font-size:15px}
.alerte span{font-size:13px;color:var(--muted)}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
/* Couleur de la catégorie du plateau (comme dans Backstage) : 0 rouge, 1 jaune, 2 vert */
.slide{--sc:var(--c)}
.slide.t0{--sc:#B84A3E}.slide.t1{--sc:#B7832F}.slide.t2{--sc:#2F7A4A}
:root[data-theme="dark"] .slide.t0{--sc:#E58A84}:root[data-theme="dark"] .slide.t1{--sc:#E0B266}:root[data-theme="dark"] .slide.t2{--sc:#7CC992}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slide.t0{--sc:#E58A84}:root:not([data-theme="light"]) .slide.t1{--sc:#E0B266}:root:not([data-theme="light"]) .slide.t2{--sc:#7CC992}}
.slide{flex:0 0 100%;scroll-snap-align:center;background:color-mix(in srgb,var(--sc) 22%,var(--sunk));border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.slide-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slide-h b{font-size:16px;font-weight:700;color:var(--sc)}
.slide-tag{font-size:12px;font-weight:600;color:var(--muted)}
.slide-type{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:99px;padding:3px 10px;white-space:nowrap}
.slide-n{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slide-a{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.points{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.points span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.points span.on{background:var(--c);width:16px;border-radius:3px}
.slides.mini .slide{--sc:var(--c)}
.slide.rc{--sc:var(--scl)}
:root[data-theme="dark"] .slide.rc{--sc:var(--scd)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slide.rc{--sc:var(--scd)}}
.slide-n .pe{margin-right:8px}
.slide-h b.presque{color:var(--warn)}
.bilan{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.bilan b{color:var(--ink);font-weight:600}
.etoiles{color:var(--today);letter-spacing:1px;white-space:nowrap}
.etoiles i{font-style:normal;color:var(--line)}

/* ---------- Feuille Sauvegarde & réglages ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:92dvh;border-radius:22px 22px 0 0;margin:auto auto 0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (min-width:600px){dialog{border-radius:22px;margin:auto}}
.feuille{padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.feuille h2{margin:0;font-family:var(--display);font-size:22px}
.feuille h3{margin:8px 0 0;font-family:var(--display);font-size:17px}
.hint{margin:0;font-size:14px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;width:100%}
.btn.primaire{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.ligne2{display:flex;gap:8px}
.etat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.etat div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.etat div:last-child{border-bottom:0}
.etat span{color:var(--muted)}
.segment{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.segment button{border:0;background:none;border-radius:9px;padding:8px 0;font-size:14px;font-weight:600;color:var(--muted)}
.segment button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.version{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}

<body>
<div id="vues">
  <section id="v-accueil" class="vue" aria-label="Accueil"><main id="accueil"></main></section>
</div>
<nav id="barre" aria-label="Applications"><div id="onglets"></div></nav>
<dialog id="reglages" aria-label="Sauvegarde et réglages"></dialog>
<dialog id="retours" aria-label="Noter une modif"></dialog>
<button type="button" id="retour-btn" aria-label="Noter une modif" hidden></button>
<input type="file" id="fichier" accept="application/json,.json" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const APPS = self.APPS || [];
const VERSION = self.VERSION_QUOTIDIEN || 1;
const ICONE_ACCUEIL = '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/>';
const svg = (inner, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

/* ---------- Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const plur = (n, un, plusieurs) => `${n} ${n > 1 ? plusieurs : un}`;
const pause = ms => new Promise(r => setTimeout(r, ms));
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }

/* ---------- Thème (Auto / Sombre / Clair), appliqué aussi aux apps ---------- */
const CLE_THEME = 'quotidien-theme';
function themeChoisi(){ try{ return localStorage.getItem(CLE_THEME) || 'auto'; }catch(e){ return 'auto'; } }
function appliquerTheme(doc){
  if(!doc) return;
  const t = themeChoisi(), el = doc.documentElement;
  if(t === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', t);
}
function appliquerPartout(){
  appliquerTheme(document);
  for(const f of frames.values()){ try{ appliquerTheme(f.contentDocument); }catch(e){} }
}

/* ---------- Vues et barre ---------- */
const frames = new Map();     // id → <iframe>
const cacheeDepuis = new Map();
let actif = null;

function creerFrame(app, query = ''){
  let f = frames.get(app.id);
  if(f) return f;
  f = document.createElement('iframe');
  f.className = 'vue';
  f.title = app.nom;
  f.inert = true;
  f.setAttribute('allow', 'camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *; web-share *; fullscreen *');
  f.charge = new Promise(res => f.addEventListener('load', res, {once:true}));
  f.addEventListener('load', () => {
    try{ appliquerTheme(f.contentDocument); }catch(e){}
    brancherHistorique(f, app);
    planifierAccueil(1500);   // ex. les Courses complètent leur liste à l'ouverture
  });
  f.src = app.dossier + query;
  $('#vues').appendChild(f);
  frames.set(app.id, f);
  return f;
}
/* Bouton « retour » : les apps ne créent plus d'entrées d'historique dans leur fenêtre.
   Leur history.pushState / back passe par la coquille, qui garde une seule pile (fiable sur Android). */
function brancherHistorique(f, app){
  let w; try{ w = f.contentWindow; if(!w || w.__quotidienHist) return; w.__quotidienHist = true; }catch(e){ return; }
  const h = w.history, origReplace = h.replaceState.bind(h);
  let base = null; f.pile = [];
  try{
    Object.defineProperty(h, 'state', {configurable:true, get:() => f.pile.length ? f.pile[f.pile.length - 1] : base});
    h.pushState = st => {
      if(actif !== app.id) return;
      f.pile.push(st === undefined ? null : st);
      history.pushState({app:app.id, p:f.pile.length}, '', location.pathname + '#' + app.id);
    };
    h.replaceState = (st, titre, url) => {
      if(f.pile.length) f.pile[f.pile.length - 1] = st === undefined ? null : st; else base = st === undefined ? null : st;
      if(url != null){ try{ origReplace(null, '', url); }catch(e){} }
    };
    h.back = () => { if(f.pile.length) history.back(); };
    h.go = n => { if(n < 0 && f.pile.length) history.go(Math.max(n, -f.pile.length)); };
  }catch(e){ console.warn('historique', e); }
}
function vueDe(id){ return id === 'accueil' ? $('#v-accueil') : frames.get(id); }
function montrer(id, {query = '', historique = false} = {}){
  if(id === actif){   // 2e appui sur l'onglet actif : retour en haut
    try{ (id === 'accueil' ? $('#v-accueil') : frames.get(id).contentWindow).scrollTo({top:0, behavior:'smooth'}); }catch(e){}
    return;
  }
  const avant = vueDe(actif);
  if(avant && avant.pile) avant.pile.length = 0;   // on quitte l'app : ses niveaux internes ne sont plus dans l'historique
  if(avant){ avant.classList.remove('on'); avant.inert = true; if(actif !== 'accueil') cacheeDepuis.set(actif, Date.now()); }
  actif = id;
  let v;
  if(id === 'accueil'){ v = $('#v-accueil'); rafraichirAccueil(); }
  else {
    const app = APPS.find(a => a.id === id);
    v = creerFrame(app, query);
    const t = cacheeDepuis.get(id);
    // Une app cachée ne sait pas qu'on revient : on la prévient comme si on rouvrait l'app (météo, agendas…)
    if(t && Date.now() - t > 30000){ try{ v.contentDocument.dispatchEvent(new Event('visibilitychange')); }catch(e){} }
    cacheeDepuis.delete(id);
  }
  v.classList.add('on'); v.inert = false;

  document.querySelectorAll('#onglets button').forEach(b => { if(b.dataset.id === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  // Bouton « retour » d'Android : depuis une app, il ramène à l'Accueil (au lieu de fermer Mon quotidien)
  if(!historique){
    const url = location.pathname + (id === 'accueil' ? '' : '#' + id);
    try{
      if(id !== 'accueil' && !(history.state && history.state.app)) history.pushState({app:id, p:0}, '', url);
      else history.replaceState(id === 'accueil' ? null : {app:id, p:0}, '', url);
    }catch(e){}
  }
}
function construireBarre(){
  const items = [{id:'accueil', nom:'Accueil', icone:ICONE_ACCUEIL}, ...APPS];
  const o = $('#onglets');
  o.style.gridTemplateColumns = `repeat(${items.length}, minmax(0, 1fr))`;
  o.classList.toggle('serre', items.length > 4);
  o.innerHTML = items.map(a => `<button type="button" data-id="${esc(a.id)}">${svg(a.icone)}<span>${esc(a.nom)}</span></button>`).join('');
  o.addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if(b) montrer(b.dataset.id); });
}
// Les apps sont chargées en arrière-plan, une par une : ensuite, passer de l'une à l'autre est instantané
function precharger(){
  let i = 0;
  const suite = () => {
    const app = APPS[i++]; if(!app) return;
    creerFrame(app).charge.then(() => setTimeout(suite, 600));
  };
  setTimeout(suite, 900);
}

/* ---------- Lecture des bases des apps (sans jamais rien créer ni modifier) ---------- */
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function baseExiste(nom){
  if(indexedDB.databases){ try{ return (await indexedDB.databases()).some(d => d.name === nom); }catch(e){} }
  return null;   // inconnu : ouvrir() s'en charge
}
function ouvrir(nom){
  return new Promise(res => {
    let r;
    try{ r = indexedDB.open(nom); }catch(e){ return res(null); }
    let neuve = false;
    // La base n'existe pas encore : on annule, pour ne surtout pas créer une base vide à la place de l'app
    r.onupgradeneeded = () => { neuve = true; try{ r.transaction.abort(); }catch(e){} };
    r.onsuccess = () => { const db = r.result; if(neuve){ db.close(); return res(null); } db.onversionchange = () => db.close(); res(db); };
    r.onerror = e => { if(e && e.preventDefault) e.preventDefault(); res(null); };
  });
}
async function ouvrirBase(nom){ return (await baseExiste(nom)) === false ? null : ouvrir(nom); }
async function lire(nom, fn){
  const db = await ouvrirBase(nom);
  if(!db) return null;
  try{ return await fn(db); } finally{ db.close(); }   // jamais de base laissée ouverte
}
const aTable = (db, t) => db.objectStoreNames.contains(t);
const tout = (db, t) => aTable(db, t) ? req(db.transaction(t).objectStore(t).getAll()) : Promise.resolve([]);
// Apps qui rangent leurs données dans localStorage (ex. Backstage) : toutes les clés qui commencent par leur préfixe
const clesLocales = app => { const out = []; try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith(app.prefixe)) out.push(k); } }catch(e){} return out; };
const estLocale = app => app.stockage === 'localStorage' && !!app.prefixe;
const un = (db, t, k) => aTable(db, t) && k != null ? req(db.transaction(t).objectStore(t).get(k)) : Promise.resolve(undefined);

/* ---------- Garde-robe : météo et tenue prévue ---------- */
const WMO = c => c == null ? null :
  c === 0 ? ['☀️', 'Ciel dégagé'] : c === 1 ? ['🌤️', 'Plutôt ensoleillé'] : c === 2 ? ['⛅', 'Partiellement nuageux'] : c === 3 ? ['☁️', 'Couvert'] :
  c <= 48 ? ['🌫️', 'Brouillard'] : c <= 55 ? ['🌦️', 'Bruine'] : c <= 57 ? ['🌧️', 'Bruine verglaçante'] :
  c === 61 ? ['🌧️', 'Pluie faible'] : c === 63 ? ['🌧️', 'Pluie modérée'] : c === 65 ? ['🌧️', 'Forte pluie'] : c <= 67 ? ['🌧️', 'Pluie verglaçante'] :
  c <= 75 ? ['🌨️', 'Neige'] : c === 77 ? ['🌨️', 'Grains de neige'] : c <= 82 ? ['🌦️', 'Averses'] : c <= 86 ? ['🌨️', 'Averses de neige'] :
  c === 95 ? ['⛈️', 'Orage'] : ['⛈️', 'Orage avec grêle'];
let meteoMem = null;
async function meteo(v){
  const cle = v.lat + ',' + v.lon;
  if(meteoMem && meteoMem.cle === cle && Date.now() - meteoMem.t < 20 * 60e3) return meteoMem.jours;
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 8000);
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${v.lat}&longitude=${v.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2`;
    const d = (await (await fetch(url, {signal:ctrl.signal})).json()).daily, jours = {};
    d.time.forEach((j, i) => { jours[j] = {max:Math.round(d.temperature_2m_max[i]), min:Math.round(d.temperature_2m_min[i]), pluie:d.precipitation_probability_max[i] ?? 0, code:d.weather_code[i]}; });
    meteoMem = {cle, t:Date.now(), jours};
    return jours;
  }catch(e){ return null; } finally{ clearTimeout(to); }
}
// La garde-robe calcule elle-même la tenue (silhouette avec la tête emoji) et ses propositions
async function attendreApp(id, test){
  const app = APPS.find(a => a.id === id); if(!app) return null;
  const f = creerFrame(app); await f.charge;
  for(let i = 0; i < 40; i++){ try{ const w = f.contentWindow; if(test(w)) return w; }catch(e){} await pause(150); }
  return null;
}
async function lireGardeRobe(){
  const reg = await lire('garde-robe', db => un(db, 'kv', 'settings'));
  if(reg === null) return null;   // pas de garde-robe sur ce téléphone
  const n = new Date().getHours() >= 18 ? 1 : 0;   // le soir, on prépare demain
  const dj = new Date(); dj.setDate(dj.getDate() + n);
  const w = await attendreApp('garde-robe', w => w.quotidienGR && w.quotidienGR.pret());
  let tenue = null, props = [], vide = false;
  if(w){
    tenue = w.quotidienGR.jour(n);
    if(!tenue) props = w.quotidienGR.propositions(n);
    vide = !w.quotidienGR.nbPieces();
  }
  return {n, jour:iso(dj), demain:n === 1, ville:(reg && reg.city) || {name:'Paris', lat:48.8566, lon:2.3522}, tenue, props, vide};
}
const visuelTenue = x => x.html ? `<div class="sil-box">${x.html}</div>`
  : `<div class="vignettes">${(x.vignettes || []).map(src => `<div><img src="${esc(src)}" alt=""></div>`).join('') || `<div>${svg('<path d="M9 3.5 4 6 2.5 10.5 6 12v8.5h12V12l3.5-1.5L20 6l-5-2.5a3 3 0 0 1-6 0Z"/>', 22)}</div>`}</div>`;
function blocGardeRobe(d, jours){
  if(!d) return `<p class="vide">Pas encore de garde-robe sur ce téléphone. Ouvre-la, ou importe ta sauvegarde avec le bouton en haut à droite.</p>`;
  const w = jours && jours[d.jour], desc = w && WMO(w.code);
  const wx = w
    ? `<div class="wx2" data-aller="garde-robe" data-action="meteo"><span class="wx-ico" aria-hidden="true">${desc ? desc[0] : '⛅'}</span><span class="wx-t">${w.max}°</span><span class="wx-s">min ${w.min}°</span><span class="wx-s">pluie ${w.pluie} %</span><span class="wx-s">${esc(d.ville.name)}</span>${d.demain ? '<span class="pastille demain">Demain</span>' : ''}</div>`
    : `<div class="wx2" data-aller="garde-robe" data-action="meteo"><span class="wx-ico" aria-hidden="true">⛅</span><span class="wx-s">${jours === undefined ? 'Météo…' : 'Météo indisponible'}</span><span class="wx-s">${esc(d.ville.name)}</span></div>`;
  let droite;
  if(d.tenue){
    const pcs = (d.tenue.pieces || []);
    const sl = [`<div class="slide tslide" data-aller="garde-robe" data-action="tenue" data-id="${esc(d.tenue.id)}">${visuelTenue(d.tenue)}<div class="ts-n">${esc(d.tenue.nom)}</div></div>`,
      ...pcs.map(x => `<div class="slide tslide piece${x.sale ? ' sale' : ''}" data-aller="garde-robe" data-action="piece" data-id="${esc(x.id)}"><div class="piece-img">${x.src ? `<img src="${esc(x.src)}" alt="">` : svg('<path d="M9 3.5 4 6 2.5 10.5 6 12v8.5h12V12l3.5-1.5L20 6l-5-2.5a3 3 0 0 1-6 0Z"/>', 26)}</div><div class="ts-n">${esc(x.nom)}</div><button type="button" class="ts-b${x.sale ? ' off' : ''}" data-sale="${esc(x.id)}">${x.sale ? 'Au sale · remettre propre' : '🧺 Au sale'}</button></div>`)];
    droite = `<div class="tenue2"><div class="slides mini" data-ouvrir="garde-robe">${sl.join('')}</div>${sl.length > 1 ? `<div class="points" aria-hidden="true">${sl.map((_, i) => `<span${i ? '' : ' class="on"'}></span>`).join('')}</div>` : ''}</div>`;
  }
  else if(d.props.length){
    droite = `<div class="tenue2">
      <div class="slides mini" data-ouvrir="garde-robe">${d.props.map(x => `<div class="slide tslide" data-aller="garde-robe" data-action="tenue" data-id="${esc(x.id)}">${visuelTenue(x)}<div class="ts-n">${esc(x.nom)}</div><button type="button" class="ts-b" data-choisir="${esc(x.id)}" data-n="${d.n}">Choisir pour ${d.demain ? 'demain' : 'aujourd’hui'}</button></div>`).join('')}</div>
      ${d.props.length > 1 ? `<div class="points" aria-hidden="true">${d.props.map((_, i) => `<span${i ? '' : ' class="on"'}></span>`).join('')}</div>` : ''}</div>`;
  }
  else droite = `<div class="tenue2"><p class="vide">${d.vide ? 'Ajoute tes vêtements dans la garde-robe.' : 'Aucune tenue propre à proposer.'}</p></div>`;
  return `<div class="gr2">${wx}${droite}</div>`;
}

/* ---------- Organisation : événements et tâches du jour (mêmes règles que l'app) ---------- */
const JC = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => (parseD(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -dow(s));
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const monthIdx = s => { const x = parseD(s); return x.getFullYear() * 12 + x.getMonth(); };
const shortDate = s => JC[dow(s)] + ' ' + parseD(s).getDate();
function monthOcc(r, y, m){
  const n = dim(y, m), mode = r.mode || 'dom', wd = r.wd || 0;
  if(mode === 'dom') return iso(new Date(y, m, Math.min(r.dom || 1, n)));
  if(mode === 'lastday') return iso(new Date(y, m, n));
  if(mode === 'nth'){ const first = dow(iso(new Date(y, m, 1))); const day = 1 + ((wd - first + 7) % 7) + 7 * ((r.nth || 1) - 1); return day <= n ? iso(new Date(y, m, day)) : null; }
  if(mode === 'last'){ const lastDow = dow(iso(new Date(y, m, n))); return iso(new Date(y, m, n - ((lastDow - wd + 7) % 7))); }
  if(mode === 'near'){ const target = iso(new Date(y, m, Math.min(r.dom || 1, n))); let s = (wd - dow(target) + 7) % 7; if(s > 3) s -= 7; return addDays(target, s); }
  return null;
}
function occursOn(t, d){
  if(t.kind === 'event'){ if(!t.date) return false; return t.yearly ? (d >= t.date && d.slice(5) === t.date.slice(5)) : t.date === d; }
  if(t.free) return false;
  if(!t.rep) return t.date === d;
  if(t.skip && t.skip.includes(d)) return false;
  const start = t.date || t.created;
  if(!start || d < start) return false;
  const r = t.rep;
  if(r.unit === 'jour') return diffDays(start, d) % (r.every || 1) === 0;
  if(r.unit === 'sem'){ const days = r.days && r.days.length ? r.days : [dow(start)]; if(!days.includes(dow(d))) return false; return Math.round(diffDays(mondayOf(start), mondayOf(d)) / 7) % (r.every || 1) === 0; }
  if(r.unit === 'an') return d.slice(5) === start.slice(5) && (parseD(d).getFullYear() - parseD(start).getFullYear()) % (r.every || 1) === 0;
  if(r.unit === 'mois'){
    const sm = monthIdx(start), dm = monthIdx(d);
    for(const off of [0, -1, 1]){ const mi = dm + off; if(mi < sm || (mi - sm) % (r.every || 1)) continue; if(monthOcc(r, Math.floor(mi / 12), mi % 12) === d) return true; }
    return false;
  }
  return false;
}
const isDone = (t, d) => (t.free || t.info) ? false : (t.rep || (t.kind === 'event' && t.yearly)) ? (t.doneDates || []).includes(d) : !!t.done;
const isEvent = t => !!t && !!t.info && !t.free;
function prevOcc(t, before){ for(let i = 1; i <= 62; i++){ const d = addDays(before, -i); if(occursOn(t, d)) return d; } return null; }
function nextOcc(t, from){ if(!t.rep && !(t.kind === 'event' && t.yearly)) return t.date; for(let i = 0; i < 400; i++){ const d = addDays(from, i); if(occursOn(t, d)) return d; } return null; }
function lateEntries(tasks, t){
  const out = [];
  tasks.forEach(x => {
    if(x.info || x.kind === 'event') return;
    if(!x.rep){ if(x.date && x.date < t && !isDone(x, x.date)) out.push({t:x, d:x.date}); return; }
    const p = prevOcc(x, t); if(!p || (x.created && p < x.created)) return;
    const nx = nextOcc(x, addDays(p, 1)), win = Math.floor((nx ? diffDays(p, nx) : 30) / 2);
    if(diffDays(p, t) > win) return;
    if(!isDone(x, p)) out.push({t:x, d:p});
  });
  return out.sort((a, b) => a.d < b.d ? -1 : 1);
}
async function lireOrganisation(){
  return lire('organisation', async db => {
    const [tasks, themes] = await Promise.all([tout(db, 'tasks'), tout(db, 'themes')]);
    const t = iso(new Date()), jour = tasks.filter(x => occursOn(x, t));
    const evts = jour.filter(isEvent).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1);
    const taches = jour.filter(x => !isEvent(x));
    const restantes = [...lateEntries(tasks, t).map(e => ({...e, retard:true})),
      ...taches.filter(x => !isDone(x, t)).sort((a, b) => (b.prio ? 1 : 0) - (a.prio ? 1 : 0)).map(x => ({t:x, d:t}))];
    const faitesL = taches.filter(x => isDone(x, t)).map(x => ({t:x, d:t, fait:true}));
    return {evts, restantes, faitesL, faites:faitesL.length, themes:new Map(themes.map(th => [th.id, th]))};
  });
}

  const ev = d.evts.map(e => `<div class="slide"${coul(e)}${lien(e, iso(new Date()))}>${cat(e)}<div class="slide-n">${esc(e.title)}</div><div class="slide-h"><b>${esc(heure(e) || 'Toute la journée')}</b></div></div>`);
  const ta = [...d.restantes, ...d.faitesL].map(e => `<div class="slide tache${e.fait ? ' faite' : ''}"${coul(e.t)}${lien(e.t, e.d)}><div class="slide-l">${cat(e.t)}<div class="slide-n">${esc(e.t.title)}</div><div class="slide-h"><b>${e.retard ? `en retard · ${esc(shortDate(e.d))}` : heure(e.t) || (e.fait ? 'Faite' : 'À faire')}</b>${e.fait ? '' : minut(e.t, e.d)}</div></div><button type="button" class="coche" data-coche="${esc(e.t.id)}" data-d="${esc(e.d)}"${e.retard ? ' data-late="1"' : ''} aria-label="${e.fait ? 'Décocher' : 'Cocher'} ${esc(e.t.title)}">${e.fait ? svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18) : ''}</button></div>`);

/* ---------- Courses : liste et produits presque vides (mêmes calculs que l'app) ---------- */
const DAY = 864e5;
const RAYON_EMOJI = {fl:'🥬', frais:'🥛', viande:'🥩', pain:'🥖', epicerie:'🥫', boissons:'🥤', surgeles:'🧊', hygiene:'🧴', maison:'🏠', autre:'🛒'};
const lastQty = p => (p.purchases || []).length ? p.purchases[p.purchases.length - 1].q : null;
const packOf = p => p.pack || lastQty(p) || 1;
function rate(p){
  if(p.everyDays > 0) return packOf(p) / p.everyDays;
  const ps = (p.purchases || []).slice().sort((a, b) => a.d - b.d);
  if(ps.length < 2) return null;
  const span = (ps[ps.length - 1].d - ps[0].d) / DAY; if(span < 1) return null;
  const used = ps.slice(0, -1).reduce((s, x) => s + x.q, 0);
  return used > 0 ? used / span : null;
}
function stockAt(p){ if(p.stockAt == null) return null; const r = rate(p) || 0; return Math.max(0, (p.stockQty || 0) - r * Math.max(0, (Date.now() - p.stockAt) / DAY)); }
function stockPct(p){ const s = stockAt(p); if(s == null) return null; const ref = Math.max(packOf(p), ...(p.purchases || []).map(x => x.q), p.stockQty || 0, 0.0001); return Math.max(0, Math.min(100, s / ref * 100)); }
function daysLeft(p){ const r = rate(p), s = stockAt(p); return r && s != null ? s / r : null; }
async function lireCourses(){
  return lire('courses', async db => {
    const [products, list, tickets] = await Promise.all([tout(db, 'products'), tout(db, 'list'), tout(db, 'tickets')]);
    const P = new Map(products.map(p => [p.id, p])), prix = new Map();
    for(const t of tickets.slice().sort((a, b) => a.date - b.date)) for(const l of t.lines || []) if(l.pid && l.price != null && l.qty > 0) prix.set(l.pid, l.price / l.qty);
    const items = list.filter(i => !i.checked).map(i => ({i, p:P.get(i.pid)})).filter(x => x.p).sort((a, b) => a.p.name.localeCompare(b.p.name, 'fr'));
    let total = 0, connus = 0;
    for(const {i, p} of items){ const u = p.price != null ? p.price : prix.get(p.id); if(u == null || i.format) continue; total += u * (i.qty || 1); connus++; }
    const dans = new Set(items.map(x => x.p.id));
    const bas = products.filter(p => !dans.has(p.id) && !p.never && !(p.snooze > Date.now()))
      .filter(p => { const pc = stockPct(p), d = daysLeft(p); return pc != null && (pc < 20 || (d != null && d < 2)); })
      .sort((a, b) => stockPct(a) - stockPct(b));
    let emojis = {};
    try{ const w = await attendreApp('courses', w => !!w.quotidienCO); if(w) emojis = w.quotidienCO.emojis(); }catch(e){}
    return {items, total, connus, bas, emojis};
  });
}
function prochainesCourses(){
  const n = (5 - new Date().getDay() + 7) % 7;   // le vendredi, comme dans l'app
  return n === 0 ? 'courses aujourd’hui' : n === 1 ? 'courses demain' : 'courses vendredi';
}

const RAYON_C = {fl:['#3E9B5F','#6CC48A'], frais:['#2E8FB8','#6BBFE0'], viande:['#C2504A','#E58A84'], pain:['#B7832F','#E0B266'], epicerie:['#C46A2B','#E89A63'], boissons:['#1F9E8A','#5CCBB7'], surgeles:['#5B7FD6','#93AEF0'], hygiene:['#C04F8E','#E68BBE'], maison:['#7A5CC7','#A893E8'], autre:['#6B7486','#A0A8B8']};

  return h;
}

/* ---------- Backstage : plateaux du jour et bilan du mois ----------
   Backstage est chargée dans sa fenêtre : on utilise ses propres calculs (aucune copie de logique). */
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
async function lireBackstage(){
  const app = APPS.find(a => a.id === 'backstage'); if(!app) return null;
  const f = creerFrame(app);
  await f.charge;
  const w = f.contentWindow;
  if(!w || typeof w.loadScenes !== 'function') return null;
  const toutes = w.loadScenes(), plateaux = w.loadPlateaux();
  if(!toutes.length && !plateaux.length && !(await lireScenesAgenda(1, 0)).length) return null;
  const jour = new Date(); jour.setHours(0, 0, 0, 0);
  let plats = [];
  try{
    plats = w.sortByEffectiveTime(plateaux.filter(p => (p.city || 'Paris') === 'Paris' && w.isPlateauComplete(p) && w.doesPlateauOccur(p, jour)), jour.getDay())
      .map(({p, slot}) => ({nom:p.name, heure:(slot && w.formatPlateauTime(slot.time)) || '', type:slot && slot.type != null ? slot.type : null, adresse:p.address || ''}));
  }catch(e){ console.warn(e); }
  const mois = new Date().toISOString().slice(0, 7);
  const scenes = toutes.filter(s => s.date && s.date.slice(0, 7) === mois);
  const net = scenes.reduce((a, s) => a + ((s.gains || 0) - (s.depenses || 0)), 0);
  let etoiles = null; try{ etoiles = w.computeStarRating().stars; }catch(e){}
  let agenda = []; try{ agenda = await lireScenesAgenda(1, 0); }catch(e){}
  return {plats, agenda, nb:scenes.length, net, etoiles};
}
// Scènes prévues dans l'Organisation (catégorie « Scène » ou 🎤), sur une période
const SCENE_RE = /sc[eè]ne/i;   // pas « Stand-up » (écriture…) : seulement les scènes
async function lireScenesAgenda(avant, apres){
  const r = await lire('organisation', async db => {
    const [tasks, themes] = await Promise.all([tout(db, 'tasks'), tout(db, 'themes')]);
    const nomDe = id => (themes.find(x => x.id === id) || {}).name || '';
    const ids = new Set(themes.filter(th => SCENE_RE.test(th.name || '') || (th.parentId && SCENE_RE.test(nomDe(th.parentId)))).map(th => th.id));
    if(!ids.size) return [];
    const out = [], t0 = new Date();
    for(let i = -avant + 1; i <= apres; i++){
      const x = new Date(t0); x.setDate(x.getDate() + i); const d = iso(x);
      tasks.filter(k => ids.has(k.themeId) && occursOn(k, d)).forEach(k => out.push({titre:k.title, date:d, heure:(k.time || '').replace(':', 'h').replace(/h00$/, 'h')}));
    }
    return out.sort((a, b) => (a.date + a.heure) < (b.date + b.heure) ? -1 : 1);
  });
  return r || [];
}
function blocBackstage(d){
  if(!d) return `<p class="vide">Pas encore de scènes ni de plateaux. Ouvre Backstage pour commencer.</p>`;
  // Une diapo par scène du jour : d'abord celles de ton agenda (là où tu joues), puis les plateaux de Backstage
  const memes = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
  const slides = [
    ...d.agenda.map(a => { const p = d.plats.find(x => memes(x.nom, a.titre)); return {nom:a.titre, heure:a.heure || (p && p.heure) || '', type:p ? p.type : null, adresse:p ? p.adresse : '', prevu:true}; }),
    ...d.plats.filter(p => !d.agenda.some(a => memes(a.titre, p.nom)))
  ];
  const pl = slides.length
    ? `<div class="slides" data-ouvrir="backstage">${slides.map(s => `<div class="slide${s.type != null ? ' t' + s.type : ''}" data-aller="backstage" data-action="plateau" data-nom="${esc(s.nom)}" data-date="${esc(iso(new Date()))}"><div class="slide-n">${esc(s.nom)}</div><div class="slide-h"><b>${esc(s.heure || 'Ce soir')}</b>${s.prevu ? '<span class="slide-tag">🎤 Dans ton agenda</span>' : ''}</div>${s.adresse ? `<div class="slide-a">${esc(s.adresse)}</div>` : ''}</div>`).join('')}</div>${slides.length > 1 ? `<div class="points" aria-hidden="true">${slides.map((_, i) => `<span${i ? '' : ' class="on"'}></span>`).join('')}</div>` : ''}`
    : `<p class="vide">Pas de plateau prévu aujourd’hui.</p>`;
  const signe = d.net >= 0 ? '+' : '−';
  const et = d.etoiles == null ? '' : `<span class="etoiles" aria-label="${(Math.round(d.etoiles * 2) / 2).toString().replace('.', ',')} étoiles sur 5">${'★'.repeat(Math.round(d.etoiles))}<i>${'★'.repeat(5 - Math.round(d.etoiles))}</i></span>`;
  return pl + `<div class="bilan"><span>${cap(MOIS[new Date().getMonth()])} : <b>${plur(d.nb, 'scène', 'scènes')}</b> · <b>${signe}${Math.abs(Math.round(d.net))} €</b></span>${et}</div>`;
}

/* ---------- Blocs de l'accueil : un « lecteur » par app (optionnel) ---------- */

  'garde-robe':   {titre:() => 'Météo et tenue', lire:lireGardeRobe, rendre:d => blocGardeRobe(d, undefined)},
  'organisation': {titre:d => 'Aujourd’hui' + titreOrganisation(d), lire:lireOrganisation, rendre:blocOrganisation},
  'courses':      {titre:() => 'À acheter bientôt', lire:lireCourses, rendre:blocCourses},
  'backstage':    {titre:() => 'Sur scène', lire:lireBackstage, rendre:blocBackstage},
};
const styleCouleur = app => app.couleur ? ` style="--c-c:${app.couleur[0]};--c-s:${app.couleur[1]}"` : '';
// Carte de l'accueil : toucher la carte ouvre l'app ; les cases à cocher et le carrousel restent utilisables dedans
function carte(app, titre, corps){
  return `<div class="bloc" data-ouvrir="${esc(app.id)}"${styleCouleur(app)} role="group" aria-label="${esc(app.nom)}">${corps}</div>`;
}
function squeletteAccueil(){
  const now = new Date();
  $('#accueil').innerHTML = `
    <header class="tete">
      <h1>${esc(cap(now.toLocaleDateString('fr-FR', {weekday:'long'})) + ' ' + now.toLocaleDateString('fr-FR', {day:'numeric', month:'long'}))}</h1>
      <button type="button" class="rond" data-act="reglages" aria-label="Sauvegarde et réglages">${svg('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>', 20)}</button>
    </header>
    <button type="button" class="alerte" id="alerte-drive" data-act="reglages" hidden></button>
    ${APPS.map(a => `<div data-bloc="${esc(a.id)}">${carte(a, LECTEURS[a.id] ? esc(LECTEURS[a.id].titre(null)) : esc(a.nom), LECTEURS[a.id] ? '<p class="vide">Chargement…</p>' : '<p class="vide">Ouvrir l’app</p>')}</div>`).join('')}`;
  $('#accueil').dataset.jour = iso(now);
  alerteDrive();
}
const positions = {};   // position de chaque carrousel, gardée quand la carte se redessine (après avoir coché…)
function brancherSlides(el){
  el.querySelectorAll('.slides').forEach((s, n) => {
    const box = s.parentElement, pts = box.querySelectorAll(':scope > .points span'), cle = (el.dataset.bloc || '') + n;
    const maj = () => { const i = Math.round(s.scrollLeft / Math.max(1, s.clientWidth)); pts.forEach((p, j) => p.classList.toggle('on', i === j)); positions[cle] = s.scrollLeft; };
    if(positions[cle]){ s.scrollLeft = positions[cle]; maj(); }
    s.addEventListener('scroll', maj, {passive:true});
  });
}
let enCours = false, aRefaire = false, minuteur = 0;
function planifierAccueil(ms){ clearTimeout(minuteur); minuteur = setTimeout(rafraichirAccueil, ms); }
async function rafraichirAccueil(){
  if(enCours){ aRefaire = true; return; }
  enCours = true;
  try{
    if(!$('#accueil').firstChild || $('#accueil').dataset.jour !== iso(new Date())) squeletteAccueil();
    await Promise.all(APPS.filter(a => LECTEURS[a.id]).map(async a => {
      const L = LECTEURS[a.id];
      let d = null; try{ d = await L.lire(); }catch(e){ console.warn(a.id, e); }
      const el = $(`[data-bloc="${a.id}"]`);
      if(el){ el.innerHTML = carte(a, L.titre(d), L.rendre(d)); brancherSlides(el); }
      if(a.id === 'garde-robe' && d){
        const jours = await meteo(d.ville);
        const el2 = $(`[data-bloc="${a.id}"]`);
        if(el2){ el2.innerHTML = carte(a, L.titre(d), blocGardeRobe(d, jours)); brancherSlides(el2); }
      }
    }));
  } finally{
    enCours = false;
    if(aRefaire){ aRefaire = false; planifierAccueil(50); }
  }
}
// Cocher une tâche depuis l'accueil : c'est l'Organisation elle-même qui le fait (mêmes règles, même enregistrement)
async function cocherOrganisation(btn){
  const ligne = btn.closest('.tache'); if(!ligne || ligne.dataset.attente) return;
  ligne.dataset.attente = '1';
  ligne.classList.toggle('faite');   // effet immédiat
  try{
    const app = APPS.find(a => a.id === 'organisation'), f = creerFrame(app);
    await f.charge;
    let w = f.contentWindow;
    for(let i = 0; i < 30 && !(w.document.querySelector('#app .hero')); i++){ await pause(150); w = f.contentWindow; }
    if(typeof w.toggleTask !== 'function') throw new Error('Organisation pas prête');
    w.toggleTask(btn.dataset.coche, btn.dataset.d, !!btn.dataset.late);
  }catch(e){ console.warn(e); ligne.classList.toggle('faite'); toast('Impossible de cocher pour l’instant.'); }
  delete ligne.dataset.attente;
  planifierAccueil(350);
}
async function mettreAuSale(btn){
  btn.disabled = true;
  const w = await attendreApp('garde-robe', w => w.quotidienGR && w.quotidienGR.pret());
  if(w){ const sale = w.quotidienGR.sale(btn.dataset.sale); toast(sale ? 'Au sale 🧺' : 'Remis au propre ✨'); }
  planifierAccueil(300);
}
async function choisirTenue(btn){
  btn.disabled = true; btn.textContent = '…';
  const w = await attendreApp('garde-robe', w => w.quotidienGR && w.quotidienGR.pret());
  if(w){ w.quotidienGR.choisir(btn.dataset.choisir, +btn.dataset.n || 0); toast('Tenue choisie 👌'); }
  else toast('Garde-robe pas prête, réessaie.');
  planifierAccueil(400);
}
$('#accueil').addEventListener('click', e => {
  if(e.target.closest('[data-act="reglages"]')){ ouvrirReglages(); return; }
  // Aller directement au bon endroit dans l'app (tâche, vêtement, produit, plateau…)
  const go = e.target.closest('[data-aller]');
  if(go && !e.target.closest('[data-coche], [data-choisir], [data-sale]')){
    const x = go.dataset;
    window.quotidien.ouvrir(x.aller, {action:x.action, id:x.id || null, d:x.d || null, nom:x.nom || null, date:x.date || null});
    return;
  }
  const c = e.target.closest('[data-coche]'); if(c){ cocherOrganisation(c); return; }
  const ch = e.target.closest('[data-choisir]'); if(ch){ choisirTenue(ch); return; }
  const sa = e.target.closest('[data-sale]'); if(sa){ mettreAuSale(sa); return; }
  if(e.target.closest('.slides, .ocs')) { const s = e.target.closest('[data-ouvrir]'); if(s) montrer(s.dataset.ouvrir); return; }
  const b = e.target.closest('[data-ouvrir]'); if(b) montrer(b.dataset.ouvrir);
});

/* ---------- Sauvegarde globale ---------- */
async function collecter(){
  const bases = {};
  for(const app of APPS){
    if(!app.base) continue;
    const c = await lire(app.base, async db => {
      const tables = {};
      for(const n of Array.from(db.objectStoreNames)){
        const os = db.transaction(n).objectStore(n);
        if(os.keyPath == null){   // table « clé → valeur » (ex. les réglages de la garde-robe)
          const [ks, vs] = await Promise.all([req(os.getAllKeys()), req(os.getAll())]);
          tables[n] = {cle:null, paires:ks.map((k, i) => [k, vs[i]])};
        } else tables[n] = {cle:os.keyPath, valeurs:await req(os.getAll())};
      }
      return {version:db.version, tables};
    });
    if(c) bases[app.base] = c;
  }
  const locaux = {};
  for(const app of APPS.filter(estLocale)){
    const ks = clesLocales(app);
    if(ks.length) locaux[app.id] = Object.fromEntries(ks.map(k => [k, localStorage.getItem(k)]));
  }
  return {bases, locaux, retours:lireRetours()};
}
async function exporterTout(){
  toast('Préparation de la sauvegarde…');
  const {bases, locaux, retours} = await collecter();
  if(!Object.keys(bases).length && !Object.keys(locaux).length){ toast('Aucune donnée à sauvegarder sur ce téléphone.'); return; }
  const data = {app:'mon-quotidien-tout', version:2, date:new Date().toISOString(), bases, locaux, retours};
  const nom = `mon-quotidien-${iso(new Date())}.json`;
  const fichier = new File([JSON.stringify(data)], nom, {type:'application/json'});
  // Sur téléphone : feuille de partage (Enregistrer dans Fichiers, Drive…) ; sinon téléchargement
  // Android : enregistré directement dans Téléchargements. iPhone : feuille de partage.
  if(!/Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[fichier]})){
    try{ await navigator.share({files:[fichier], title:nom}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(fichier), a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Sauvegarde enregistrée dans Téléchargements.');
}
// Reconnaît la sauvegarde globale ET les sauvegardes faites dans chaque app
function planImport(data){
  if(!data || typeof data !== 'object') return null;
  const tab = v => Array.isArray(v) ? v : [];
  if(data.app === 'mon-quotidien-tout' && (data.bases || data.locaux || Array.isArray(data.retours))){
    return [...Object.entries(data.bases || {}).map(([base, c]) => ({base, tables:Object.fromEntries(Object.entries(c.tables || {}).map(([n, t]) =>
      [n, t.cle == null ? {vider:true, paires:tab(t.paires)} : {vider:true, valeurs:tab(t.valeurs)}]))})),
      ...Object.entries(data.locaux || {}).map(([id, cles]) => ({local:id, vider:true, cles})),
      ...(Array.isArray(data.retours) && data.retours.length ? [{retours:data.retours}] : [])];
  }
  if(data.app === 'backstage' || (Array.isArray(data.scenes) && data.exportedAt)){   // sauvegarde faite dans Backstage
    const cles = {backstage_scenes_v1:JSON.stringify(tab(data.scenes)), backstage_goals_v1:JSON.stringify(data.goals || {}), backstage_texts_v1:JSON.stringify(tab(data.texts))};
    if(data.rotation2) cles.backstage_rotation2_v1 = JSON.stringify(data.rotation2);
    if(Array.isArray(data.plateaux)) cles.backstage_plateaux_v1 = JSON.stringify(data.plateaux);
    if(data.plateauxCity) cles.backstage_plateaux_city_v1 = data.plateauxCity;
    return [{local:'backstage', vider:false, cles}];
  }
  if(data.app === 'courses'){
    return [{base:'courses', tables:{products:{vider:true, valeurs:tab(data.products)}, aliases:{vider:true, valeurs:tab(data.aliases)},
      tickets:{vider:true, valeurs:tab(data.tickets)}, list:{vider:true, valeurs:tab(data.list)},
      settings:{vider:true, valeurs:[Object.assign({}, data.settings || {}, {k:'main'})]}}}];
  }
  if(data.app === 'organisation' && Array.isArray(data.tasks)){
    const t = {};
    for(const n of ['themes', 'tasks', 'lists', 'items', 'routines']) t[n] = {vider:true, valeurs:tab(data[n])};
    const m = data.meta || {}, meta = [{key:'monthView', value:!!m.monthView}];
    if(Array.isArray(m.timelog)) meta.push({key:'timelog', value:m.timelog});
    if(Array.isArray(m.feeds)) meta.push({key:'feeds', value:m.feeds});
    t.meta = {vider:false, valeurs:meta};
    return [{base:'organisation', tables:t}];
  }
  if(data.app === 'mon-quotidien' && Array.isArray(data.pieces)){   // sauvegarde faite dans la garde-robe
    return [{base:'garde-robe', tables:{pieces:{vider:true, valeurs:data.pieces}, outfits:{vider:true, valeurs:tab(data.outfits)},
      kv:{vider:false, paires:[['settings', data.settings || {}]]}}}];
  }
  return null;
}
async function attendreBase(nom){
  for(let i = 0; i < 40; i++){
    const db = await ouvrir(nom);
    if(db && db.objectStoreNames.length) return db;
    if(db) db.close();
    await pause(250);
  }
  return null;
}
async function ecrire(p){
  if(p.retours){   // notes de modifs : ajoutées à celles déjà présentes
    const l = lireRetours(), ids = new Set(l.map(r => r.id));
    ecrireRetours([...l, ...p.retours.filter(r => r && r.id && !ids.has(r.id))]);
    return;
  }
  if(p.local){
    const app = APPS.find(a => a.id === p.local);
    if(!app || !estLocale(app)) throw new Error(`app « ${p.local} » inconnue`);
    if(p.vider) clesLocales(app).forEach(k => localStorage.removeItem(k));
    for(const [k, v] of Object.entries(p.cles || {})) if(k.startsWith(app.prefixe) && typeof v === 'string') localStorage.setItem(k, v);
    const f = frames.get(app.id);
    if(f){ try{ f.contentWindow.location.reload(); }catch(e){} }
    return;
  }
  const app = APPS.find(a => a.base === p.base);
  let db = await ouvrirBase(p.base);
  if(!db && app){ await creerFrame(app).charge; db = await attendreBase(p.base); }   // l'app crée d'abord sa base
  if(!db) throw new Error(`base « ${p.base} » introuvable`);
  try{
    const noms = Object.keys(p.tables).filter(n => aTable(db, n));
    await new Promise((res, rej) => {
      const tx = db.transaction(noms, 'readwrite');
      for(const n of noms){
        const t = p.tables[n], os = tx.objectStore(n);
        if(t.vider) os.clear();
        for(const v of t.valeurs || []) os.put(v);
        for(const [k, v] of t.paires || []) os.put(v, k);
      }
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  } finally{ db.close(); }
  const f = app && frames.get(app.id);
  if(f){ try{ f.contentWindow.location.reload(); }catch(e){} }   // l'app relit ses données
}
async function importerFichiers(files){
  for(const f of files){
    let data;
    try{ data = JSON.parse(await f.text()); }catch(e){ toast(`« ${f.name} » est illisible.`); continue; }
    const plan = planImport(data);
    if(!plan || !plan.length){ toast(`« ${f.name} » n’est pas une sauvegarde reconnue.`); continue; }
    const noms = plan.map(p => p.retours ? 'Notes de modifs' : (APPS.find(a => p.local ? a.id === p.local : a.base === p.base) || {nom:p.base || p.local}).nom).join(', ');
    if(!confirm(`Importer : ${noms}\ndepuis « ${f.name} » ?\n\nLes données actuelles de ${plan.length > 1 ? 'ces apps' : 'cette app'} sur ce téléphone seront remplacées.`)) continue;
    try{
      for(const p of plan) await ecrire(p);
      toast(`${noms} : sauvegarde importée.`);
    }catch(e){ console.error(e); toast(`Import impossible (${e && e.message ? e.message : 'erreur'}).`); }
    await pause(400);
  }
  majEtat(); planifierAccueil(800);
}
$('#fichier').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if(fs.length) importerFichiers(fs); });

/* ---------- Sauvegarde automatique sur Google Drive (via un script Google Apps Script) ----------
   Dès que l'app est ouverte et que la dernière sauvegarde a plus de 12 h, chaque app est envoyée
   dans un fichier séparé. Chaque fichier est une sauvegarde complète de son app : « Tout importer » le relit. */
const CLE_DRIVE = 'quotidien-drive';
const INTERVALLE_DRIVE = 12 * 3600e3, PAUSE_APRES_ECHEC = 30 * 60e3;
function lireDrive(){ try{ return JSON.parse(localStorage.getItem(CLE_DRIVE) || '{}') || {}; }catch(e){ return {}; } }
function ecrireDrive(maj){ const d = {...lireDrive(), ...maj}; try{ localStorage.setItem(CLE_DRIVE, JSON.stringify(d)); }catch(e){} return d; }
const driveActif = d => !!(d.url && d.code);
function ilYa(ts){
  const m = Math.round((Date.now() - ts) / 60e3);
  if(m < 1) return 'à l’instant';
  if(m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60); if(h < 48) return `il y a ${h} h`;
  return `il y a ${Math.round(h / 24)} jours`;
}
async function envoyerDrive(d, corps){
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 120e3);
  try{
    const r = await fetch(d.url, {method:'POST', body:JSON.stringify({code:d.code, ...corps}), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal:ctrl.signal});
    let j = null; try{ j = await r.json(); }catch(e){}
    if(!j) throw new Error('réponse illisible (adresse du script correcte ? déployé avec l’accès « Tout le monde » ?)');
    if(!j.ok) throw new Error(j.erreur || 'refusé par le script');
    return j;
  }catch(e){
    throw new Error(e.name === 'AbortError' ? 'délai dépassé (connexion lente ?)' : (e.message || 'pas de connexion'));
  }finally{ clearTimeout(to); }
}
let driveEnCours = false;
async function sauvegarderDrive(manuel){
  const d = lireDrive();
  if(!driveActif(d) || driveEnCours) return;
  driveEnCours = true; majEtatDrive('Sauvegarde en cours…');
  ecrireDrive({essai:Date.now()});
  try{
    const {bases, locaux, retours} = await collecter(), date = new Date().toISOString(), envois = [];
    for(const app of APPS){
      if(app.base && bases[app.base]) envois.push({app:app.id, data:{app:'mon-quotidien-tout', version:2, date, bases:{[app.base]:bases[app.base]}}});
      else if(estLocale(app) && locaux[app.id]) envois.push({app:app.id, data:{app:'mon-quotidien-tout', version:2, date, locaux:{[app.id]:locaux[app.id]}}});
    }
    if(retours.length) envois.push({app:'notes', data:{app:'mon-quotidien-tout', version:2, date, retours}});
    if(!envois.length) throw new Error('aucune donnée sur ce téléphone');
    for(const e of envois){
      try{ await envoyerDrive(d, {app:e.app, contenu:JSON.stringify(e.data)}); }
      catch(err){ throw new Error(`${(APPS.find(a => a.id === e.app) || {nom:'Notes'}).nom} : ${err.message}`); }
    }
    ecrireDrive({derniere:Date.now(), echecs:0, erreur:''});
    if(manuel) majEtatDrive('Sauvegarde envoyée sur Drive ✓');
  }catch(err){
    const n = (lireDrive().echecs || 0) + 1;
    ecrireDrive({echecs:n, erreur:err.message});
    if(manuel) majEtatDrive('Échec : ' + err.message);
  }finally{
    driveEnCours = false; majEtatDrive(); alerteDrive();
  }
}
function verifierDrive(){
  const d = lireDrive();
  if(!driveActif(d) || driveEnCours) return;
  if(d.derniere && Date.now() - d.derniere < INTERVALLE_DRIVE) return;
  if(d.essai && d.echecs && Date.now() - d.essai < PAUSE_APRES_ECHEC) return;
  sauvegarderDrive(false);
}
function texteEtatDrive(){
  const d = lireDrive();
  if(!driveActif(d)) return 'Pas encore configurée.';
  let s = d.derniere ? `Dernière sauvegarde : ${ilYa(d.derniere)} ✓` : 'Aucune sauvegarde envoyée pour l’instant.';
  if(d.echecs) s += `\nDernier essai raté : ${d.erreur || 'erreur'}`;
  return s;
}
function majEtatDrive(msg){
  const el = $('#drive-etat'); if(!el) return;
  el.textContent = msg || texteEtatDrive();
}
// Alerte sur l'accueil si aucune sauvegarde réussie depuis 2 jours (ou si les envois échouent)
function alerteDrive(){
  const el = $('#alerte-drive'); if(!el) return;
  const d = lireDrive();
  const enRetard = driveActif(d) && (d.echecs >= 2 || (d.derniere && Date.now() - d.derniere > 48 * 3600e3));
  el.hidden = !enRetard;
  if(enRetard) el.innerHTML = `<b>Sauvegarde Drive en retard</b><span>${d.derniere ? 'Dernière réussie ' + ilYa(d.derniere) : 'Aucune sauvegarde réussie'}${d.erreur ? ' · ' + esc(d.erreur.replace(/\.$/, '')) : ''}. Touche pour voir.</span>`;
}

/* ---------- Feuille « Sauvegarde et réglages » ---------- */
async function majEtat(){
  const el = $('#etat'); if(!el) return;
  const lignes = await Promise.all(APPS.filter(a => a.base || estLocale(a)).map(async a => {
    if(estLocale(a)){
      const ks = clesLocales(a); let n = 0;
      for(const k of ks){ try{ const v = JSON.parse(localStorage.getItem(k)); n += Array.isArray(v) ? v.length : 1; }catch(e){ n++; } }
      return `<div><b>${esc(a.nom)}</b><span>${ks.length ? plur(n, 'élément', 'éléments') : 'aucune donnée'}</span></div>`;
    }
    const n = await lire(a.base, async db => { let s = 0; for(const t of Array.from(db.objectStoreNames)) s += await req(db.transaction(t).objectStore(t).count()); return s; });
    return `<div><b>${esc(a.nom)}</b><span>${n == null ? 'aucune donnée' : plur(n, 'élément', 'éléments')}</span></div>`;
  }));
  el.innerHTML = lignes.join('');
}

async function copierTexte(s){
  try{ await navigator.clipboard.writeText(s); return true; }catch(e){}
  try{ const ta = document.createElement('textarea'); ta.value = s; $('#retours').appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
$('#retours').addEventListener('click', async e => {
  const dlg = $('#retours');
  if(e.target === dlg){ dlg.close(); return; }
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.app){
    retourApp = b.dataset.app;
    dlg.querySelectorAll('[data-app]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#r-ecran').value = retourApp === actif ? ecranActuel() : '';
    return;
  }
  if(b.dataset.suppr){ ecrireRetours(lireRetours().filter(r => r.id !== b.dataset.suppr)); rafraichirListe('Note supprimée.'); return; }
  const a = b.dataset.r;
  if(a === 'fermer') dlg.close();
  else if(a === 'ajouter'){
    const texte = $('#r-texte').value.trim();
    if(!texte){ $('#r-msg').textContent = 'Écris d’abord ta remarque.'; $('#r-texte').focus(); return; }
    const l = lireRetours();
    l.push({id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6), app:retourApp, ecran:$('#r-ecran').value.trim(), texte, date:new Date().toISOString()});
    ecrireRetours(l);
    $('#r-texte').value = '';
    rafraichirListe(`Noté pour ${nomDe(retourApp)} ✓`);
  }
  else if(a === 'copier'){
    if(!lireRetours().length){ $('#r-msg').textContent = 'Rien à copier.'; return; }
    $('#r-msg').textContent = (await copierTexte(texteRetours())) ? 'Copié ! Colle-le dans ta conversation avec Claude.' : 'Copie impossible : utilise « Partager ».';
  }
  else if(a === 'partager'){
    if(!lireRetours().length){ $('#r-msg').textContent = 'Rien à partager.'; return; }
    const s = texteRetours();
    if(navigator.share){ try{ await navigator.share({title:'Retours Mon quotidien', text:s}); return; }catch(err){ if(err && err.name === 'AbortError') return; } }
    $('#r-msg').textContent = (await copierTexte(s)) ? 'Partage indisponible : texte copié à la place.' : 'Partage indisponible.';
  }
  else if(a === 'vider'){
    if(!lireRetours().length) return;
    if(!confirm('Effacer toutes les notes ? Pense à les copier ou les partager avant.')) return;
    ecrireRetours([]); rafraichirListe('Notes effacées.');
  }
});
$('#retour-btn').addEventListener('click', ouvrirRetours);
if(self.RETOURS !== false){ $('#retour-btn').hidden = false; majPastille(); }

/* ---------- Pont entre les apps (ex. Organisation « Scène » → Backstage « Noter ») ---------- */
window.quotidien = {
  async ouvrir(id, params){
    const app = APPS.find(a => a.id === id); if(!app) return;
    montrer(id);
    const f = frames.get(id); await f.charge;
    try{ const fn = f.contentWindow.quotidienAction; if(typeof fn === 'function') fn(params || {}); }catch(e){}
  },
  scenesAgenda: jours => lireScenesAgenda(jours || 7, 0),
  // Demande à une app (chargée en arrière-plan si besoin) : ex. Backstage → Organisation
  async demander(id, params){
    const w = await attendreApp(id, w => typeof w.quotidienAction === 'function' && (!w.quotidienPret || w.quotidienPret()));
    if(!w) return null;
    try{ return await w.quotidienAction(params || {}); }catch(e){ console.warn(e); return null; }
  }
};

/* ---------- Démarrage ---------- */
window.addEventListener('popstate', e => {
  const st = e.state || {}, id = st.app || 'accueil', p = st.p || 0;
  const f = frames.get(id);
  // Retour à l'intérieur de l'app ouverte : on lui dit de revenir d'un cran (fermer une fenêtre, revenir à son accueil…)
  if(id === actif && f && f.pile && f.pile.length > p){
    f.pile.length = p;
    try{ const w = f.contentWindow; w.dispatchEvent(new w.PopStateEvent('popstate', {state:w.history.state})); }catch(err){}
    return;
  }
  if(id === actif) return;
  montrer(APPS.some(a => a.id === id) ? id : 'accueil', {historique:true});
});
appliquerTheme(document);
construireBarre();
{
  const params = new URLSearchParams(location.search), demande = params.get('app'), h = location.hash.slice(1);
  if(demande && APPS.some(a => a.id === demande)){ params.delete('app'); const q = params.toString(); montrer(demande, {query:q ? '?' + q : ''}); }
  else montrer(APPS.some(a => a.id === h) ? h : 'accueil');
}
if(actif !== 'accueil') rafraichirAccueil();
precharger();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(actif === 'accueil') rafraichirAccueil();
  setTimeout(verifierDrive, 3000);
});
setTimeout(verifierDrive, 6000);   // laisse l'app s'ouvrir tranquillement avant d'envoyer
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// Un seul service worker pour tout Myself/ ; mise à jour automatique
if('serviceWorker' in navigator && location.protocol === 'https:'){
  const avait = !!navigator.serviceWorker.controller; let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(avait && !recharge){ recharge = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  // Retire les anciens service workers des apps (courses/, organisation/…), jamais ceux d'autres sites
  navigator.serviceWorker.getRegistrations().then(regs => {
    const base = new URL('./', location.href).href;
    regs.forEach(r => { if(r.scope !== base && r.scope.startsWith(base)) r.unregister(); });
  }).catch(() => {});
}
