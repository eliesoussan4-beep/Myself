<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --sun:#E9A92C; --rain:#4F82C9; --warn:#A8432C;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --sun:#F2BD4E; --rain:#7EA8E6; --warn:#E3826B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --sun:#F2BD4E; --rain:#7EA8E6; --warn:#E3826B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{max-width:640px;margin:0 auto;padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}

/* Section switcher */
.switcher{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.seg .count{font-size:11px;background:var(--warn);color:#fff;border-radius:99px;padding:0 6px;margin-left:4px;vertical-align:1px}

h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 16px}
.page-head h1{font-size:28px;font-weight:700}
.muted{color:var(--muted)}

/* Tomorrow hero */
.tomorrow{margin:18px 0 6px}
.tomorrow .day{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.92;letter-spacing:-.03em}
.tomorrow .date{color:var(--muted);font-size:15px;margin-top:6px;text-transform:none}

.weather{margin:18px 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.weather-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.weather-now{display:flex;align-items:center;gap:10px;font-weight:600}
.weather-now svg{flex:none}
.linkish{border:0;background:none;color:var(--denim);font-weight:600;padding:4px 0;font-size:14px}
.band-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span,.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;line-height:1.2}
.chip input:checked + span,.chip-btn[aria-pressed="true"]{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.chip input:focus-visible + span{outline:2px solid var(--denim);outline-offset:2px}
.chip small{opacity:.75;font-size:12px}

/* Look */
.look-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:8px}
.look-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.look-head h2{font-size:24px;font-weight:700}
.why{color:var(--muted);font-size:14px;margin:0 0 14px}
.look{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:170px;gap:8px}
.look.n1{grid-template-columns:1fr;grid-auto-rows:320px}
.look.n3 .tile:first-child{grid-row:span 2}
.look.odd .tile:last-child{grid-column:span 2}
.look.n3 .tile:last-child{grid-column:auto}
.tile{background:var(--sunk);border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:contain}
.tile .cap{position:absolute;left:8px;bottom:8px;right:8px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:fit-content;max-width:calc(100% - 16px)}
.noimg{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:13px;padding:10px;text-align:center}
.look-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.btn.grow{flex:1}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.planned{display:inline-flex;align-items:center;gap:6px;background:var(--denim-soft);color:var(--denim);font-weight:600;font-size:13px;border-radius:99px;padding:4px 10px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:26px 20px;text-align:center}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{margin:0 0 16px;color:var(--muted)}

/* Grids */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.piece{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:6px}
.piece .ph{aspect-ratio:3/4;background:var(--sunk);border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.piece .ph img{width:100%;height:100%;object-fit:contain}
.piece .nm{font-weight:600;font-size:14px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece .ct{font-size:12px;color:var(--muted);padding:0 4px 2px;margin-top:-6px}
.badge{position:absolute;top:6px;left:6px;background:var(--warn);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px}
.piece.is-dirty .ph img{opacity:.45}

.outfits{display:flex;flex-direction:column;gap:10px}
.outfit{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;width:100%}
.outfit .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.outfit h3{font-size:18px;font-weight:700}
.outfit .meta{font-size:13px;color:var(--muted);margin-top:2px}
.strip{display:flex;gap:6px;margin-top:10px;overflow:hidden}
.strip .th{width:56px;height:70px;border-radius:9px;background:var(--sunk);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.strip .th img{width:100%;height:100%;object-fit:contain}
.strip .th.dirty img{opacity:.35}
.warnline{color:var(--warn);font-size:13px;font-weight:600;margin-top:8px}

.group-title{font-family:var(--display);font-size:19px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 12px}

/* Bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:640px;height:var(--nav-h)}
.tabbar li{flex:1}
.tabbar button{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--denim)}
.tabbar button:disabled{opacity:.45;cursor:default}

/* Sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;margin:auto auto 0;overflow:hidden}
@media (min-width:600px){dialog{border-radius:22px;margin:auto}}
dialog::backdrop{background:rgba(10,14,22,.5)}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-scroll{overflow-y:auto;padding:20px 18px 8px}
.sheet h2{font-size:22px;font-weight:700;margin-bottom:14px}
.sheet-actions .btn{padding:11px 12px;min-width:0}
.del-link{color:var(--warn);display:block;margin:4px 0 12px}
.sheet-actions .btn.grow{flex:1 1 0}
.sheet-actions{display:flex;gap:8px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.field{display:block;margin-bottom:16px}
.field > span,.legend{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px}
fieldset{border:0;margin:0 0 16px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.photo-drop{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--sunk);border:1px dashed var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden;cursor:pointer;position:relative}
.photo-drop img{width:100%;height:100%;object-fit:contain}
.photo-drop .busy{position:absolute;inset:auto 10px 10px auto;background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--sunk);border-radius:12px;margin-bottom:16px;font-weight:600;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--denim)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{position:relative;display:block;cursor:pointer}
.pick input{position:absolute;opacity:0}
.pick .box{display:block;border:2px solid transparent;border-radius:12px;background:var(--sunk);overflow:hidden}
.pick .box .ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.pick .box img{width:100%;height:100%;object-fit:contain}
.pick .box .l{display:block;font-size:12px;font-weight:600;padding:3px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick input:checked + .box{border-color:var(--denim);background:var(--denim-soft)}
.pick input:focus-visible + .box{outline:2px solid var(--denim);outline-offset:2px}

.photo-btns{display:flex;gap:8px;margin:-6px 0 12px}
.photo-btns .btn{flex:1;text-align:center;position:relative;cursor:pointer}
.photo-drop{cursor:default}
.checker{background-color:var(--sunk);background-image:conic-gradient(var(--line) 25%,transparent 0 50%,var(--line) 0 75%,transparent 0);background-size:18px 18px}
.cut-tools{margin:-8px 0 12px}
.sil-wrap{background:var(--sunk);border-radius:16px;padding:16px 12px}
.sil{position:relative;margin:0 auto}
.sil img{position:absolute;max-width:none;object-fit:fill}
.sil-wrap .strip{margin-top:12px}
#cam{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#000;color:#fff}
#cam::backdrop{background:#000}
.cam{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cam-top{display:flex;align-items:center;gap:8px;padding:10px 10px 8px}
.cam-x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px}
.cam-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cam-cats::-webkit-scrollbar{display:none}
.cam-cats .chip-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;white-space:nowrap}
.cam-cats .chip-btn[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.cam-box{position:relative;width:min(100vw, calc((100dvh - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .75));aspect-ratio:3/4;margin:0 auto;background:#111;overflow:hidden}
.cam-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-guide,.cam-guide svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-tip{text-align:center;font-size:14px;margin:10px 16px 0;color:rgba(255,255,255,.85)}
.cam-bottom{flex:1;display:flex;align-items:center;justify-content:center;min-height:96px}
.cam-shot{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);padding:0}
.cam-shot:active{background:#fff}
.cam-shot:disabled{opacity:.4}
.cam-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.soon{padding:60px 10px;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><p class="loading">Ouverture de ta garde-robe…</p></main>

<nav class="tabbar" aria-label="Pages">
  <ul>
    <li><button type="button" aria-current="page" data-tab="vetements">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5 4 6 2.5 10.5 6 12v8.5h12V12l3.5-1.5L20 6l-5-2.5a3 3 0 0 1-6 0Z"/></svg>
      Vêtements</button></li>
    <li><button type="button" data-tab="soon2" disabled aria-label="Onglet à venir">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/><path d="M12 8.5v7M8.5 12h7"/></svg>
      Bientôt</button></li>
    <li><button type="button" data-tab="soon3" disabled aria-label="Onglet à venir">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/><path d="M12 8.5v7M8.5 12h7"/></svg>
      Bientôt</button></li>
  </ul>
</nav>

<dialog id="sheet"></dialog>
<dialog id="cam" aria-label="Appareil photo"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Constantes ---------- */
const CATS = [
  {id:'manteau', label:'Manteau', order:0},
  {id:'veste', label:'Veste', order:1},
  {id:'gilet', label:'Gilet', order:2},
  {id:'pull', label:'Pull', order:3},
  {id:'sweat', label:'Sweat', order:4},
  {id:'chemise', label:'Chemise', order:5},
  {id:'tshirt', label:'T-shirt', order:6},
  {id:'pantalon', label:'Pantalon', order:7},
  {id:'chaussures', label:'Chaussures', order:8},
  {id:'accessoire', label:'Accessoire', order:9},
];
/* Couches pour l'assemblage : dessous < intermédiaire < dessus */
const LAYER = {tshirt:'under', chemise:'under', haut:'under', robe:'under', pull:'mid', sweat:'mid', gilet:'mid', veste:'outer', manteau:'outer', pantalon:'bottom', bas:'bottom', chaussures:'shoes', accessoire:'acc'};
const LAYER_RANK = {under:0, mid:1, outer:2};
const OPEN_FRONT = new Set(['gilet','veste','manteau']);
const BANDS = [
  {id:'froid', label:'Froid', hint:'< 10°', words:'le froid'},
  {id:'frais', label:'Frais', hint:'10–17°', words:'un temps frais'},
  {id:'doux', label:'Doux', hint:'18–24°', words:'un temps doux'},
  {id:'chaud', label:'Chaud', hint:'25°+', words:'la chaleur'},
];
const catLabel = id => id === 'bas' ? 'Pantalon' : (CATS.find(c=>c.id===id)||{label:'À classer'}).label;
const catOrder = id => (CATS.find(c=>c.id===(id==='bas'?'pantalon':id))||{order:5.5}).order;
const bandFor = t => t<10?'froid':t<18?'frais':t<25?'doux':'chaud';

const ICON = {
  sun:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--sun)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  rain:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--rain)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 15.5a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 9a3.3 3.3 0 0 1-.5 6.5Z"/><path d="M9 18.5 8 21M13 18.5 12 21M17 18.5 16 21"/></svg>',
  unknown:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 10.5 3.3 3.3 0 0 1 18 17Z"/></svg>',
  hanger:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5a2 2 0 1 1 2-2c0 1-2 1.5-2 3L3 15.5c-.8.6-.4 1.5.5 1.5h17c.9 0 1.3-.9.5-1.5L12 9"/></svg>',
  camera:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h3l1.5-2h7l1.5 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>',
};

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => dayKey(new Date());
/* Jour visé : avant midi, c'est la tenue du jour ; après midi, celle du lendemain.
   Le sélecteur Aujourd'hui / Demain permet de forcer l'un ou l'autre. */
const SWITCH_HOUR = 12;
const dayOffset = () => (S.dayChoice ?? (new Date().getHours() < SWITCH_HOUR ? 0 : 1));
const dayWord = () => dayOffset() === 0 ? "aujourd'hui" : 'demain';
const tomorrowDate = () => { const d = new Date(); d.setDate(d.getDate() + dayOffset()); return d; };
const tomorrowKey = () => dayKey(tomorrowDate());
function daysSince(key){
  if(!key) return null;
  const [y,m,d] = key.split('-').map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((t - new Date(y,m-1,d)) / 86400000);
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2800);
}
function photoSrc(p){
  if(!p || !p.photo) return '';
  if(p.photo.assetId) return '/_blob/' + p.photo.assetId;
  return p.photo.dataUrl || '';
}
function cutSrc(p){ return p && p.photo && p.photo.cut ? p.photo.cut.dataUrl : ''; }
function thumbSrc(p){ return cutSrc(p) || photoSrc(p); }
function pieceVisual(p){
  const src = thumbSrc(p);
  return src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<div class="noimg">${ICON.hanger}<span>${esc(catLabel(p.category))}</span></div>`;
}

/* ---------- Stockage : base Claude si dispo, sinon navigateur ---------- */
const LS_KEY = 'garde-robe-v1';
/* Hors de claude.ai : tout est gardé dans IndexedDB (bien plus de place que localStorage pour les photos) */
const idb = {
  open(){
    if(this._p) return this._p;
    this._p = new Promise((res, rej) => {
      const r = indexedDB.open('garde-robe', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._p;
  },
  async get(){
    const db = await this.open();
    return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); });
  },
  async set(v){
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, 'state'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
};
const store = {
  mode:'local', base:null, assets:null,
  async init(){
    let db=null, user=null, assets=null;
    if(window.claude && typeof window.claude.use === 'function'){
      try{ [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]); }catch(e){}
    }
    this.assets = assets;
    if(db && user){
      let id = null;
      try{ id = await user.id(); }catch(e){}
      if(id){
        this.mode = 'db';
        this.base = db.doc('data/users/' + id + '/wardrobe');
        let pending = 3;
        const done = () => { if(--pending === 0){ S.ready = true; render(); } };
        const onErr = e => { if(e && e.code === 'revoked') toast("L'accès aux données a été retiré."); };
        let first1=true, first2=true, first3=true;
        this.base.collection('pieces').onSnapshot(snap => {
          S.pieces = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
          if(first1){ first1=false; done(); } else render();
        }, onErr);
        this.base.collection('outfits').onSnapshot(snap => {
          S.outfits = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
          if(first2){ first2=false; done(); } else render();
        }, onErr);
        this.base.collection('meta').doc('settings').onSnapshot(d => {
          S.settings = d.exists ? {...d.data()} : {};
          if(first3){ first3=false; done(); } else render();
        }, onErr);
        return;
      }
    }
    this.mode = 'local';
    let j = null;
    try{ j = await idb.get(); }catch(e){}
    if(!j){ try{ const raw = localStorage.getItem(LS_KEY); if(raw) j = JSON.parse(raw); }catch(e){} }
    if(j){
      (j.pieces||[]).forEach(p => S.pieces.set(p.id, p));
      (j.outfits||[]).forEach(o => S.outfits.set(o.id, o));
      S.settings = j.settings || {};
    }
    let migrated = false;
    for(const pc of S.pieces.values()){ if(pc.category === 'bas'){ pc.category = 'pantalon'; migrated = true; } }
    S.ready = true; render();
    if(migrated) this.persistLocal();
  },
  persistLocal(){
    const data = {pieces:[...S.pieces.values()], outfits:[...S.outfits.values()], settings:S.settings};
    idb.set(data).catch(() => {
      try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }
      catch(e){ toast("Stockage plein : supprime quelques photos."); }
    });
  },
  async write(fn){
    try{ await fn(); }
    catch(e){
      if(e && e.code === 'quota_exceeded') toast("Espace de stockage plein.");
      else toast("Enregistrement impossible, réessaie.");
    }
  },
  savePiece(p){
    S.pieces.set(p.id, p); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('pieces').doc(p.id).set(p));
    this.persistLocal();
  },
  deletePiece(id){
    const p = S.pieces.get(id);
    S.pieces.delete(id);
    for(const o of S.outfits.values()){
      if((o.pieceIds||[]).includes(id)) this.saveOutfit({...o, pieceIds:o.pieceIds.filter(x => x !== id)});
    }
    render();
    if(p && p.photo && p.photo.assetId && this.assets){ this.assets.delete(p.photo.assetId).catch(()=>{}); }
    if(this.mode === 'db') return this.write(() => this.base.collection('pieces').doc(id).delete());
    this.persistLocal();
  },
  saveOutfit(o){
    S.outfits.set(o.id, o); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('outfits').doc(o.id).set(o));
    this.persistLocal();
  },
  deleteOutfit(id){
    S.outfits.delete(id); render();
    if(this.mode === 'db') return this.write(() => this.base.collection('outfits').doc(id).delete());
    this.persistLocal();
  },
  saveSettings(patch){
    S.settings = {...S.settings, ...patch}; render();
    if(this.mode === 'db') return this.write(() => this.base.collection('meta').doc('settings').set(S.settings));
    this.persistLocal();
  },
};

/* ---------- Photos ---------- */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); setTimeout(()=>URL.revokeObjectURL(url), 1000); };
    img.onerror = rej; img.src = url;
  });
}
function drawScaled(img, max){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const r = Math.min(1, max / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.round(iw * r); c.height = Math.round(ih * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function processPhoto(fileOrImg){
  const img = fileOrImg instanceof Blob ? await loadImage(fileOrImg) : fileOrImg;
  if(store.assets){
    try{
      const c = drawScaled(img, 1000);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.84));
      const res = await store.assets.upload(blob, {type:'image/jpeg'});
      return {assetId: res.id};
    }catch(e){ /* repli ci-dessous */ }
  }
  return {dataUrl: drawScaled(img, store.mode === 'local' ? 800 : 480).toDataURL('image/jpeg', store.mode === 'local' ? 0.8 : 0.74)};
}

/* Détourage : le fond (couleur des bords de la photo) devient transparent,
   puis l'image est recadrée au plus près du vêtement. w et h gardent la taille
   réelle relative (en fraction du grand côté de la photo) pour l'assemblage. */
function cutout(img){
  const c = drawScaled(img, 720), W = c.width, H = c.height, N = W * H;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  const id = ctx.getImageData(0, 0, W, H), d = id.data;
  const R = [], G = [], B = [];
  const step = Math.max(1, Math.floor((W + H) / 500));
  const take = px => { const i = px * 4; R.push(d[i]); G.push(d[i+1]); B.push(d[i+2]); };
  for(let x = 0; x < W; x += step){ take(x); take((H-1)*W + x); }
  for(let y = 0; y < H; y += step){ take(y*W); take(y*W + W - 1); }
  const med = a => { const t = [...a].sort((p,q) => p-q); return t[t.length >> 1]; };
  const br = med(R), bgc = med(G), bb = med(B);
  const spread = R.map((r,k) => Math.hypot(r-br, G[k]-bgc, B[k]-bb)).sort((a,b) => a-b);
  const tol = Math.min(78, Math.max(26, spread[Math.floor(spread.length * 0.9)] * 1.4 + 14));
  const dist = i => Math.hypot(d[i]-br, d[i+1]-bgc, d[i+2]-bb);
  const bg = new Uint8Array(N), q = new Int32Array(N); let qt = 0, qh = 0;
  const visit = (px, from) => {
    if(bg[px]) return;
    const i = px * 4, dd = dist(i);
    let ok = dd < tol;
    if(!ok && from >= 0 && dd < tol * 1.7){
      const j = from * 4;
      ok = Math.hypot(d[i]-d[j], d[i+1]-d[j+1], d[i+2]-d[j+2]) < 9;
    }
    if(ok){ bg[px] = 1; q[qt++] = px; }
  };
  for(let x = 0; x < W; x++){ visit(x, -1); visit((H-1)*W + x, -1); }
  for(let y = 0; y < H; y++){ visit(y*W, -1); visit(y*W + W - 1, -1); }
  while(qh < qt){
    const px = q[qh++], x = px % W;
    if(x > 0) visit(px - 1, px);
    if(x < W - 1) visit(px + 1, px);
    if(px >= W) visit(px - W, px);
    if(px < N - W) visit(px + W, px);
  }
  let fg = 0;
  const rows = new Uint32Array(H), cols = new Uint32Array(W);
  for(let px = 0; px < N; px++){
    const i = px * 4;
    if(bg[px]){ d[i+3] = 0; continue; }
    fg++; rows[(px / W) | 0]++; cols[px % W]++;
    const x = px % W;
    const edge = (x > 0 && bg[px-1]) || (x < W-1 && bg[px+1]) || (px >= W && bg[px-W]) || (px < N-W && bg[px+W]);
    if(edge) d[i+3] = 150;
  }
  const frac = fg / N;
  if(frac < 0.03 || frac > 0.93) return null;
  const rmin = Math.max(2, W * 0.012), cmin = Math.max(2, H * 0.012);
  let y0 = 0, y1 = H - 1, x0 = 0, x1 = W - 1;
  while(y0 < H && rows[y0] < rmin) y0++;
  while(y1 > y0 && rows[y1] < rmin) y1--;
  while(x0 < W && cols[x0] < cmin) x0++;
  while(x1 > x0 && cols[x1] < cmin) x1--;
  if(x1 - x0 < 10 || y1 - y0 < 10) return null;
  ctx.putImageData(id, 0, 0);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const out = document.createElement('canvas'); out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
  let url = out.toDataURL('image/webp', 0.86);
  if(!url.startsWith('data:image/webp')) url = out.toDataURL('image/png');
  const M = Math.max(W, H);
  return {dataUrl:url, w:cw / M, h:ch / M};
}

/* ---------- Météo (Paris) ---------- */
const PARIS = {lat:48.8566, lon:2.3522};
S.weatherState = 'loading'; // loading | ok | blocked
function tomorrowWeather(){
  const k = tomorrowKey(), m = S.settings.manual;
  if(m && m.date === k) return {band:m.band, rain:!!m.rain, source:'manual'};
  const a = S.weatherDays[k];
  if(a) return {band:bandFor(a.max), rain:a.rain, source:'auto', ...a};
  return null;
}
async function fetchWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${PARIS.lat}&longitude=${PARIS.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=Europe%2FParis&forecast_days=2`;
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch(url, {signal:ctrl.signal});
    const j = await r.json();
    const d = j.daily;
    S.weatherDays = {};
    d.time.forEach((day, i) => {
      const prob = d.precipitation_probability_max[i] ?? 0, mm = d.precipitation_sum[i] ?? 0;
      S.weatherDays[day] = {date:day, max:Math.round(d.temperature_2m_max[i]), min:Math.round(d.temperature_2m_min[i]), rainProb:prob, rainMm:Math.round(mm*10)/10, rain: prob >= 50 || mm >= 1};
    });
    S.weatherState = 'ok';
  }catch(e){ S.weatherState = 'blocked'; }
  finally{ clearTimeout(t); render(); }
}
async function refreshWeather(){
  S.weatherState = 'loading'; render();
  await fetchWeather();
  if(S.weatherState === 'ok'){
    if(S.settings.manual && S.settings.manual.date === tomorrowKey()) store.saveSettings({manual:null});
    toast('Météo de Paris mise à jour.');
  } else toast('Météo automatique bloquée sur cette page : choisis à la main.');
}

/* ---------- Suggestion ---------- */
function rankOutfits(w){
  const bi = w ? BANDS.findIndex(b => b.id === w.band) : -1;
  const all = [...S.outfits.values()].map(o => {
    const pcs = (o.pieceIds||[]).map(id => S.pieces.get(id)).filter(Boolean);
    if(!pcs.length) return null;
    const dirty = pcs.filter(p => p.dirty);
    let score = 0; const why = [];
    if(w){
      const ob = (o.bands||[]).map(b => BANDS.findIndex(x => x.id === b));
      if(ob.includes(bi)){ score += 10; why.push(`Pensée pour ${BANDS[bi].words}`); }
      else if(ob.some(i => Math.abs(i - bi) === 1)) score += 3;
      else if(ob.length) score -= 4;
      if(w.rain){ if(o.rainOk){ score += 3; why.push('ok sous la pluie'); } else score -= 5; }
    }
    const d = daysSince(o.lastWorn);
    if(d === null){ score += 7; why.push('jamais portée'); }
    else { score += Math.min(Math.max(d,0), 14) * 0.5; if(d >= 3) why.push(`pas portée depuis ${d} jours`); }
    return {o, pcs, dirty, score, why};
  }).filter(Boolean);
  return {
    ok: all.filter(x => !x.dirty.length).sort((a,b) => b.score - a.score),
    blocked: all.filter(x => x.dirty.length),
  };
}
function sentence(parts){
  if(!parts.length) return 'Une tenue propre de ta garde-robe.';
  const s = parts.join(', ');
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}

function lookGrid(pcs){
  const sorted = [...pcs].sort((a,b) => catOrder(a.category) - catOrder(b.category));
  const n = sorted.length;
  const cls = n === 1 ? 'n1' : n === 3 ? 'n3' : (n % 2 ? 'odd' : '');
  return `<div class="look ${cls}">${sorted.map(p => `<div class="tile">${pieceVisual(p)}<span class="cap">${esc(p.name)}</span></div>`).join('')}</div>`;
}

/* Tenue assemblée : hauts en haut, pantalon dessous, chaussures en bas,
   tous à la même échelle. Veste/gilet/manteau ouverts au milieu, ou posés à côté. */
function silhouette(pcs, jacketSide){
  const L = p => LAYER[p.category] || 'acc';
  const main = pcs.filter(p => L(p) !== 'acc');
  if(!main.length || main.some(p => !(p.photo && p.photo.cut))) return null;
  const tops = main.filter(p => L(p) in LAYER_RANK).sort((a,b) => LAYER_RANK[L(a)] - LAYER_RANK[L(b)]);
  const hasInner = tops.some(p => L(p) !== 'outer');
  const side = jacketSide && hasInner;
  const torso = side ? tops.filter(p => L(p) !== 'outer') : tops;
  const beside = side ? tops.filter(p => L(p) === 'outer') : [];
  const items = [];
  let torsoW = 0;
  torso.forEach((p, i) => {
    const c = p.photo.cut; torsoW = Math.max(torsoW, c.w);
    const rank = LAYER_RANK[L(p)];
    const covers = OPEN_FRONT.has(p.category) && torso.some(q => LAYER_RANK[L(q)] < rank);
    items.push({p, x:-c.w/2, y:0, w:c.w, h:c.h, z:10 + rank*10 + i, open: covers ? (L(p) === 'outer' ? 34 : 24) : 0});
  });
  const innerH = torso.length ? Math.min(...torso.map(p => p.photo.cut.h)) : 0;
  let y = torso.length ? innerH * 0.8 : 0, pantsBottom = y;
  main.filter(p => L(p) === 'bottom').forEach((p, i) => {
    const c = p.photo.cut; items.push({p, x:-c.w/2, y, w:c.w, h:c.h, z:5 + i});
    pantsBottom = Math.max(pantsBottom, y + c.h);
  });
  const hasPants = main.some(p => L(p) === 'bottom');
  let ys = hasPants ? pantsBottom - (pantsBottom - y) * 0.04 : (torso.length ? Math.max(...torso.map(p => p.photo.cut.h)) + 0.02 : 0);
  main.filter(p => L(p) === 'shoes').forEach((p, i) => {
    const c = p.photo.cut; items.push({p, x:-c.w/2, y:ys, w:c.w, h:c.h, z:1 + i}); ys += c.h * 0.6;
  });
  let bx = torsoW / 2 + 0.03;
  beside.forEach(p => { const c = p.photo.cut; items.push({p, x:bx, y:0, w:c.w, h:c.h, z:40}); bx += c.w + 0.03; });
  const minX = Math.min(...items.map(it => it.x)), maxX = Math.max(...items.map(it => it.x + it.w));
  const maxY = Math.max(...items.map(it => it.y + it.h));
  const TW = maxX - minX, TH = maxY;
  const ratio = TW / TH;
  const imgs = items.sort((a,b) => a.z - b.z).map(it => {
    const b = it.open, clip = b ? `clip-path:polygon(0 0,100% 0,100% 100%,${50+b/2}% 100%,${50+b/2}% 17%,${50-b/2}% 17%,${50-b/2}% 100%,0 100%);` : '';
    return `<img src="${esc(it.p.photo.cut.dataUrl)}" alt="${esc(it.p.name)}" style="left:${((it.x-minX)/TW*100).toFixed(2)}%;top:${(it.y/TH*100).toFixed(2)}%;width:${(it.w/TW*100).toFixed(2)}%;height:${(it.h/TH*100).toFixed(2)}%;${clip}">`;
  }).join('');
  const acc = pcs.filter(p => L(p) === 'acc');
  return `<div class="sil-wrap"><div class="sil" style="aspect-ratio:${TW.toFixed(4)}/${TH.toFixed(4)};width:min(100%, calc(58vh * ${ratio.toFixed(4)}))">${imgs}</div>
    ${acc.length ? `<div class="strip" style="justify-content:center">${acc.map(p => `<div class="th">${thumbSrc(p)?`<img src="${esc(thumbSrc(p))}" alt="${esc(p.name)}">`:ICON.hanger}</div>`).join('')}</div>` : ''}</div>`;
}

function lookView(pcs){
  const hasOuter = pcs.some(p => LAYER[p.category] === 'outer') && pcs.some(p => ['under','mid'].includes(LAYER[p.category]));
  const sil = silhouette(pcs, !!S.settings.jacketSide);
  if(sil){
    const toggle = hasOuter ? `<div class="band-row" style="margin:0 0 10px"><button type="button" class="chip-btn" data-act="jacket" aria-pressed="${!S.settings.jacketSide}">Veste ouverte</button><button type="button" class="chip-btn" data-act="jacket" aria-pressed="${!!S.settings.jacketSide}">Veste à côté</button></div>` : '';
    return toggle + sil;
  }
  const missing = pcs.filter(p => LAYER[p.category] !== 'acc' && !(p.photo && p.photo.cut)).length;
  return lookGrid(pcs) + (missing ? `<p class="hint" style="margin:10px 0 0">Pour voir la tenue assemblée, détoure la photo de ${missing} pièce${missing>1?'s':''} (onglet Pièces).</p>` : '');
}

  else if(w) wline = `${w.rain?ICON.rain:ICON.sun}<span>${esc(BANDS.find(b=>b.id===w.band).label)}${w.rain?', avec de la pluie':', sans pluie'}${S.weatherDays[tomorrowKey()]?' (ton choix)':''}</span>`;

    <div class="band-row">${BANDS.map(b => `<button type="button" class="chip-btn" data-act="band" data-band="${b.id}" aria-pressed="${curBand===b.id}">${b.label} <small>${b.hint}</small></button>`).join('')}
      <button type="button" class="chip-btn" data-act="rain" aria-pressed="${!!(w && w.rain)}">Pluie</button></div>

  const head = `<div class="tomorrow"><div class="day">${off===0?"Aujourd'hui":'Demain'}</div><div class="date">${esc(dateStr)}</div>
    <div class="band-row" role="group" aria-label="Jour de la tenue">
      <button type="button" class="chip-btn" data-act="day" data-off="0" aria-pressed="${off===0}">Aujourd'hui</button>
      <button type="button" class="chip-btn" data-act="day" data-off="1" aria-pressed="${off===1}">Demain</button>
    </div></div>`;

  if(!S.pieces.size) return head + weather + `<div class="empty"><h3>Commence par tes pièces</h3><p>Prends en photo tes vêtements un par un, puis assemble-les en tenues.</p><button class="btn primary" type="button" data-act="new-piece">Ajouter une pièce</button></div>`;
  if(!S.outfits.size) return head + weather + `<div class="empty"><h3>Aucune tenue pour l'instant</h3><p>Assemble tes pièces en tenues : c'est parmi elles que je choisirai.</p><button class="btn primary" type="button" data-act="new-outfit">Créer une tenue</button></div>`;

  const planned = S.settings.planned && S.settings.planned.date === tomorrowKey() ? S.outfits.get(S.settings.planned.outfitId) : null;
  if(planned){
    const pcs = (planned.pieceIds||[]).map(id => S.pieces.get(id)).filter(Boolean);
    const anyClean = pcs.some(p => !p.dirty);
    return head + weather + `<article class="look-card">
      <div class="look-head"><h2>${esc(planned.name)}</h2><span class="planned">Prévue</span></div>
      <p class="why">C'est la tenue que tu as choisie pour ${dayWord()}.</p>
      ${lookView(pcs)}
      <div class="look-actions">
        ${anyClean ? `<button class="btn grow" type="button" data-act="dirty-planned">Mettre au sale après</button>` : `<span class="muted" style="align-self:center;flex:1">Pièces déjà au sale</span>`}
        <button class="btn" type="button" data-act="unplan">Changer</button>
      </div></article>`;
  }

  const {ok, blocked} = rankOutfits(w);
  if(!ok.length) return head + weather + `<div class="empty"><h3>Tout est au sale</h3><p>Chaque tenue contient au moins une pièce à laver (${blocked.length} tenue${blocked.length>1?'s':''}).</p><button class="btn primary" type="button" data-section="linge">Voir le linge</button></div>`;
  const pick = ok[S.alt % ok.length];
  return head + weather + `<article class="look-card">
    <div class="look-head"><h2>${esc(pick.o.name)}</h2>${ok.length>1?`<span class="muted" style="font-size:13px">${(S.alt % ok.length)+1} sur ${ok.length}</span>`:''}</div>
    <p class="why">${esc(sentence(pick.why))}</p>
    ${lookView(pick.pcs)}
    <div class="look-actions">
      <button class="btn primary grow" type="button" data-act="plan" data-id="${esc(pick.o.id)}">Je la porte ${dayWord()}</button>
      ${ok.length>1?`<button class="btn" type="button" data-act="another">Autre idée</button>`:''}
    </div></article>
    ${blocked.length?`<p class="hint" style="margin-top:12px">${blocked.length} tenue${blocked.length>1?'s':''} écartée${blocked.length>1?'s':''} à cause du linge sale.</p>`:''}`;
}

function renderTenues(){
  const list = [...S.outfits.values()].sort((a,b) => (a.name||'').localeCompare(b.name||'', 'fr'));
  const head = `<div class="page-head"><h1>Tenues</h1><button class="btn primary" type="button" data-act="new-outfit">Nouvelle tenue</button></div>`;
  if(!list.length) return head + `<div class="empty"><h3>Aucune tenue</h3><p>${S.pieces.size?'Choisis quelques pièces qui vont bien ensemble.':"Ajoute d'abord des pièces dans l'onglet Pièces."}</p>${S.pieces.size?'<button class="btn primary" type="button" data-act="new-outfit">Créer une tenue</button>':'<button class="btn primary" type="button" data-act="new-piece">Ajouter une pièce</button>'}</div>`;
  return head + `<div class="outfits">${list.map(o => {
    const pcs = (o.pieceIds||[]).map(id => S.pieces.get(id)).filter(Boolean).sort((a,b) => catOrder(a.category) - catOrder(b.category));
    const dirty = pcs.filter(p => p.dirty).length;
    const bands = (o.bands||[]).map(b => (BANDS.find(x=>x.id===b)||{}).label).filter(Boolean);
    const d = daysSince(o.lastWorn);
    const meta = [bands.length ? bands.join(', ') : 'Tous temps', o.rainOk ? 'ok pluie' : null].filter(Boolean).join(', ');
    return `<button class="outfit" type="button" data-act="edit-outfit" data-id="${esc(o.id)}">
      <div class="row"><h3>${esc(o.name)}</h3><span class="muted" style="font-size:13px">${d===null?'Jamais portée':d<=0?(d<0?'Prévue demain':"Portée aujourd'hui"):`Il y a ${d} j`}</span></div>
      <div class="meta">${esc(meta)}</div>
      <div class="strip">${pcs.map(p => `<div class="th ${p.dirty?'dirty':''}">${thumbSrc(p)?`<img src="${esc(thumbSrc(p))}" alt="" loading="lazy">`:ICON.hanger}</div>`).join('')}</div>
      ${dirty?`<div class="warnline">${dirty} pièce${dirty>1?'s':''} au sale</div>`:''}
    </button>`;}).join('')}</div>`;
}

function pieceCard(p, act){
  return `<button class="piece ${p.dirty?'is-dirty':''}" type="button" data-act="${act}" data-id="${esc(p.id)}">
    <div class="ph">${pieceVisual(p)}${p.dirty?'<span class="badge">Au sale</span>':''}</div>
    <div class="nm">${esc(p.name)}</div><div class="ct">${esc(catLabel(p.category))}</div></button>`;
}

function renderPieces(){
  const all = [...S.pieces.values()];
  const head = `<div class="page-head"><h1>Pièces</h1><button class="btn primary" type="button" data-act="new-piece">Ajouter</button></div>`;
  if(!all.length) return head + `<div class="empty"><h3>Ta penderie est vide</h3><p>Photographie une pièce sur un fond uni : c'est cette photo qui apparaîtra dans tes tenues.</p><button class="btn primary" type="button" data-act="new-piece">Prendre une photo</button></div>`;
  const used = CATS.filter(c => all.some(p => p.category === c.id));
  const filters = `<div class="filters"><button type="button" class="chip-btn" data-act="filter" data-cat="all" aria-pressed="${S.filter==='all'}">Tout (${all.length})</button>${used.map(c => `<button type="button" class="chip-btn" data-act="filter" data-cat="${c.id}" aria-pressed="${S.filter===c.id}">${c.label}</button>`).join('')}</div>`;
  const shown = all.filter(p => S.filter === 'all' || p.category === S.filter)
    .sort((a,b) => catOrder(a.category) - catOrder(b.category) || (a.name||'').localeCompare(b.name||'', 'fr'));
  return head + filters + `<div class="pieces">${shown.map(p => pieceCard(p, 'edit-piece')).join('')}</div>`;

function renderLinge(){
  const all = [...S.pieces.values()].sort((a,b) => catOrder(a.category) - catOrder(b.category));
  const dirty = all.filter(p => p.dirty), clean = all.filter(p => !p.dirty);
  const head = `<div class="page-head"><h1>Linge</h1>${dirty.length?'<button class="btn" type="button" data-act="all-clean">Tout est propre</button>':''}</div>`;
  if(!all.length) return head + `<div class="empty"><h3>Rien à laver</h3><p>Ajoute des pièces pour suivre ce qui est au sale.</p><button class="btn primary" type="button" data-act="new-piece">Ajouter une pièce</button></div>`;
  return head + `<p class="hint">Touche une pièce pour changer son état.</p>
    <div class="group-title">Au sale <span class="muted" style="font:500 14px var(--body)">${dirty.length}</span></div>
    ${dirty.length ? `<div class="pieces">${dirty.map(p => pieceCard(p, 'toggle-dirty')).join('')}</div>` : '<p class="muted">Tout est propre.</p>'}
    <div class="group-title">Propre <span class="muted" style="font:500 14px var(--body)">${clean.length}</span></div>
    ${clean.length ? `<div class="pieces">${clean.map(p => pieceCard(p, 'toggle-dirty')).join('')}</div>` : '<p class="muted">Tout est au sale.</p>'}`;
}

/* ---------- Appareil photo intégré avec contour en surimpression ----------
   Cadre 3:4 (300 x 400 unités). Tous les contours sont dessinés à la même échelle
   (environ 0,29 cm par unité) : si tu remplis le contour, les proportions entre
   pièces sont justes dans la tenue assemblée. */
const LONG_TOP = 'M115 70 L60 90 L35 150 L20 300 L55 305 L75 170 L75 330 L225 330 L225 170 L245 305 L280 300 L265 150 L240 90 L185 70 Q150 96 115 70 Z';
const GUIDES = {
  tshirt:  {d:'M115 75 L60 95 L25 150 L65 170 L75 152 L75 325 L225 325 L225 152 L235 170 L275 150 L240 95 L185 75 Q150 100 115 75 Z', tip:'T-shirt à plat, manches écartées'},
  chemise: {d:LONG_TOP, extra:'M122 72 L150 102 L178 72 M150 102 L150 330', tip:'Chemise boutonnée, manches le long du corps'},
  pull:    {d:LONG_TOP, tip:'Pull à plat, manches le long du corps'},
  sweat:   {d:LONG_TOP, tip:'Sweat à plat, capuche repliée derrière'},
  gilet:   {d:LONG_TOP, extra:'M122 72 L150 175 L178 72 M150 175 L150 330', tip:'Gilet fermé, à plat'},
  veste:   {d:'M110 60 L55 80 L28 145 L12 310 L50 316 L70 178 L70 345 L230 345 L230 178 L250 316 L288 310 L272 145 L245 80 L190 60 L150 150 Z', extra:'M150 150 L150 345', tip:'Veste fermée, à plat'},
  manteau: {d:'M110 40 L55 60 L28 125 L12 300 L50 306 L70 160 L70 385 L230 385 L230 160 L250 306 L288 300 L272 125 L245 60 L190 40 L150 130 Z', extra:'M150 130 L150 385', tip:'Manteau fermé, à plat'},
  pantalon:{d:'M95 18 L205 18 L232 385 L166 385 L150 118 L134 385 L68 385 Z', tip:'Pantalon à plat, taille en haut'},
  chaussures:{d:'M102 175 a20 20 0 0 1 40 0 v75 a20 20 0 0 1 -40 0 Z M158 175 a20 20 0 0 1 40 0 v75 a20 20 0 0 1 -40 0 Z', tip:'La paire côte à côte, vue de dessus, pointes en bas'},
  accessoire:{d:'M100 150 h100 a16 16 0 0 1 16 16 v68 a16 16 0 0 1 -16 16 h-100 a16 16 0 0 1 -16 -16 v-68 a16 16 0 0 1 16 -16 Z', tip:"L'accessoire au centre"},
};
const cam = $('#cam');
let camStream = null;
function stopCamera(){ if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
cam.addEventListener('close', stopCamera);
function guideSvg(cat){
  const g = GUIDES[cat] || GUIDES.tshirt;
  const paths = `<path d="${g.d}"/>${g.extra ? `<path d="${g.extra}"/>` : ''}`;
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="rgba(0,0,0,.55)" stroke-width="5" stroke-linejoin="round">${paths}</g>
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="7 5" stroke-linejoin="round">${paths}</g>
    <g stroke="#fff" stroke-width="3" fill="none"><path d="M6 30V6h24M270 6h24v24M294 370v24h-24M30 394H6v-24"/></g></svg>`;
}
async function openCamera(cat, onShot, onFallback){
  let current = GUIDES[cat] ? cat : 'tshirt';
  cam.innerHTML = `<div class="cam">
    <div class="cam-top">
      <button type="button" class="cam-x" data-cam="close" aria-label="Fermer">✕</button>
      <div class="cam-cats">${CATS.map(c => `<button type="button" class="chip-btn" data-cam-cat="${c.id}" aria-pressed="${c.id===current}">${c.label}</button>`).join('')}</div>
    </div>
    <div class="cam-box"><video playsinline muted autoplay></video><div class="cam-guide">${guideSvg(current)}</div></div>
    <p class="cam-tip" id="camTip">${esc(GUIDES[current].tip)}. Remplis le contour.</p>
    <div class="cam-bottom"><button type="button" class="cam-shot" data-cam="shot" aria-label="Prendre la photo" disabled></button></div>
  </div>`;
  cam.showModal();
  const video = cam.querySelector('video'), shot = cam.querySelector('.cam-shot');
  cam.querySelector('.cam-cats [aria-pressed="true"]')?.scrollIntoView({inline:'center', block:'nearest'});
  cam.onclick = e => {
    const c = e.target.closest('[data-cam-cat]');
    if(c){
      current = c.dataset.camCat;
      cam.querySelectorAll('[data-cam-cat]').forEach(b => b.setAttribute('aria-pressed', b === c));
      cam.querySelector('.cam-guide').innerHTML = guideSvg(current);
      cam.querySelector('#camTip').textContent = GUIDES[current].tip + '. Remplis le contour.';
      return;
    }
    const a = e.target.closest('[data-cam]'); if(!a) return;
    if(a.dataset.cam === 'close') cam.close();
    if(a.dataset.cam === 'native'){ cam.close(); onFallback(); }
    if(a.dataset.cam === 'shot'){
      const vw = video.videoWidth, vh = video.videoHeight; if(!vw) return;
      let sx = 0, sy = 0, sw = vw, sh = vh;
      if(vw / vh > 0.75){ sw = vh * 0.75; sx = (vw - sw) / 2; } else { sh = vw / 0.75; sy = (vh - sh) / 2; }
      const c = document.createElement('canvas'); c.width = 900; c.height = 1200;
      c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, 900, 1200);
      cam.close();
      onShot(c, current);
    }
  };
  try{
    camStream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1440}}});
    if(!cam.open){ stopCamera(); return; }
    video.srcObject = camStream;
    await video.play().catch(()=>{});
    shot.disabled = false;
  }catch(err){
    cam.querySelector('.cam-box').innerHTML = `<div class="cam-err"><p>L'app n'a pas accès à la caméra. Autorise-la dans les réglages de Chrome (cadenas ou ⋮, Paramètres du site, Caméra), ou utilise l'appareil photo du téléphone, sans contour.</p><button type="button" class="btn primary" data-cam="native">Ouvrir l'appareil photo du téléphone</button></div>`;
  }
}

function pieceSheet(existing){
  const p = existing ? {...existing, photo: existing.photo ? {...existing.photo} : null} : {id:uid('p'), name:'', category:'', dirty:false, photo:null, createdAt:Date.now()};
  if(p.category === 'bas') p.category = 'pantalon';
  let busy = false;
  const detourDefault = S.settings.detour !== false;
  const html = `<form class="sheet" novalidate>
    <div class="sheet-scroll">
      <h2>${existing?'Modifier la pièce':'Nouvelle pièce'}</h2>
      <div class="photo-drop" id="drop"></div>
      <div class="photo-btns">
        <button type="button" class="btn primary" id="camBtn">Prendre une photo</button>
        <input type="file" accept="image/*" capture="environment" class="sr" id="camIn" tabindex="-1" aria-hidden="true">
        <label class="btn">Choisir dans l'album<input type="file" accept="image/*" class="sr" id="albIn"></label>
      </div>
      <label class="toggle">Détourer automatiquement<input type="checkbox" name="detour" ${detourDefault?'checked':''}></label>
      <div id="cutTools" class="cut-tools"></div>
      <label class="field"><span>Nom</span><input type="text" name="name" value="${esc(p.name)}" placeholder="Chemise en lin bleue" autocomplete="off"></label>
      <fieldset><legend class="legend">Catégorie</legend><div class="chips">
        ${CATS.map(c => `<label class="chip"><input type="radio" name="cat" value="${c.id}" ${p.category===c.id?'checked':''}><span>${c.label}</span></label>`).join('')}
      </div></fieldset>
      <label class="toggle">Au sale<input type="checkbox" name="dirty" ${p.dirty?'checked':''}></label>
      ${existing?'<button class="linkish del-link" type="button" id="del">Supprimer définitivement</button>':''}
    </div>
    <div class="sheet-actions">
      <button class="btn grow" type="button" data-close>Annuler</button>
      <button class="btn primary grow" type="submit" id="save">Enregistrer</button>
    </div></form>`;
  openSheet(html, form => {
    if(busy){ toast('La photo est encore en cours de traitement.'); return false; }
    const name = form.name.value.trim();
    if(!name){ form.name.focus(); toast('Donne un nom à la pièce.'); return false; }
    const cat = form.querySelector('input[name=cat]:checked');
    if(!cat){ toast('Choisis une catégorie.'); return false; }
    p.name = name; p.category = cat.value; p.dirty = form.dirty.checked;
    store.savePiece(p); toast(existing ? 'Pièce mise à jour.' : 'Pièce ajoutée.');
  }, form => {
    const drop = form.querySelector('#drop'), tools = form.querySelector('#cutTools'), save = form.querySelector('#save');
    const paint = (busyText) => {
      const cut = cutSrc(p), orig = photoSrc(p);
      drop.classList.toggle('checker', !!cut);
      drop.innerHTML = cut ? `<img src="${esc(cut)}" alt="Pièce détourée">` : orig ? `<img src="${esc(orig)}" alt="Photo de la pièce">` : `<div class="noimg">${ICON.camera}<span>Photographie la pièce toujours au même endroit, sur un fond uni</span></div>`;
      if(busyText) drop.insertAdjacentHTML('beforeend', `<span class="busy">${busyText}</span>`);
      tools.innerHTML = !orig ? '' : cut
        ? '<button type="button" class="linkish" data-cut="remove">Annuler le détourage</button>'
        : '<button type="button" class="linkish" data-cut="run">Détourer cette photo</button>';
    };
    const setBusy = b => { busy = b; save.disabled = b; };
    const runCut = async (img) => {
      const cut = cutout(img);
      if(cut){ p.photo.cut = cut; }
      else { delete p.photo.cut; toast("Détourage impossible : le fond n'est pas assez uni ou trop proche de la couleur du vêtement."); }
    };
    const useImage = async img => {
      setBusy(true); paint('Traitement…');
      try{
        const old = p.photo;
        p.photo = await processPhoto(img);
        if(old && old.assetId && store.assets && old.assetId !== p.photo.assetId) store.assets.delete(old.assetId).catch(()=>{});
        if(form.detour.checked) await runCut(img);
      }catch(e){ toast('Photo illisible, réessaie.'); }
      setBusy(false); paint();
    };
    form.querySelector('#camBtn').addEventListener('click', () => {
      const checked = form.querySelector('input[name=cat]:checked');
      openCamera(checked ? checked.value : 'tshirt', (canvas, cat) => {
        const r = form.querySelector(`input[name=cat][value="${cat}"]`); if(r) r.checked = true;
        useImage(canvas);
      }, () => form.querySelector('#camIn').click());
    });
    const onFile = async input => {
      const f = input.files && input.files[0]; if(!f) return;
      setBusy(true); paint('Traitement…');
      try{
        const img = await loadImage(f);
        const old = p.photo;
        p.photo = await processPhoto(img);
        if(old && old.assetId && store.assets && old.assetId !== p.photo.assetId) store.assets.delete(old.assetId).catch(()=>{});
        if(form.detour.checked) await runCut(img);
      }catch(e){ toast('Photo illisible, essaie une autre image.'); }
      setBusy(false); paint(); input.value = '';
    };
    form.querySelector('#camIn').addEventListener('change', e => onFile(e.target));
    form.querySelector('#albIn').addEventListener('change', e => onFile(e.target));
    form.detour.addEventListener('change', () => store.saveSettings({detour: form.detour.checked}));
    tools.addEventListener('click', async e => {
      const b = e.target.closest('[data-cut]'); if(!b) return;
      if(b.dataset.cut === 'remove'){ delete p.photo.cut; paint(); return; }
      setBusy(true); paint('Détourage…');
      try{
        const img = new Image(); img.crossOrigin = 'anonymous';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = photoSrc(p); });
        await runCut(img);
      }catch(err){ toast('Impossible de relire la photo.'); }
      setBusy(false); paint();
    });
    paint();
    const del = form.querySelector('#del');
    if(del) del.addEventListener('click', () => {
      const n = [...S.outfits.values()].filter(o => (o.pieceIds||[]).includes(p.id)).length;
      if(confirm(`Supprimer « ${p.name} » ?${n?` Elle sera retirée de ${n} tenue${n>1?'s':''}.`:''}`)){ store.deletePiece(p.id); sheet.close(); toast('Pièce supprimée.'); }
    });
  });
}

/* ---------- Actions ---------- */
document.addEventListener('click', e => {
  const sec = e.target.closest('[data-section]');
  if(sec){ S.section = sec.dataset.section; render(); window.scrollTo({top:0}); return; }
  const el = e.target.closest('[data-act]'); if(!el || sheet.contains(el)) return;
  const id = el.dataset.id;
  switch(el.dataset.act){
    case 'new-piece': pieceSheet(); break;
    case 'edit-piece': pieceSheet(S.pieces.get(id)); break;
    case 'new-outfit': outfitSheet(); break;
    case 'edit-outfit': outfitSheet(S.outfits.get(id)); break;
    case 'filter': S.filter = el.dataset.cat; render(); break;
    case 'toggle-dirty': { const p = S.pieces.get(id); if(p) store.savePiece({...p, dirty:!p.dirty}); break; }
    case 'all-clean': for(const p of S.pieces.values()) if(p.dirty) store.savePiece({...p, dirty:false}); toast('Tout est propre.'); break;
    case 'band': {
      const w = tomorrowWeather();
      store.saveSettings({manual:{date:tomorrowKey(), band:el.dataset.band, rain: w ? w.rain : false}}); S.alt = 0; break;
    }
    case 'rain': {
      const w = tomorrowWeather();
      store.saveSettings({manual:{date:tomorrowKey(), band: w ? w.band : 'doux', rain: !(w && w.rain)}}); S.alt = 0; break;
    }
    case 'auto-weather': refreshWeather(); break;
    case 'day': S.dayChoice = +el.dataset.off; S.alt = 0; render(); break;
    case 'another': S.alt++; render(); break;
    case 'plan': {
      const o = S.outfits.get(id); if(!o) break;
      store.saveOutfit({...o, prevWorn:o.lastWorn ?? null, lastWorn:tomorrowKey()});
      store.saveSettings({planned:{date:tomorrowKey(), outfitId:id}});
      toast(`C'est noté pour ${dayWord()}.`); break;
    }
    case 'unplan': {
      const pl = S.settings.planned; const o = pl && S.outfits.get(pl.outfitId);
      if(o && o.lastWorn === tomorrowKey()) store.saveOutfit({...o, lastWorn:o.prevWorn ?? null});
      store.saveSettings({planned:null}); S.alt = 0; break;
    }
    case 'jacket': store.saveSettings({jacketSide: el.textContent.includes('côté')}); break;
    case 'dirty-planned': {
      const pl = S.settings.planned; const o = pl && S.outfits.get(pl.outfitId); if(!o) break;
      (o.pieceIds||[]).forEach(pid => { const p = S.pieces.get(pid); if(p && !p.dirty) store.savePiece({...p, dirty:true}); });
      toast('Pièces mises au sale.'); break;
    }
  }
});

render();
store.init();
fetchWeather();
// Rafraîchit la météo quand on revient sur l'app
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') fetchWeather(); });
// Demande à Chrome de ne jamais effacer tes photos et tenues
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
// Application installable + fonctionne hors connexion
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
