<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organisation</title>
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<!--PWA-->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!--/PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8EBEF;--surface:#FFFFFF;--sunk:#F2F4F7;--ink:#18202E;--muted:#636C7D;--line:#D3D8E0;
  --denim:#2F4C78;--denim-soft:#DCE4F0;--on-denim:#FFFFFF;
  --today:#E8962E;--today-soft:#FFF1DC;--tomorrow:#7B5CD6;--tomorrow-soft:#EFE9FF;--warn:#A8432C;
  /* teintes dérivées, propres à Organisation */
  --today-card:#FFF1DC;--today-row:#FFFFFF;--today-line:#F2C98C;--today-box:#E2B26D;
  --tomorrow-card:#F3EEFF;--tomorrow-row:#FFFFFF;--tomorrow-line:#CDBEF5;--tomorrow-box:#B7A5EE;
  --box:#B3BBC8;--box-bg:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C;--surface:#1B212B;--sunk:#232A36;--ink:#E7EBF1;--muted:#98A1B1;--line:#2E3645;
    --denim:#8FB0E3;--denim-soft:#26344B;--on-denim:#0F1622;
    --today:#F0A648;--today-soft:#3B2C15;--tomorrow:#A58CF0;--tomorrow-soft:#2A2342;--warn:#E3826B;
    --today-card:#2A2216;--today-row:#3B2F1F;--today-line:#6E5228;--today-box:#7A6446;
    --tomorrow-card:#221D35;--tomorrow-row:#2E2747;--tomorrow-line:#4A3D78;--tomorrow-box:#65589A;
    --box:#4A5468;--box-bg:#2E3645;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C;--surface:#1B212B;--sunk:#232A36;--ink:#E7EBF1;--muted:#98A1B1;--line:#2E3645;
  --denim:#8FB0E3;--denim-soft:#26344B;--on-denim:#0F1622;
  --today:#F0A648;--today-soft:#3B2C15;--tomorrow:#A58CF0;--tomorrow-soft:#2A2342;--warn:#E3826B;
  --today-card:#2A2216;--today-row:#3B2F1F;--today-line:#6E5228;--today-box:#7A6446;
  --tomorrow-card:#221D35;--tomorrow-row:#2E2747;--tomorrow-line:#4A3D78;--tomorrow-box:#65589A;
  --box:#4A5468;--box-bg:#2E3645;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
svg{display:block;flex:none}
h1,h2,h3,.title{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.01em;margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;border:0;padding:0;margin:0}
.f-grow{flex:1}

#app{max-width:640px;margin:0 auto;padding:16px 16px 20px;display:flex;flex-direction:column}

/* Chips et boutons */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;line-height:1.3;color:var(--ink);white-space:nowrap;flex:none}
.chip.on{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);text-align:center}
.btn.primary{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1 1 0;min-width:0}
.btn-ico{width:40px;height:40px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}

/* Carte du haut */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 12px 14px 16px;margin-bottom:14px}
.hero-top{display:flex;align-items:center;gap:12px}
.hero-main{flex:1;min-width:0}
.hero-day{font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.hero-num{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;margin:10px 0 6px}
.hero-sub{font-size:14px;color:var(--muted)}
.hero-chips{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:none;max-width:58%}
.hero-late{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.hero-late::-webkit-scrollbar{display:none}
.hero-late .chip{max-width:240px}
.late-label{font-size:14px;color:var(--muted);white-space:nowrap;flex:none}

/* Raccourcis */
.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:12px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0}
.sc-ico{position:relative;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink);display:flex;align-items:center;justify-content:center}
.sc-lbl{font-size:9px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;word-break:normal;overflow-wrap:normal;hyphens:none}
.badge{position:absolute;top:-3px;right:-3px;height:17px;min-width:17px;padding:0 5px;border-radius:9px;background:var(--today);color:#fff;font-size:10.5px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}

/* Agenda */
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-title{flex:1;min-width:0;min-height:40px;display:flex;align-items:center;font-size:22px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.chip .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--box);background:var(--box-bg);display:flex;align-items:center;justify-content:center}
.chip.on .box{background:var(--on-denim);border-color:var(--on-denim);color:var(--denim)}
.days{display:flex;flex-direction:column;gap:8px}
.day{border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.day.past{opacity:.5}
.day.past.open{opacity:1}
.day-name{flex:none;min-width:66px;font-size:18px;font-weight:700;line-height:1.2}
.day-sum{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.past .day-sum{color:var(--muted)}
.day-count{flex:none;font-size:14px;color:var(--muted)}
.day-body{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.day.today{background:var(--today-card);border-color:var(--today-line)}
.day.today .day-name{color:var(--today)}
.day.tomorrow{background:var(--tomorrow-card);border-color:var(--tomorrow-line)}
.day.tomorrow .day-name{color:var(--tomorrow)}

/* Lignes de tâche et de liste */
.task{display:flex;align-items:center;gap:2px;min-height:54px;padding:3px 8px 3px 2px}
.check{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.check .box{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--box);background:var(--box-bg);display:flex;align-items:center;justify-content:center;color:var(--on-denim)}
.task.done .check .box{background:var(--denim);border-color:var(--denim)}
.day.today .check .box{border-color:var(--today-box);background:transparent}
.day.today .task.done .check .box{background:var(--today);border-color:var(--today);color:var(--today-card)}
.day.tomorrow .check .box{border-color:var(--tomorrow-box);background:transparent}
.day.tomorrow .task.done .check .box{background:var(--tomorrow);border-color:var(--tomorrow);color:var(--tomorrow-card)}
.grip{width:34px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab;margin-right:-8px}
[data-drag-l]{transition:transform .15s}
[data-drag-l] + [data-drag-l]{margin-top:10px}
[data-drag-l].drag{transition:none;position:relative;z-index:2;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.task.simple{padding-left:10px}
/* ---------- Tableau de bord ---------- */
.ob{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
.ob-t{background:var(--sunk);border:0;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;color:var(--ink);text-align:left;font-family:inherit;position:relative}
button.ob-t{width:100%}
.ob-titre{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.ob-titre b{font-family:var(--display);font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-titre > span{font-size:12px;font-weight:700;color:var(--muted)}
.ob-vide{margin:0;font-size:14px;color:var(--muted)}
.ob-sous{font-size:12.5px;font-weight:600;color:var(--muted)}
.ob-bande{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,4fr);gap:8px;align-items:start}
.ob-btns{display:flex;flex-direction:column;gap:8px;height:132px}
.ob-bbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;border-radius:14px;background:var(--sunk);color:var(--ink);font-size:11px;font-weight:600;line-height:1.15;padding:6px 2px;text-align:center}
.ob-bbtn svg{color:var(--denim)}
.ob-bloc{display:flex;flex-direction:column;gap:8px;min-width:0}
.ob-car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;margin:0 -16px 0 0;padding:0 16px 0 0}
.ob-car.pleine{margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.ob-car::-webkit-scrollbar{display:none}
.ob-car > .ob-t{flex:0 0 100%;scroll-snap-align:start}
.ob-points{display:flex;justify-content:center;gap:6px}
.ob-points span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.ob-points span.on{background:var(--denim);width:16px;border-radius:3px}
.ob-rout{height:132px;background:color-mix(in srgb,var(--c,var(--denim)) 18%,var(--sunk));cursor:pointer}
.ob-rout .ob-titre b{color:var(--c,var(--ink))}
.ob-steps{display:flex;flex-wrap:wrap;gap:4px;overflow:hidden;max-height:50px}
.ob-steps span{font-size:12px;font-weight:600;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:8px;padding:3px 8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-play{position:absolute;right:12px;top:10px;display:flex;align-items:center;gap:5px;border:0;border-radius:99px;background:var(--c,var(--denim));color:var(--surface);font-size:12.5px;font-weight:700;padding:6px 11px}
.ob-rout .ob-titre{padding-right:84px}
.ob-cat{height:190px;background:color-mix(in srgb,var(--c,var(--denim)) 16%,var(--sunk))}
.ob-cat .ob-titre b{color:var(--c,var(--ink))}
.ob-liste{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:none;display:flex;flex-direction:column;gap:4px}
.ob-liste::-webkit-scrollbar{display:none}
.ob-l{display:flex;align-items:center;gap:8px;border:0;border-radius:10px;background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink);padding:8px 10px;text-align:left;flex:none;min-width:0;font-family:inherit}
.ob-l span{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-l small{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ob-l.fait span{text-decoration:line-through;color:var(--muted)}
.ob-prio{font-style:normal;flex:none;width:16px;height:16px;border-radius:50%;background:var(--today);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ob-evs{height:230px}
.ob-lien{border:0;background:none;color:var(--denim);font-size:12.5px;font-weight:700;padding:0}
.ob-ev{display:flex;align-items:center;gap:10px;border:0;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);padding:7px 10px;text-align:left;flex:none;min-width:0;font-family:inherit}
.ob-ev-d{flex:none;width:38px;display:flex;flex-direction:column;align-items:center;line-height:1}
.ob-ev-d b{font-family:var(--display);font-size:18px;font-weight:800;color:var(--c)}
.ob-ev-d small{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.ob-ev-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ob-ev-t b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-ev-t small{font-size:12px;color:var(--muted)}
.att{display:flex;flex-direction:column;gap:5px;max-height:34dvh;overflow-y:auto;overscroll-behavior:contain;margin-bottom:6px}
.att-l{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px;color:var(--ink);text-align:left;font-size:15px;font-weight:600;font-family:inherit}
.att-l .cdot{flex:none}
.att-l .ell{flex:1;min-width:0}
.att-plus{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--denim);color:var(--on-denim)}
.ob-att{margin-bottom:12px}
.ob-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-8px 2px 12px}
.ob-tete h1{margin:0;font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-weight:800;font-size:clamp(22px,7vw,40px);line-height:1;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ob-reg{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ob-bande-t .ob-btns{height:150px}
.ob-bande-t .ob-cat{height:150px}
.ob-play.rond{position:absolute;top:8px;right:42px;width:28px;height:28px;border-radius:50%;padding:0;justify-content:center;gap:0;z-index:2}
.ob-carre .ob-rout .ob-titre{padding-right:62px}
.ob-duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.ob-carre{position:relative}
.ob-car.sq{margin:0;padding:0}
.ob-car.sq > .ob-t{height:160px}
.ob-carre .ob-rout .ob-titre{padding-right:30px}
.ob-carre .ob-rout .ob-titre b{font-size:15px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ob-carre .ob-steps{max-height:none;overflow:hidden;flex:1;min-height:0;align-content:flex-start}
.ob-carre .ob-ev2 .ob-titre b{font-size:15px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ob-carre .ob-ev2 .ob-titre > span{display:none}
.ob-carre .ob-n b{font-size:30px}
.ob-carre .ob-remettre{right:10px;bottom:10px}
.ob-carre .ob-dates{padding-bottom:34px}
.ob-mini-plus{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 75%,transparent);color:var(--denim);display:flex;align-items:center;justify-content:center;padding:0}
.ob-cat{cursor:pointer}
dialog.ob-pop{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,440px);max-height:min(80dvh,640px);border-radius:22px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:obpop .18s ease}
dialog.ob-pop::backdrop{background:rgba(10,14,22,.5)}
@keyframes obpop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.ob-pop-in{display:flex;flex-direction:column;max-height:min(80dvh,640px)}
.ob-pop-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.ob-pop-h h2{margin:0;font-family:var(--display);font-size:22px}
.ob-pop-x{width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);color:var(--muted);font-size:15px}
.ob-pop-c{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.ob-pr{background:color-mix(in srgb,var(--c,var(--denim)) 14%,var(--sunk));border-radius:14px}
.ob-pr summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.ob-pr summary::-webkit-details-marker{display:none}
.ob-pr summary b{flex:1;font-family:var(--display);font-size:16px;color:var(--c,var(--ink))}
.ob-pr summary span{font-size:12.5px;font-weight:700;color:var(--muted)}
.ob-pr-plus{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:color-mix(in srgb,var(--c,var(--denim)) 22%,var(--surface));color:var(--c,var(--denim));font-size:18px;font-weight:800;line-height:1;padding:0}
.ob-pr-l{display:flex;flex-direction:column;gap:4px;padding:0 8px 10px}
.ob-tip{height:138px;background:color-mix(in srgb,var(--c,var(--denim)) 18%,var(--sunk));justify-content:space-between}
.ob-tip-c{font-size:12px;font-weight:700;color:var(--c,var(--muted))}
.ob-tip-t{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2px;border:0;background:none;color:var(--ink);padding:0;text-align:left;font-family:inherit}
.ob-tip-t b{font-family:var(--display);font-size:19px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ob-tip-t span{font-size:12.5px;font-weight:600;color:var(--muted)}
.ob-tip-b{display:flex;gap:6px}
.ob-tip-b .chip{flex:1;justify-content:center}
.ob-tip-b .chip:last-child{flex:none}
.ob-st{height:178px}
.ob-bars{flex:1;min-height:0;display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end}
.ob-bars.sept{grid-template-columns:repeat(7,1fr);gap:8px}
.ob-bars > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.ob-bars b{font-size:10.5px;font-weight:700;color:var(--muted)}
.ob-bars i{width:80%;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--denim) 40%,transparent)}
.ob-bars .on i{background:var(--today)}
.ob-bars span{font-size:10.5px;font-weight:600;color:var(--muted)}
.ob-hb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:7px}
.ob-hb > div{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 3.6em;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.ob-hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-hb i{display:block;height:9px;border-radius:5px;background:color-mix(in srgb,var(--c,var(--denim)) 18%,transparent);overflow:hidden}
.ob-hb i em{display:block;height:100%;border-radius:5px;background:var(--c,var(--denim))}
.ob-hb b{text-align:right;font-weight:800;color:var(--c,var(--ink));white-space:nowrap}
.ob-note{margin:0;font-size:11px;color:var(--muted)}
.ob-l small.vieux{color:var(--warn)}
.ob-ev2{height:120px;background:color-mix(in srgb,var(--c,var(--denim)) 18%,var(--sunk));cursor:pointer}
.ob-ev2 .ob-titre b{color:var(--c,var(--ink))}
.ob-n{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.ob-n b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.ob-n span{font-size:13px;font-weight:600;color:var(--muted)}
.ob-dates{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;overflow-y:auto;scrollbar-width:none}
.ob-dates span{font-size:13px;font-weight:700;background:color-mix(in srgb,var(--surface) 75%,transparent);border-radius:8px;padding:4px 9px}
.ob-dates span.passe{opacity:.5;text-decoration:line-through}
.ob-dates em{font-style:normal;font-size:13px;color:var(--muted)}
.ob-remettre{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:4px;border:0;border-radius:99px;background:var(--c,var(--denim));color:var(--surface);font-size:12.5px;font-weight:700;padding:6px 11px;font-family:inherit}
.ob-ev2.anim > :not(.ob-titre){animation:obmonte .3s cubic-bezier(.2,.8,.2,1) both}
.ob-ev2.anim .ob-dates span{animation:obpuce .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms + 60ms)}
.ob-ev2.anim .ob-remettre{animation-delay:.12s}
@keyframes obmonte{from{opacity:0;transform:translateY(16px)}}
@keyframes obpuce{from{opacity:0;transform:translateY(10px) scale(.85)}}
@media (prefers-reduced-motion: reduce){.ob-ev2.anim > *,.ob-ev2.anim .ob-dates span{animation:none}}
.task-body{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px}
.t-title{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done .t-title{color:var(--muted);text-decoration:line-through}
.t-prio{color:var(--today);font-weight:700}
.t-meta{font-size:14px;line-height:1.3;color:var(--muted);display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;min-width:0}
.t-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.t-meta .late{color:var(--warn)}
.t-meta .is-today{color:var(--today);font-weight:600}
.t-meta .is-tomorrow{color:var(--tomorrow);font-weight:600}
.rep-lbl{display:inline-flex;align-items:center;gap:4px}
.chip.play{padding:7px 11px 7px 9px;gap:4px;color:var(--denim);font-weight:600}
.add-row{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;color:var(--denim);font-size:15px;font-weight:600}

/* Mois */
.month{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:10px 10px 12px;margin-bottom:8px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{text-align:center;font-size:14px;color:var(--muted);padding:2px 0 4px}
.mday{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:4px;font-size:15px;font-weight:500;line-height:1.3}
.mday.past{opacity:.45}
.mday.today{background:var(--today-soft);color:var(--today);font-weight:700;opacity:1}
.mday.tomorrow{background:var(--tomorrow-soft);color:var(--tomorrow);font-weight:700}
.mday.sel{box-shadow:inset 0 0 0 1.5px var(--denim);opacity:1}
.dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%}

.backup-link{align-self:center;font-size:12px;color:var(--muted);text-align:center;padding:10px 12px;margin-top:14px}

/* Fenêtres qui montent du bas */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(10,14,22,.5);animation:fade .2s ease-out}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 18px 8px;display:flex;flex-direction:column;gap:8px}
.sheet-bar{flex:none;display:flex;gap:10px;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-bar .btn{flex:1 1 0;min-width:0}
.sheet-title{font-size:22px;font-weight:700;line-height:1.2;margin-bottom:6px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Thèmes et listes (sous-catégories repliées) */
.gcard{background:var(--sunk);border:1px solid var(--line);border-radius:22px}
.gcard-head{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px}
.g-emoji{font-size:20px;width:28px;text-align:center;flex:none;line-height:1}
.g-name{flex:1;min-width:0;font-size:18px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-count{font-size:14px;color:var(--muted);flex:none}
.gbadge{height:17px;min-width:17px;padding:0 5px;border-radius:9px;background:var(--today);color:#fff;font-size:10.5px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.chev{color:var(--muted);flex:none}
.gcard-body{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.gcard-foot{display:flex;align-items:center;gap:4px;padding:0 2px 0 4px}
.foot-btn{min-height:44px;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:0 4px;white-space:nowrap}
.foot-btn.add{color:var(--denim);font-size:15px;font-weight:600;flex:1}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.dashed-add{width:100%;min-height:54px;border:1.5px dashed var(--line);border-radius:18px;color:var(--denim);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.quick-add{display:flex;align-items:center;gap:8px}
.quick-add input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;outline:none;font-size:15px;color:var(--ink)}
.quick-add input::placeholder{color:var(--muted)}
.quick-add .btn-ico{width:44px;height:44px;background:var(--denim-soft);color:var(--denim)}

/* Cases de formulaire : titre à gauche, valeur à droite */
.field{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;width:100%;background:var(--sunk);border-radius:12px;text-align:left}
.f-label{font-size:15px;font-weight:600;color:var(--ink);flex:none}
.f-input,.f-select{flex:1;min-width:0;height:46px;background:transparent;border:0;outline:none;padding:0;text-align:right;font-size:15px;font-weight:500;color:var(--muted)}
.f-input::placeholder{color:var(--muted);opacity:.6}
.f-select{appearance:none;-webkit-appearance:none;text-align-last:right;cursor:pointer}
.f-select option{background:var(--surface);color:var(--ink)}
.f-value{flex:1;min-width:0;text-align:right;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-emoji{font-size:20px}
.case{background:var(--sunk);border-radius:12px}
.case > .field{background:transparent}
.case.open > .field{border-radius:12px 12px 0 0}
.case-more{padding:4px 14px 12px;border-radius:0 0 12px 12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.even{flex-wrap:nowrap}
.chips.even .chip{flex:1 1 auto;padding:7px 8px}
.rowline{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.f-word{min-width:66px}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;flex:none}
.stepper button{width:40px;height:38px;color:var(--denim);font-size:20px;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:30px;text-align:center;font-size:15px;font-weight:700;white-space:nowrap}
.stepper span.wide{min-width:62px}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdays .chip{padding:7px 0}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);padding:3px;display:flex;flex:none;margin-left:auto}
.switch .knob{width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch.on{background:var(--today)}
.switch.on .knob{transform:translateX(20px);background:var(--surface)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emoji-grid button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;text-align:center}
.emoji-grid button.on{background:var(--denim);border-color:var(--denim)}
.del-btn{margin-top:8px}
.shake{animation:shake .25s 2}
.ver{text-align:center;font-size:14px;color:var(--muted);padding-top:4px}

/* Fenêtre de confirmation */
.modal-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.modal{position:relative;width:100%;max-width:340px;background:var(--surface);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;animation:pop .18s ease-out}
.modal h3{font-size:18px;font-weight:700;line-height:1.25}
.modal p{margin:0;font-size:14px;color:var(--muted)}
.modal .btn-row{margin-top:12px}

/* Minuteur économe : fond noir, texte sombre, presque rien ne bouge */
.timer{position:fixed;inset:0;z-index:30;background:#000;color:#5E6674;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.timer[hidden]{display:none}
.timer-inner{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
.timer-task{font-size:16px;max-width:86vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-time{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-size:88px;font-weight:500;letter-spacing:-.03em;color:#868F9E;font-variant-numeric:tabular-nums;line-height:1}
.timer.paused .timer-time{color:#3F4652}
.timer-btns{display:flex;gap:10px;margin-top:28px}
.timer-outils{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;width:min(420px,86vw)}
.timer-outils[hidden]{display:none}
.timer-outils button{display:flex;flex-direction:column;gap:6px;border:1px solid #23272F;border-radius:14px;padding:12px;color:#6E7787;text-align:center;min-width:0}
.timer-outils span{font-size:12px;font-weight:600}
.timer-outils b{font-size:17px;font-weight:700;color:#9AA3B2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-btns button{border:1px solid #23272F;border-radius:12px;padding:11px 13px;color:#6E7787;font-size:15px;font-weight:600;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.toast[hidden]{display:none}


/* Couleurs des catégories et des listes */
:root{--c-forest:#1E5E33;--c-mint:#237A5C;--c-cyan:#0E7480;--c-indigo:#3A41A8;--c-plum:#7D2E68;--c-rose:#B03A5B;--c-red:#B42D2D;--c-orange:#B25A12;--c-amber:#946200;--c-olive:#66611C;--c-brown:#6E4426;--c-gray:#5F6670;--c-sky:#146C93;--c-lime:#5A7A12;--c-fuchsia:#96309F;--c-sand:#8A6334;--c-green:#2F7A4A;--c-pink:#A83E6E;--c-teal:#1F7C78;--c-yellow:#8A6A0E;--c-purple:#6A4BC4;--c-coral:#B4532F;--c-blue:#2F4C78;--c-slate:#56627A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-forest:#4FAE6A;--c-mint:#8EE3C4;--c-cyan:#4FD8E6;--c-indigo:#8C93F0;--c-plum:#C77BB0;--c-rose:#F4A3B8;--c-red:#F07272;--c-orange:#F5A25D;--c-amber:#FFC24D;--c-olive:#BDB76B;--c-brown:#C29572;--c-gray:#C9CDD4;--c-sky:#63C7EE;--c-lime:#B8D65A;--c-fuchsia:#D47FE0;--c-sand:#D6B48C;--c-green:#7CC992;--c-pink:#E98BB5;--c-teal:#5EC4C0;--c-yellow:#E3C35A;--c-purple:#A58CF0;--c-coral:#EE9A7A;--c-blue:#8FB0E3;--c-slate:#AAB4C6}}
:root[data-theme="dark"]{--c-forest:#4FAE6A;--c-mint:#8EE3C4;--c-cyan:#4FD8E6;--c-indigo:#8C93F0;--c-plum:#C77BB0;--c-rose:#F4A3B8;--c-red:#F07272;--c-orange:#F5A25D;--c-amber:#FFC24D;--c-olive:#BDB76B;--c-brown:#C29572;--c-gray:#C9CDD4;--c-sky:#63C7EE;--c-lime:#B8D65A;--c-fuchsia:#D47FE0;--c-sand:#D6B48C;--c-green:#7CC992;--c-pink:#E98BB5;--c-teal:#5EC4C0;--c-yellow:#E3C35A;--c-purple:#A58CF0;--c-coral:#EE9A7A;--c-blue:#8FB0E3;--c-slate:#AAB4C6}
.c-forest{--c:var(--c-forest)}.c-mint{--c:var(--c-mint)}.c-cyan{--c:var(--c-cyan)}.c-indigo{--c:var(--c-indigo)}.c-plum{--c:var(--c-plum)}.c-rose{--c:var(--c-rose)}.c-red{--c:var(--c-red)}.c-orange{--c:var(--c-orange)}.c-amber{--c:var(--c-amber)}.c-olive{--c:var(--c-olive)}.c-brown{--c:var(--c-brown)}.c-gray{--c:var(--c-gray)}
.c-sky{--c:var(--c-sky)}.c-lime{--c:var(--c-lime)}.c-fuchsia{--c:var(--c-fuchsia)}.c-sand{--c:var(--c-sand)}
.c-green{--c:var(--c-green)}.c-pink{--c:var(--c-pink)}.c-teal{--c:var(--c-teal)}.c-yellow{--c:var(--c-yellow)}
.c-purple{--c:var(--c-purple)}.c-coral{--c:var(--c-coral)}.c-blue{--c:var(--c-blue)}.c-slate{--c:var(--c-slate)}
.task-wrap{background:var(--sunk);border-radius:12px}
.day.today .task-wrap{background:var(--today-row)}
.day.tomorrow .task-wrap{background:var(--tomorrow-row)}
.task-wrap.cat{box-shadow:inset 3px 0 0 var(--c)}
.cat-name{color:var(--c);font-weight:600}
.gcard .task-wrap{background:var(--surface)}
.gcard.tint{background:color-mix(in srgb,var(--c) 9%,var(--sunk));border-color:color-mix(in srgb,var(--c) 38%,var(--line))}
.gcard.tint .g-name{color:var(--c)}
.gcard.tint .task-wrap{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.gcard.tint .quick-add input{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.cdots{display:flex;gap:3px;flex:none}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.dot{background:var(--c,var(--denim))}
.task .chev{padding-right:4px}
.subs{padding:0 10px 8px 46px;display:flex;flex-direction:column}
.sub{display:flex;align-items:center;gap:4px;min-height:40px}
.check.sm{width:36px;height:40px;margin-left:-8px}
.check.sm .box{width:20px;height:20px;border-radius:5px}
.sub-title{font-size:15px;line-height:1.3;min-width:0}
.sub.done .sub-title{color:var(--muted);text-decoration:line-through}
.sub.done .check .box{background:var(--denim);border-color:var(--denim)}
.day.today .sub.done .check .box{background:var(--today);border-color:var(--today);color:var(--today-card)}
.day.tomorrow .sub.done .check .box{background:var(--tomorrow);border-color:var(--tomorrow);color:var(--tomorrow-card)}
.sub-edit{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:40px;font-size:14px;color:var(--muted)}
.day-head{display:flex;align-items:center;padding-right:8px}
.day-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 8px 0 16px;text-align:left}
.day-add{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.day.today .day-add{background:var(--today-row);border-color:var(--today-line);color:var(--today)}
.day.tomorrow .day-add{background:var(--tomorrow-row);border-color:var(--tomorrow-line);color:var(--tomorrow)}
.hero-bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:10px}
.hero-bar span{display:block;height:100%;border-radius:99px;background:var(--today)}
.hero-sec{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.hero-cats{display:flex;flex-wrap:wrap;gap:6px 16px}
.hcat{display:flex;align-items:center;gap:7px;font-size:14px;min-width:0;max-width:100%;line-height:1.3;white-space:nowrap}
.hcat .ell{white-space:nowrap}
.hcat .n{color:var(--muted);flex:none}
.hero-row{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}
.hero-row::-webkit-scrollbar{display:none}
.hero-row .chip{max-width:260px}
.chip .muted{color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.swatch{aspect-ratio:1;border-radius:99px;background:var(--c)}
.swatch.on{box-shadow:0 0 0 2px var(--sunk),0 0 0 4px var(--c)}
.f-dot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;margin-right:8px;vertical-align:-1px}
.subedit{display:flex;align-items:center;gap:8px}
.subedit input{flex:1;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;font-size:15px;color:var(--ink);outline:none}
.subedit button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.i-emoji{margin-right:2px}

.duo{display:flex;flex-direction:column;gap:8px}
.day.mini{padding:0 5px 5px}
.mini-head{display:flex;align-items:center;gap:4px;min-height:50px;padding:0 0 0 7px}
.mini-head .day-name{flex:1;min-width:0;font-size:clamp(16px,4.6vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .day-add{width:30px;height:30px}
.mini-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mini-body > .task-wrap.open,.rgroup > .task-wrap.open,.mini-body > .span2,.rgroup > .span2{grid-column:1/-1}
.task-wrap.mini .task{min-height:48px;padding:3px 6px 3px 0;gap:0}
.task-wrap.mini .check{width:38px}
.task-wrap.mini .task-body{padding:4px 2px}
.task-wrap.mini .t-title{font-size:15px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto}
.task-wrap.mini .t-meta{font-size:13px}
.task-wrap.mini .subs{padding:0 8px 6px 34px}
.task-wrap.mini .sub-title{font-size:14px}
.play-ico{width:30px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--sunk);color:var(--denim);display:flex;align-items:center;justify-content:center;flex:none}
.next3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.daybtn{min-height:60px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;color:var(--ink);min-width:0}
.db-name{font-size:15px;font-weight:600;line-height:1.2;white-space:nowrap}

<script>
(() => {
'use strict';
const VERSION = 30;
const DEMO = false;
const DB_NAME = 'organisation';
const STORES = ['themes', 'tasks', 'lists', 'items', 'routines'];

/* ---------- Dates ---------- */
const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JC = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MC = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => (parse(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -dow(s));
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const shortDate = s => JC[dow(s)] + ' ' + parse(s).getDate();
function relLabel(s) {
  const t = today();
  if (s === t) return "Aujourd'hui";
  if (s === addDays(t, 1)) return 'Demain';
  const d = parse(s);
  let r = JC[dow(s)] + ' ' + d.getDate() + ' ' + MC[d.getMonth()];
  if (d.getFullYear() !== new Date().getFullYear()) r += ' ' + d.getFullYear();
  return r;
}

/* ---------- Outils ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, one, many) => n + ' ' + (n > 1 ? many : one);
const ic = (d, s = 20, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const P = {
  check: 'M5 12.5l4.5 4.5L19 7.5', left: 'M15 6l-6 6 6 6', right: 'M9 6l6 6-6 6', down: 'M6 9l6 6 6-6', up: 'M6 15l6-6 6 6',
  plus: 'M12 5v14M5 12h14', close: 'M6 6l12 12M18 6L6 18',
  rep: 'M4 12a8 8 0 0 1 13.7-5.6L20 8.7M20 4v4.7h-4.7M20 12a8 8 0 0 1-13.7 5.6L4 15.3M4 20v-4.7h4.7',
  play: 'M8 5.5v13l10-6.5z', pencil: 'M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3zM14 7l3 3',
  todo: 'M4 6.5l1.5 1.5L8.5 5M4 12.5l1.5 1.5 3-3M4 18.5l1.5 1.5 3-3M12 7h8M12 13h8M12 19h8',
  bookmark: 'M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z'
};
const CHECK = ic(P.check, 15, 3);

let toastTO, toastUndo = null;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${h(msg)}</span>${undo ? '<button type="button" class="toast-undo">Annuler</button>' : ''}`;
  toastUndo = undo || null; t.hidden = false;
  clearTimeout(toastTO);
  toastTO = setTimeout(() => { t.hidden = true; toastUndo = null; }, undo ? 6000 : 2200);
}
document.addEventListener('click', e => {
  if (!e.target.closest('.toast-undo') || !toastUndo) return;
  const u = toastUndo; toastUndo = null; $('#toast').hidden = true; u();
});

/* ---------- Base de données « organisation » ---------- */
let db = null;
const S = { themes: [], tasks: [], lists: [], items: [], routines: [], meta: {} };

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function getAll(store) {
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(stores, fn) {
  if (!db) return Promise.resolve();
  return new Promise((res, rej) => {
    const t = db.transaction(stores, 'readwrite');
    fn(t);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
function save(store, obj) {
  const arr = S[store];
  const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  return tx([store], t => t.objectStore(store).put(obj)).catch(() => toast('Enregistrement impossible 😕'));
}
function removeMany(store, ids) {
  S[store] = S[store].filter(x => !ids.includes(x.id));
  return tx([store], t => ids.forEach(id => t.objectStore(store).delete(id))).catch(() => {});
}
function setMeta(key, value) {
  S.meta[key] = value;
  return tx(['meta'], t => t.objectStore('meta').put({ key, value })).catch(() => {});
}
async function loadAll() {
  for (const s of STORES) S[s] = await getAll(s);
  const meta = await getAll('meta');
  S.meta = {}; meta.forEach(m => { S.meta[m.key] = m.value; });
}

/* ---------- Répétitions ---------- */
const monthIdx = s => { const x = parse(s); return x.getFullYear() * 12 + x.getMonth(); };
const ord = n => n === 1 ? '1er' : n + 'e';
// Date de l'occurrence mensuelle dans le mois (y, m), selon le mode choisi
function monthOcc(r, y, m) {
  const n = dim(y, m), mode = r.mode || 'dom', wd = r.wd || 0;
  if (mode === 'dom') return iso(new Date(y, m, Math.min(r.dom || 1, n)));
  if (mode === 'lastday') return iso(new Date(y, m, n));
  if (mode === 'nth') {
    const first = dow(iso(new Date(y, m, 1)));
    const day = 1 + ((wd - first + 7) % 7) + 7 * ((r.nth || 1) - 1);
    return day <= n ? iso(new Date(y, m, day)) : null;
  }
  if (mode === 'last') {
    const lastDow = dow(iso(new Date(y, m, n)));
    return iso(new Date(y, m, n - ((lastDow - wd + 7) % 7)));
  }
  if (mode === 'near') {
    const target = iso(new Date(y, m, Math.min(r.dom || 1, n)));
    let s = (wd - dow(target) + 7) % 7; if (s > 3) s -= 7;
    return addDays(target, s);
  }
  return null;
}
/* Retard lissé : une tâche répétée faite en retard (ex. raser la barbe le mercredi au lieu du dimanche)
   décale les occurrences suivantes, de moins en moins, jusqu'à retrouver son jour habituel.
   t.decal = { p: date prévue, L: jours de retard, step: jours rattrapés à chaque fois } */
const decalCache = new Map();
function decalOcc(t) {
  const dc = t.decal; if (!dc || !t.rep || !(dc.L > 0)) return null;
  const key = JSON.stringify([dc, t.rep, t.date, t.created, t.skip || []]);
  const c = decalCache.get(t.id); if (c && c.key === key) return c.list;
  // Chaque fois : l'intervalle habituel moins un petit rattrapage, compté depuis la fois précédente,
  // jusqu'à retomber sur le jour prévu. L'écart n'est donc jamais plus grand que l'intervalle normal.
  const list = []; let q = dc.p, prec = dc.fait || addDays(dc.p, dc.L);
  for (let k = 1; k <= 60; k++) {
    let n = null; for (let i = 1; i <= 400; i++) { const x = addDays(q, i); if (occursBase(t, x)) { n = x; break; } }
    if (!n) break;
    const vise = addDays(prec, diffDays(q, n) - dc.step);
    const d2 = vise > n ? vise : n;
    list.push({ q: n, d: d2 });
    if (d2 === n) break;   // revenu au jour prévu
    q = n; prec = d2;
  }
  decalCache.set(t.id, { key, list });
  return list;
}
function occursOn(t, d) {
  if (t.rep && t.decal) {
    const l = decalOcc(t);
    if (l && l.length) {
      if (l.some(x => x.d === d)) return true;            // occurrence décalée à ce jour
      if (l.some(x => x.q === d && x.d !== d)) return false; // son jour d'origine est libéré
    }
  }
  return occursBase(t, d);
}
function occursBase(t, d) {
  if (t.kind === 'event') { if (!t.date) return false; return t.yearly ? (d >= t.date && d.slice(5) === t.date.slice(5)) : t.date === d; }
  if (t.free) return false;
  if (!t.rep) return t.date === d;
  if (t.skip && t.skip.includes(d)) return false;
  const start = t.date || t.created;
  if (!start || d < start) return false;
  const r = t.rep;
  if (r.unit === 'jour') return diffDays(start, d) % (r.every || 1) === 0;
  if (r.unit === 'sem') {
    const days = r.days && r.days.length ? r.days : [dow(start)];
    if (!days.includes(dow(d))) return false;
    return Math.round(diffDays(mondayOf(start), mondayOf(d)) / 7) % (r.every || 1) === 0;
  }
  if (r.unit === 'an') return d.slice(5) === start.slice(5) && (parse(d).getFullYear() - parse(start).getFullYear()) % (r.every || 1) === 0;
  if (r.unit === 'mois') {
    const sm = monthIdx(start), dm = monthIdx(d);
    for (const off of [0, -1, 1]) {
      const mi = dm + off;
      if (mi < sm || (mi - sm) % (r.every || 1)) continue;
      if (monthOcc(r, Math.floor(mi / 12), mi % 12) === d) return true;
    }
    return false;
  }
  return false;
}
const isDone = (t, d) => (t.free || t.info) ? false : (t.rep || (t.kind === 'event' && t.yearly)) ? (t.doneDates || []).includes(d) : !!t.done;
function prevOcc(t, before) {
  for (let i = 1; i <= 62; i++) { const d = addDays(before, -i); if (occursOn(t, d)) return d; }
  return null;
}
function nextOcc(t, from) {
  if (!t.rep && !(t.kind === 'event' && t.yearly)) return t.date;
  for (let i = 0; i < 400; i++) { const d = addDays(from, i); if (occursOn(t, d)) return d; }
  return null;
}
function monthText(r) {
  const mode = r.mode || 'dom', jour = JOURS[r.wd || 0].toLowerCase();
  if (mode === 'dom') return `Le ${r.dom || 1} du mois`;
  if (mode === 'nth') return `Le ${ord(r.nth || 1)} ${jour} du mois`;
  if (mode === 'last') return `Le dernier ${jour} du mois`;
  if (mode === 'near') return `Le ${jour} le plus proche du ${r.dom || 1}`;
  if (mode === 'lastday') return 'Le dernier jour du mois';
  return '';
}
function repLabel(t) {
  const r = t.rep; if (!r) return '';
  const n = r.every || 1;
  if (r.unit === 'jour') return n === 1 ? 'Chaque jour' : `Tous les ${n} jours`;
  if (r.unit === 'sem') {
    const days = (r.days && r.days.length ? r.days : [dow(t.date || t.created)]).slice().sort();
    if (days.length === 7) return n === 1 ? 'Chaque jour' : `Toutes les ${n} sem.`;
    const ds = days.map(i => JC[i]).join(', ');
    return n === 1 ? 'Chaque ' + ds : `Toutes les ${n} sem. · ${ds}`;
  }
  if (r.unit === 'mois') return monthText(r) + (n > 1 ? ` · tous les ${n} mois` : '');
  if (r.unit === 'an') return n === 1 ? 'Chaque année' : `Tous les ${n} ans`;
  return '';
}

/* ---------- Sous-tâches ---------- */
const subKey = (t, d) => t.rep ? (d || today()) : t.free ? 'f' + (t.freeLog || []).length : 'x';
const subDone = (t, d) => ((t.subDone || {})[subKey(t, d)] || []).filter(id => (t.subs || []).some(s => s.id === id));
const hasSubs = t => !!(t.subs && t.subs.length);

/* ---------- Couleurs et emojis automatiques ---------- */
const COLORS = ['green', 'pink', 'teal', 'yellow', 'purple', 'coral', 'blue', 'sky', 'lime', 'fuchsia', 'sand', 'red', 'orange', 'indigo', 'mint', 'plum', 'amber', 'cyan', 'forest', 'rose', 'brown', 'olive', 'slate', 'gray'];
// ordre d'affichage du nuancier : par teinte
const SWATCHES = ['red', 'coral', 'orange', 'amber', 'yellow', 'olive', 'lime', 'green', 'forest', 'mint', 'teal', 'cyan', 'sky', 'blue', 'indigo', 'purple', 'plum', 'fuchsia', 'pink', 'rose', 'sand', 'brown', 'slate', 'gray'];
const COLOR_NAMES = { green: 'Vert', pink: 'Rose', teal: 'Turquoise', yellow: 'Jaune', purple: 'Violet', coral: 'Corail', blue: 'Bleu', sky: 'Ciel', lime: 'Anis', fuchsia: 'Fuchsia', sand: 'Sable', slate: 'Ardoise' , forest: 'Forêt', mint: 'Menthe', cyan: 'Cyan', indigo: 'Indigo', plum: 'Prune', rose: 'Rose poudré', red: 'Rouge', orange: 'Orange', amber: 'Ambre', olive: 'Olive', brown: 'Marron', gray: 'Gris' };
const nextColor = arr => {
  const all = [...S.themes, ...S.lists].map(x => x.color), own = arr.map(x => x.color);
  const n = (list, c) => list.filter(x => x === c).length;
  return COLORS.find(c => !all.includes(c)) || COLORS.find(c => !own.includes(c)) || COLORS.slice().sort((a, b) => n(all, a) - n(all, b))[0];
};
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const KW = {
  themes: [
    ['stand ?up|scene|blague|humour|sketch|impro|spectacle', '🎤'], ['menage|maison|quotidien|vie |linge|lessive', '🏠'],
    ['social|ami|famille|pote|relation', '💬'], ['papier|paperasse|admin|impot|banque|caf|assurance|mutuelle|facture', '📄'],
    ['foot|match|ballon|basket|hand|rugby|volley|tennis', '⚽'], ['sport|muscu|course a pied|running|run|velo|natation|gym|fitness', '💪'], ['travail|boulot|job|pro|bureau|taf', '💼'],
    ['etude|cours|ecole|fac|revision|exam|devoir', '🎓'], ['sante|medecin|docteur|dentiste|soin', '🩺'],
    ['argent|budget|finance|epargne', '💰'], ['art|dessin|peinture|creati|ecriture|photo', '🎨'], ['musique|guitare|piano|chant', '🎵'],
    ['bien.?etre|meditation|yoga|detente', '🧘'], ['cuisine|repas|recette|batch', '🍳'], ['voiture|auto|moto', '🚗'],
    ['jardin|plante', '🌱'], ['voyage|vacance', '✈️'], ['lecture|lire|livre', '📚'], ['animaux|chat|chien', '🐾'],
    ['bricol|reparation|travaux|diy', '🛠️'], ['course|shopping|achat', '🛒'], ['projet|objectif|but', '🎯'], ['jeu|gaming', '🎮']
  ],
  lists: [
    ['film|cine', '🎬'], ['serie|anime', '📺'], ['livre|lecture|lire|bd|manga|roman', '📚'], ['lieu|visite|visiter|sortie|balade', '📍'],
    ['voyage|vacance|pays|destination', '✈️'], ['resto|restaurant|manger|bouffe', '🍜'], ['bar|cafe|brunch', '☕'],

// Carte « Stats » : 5 diapos (ce que tu as fait, régularité, temps par catégorie, ce qui traîne, la semaine qui vient)
function statsHTML() {
  const t0 = today(), J = ['L','M','M','J','V','S','D'];
  const tasks = S.tasks.filter(t => !t.info && t.kind !== 'event' && !t.free);
  const faitLe = (t, d) => t.rep ? occursOn(t, d) && isDone(t, d) : !!t.done && (t.doneAt ? iso(new Date(t.doneAt)) : t.date) === d;
  const pts = [], diapos = [];
  // 1) Tâches faites, 14 derniers jours
  const j14 = Array.from({ length: 14 }, (_, k) => addDays(t0, k - 13)), n14 = j14.map(d => tasks.filter(t => faitLe(t, d)).length), m14 = Math.max(1, ...n14);
  const tot14 = n14.reduce((a, b) => a + b, 0);
  diapos.push(`<div class="ob-t ob-st"><div class="ob-titre"><b>Tâches faites</b><span>${tot14} en 14 jours</span></div>
    <div class="ob-bars">${j14.map((d, k) => `<div class="${d === t0 ? 'on' : ''}"><b>${n14[k] || ''}</b><i style="height:${Math.max(3, n14[k] / m14 * 100)}%"></i><span>${J[dow(d)]}</span></div>`).join('')}</div></div>`);
  // 2) Régularité des tâches répétées (30 jours)
  const reg = tasks.filter(t => t.rep).map(t => { let n = 0, f = 0; for (let k = 0; k < 30; k++) { const d = addDays(t0, -k - 1); if (occursOn(t, d)) { n++; if (isDone(t, d)) f++; } } return { t, n, f }; }).filter(x => x.n >= 2).sort((a, b) => b.f / b.n - a.f / a.n);
  if (reg.length) {
    const tous = reg.reduce((a, x) => a + x.n, 0), ok = reg.reduce((a, x) => a + x.f, 0);
    const lr = x => { const th = themeOf(x.t); return `<div class="c-${th ? th.color || 'slate' : 'slate'}"><span>${h(x.t.title)}</span><i><em style="width:${Math.max(3, x.f / x.n * 100)}%"></em></i><b>${Math.round(x.f / x.n * 100)}%</b></div>`; };
    diapos.push(`<div class="ob-t ob-st"><div class="ob-titre"><b>Régularité</b><span>${Math.round(ok / tous * 100)}% sur 30 jours</span></div><div class="ob-hb">${[...reg.slice(0, 2), ...reg.slice(2).slice(-2)].map(lr).join('')}</div><p class="ob-note">Tes tâches répétées les mieux et les moins tenues</p></div>`);
  }
  // 3) Temps passé par catégorie (30 jours, tâches faites qui ont une durée)
  const parTh = new Map();
  for (let k = 0; k < 30; k++) { const d = addDays(t0, -k); tasks.forEach(t => { if (t.duration && faitLe(t, d)) { const th = themeOf(t), top = th && th.parentId ? S.themes.find(x => x.id === th.parentId) || th : th; const key = top ? top.id : '_'; parTh.set(key, (parTh.get(key) || 0) + t.duration); } }); }
  const tps = [...parTh.entries()].sort((a, b) => b[1] - a[1]), totT = tps.reduce((a, x) => a + x[1], 0);
  if (tps.length) { const m = tps[0][1];
    diapos.push(`<div class="ob-t ob-st"><div class="ob-titre"><b>Temps par catégorie</b><span>${fmtMin(totT)} en 30 jours</span></div><div class="ob-hb">${tps.slice(0, 5).map(([k, v]) => { const th = S.themes.find(x => x.id === k); return `<div class="c-${th ? th.color || 'slate' : 'slate'}"><span>${th ? h(th.emoji + ' ' + th.name) : 'Sans catégorie'}</span><i><em style="width:${Math.max(3, v / m * 100)}%"></em></i><b>${fmtMin(v)}</b></div>`; }).join('')}</div></div>`); }
  // 4) Ce qui traîne : les tâches en attente depuis le plus longtemps
  const att = tasks.filter(t => !t.rep && !t.date && !t.done && !t.srcId).map(t => ({ t, j: Math.max(0, Math.round((parse(t0) - parse(String(t.created || t0).slice(0, 10))) / 864e5)) })).sort((a, b) => b.j - a.j);
  if (att.length) diapos.push(`<div class="ob-t ob-st"><div class="ob-titre"><b>Ce qui traîne</b><span>${att.length} en attente</span></div><div class="ob-liste">${att.slice(0, 5).map(x => { const th = themeOf(x.t); return `<button type="button" class="ob-l" data-a="plan" data-id="${x.t.id}"><span>${th ? h(th.emoji) + ' ' : ''}${h(x.t.title)}</span><small class="${x.j > 14 ? 'vieux' : ''}">${x.j ? x.j + ' j' : 'nouveau'}</small></button>`; }).join('')}</div></div>`);
  // 5) La semaine qui vient : combien de choses chaque jour
  const j7 = Array.from({ length: 7 }, (_, k) => addDays(t0, k)), c7 = j7.map(d => S.tasks.filter(t => !t.free && occursOn(t, d) && !(t.rep && isDone(t, d))).length), m7 = Math.max(1, ...c7);
  diapos.push(`<div class="ob-t ob-st"><div class="ob-titre"><b>La semaine qui vient</b><span>${c7.reduce((a, b) => a + b, 0)} choses prévues</span></div>
    <div class="ob-bars sept">${j7.map((d, k) => `<div class="${k === 0 ? 'on' : ''}"><b>${c7[k] || ''}</b><i style="height:${Math.max(3, c7[k] / m7 * 100)}%"></i><span>${k === 0 ? 'Auj.' : JC[dow(d)]}</span></div>`).join('')}</div></div>`);
  return `<div class="ob-bloc"><div class="ob-car pleine" data-car="stats">${diapos.join('')}</div>${diapos.length > 1 ? `<div class="ob-points" aria-hidden="true">${diapos.map((_, i) => `<span${i ? '' : ' class="on"'}></span>`).join('')}</div>` : ''}</div>`;
}

/* Étapes de routine : soit un texte libre { title, duration }, soit une tâche existante { taskId } */

// Fenêtre 📅 : choisir un ou plusieurs jours d'un coup, puis « Valider »

      ${note ? `<p class="panel-note">${note}</p>` : ''}
      ${!t.free && n <= 1 ? `<button type="button" class="chip${keep ? ' on' : ''}" data-f="keep" aria-pressed="${keep}">${keep ? ic(P.check, 14, 2.6) : ic(P.rep, 14, 2)}Garder aussi dans To-do</button>` : ''}

        <div class="rowline wd-pick"><span class="muted">Tous les</span>${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x, i) => `<button type="button" class="chip" data-f="allwd" data-i="${i}" aria-label="Tous les ${JOURS[i].toLowerCase()}s de ce mois">${x}</button>`).join('')}</div></div>

        <button type="button" class="chip" data-f="rt-new">${ic(P.plus, 14, 2.2)}Nouvelle routine</button></div>` : ''}`;

    const days = [...sel].sort();

      else if (u === 'libre') { f.rep = null; f.date = null; }
      else {
        if (!f.date) f.date = t0;
        const x = parse(f.date);
        if (u === 'jour') f.rep = { unit: 'jour', every: 1 };
        if (u === 'sem') f.rep = { unit: 'sem', every: 1, days: [dow(f.date)] };
        if (u === 'mois') f.rep = { unit: 'mois', mode: 'dom', every: 1, dom: x.getDate(), nth: Math.min(4, Math.ceil(x.getDate() / 7)), wd: dow(f.date) };
        if (u === 'an') f.rep = { unit: 'an', every: 1 };
      }
    }
    else if (k === 'mmode') {
      const m = b.dataset.m;
      if (m === 'near' && r.mode !== 'near' && r.wd === dow(f.date || t0)) r.wd = 0;
      if ((m === 'nth' || m === 'last') && r.mode === 'near') r.wd = dow(f.date || t0);
      r.mode = m;
    }
    else if (k === 'mwd') r.wd = +b.dataset.i;
    else if (k === 'wd') {
      const i = +b.dataset.i;
      r.days = r.days.includes(i) ? r.days.filter(x => x !== i) : [...r.days, i].sort();
    }
    else if (k === 'step') {
      const dlt = +b.dataset.s, key = b.dataset.k;
      if (key === 'segn') { durN = Math.min(30, Math.max(1, durN + dlt)); if (!durBlock && durN > 1) durBlock = 10; applyDur(); }
      if (key === 'every') r.every = Math.min(r.unit === 'jour' ? 365 : r.unit === 'sem' ? 52 : 12, Math.max(1, (r.every || 1) + dlt));
      if (key === 'dom') r.dom = Math.min(31, Math.max(1, (r.dom || 1) + dlt));
      if (key === 'nth') r.nth = Math.min(4, Math.max(1, (r.nth || 1) + dlt));
    }
    else if (k === 'cancel') { closeTop(); return; }
    else if (k === 'save') {
      f.title = f.title.trim();
      if (!f.title) { const i = $('[data-f="title"]', s.body); i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); i.focus(); return; }
      const pending = $('[data-f="sub-new"]', s.body);
      if (pending && pending.value.trim()) f.subs.push({ id: uid(), title: pending.value.trim(), min: 0 });
      f.subs = f.subs.map(x => ({ id: x.id, title: x.title.trim(), min: x.min || 0 })).filter(x => x.title);
      const ts = timedSubs(f); if (ts.length) f.duration = ts.reduce((a, x) => a + x.min, 0);
      if (f.routineRun && f.date !== f.runDate) f.routineRun = null;
      if (f.rep && f.rep.unit === 'sem' && !f.rep.days.length) f.rep.days = [dow(f.date || t0)];
      if (f.rep && !f.date) f.date = t0;
      if (!f.doneDates) f.doneDates = [];
      save('tasks', f);
      closeTop(); refresh();
      toast(isNew ? (f.info ? 'Ajouté à l\'agenda 📅' : 'Tâche ajoutée ✨') : 'Modifié ✅');
      if (isNew) closeDayAddSoon();
      return;
    }
    else if (k === 'report') {
      const snap = snapshot(); const tg = reportTask(task, dCtx);
      closeTop(); refresh(); toast(`Reportée ${toLabel(tg)} ↷`, () => restore(snap));
      return;
    }
    else if (k === 'unplan') {
      if (task.rep) {
        const cut = addDays(t0, -120);
        const snap = snapshot();
        save('tasks', { ...task, skip: [...(task.skip || []).filter(x => x >= cut), dCtx] });
        closeTop(); refresh(); toast('Passée pour cette fois 👌', () => restore(snap));
      } else {
        f.title = f.title.trim() || task.title;
        const snap = snapshot();
        if (task.srcId) { retirerCopie(task); closeTop(); refresh(); toast('Retirée · le modèle reste dans To-do 📥', () => restore(snap)); return; }
        save('tasks', { ...f, date: null, routineRun: null });
        closeTop(); refresh(); toast('Retirée · elle t\'attend dans To-do 📥', () => restore(snap));
      }
      return;
    }
    else if (k === 'del') {
      const ok = await confirmBox({ title: 'Supprimer la tâche ?', text: `« ${f.title || task.title} »${task.rep ? ' et toutes ses répétitions' : ''} sera supprimée.`, ok: 'Supprimer' });
      if (!ok) return;
      const snap = snapshot();
      removeMany('tasks', [task.id]);
      closeTop(); refresh(); toast('Tâche supprimée 🗑️', () => restore(snap));
      return;
    }
    else return;
    draw();
  });
  if (isNew) setTimeout(() => { const i = $('[data-f="title"]', s.body); if (i) i.focus(); }, 260);
}

function snapshot() { const o = {}; STORES.forEach(st => { o[st] = JSON.parse(JSON.stringify(S[st])); }); return o; }

// Reporter une tâche au jour suivant (une répétée : on saute ce jour, et on la recopie si elle n'est pas prévue le lendemain)
const toLabel = d => d === addDays(today(), 1) ? 'à demain' : 'au ' + shortDate(d);
function reportTask(t, d, cible) {
  const t0 = today();
  const base = !d || d < t0 ? t0 : d, target = cible || addDays(base, 1);
  if (t.rep) {
    const cut = addDays(t0, -120);
    save('tasks', { ...t, skip: [...(t.skip || []).filter(x => x >= cut), d || t0] });
    const dejaFait = ((t.subDone || {})[d || t0] || []);   // étapes déjà cochées ce jour-là : elles suivent le report
    if (!occursOn(t, target)) save('tasks', { id: uid(), info: !!t.info, time: t.time || '', title: t.title, themeId: t.themeId || null, date: target, prio: false, rep: null, duration: t.duration || 0, seg: t.seg || null, note: t.note || '', done: false, doneDates: [], subs: (t.subs || []).map(x => ({ ...x })), subDone: dejaFait.length ? { x: dejaFait } : {}, created: t0, fromRep: t.id });
  } else {
    save('tasks', { ...t, date: target, routineRun: null });
  }
  return target;
}
function reportAll(d) {
  const t0 = today();
  const entries = (d === t0 ? todayEntries() : dayItems(d).map(x => ({ t: x, d }))).filter(e => !isEvent(e.t) && !isDone(e.t, e.d));

// Appui long sur une tâche de l'agenda : actions rapides

const quotidien = () => { try { return window.parent !== window && window.parent.quotidien ? window.parent.quotidien : null; } catch (e) { return null; } };

/* ---------- Minuteur (écran allumé, noir, économe) ---------- */
// Le minuteur suit un « plan » : les étapes chronométrées, ou N séries de M minutes, ou une durée simple.
// À la fin de chaque morceau, le téléphone vibre et sonne en boucle jusqu'à « Suivant » ou « Fini ».

}

// Minuteur réduit (en pause) : petite barre en bas de l'app pour y revenir

/* ---------- Cocher ---------- */
function setDone(nt, d, v, late) {
  const t0 = today();
  if (nt.free) {
    const log = new Set(nt.freeLog || []);
    if (v) { log.add(t0); nt.date = null; }
    else { const day = d && log.has(d) ? d : t0; log.delete(day); if (!nt.date && day === t0) nt.date = t0; }
    nt.freeLog = [...log].sort().slice(-60);
    return;
  }
  if (nt.rep || (nt.kind === 'event' && nt.yearly)) {
    const day = d || t0;
    const set = new Set(nt.doneDates || []);
    nt.caught = nt.caught || {};
    if (v) { set.add(day); if (day < t0) nt.caught[day] = t0; }
    else { set.delete(day); delete nt.caught[day]; }
    // Faite en retard depuis « Aujourd'hui » : les prochaines fois sont décalées, puis reviennent peu à peu au jour prévu
    if (v && late && nt.rep && day < t0) {
      const L = diffDays(day, t0), sans = { ...nt }; delete sans.decal;
      const gap = gapAfter(sans, day);
      if (L > 0 && gap < 400) nt.decal = { p: day, L, fait: t0, step: Math.max(1, Math.round(gap * 0.15)) };
    }
    if (!v && nt.decal && nt.decal.p === day) delete nt.decal;
    const cut = addDays(t0, -120);
    nt.doneDates = [...set].filter(x => x >= cut);
    Object.keys(nt.caught).forEach(k => { if (k < cut) delete nt.caught[k]; });
  } else {
    nt.done = v; nt.doneAt = v ? Date.now() : null;
    if (v && late && nt.date && nt.date < t0 && nt.kind !== 'event') nt.date = t0; // en retard, cochée depuis « Aujourd'hui » : reste dans aujourd'hui
  }
}
function toggleTask(id, d, late) {
  const t = S.tasks.find(x => x.id === id); if (!t || t.info) return;
  const before = remainingToday();
  if (t.free) { // cochée depuis To-do : faite aujourd'hui, le modèle reste
    if (t.date && t.date < today()) save('tasks', { ...t, date: null });   // elle était prévue un jour passé : elle n'est plus en retard
    const inst = makeInstance(t, today(), { done: true, doneAt: Date.now() });
    logSrc(inst, today(), true); refresh(); toast('Fait aujourd\'hui ✅'); return;
  }
  const nt = JSON.parse(JSON.stringify(t));
  const v = !isDone(t, d || today());
  setDone(nt, d, v, late);
  save('tasks', nt);
  if (nt.srcId) logSrc(nt, nt.date || today(), v);
  refresh();
  if (before > 0 && remainingToday() === 0) toast('Journée bouclée 🎉');
}
function toggleSub(id, d, sid) {
  const t = S.tasks.find(x => x.id === id); if (!t || !hasSubs(t)) return;
  const before = remainingToday();
  const nt = JSON.parse(JSON.stringify(t));
  const k = subKey(nt, d);
  nt.subDone = nt.subDone || {};
  const cur = new Set(nt.subDone[k] || []);
  if (cur.has(sid)) cur.delete(sid); else cur.add(sid);
  nt.subDone[k] = [...cur];
  if (nt.rep) { const cut = addDays(today(), -120); Object.keys(nt.subDone).forEach(x => { if (x < cut) delete nt.subDone[x]; }); }
  const all = nt.subs.every(x => cur.has(x.id));
  const was = isDone(nt, d || today());
  if (all && !was) setDone(nt, d, true);
  if (!all && was) setDone(nt, d, false);
  save('tasks', nt);
  if (nt.srcId && all !== was) logSrc(nt, nt.date || today(), all);
  refresh();
  if (before > 0 && remainingToday() === 0) toast('Journée bouclée 🎉');
  else if (all && !was) toast('Tout est coché, bravo 🎉');
}

async function start() {
  try { db = await openDB(); await loadAll(); } catch (e) { db = null; }
  for (const st of ['themes', 'lists']) {
    const fix = [];
    S[st].slice().sort(byOrder).forEach(x => { if (!x.color) { x.color = nextColor(S[st].filter(y => y.color)); fix.push(x); } });
    if (fix.length) await tx([st], t => fix.forEach(x => t.objectStore(st).put(x))).catch(() => {});
  }
  if (DEMO && !S.tasks.length && !S.themes.length && !S.lists.length) {
    const d = demoData();
    STORES.forEach(st => { S[st] = d[st]; });
    await tx(STORES, t => STORES.forEach(st => S[st].forEach(x => t.objectStore(st).put(x)))).catch(() => {});
  }
  for (const x of S.tasks.filter(y => y.kind === 'event')) {
    const nx = { ...x, info: true, rep: x.yearly ? { unit: 'an', every: 1 } : (x.rep || null) };
    delete nx.kind; delete nx.yearly; delete nx.emoji; delete nx.autoEmoji;
    await save('tasks', nx);
  }
  await migrateRoutineSteps();
  for (const t of S.tasks.filter(x => x.free && (x.date || (x.freeLog || []).includes(today())))) {
    if (t.date) { const { routineRun, runDate, routineId } = t; makeInstance(t, t.date, routineRun ? { routineRun, runDate, routineId } : {}); }
    if ((t.freeLog || []).includes(today()) && !S.tasks.some(x => x.srcId === t.id && x.date === today() && x.done)) makeInstance(t, today(), { done: true, doneAt: Date.now() });
    await save('tasks', { ...S.tasks.find(x => x.id === t.id), date: null, routineRun: null });
  }
  const oldOrd = Object.keys(S.meta).filter(k => k.startsWith('ord:') && k.slice(4) < addDays(today(), -3));
  if (oldOrd.length) { oldOrd.forEach(k => delete S.meta[k]); tx(['meta'], t => oldOrd.forEach(k => t.objectStore('meta').delete(k))).catch(() => {}); }
  renderHome();
  setTimeout(refreshFeedsIfOld, 1500);
  const act = new URLSearchParams(location.search).get('a');
  if (act) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (act === 'new') openTaskForm(null, { date: today() });
    if (act === 'routine') A['open-routines']();
    if (act === 'todo') A['open-todo']();
  }
  if (S.meta.timer) {
    T = S.meta.timer;
    if (T.min && T.paused != null) drawTbar(); else { T.min = false; showTimer(); }
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  // Hors ligne et mises à jour : gérés par le service worker unique de « Mon quotidien » (../sw.js)
}
// Pour Mon quotidien : cocher une tâche depuis l'accueil, avec les règles de l'app
window.toggleTask = (id, d, late) => toggleTask(id, d, late);
window.quotidienPret = () => !!document.querySelector('#app .ob');   // l'accueil est dessiné
// Cocher un élément d'une liste depuis l'accueil (même règle que dans l'app)
window.quotidienCocherItem = id => { A['item-check'](null, { id }); return true; };
// Mon quotidien : ouvrir une fenêtre de l'Organisation par-dessus l'accueil (sans changer d'onglet)
window.quotidienSuperpose = p => {
  if (!p || !['ajouter', 'tache', 'listes', 'liste-ajout', 'nouvelle-liste'].includes(p.action)) return false;
  window.__superpose = true; document.documentElement.classList.add('qd-superpose');
  if (p.action === 'ajouter') openDayAdd(p.d || today());
  else if (p.action === 'listes') { if (p.id) U.openLists.add(p.id); openSheet({ render: renderLists, label: 'Listes' }); }
  else if (p.action === 'liste-ajout') openListQuick(p.id);
  else if (p.action === 'nouvelle-liste') openGroupForm('lists');
  else openQuick(p.id, p.d || null);
  if (!stack.length) { window.__superpose = false; document.documentElement.classList.remove('qd-superpose'); return false; }
  return true;
};
// « Bientôt » pour l'accueil de Mon quotidien : exactement ce que l'app affiche (événements, jours fériés…)
window.quotidienBientot = () => {
  const t = today(), hols = [];
  for (let i = 1; i <= 30; i++) { const d = addDays(t, i), n = holiday(d); if (n) hols.push({ d, n }); }
  return [...soonItems().map(e => { const th = themeOf(e.t); return { d: e.d, id: e.t.id, titre: e.t.title, emoji: th ? th.emoji : '', color: th ? th.color || 'slate' : 'slate', quand: dayMonth(e.d) + (e.t.time ? ' ' + evWhen(e.t) : ''), evt: isEvent(e.t), time: e.t.time || '', creneaux: e.t.creneaux || [] }; }),
    ...hols.map(x => ({ d: x.d, titre: x.n, emoji: '🇫🇷', color: null, quand: dayMonth(x.d) }))]
    .sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
};
// Demandes des autres apps (Backstage) : liste des catégories, plateau → événement « Scène », rappel pour recontacter
window.quotidienAction = p => {
  if (!p) return null;
  // Depuis l'accueil de Mon quotidien : aller directement au bon endroit
  if (p.action === 'tache') { const x = S.tasks.find(y => y.id === p.id); if (x) openQuick(x.id, p.d || null); return true; }
  if (p.action === 'minuteur') { const x = S.tasks.find(y => y.id === p.id); if (x && x.duration) { window.__minuteurAccueil = true; startTimer(x, p.d || today()); } return true; }
  if (p.action === 'mois') { setMeta('view', 'month'); U.monthOffset = 0; U.weekOffset = 0; renderHome(); setTimeout(() => { const g = document.querySelector('.mgrid2'); if (g) g.scrollIntoView({ block: 'center' }); }, 60); return true; }
  if (p.action === 'ajouter') { openDayAdd(p.d || today()); return true; }
  if (p.action === 'themes') return themesTries().map(x => ({ id: x.id, label: x.emoji + ' ' + x.name, parentId: x.parentId || null, name: x.name, parentName: (parentOf(x) || {}).name || '' }));
  if (p.action === 'modeleScene') {
    const nom = String(p.nom || '').trim(); if (!nom) return null;
    let th = topThemes().find(isSceneTheme) || S.themes.find(isSceneTheme);
    if (!th) { th = { id: uid(), name: 'Scènes', emoji: '🎤', color: 'purple', autoEmoji: false, order: Math.max(-1, ...S.themes.map(x => x.order || 0)) + 1 }; save('themes', th); }
    const ex = S.tasks.find(t => t.info && t.free && isSceneTheme(themeOf(t)) && t.title.trim().toLowerCase() === nom.toLowerCase());
    if (ex) return { ok: true, existe: true };
    save('tasks', { id: uid(), info: true, free: true, freeLog: [], title: nom, themeId: th.id, time: p.heure || '', note: p.adresse || '', date: null, rep: null, created: today() });
    refresh(); return { ok: true };
  }
  if (p.action === 'rappel') {
    const ex = S.tasks.find(t => t.bsRappel === p.cle);
    if (!p.rythme) { if (ex) { removeMany('tasks', [ex.id]); refresh(); } return { ok: true }; }
    // rythme : 'sem:N' · 'mois:dom:25' · 'mois:nth:1:2' (1er mercredi ; lundi = 0) · 'mois:last:2' · ancien 'mois:N'
    const pr = String(p.rythme).split(':'), t0 = today();
    let rep, start;
    if (pr[0] === 'mois' && pr.length > 2) {
      rep = pr[1] === 'dom' ? { unit: 'mois', every: 1, mode: 'dom', dom: Math.min(31, Math.max(1, +pr[2] || 1)) }
        : pr[1] === 'nth' ? { unit: 'mois', every: 1, mode: 'nth', nth: Math.min(4, Math.max(1, +pr[2] || 1)), wd: (+pr[3] || 0) % 7 }
        : { unit: 'mois', every: 1, mode: 'last', wd: (+pr[2] || 0) % 7 };
      const x = parse(t0);
      for (let i = 0; i < 14 && !start; i++) { const y = x.getFullYear(), m = x.getMonth() + i; const d = monthOcc(rep, y + Math.floor(m / 12), m % 12); if (d && d > t0) start = d; }
      if (rep.mode !== 'dom') rep.dom = parse(start || t0).getDate();
    } else {
      const unit = pr[0], every = Math.max(1, +pr[1] || 1);
      start = unit === 'sem' ? addDays(t0, 7 * every) : addDays(t0, every);
      if (unit === 'mois') { const x = parse(t0); x.setMonth(x.getMonth() + every); start = iso(x); }
      rep = unit === 'sem' ? { unit: 'sem', every, days: [dow(start)] } : unit === 'mois' ? { unit: 'mois', every, mode: 'dom', dom: parse(start).getDate() } : { unit: 'jour', every };
    }
    const cleRep = r => r ? JSON.stringify([r.unit, r.every || 1, r.unit === 'mois' ? r.mode || 'dom' : '', r.mode === 'dom' || !r.mode ? r.dom : '', r.nth || '', r.wd != null ? r.wd : '']) : '';
    const same = ex && ex.rep && (rep.unit === 'sem' ? ex.rep.unit === 'sem' && (ex.rep.every || 1) === rep.every : cleRep(ex.rep) === cleRep(rep));
    const base = ex ? { ...ex } : { id: uid(), prio: false, duration: 0, note: '', done: false, doneDates: [], subs: [], subDone: {}, created: t0, bsRappel: p.cle };
    const themeId = p.themeId && S.themes.some(x => x.id === p.themeId) ? p.themeId : (base.themeId || null);
    save('tasks', { ...base, title: p.titre || base.title || 'Recontacter', themeId, rep: same ? ex.rep : rep, date: same ? ex.date : start });
    refresh(); return { ok: true };
  }
  return null;
};
start();
})();
</script>
