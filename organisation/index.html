<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organisation</title>
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<!--/PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8EBEF;--surface:#FFFFFF;--sunk:#F2F4F7;--ink:#18202E;--muted:#636C7D;--line:#D3D8E0;
  --denim:#2F4C78;--denim-soft:#DCE4F0;--on-denim:#FFFFFF;
  --today:#E8962E;--today-soft:#FFF1DC;--tomorrow:#7B5CD6;--tomorrow-soft:#EFE9FF;--warn:#A8432C;
  /* teintes dérivées, propres à Organisation */
  --today-card:#FFF1DC;--today-row:#FFFFFF;--today-line:#F2C98C;--today-box:#E2B26D;
  --tomorrow-card:#F3EEFF;--tomorrow-row:#FFFFFF;--tomorrow-line:#CDBEF5;--tomorrow-box:#B7A5EE;
  --box:#B3BBC8;--box-bg:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C;--surface:#1B212B;--sunk:#232A36;--ink:#E7EBF1;--muted:#98A1B1;--line:#2E3645;
    --denim:#8FB0E3;--denim-soft:#26344B;--on-denim:#0F1622;
    --today:#F0A648;--today-soft:#3B2C15;--tomorrow:#A58CF0;--tomorrow-soft:#2A2342;--warn:#E3826B;
    --today-card:#2A2216;--today-row:#3B2F1F;--today-line:#6E5228;--today-box:#7A6446;
    --tomorrow-card:#221D35;--tomorrow-row:#2E2747;--tomorrow-line:#4A3D78;--tomorrow-box:#65589A;
    --box:#4A5468;--box-bg:#2E3645;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C;--surface:#1B212B;--sunk:#232A36;--ink:#E7EBF1;--muted:#98A1B1;--line:#2E3645;
  --denim:#8FB0E3;--denim-soft:#26344B;--on-denim:#0F1622;
  --today:#F0A648;--today-soft:#3B2C15;--tomorrow:#A58CF0;--tomorrow-soft:#2A2342;--warn:#E3826B;
  --today-card:#2A2216;--today-row:#3B2F1F;--today-line:#6E5228;--today-box:#7A6446;
  --tomorrow-card:#221D35;--tomorrow-row:#2E2747;--tomorrow-line:#4A3D78;--tomorrow-box:#65589A;
  --box:#4A5468;--box-bg:#2E3645;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
svg{display:block;flex:none}
h1,h2,h3,.title{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.01em;margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;border:0;padding:0;margin:0}
.f-grow{flex:1}

#app{max-width:640px;margin:0 auto;padding:16px 16px 20px;display:flex;flex-direction:column}

/* Chips et boutons */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;line-height:1.3;color:var(--ink);white-space:nowrap;flex:none}
.chip.on{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);text-align:center}
.btn.primary{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1 1 0;min-width:0}
.btn-ico{width:40px;height:40px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}

/* Carte du haut */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 12px 14px 16px;margin-bottom:14px}
.hero-top{display:flex;align-items:center;gap:12px}
.hero-main{flex:1;min-width:0}
.hero-day{font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.hero-num{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;margin:10px 0 6px}
.hero-sub{font-size:14px;color:var(--muted)}
.hero-chips{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:none;max-width:58%}
.hero-late{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.hero-late::-webkit-scrollbar{display:none}
.hero-late .chip{max-width:240px}
.late-label{font-size:14px;color:var(--muted);white-space:nowrap;flex:none}

/* Raccourcis */
.shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0}
.sc-ico{position:relative;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink);display:flex;align-items:center;justify-content:center}
.sc-lbl{font-size:9px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;word-break:normal;overflow-wrap:normal;hyphens:none}
.badge{position:absolute;top:-3px;right:-3px;height:17px;min-width:17px;padding:0 5px;border-radius:9px;background:var(--today);color:#fff;font-size:10.5px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}

/* Agenda */
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-title{flex:1;min-width:0;min-height:40px;display:flex;align-items:center;font-size:22px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.chip .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--box);background:var(--box-bg);display:flex;align-items:center;justify-content:center}
.chip.on .box{background:var(--on-denim);border-color:var(--on-denim);color:var(--denim)}
.days{display:flex;flex-direction:column;gap:8px}
.day{border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.day.past{opacity:.5}
.day.past.open{opacity:1}
.day-name{flex:none;min-width:66px;font-size:18px;font-weight:700;line-height:1.2}
.day-sum{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.past .day-sum{color:var(--muted)}
.day-count{flex:none;font-size:14px;color:var(--muted)}
.day-body{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.day.today{background:var(--today-card);border-color:var(--today-line)}
.day.today .day-name{color:var(--today)}
.day.tomorrow{background:var(--tomorrow-card);border-color:var(--tomorrow-line)}
.day.tomorrow .day-name{color:var(--tomorrow)}

/* Lignes de tâche et de liste */
.task{display:flex;align-items:center;gap:2px;min-height:54px;padding:3px 8px 3px 2px}
.check{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.check .box{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--box);background:var(--box-bg);display:flex;align-items:center;justify-content:center;color:var(--on-denim)}
.task.done .check .box{background:var(--denim);border-color:var(--denim)}
.day.today .check .box{border-color:var(--today-box);background:transparent}
.day.today .task.done .check .box{background:var(--today);border-color:var(--today);color:var(--today-card)}
.day.tomorrow .check .box{border-color:var(--tomorrow-box);background:transparent}
.day.tomorrow .task.done .check .box{background:var(--tomorrow);border-color:var(--tomorrow);color:var(--tomorrow-card)}
.task-body{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px}
.t-title{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done .t-title{color:var(--muted);text-decoration:line-through}
.t-prio{color:var(--today);font-weight:700}
.t-meta{font-size:14px;line-height:1.3;color:var(--muted);display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;min-width:0}
.t-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.t-meta .late{color:var(--warn)}
.t-meta .is-today{color:var(--today);font-weight:600}
.t-meta .is-tomorrow{color:var(--tomorrow);font-weight:600}
.rep-lbl{display:inline-flex;align-items:center;gap:4px}
.chip.play{padding:7px 11px 7px 9px;gap:4px;color:var(--denim);font-weight:600}
.add-row{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;color:var(--denim);font-size:15px;font-weight:600}

/* Mois */
.month{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:10px 10px 12px;margin-bottom:8px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{text-align:center;font-size:14px;color:var(--muted);padding:2px 0 4px}
.mday{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:4px;font-size:15px;font-weight:500;line-height:1.3}
.mday.past{opacity:.45}
.mday.today{background:var(--today-soft);color:var(--today);font-weight:700;opacity:1}
.mday.tomorrow{background:var(--tomorrow-soft);color:var(--tomorrow);font-weight:700}
.mday.sel{box-shadow:inset 0 0 0 1.5px var(--denim);opacity:1}
.dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%}

.backup-link{align-self:center;font-size:12px;color:var(--muted);text-align:center;padding:10px 12px;margin-top:14px}

/* Fenêtres qui montent du bas */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(10,14,22,.5);animation:fade .2s ease-out}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 18px 8px;display:flex;flex-direction:column;gap:8px}
.sheet-bar{flex:none;display:flex;gap:10px;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-bar .btn{flex:1 1 0;min-width:0}
.sheet-title{font-size:22px;font-weight:700;line-height:1.2;margin-bottom:6px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Thèmes et listes (sous-catégories repliées) */
.gcard{background:var(--sunk);border:1px solid var(--line);border-radius:22px}
.gcard-head{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px}
.g-emoji{font-size:20px;width:28px;text-align:center;flex:none;line-height:1}
.g-name{flex:1;min-width:0;font-size:18px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-count{font-size:14px;color:var(--muted);flex:none}
.gbadge{height:17px;min-width:17px;padding:0 5px;border-radius:9px;background:var(--today);color:#fff;font-size:10.5px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.chev{color:var(--muted);flex:none}
.gcard-body{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.gcard-foot{display:flex;align-items:center;gap:4px;padding:0 2px 0 4px}
.foot-btn{min-height:44px;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:0 4px;white-space:nowrap}
.foot-btn.add{color:var(--denim);font-size:15px;font-weight:600;flex:1}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.dashed-add{width:100%;min-height:54px;border:1.5px dashed var(--line);border-radius:18px;color:var(--denim);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.quick-add{display:flex;align-items:center;gap:8px}
.quick-add input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;outline:none;font-size:15px;color:var(--ink)}
.quick-add input::placeholder{color:var(--muted)}
.quick-add .btn-ico{width:44px;height:44px;background:var(--denim-soft);color:var(--denim)}

/* Cases de formulaire : titre à gauche, valeur à droite */
.field{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;width:100%;background:var(--sunk);border-radius:12px;text-align:left}
.f-label{font-size:15px;font-weight:600;color:var(--ink);flex:none}
.f-input,.f-select{flex:1;min-width:0;height:46px;background:transparent;border:0;outline:none;padding:0;text-align:right;font-size:15px;font-weight:500;color:var(--muted)}
.f-input::placeholder{color:var(--muted);opacity:.6}
.f-select{appearance:none;-webkit-appearance:none;text-align-last:right;cursor:pointer}
.f-select option{background:var(--surface);color:var(--ink)}
.f-value{flex:1;min-width:0;text-align:right;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-emoji{font-size:20px}
.case{background:var(--sunk);border-radius:12px}
.case > .field{background:transparent}
.case.open > .field{border-radius:12px 12px 0 0}
.case-more{padding:4px 14px 12px;border-radius:0 0 12px 12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.even{flex-wrap:nowrap}
.chips.even .chip{flex:1 1 auto;padding:7px 8px}
.rowline{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.f-word{min-width:66px}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;flex:none}
.stepper button{width:40px;height:38px;color:var(--denim);font-size:20px;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:30px;text-align:center;font-size:15px;font-weight:700;white-space:nowrap}
.stepper span.wide{min-width:62px}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdays .chip{padding:7px 0}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);padding:3px;display:flex;flex:none;margin-left:auto}
.switch .knob{width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch.on{background:var(--today)}
.switch.on .knob{transform:translateX(20px);background:var(--surface)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emoji-grid button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;text-align:center}
.emoji-grid button.on{background:var(--denim);border-color:var(--denim)}
.del-btn{margin-top:8px}
.shake{animation:shake .25s 2}
.ver{text-align:center;font-size:14px;color:var(--muted);padding-top:4px}

/* Fenêtre de confirmation */
.modal-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.modal{position:relative;width:100%;max-width:340px;background:var(--surface);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;animation:pop .18s ease-out}
.modal h3{font-size:18px;font-weight:700;line-height:1.25}
.modal p{margin:0;font-size:14px;color:var(--muted)}
.modal .btn-row{margin-top:12px}

/* Minuteur économe : fond noir, texte sombre, presque rien ne bouge */
.timer{position:fixed;inset:0;z-index:30;background:#000;color:#5E6674;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.timer[hidden]{display:none}
.timer-inner{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
.timer-task{font-size:16px;max-width:86vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-time{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-size:88px;font-weight:500;letter-spacing:-.03em;color:#868F9E;font-variant-numeric:tabular-nums;line-height:1}
.timer.paused .timer-time{color:#3F4652}
.timer-btns{display:flex;gap:10px;margin-top:28px}
.timer-btns button{border:1px solid #23272F;border-radius:12px;padding:11px 13px;color:#6E7787;font-size:15px;font-weight:600;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.toast[hidden]{display:none}


/* Couleurs des catégories et des listes */
:root{--c-sky:#146C93;--c-lime:#5A7A12;--c-fuchsia:#96309F;--c-sand:#8A6334;--c-green:#2F7A4A;--c-pink:#A83E6E;--c-teal:#1F7C78;--c-yellow:#8A6A0E;--c-purple:#6A4BC4;--c-coral:#B4532F;--c-blue:#2F4C78;--c-slate:#56627A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-sky:#63C7EE;--c-lime:#B8D65A;--c-fuchsia:#D47FE0;--c-sand:#D6B48C;--c-green:#7CC992;--c-pink:#E98BB5;--c-teal:#5EC4C0;--c-yellow:#E3C35A;--c-purple:#A58CF0;--c-coral:#EE9A7A;--c-blue:#8FB0E3;--c-slate:#AAB4C6}}
:root[data-theme="dark"]{--c-sky:#63C7EE;--c-lime:#B8D65A;--c-fuchsia:#D47FE0;--c-sand:#D6B48C;--c-green:#7CC992;--c-pink:#E98BB5;--c-teal:#5EC4C0;--c-yellow:#E3C35A;--c-purple:#A58CF0;--c-coral:#EE9A7A;--c-blue:#8FB0E3;--c-slate:#AAB4C6}
.c-sky{--c:var(--c-sky)}.c-lime{--c:var(--c-lime)}.c-fuchsia{--c:var(--c-fuchsia)}.c-sand{--c:var(--c-sand)}
.c-green{--c:var(--c-green)}.c-pink{--c:var(--c-pink)}.c-teal{--c:var(--c-teal)}.c-yellow{--c:var(--c-yellow)}
.c-purple{--c:var(--c-purple)}.c-coral{--c:var(--c-coral)}.c-blue{--c:var(--c-blue)}.c-slate{--c:var(--c-slate)}
.task-wrap{background:var(--sunk);border-radius:12px}
.day.today .task-wrap{background:var(--today-row)}
.day.tomorrow .task-wrap{background:var(--tomorrow-row)}
.task-wrap.cat{box-shadow:inset 3px 0 0 var(--c)}
.cat-name{color:var(--c);font-weight:600}
.gcard .task-wrap{background:var(--surface)}
.gcard.tint{background:color-mix(in srgb,var(--c) 9%,var(--sunk));border-color:color-mix(in srgb,var(--c) 38%,var(--line))}
.gcard.tint .g-name{color:var(--c)}

  </div>

<script>
(() => {
'use strict';
const VERSION = 15;
const DEMO = false;
const DB_NAME = 'organisation';
const STORES = ['themes', 'tasks', 'lists', 'items', 'routines'];

/* ---------- Dates ---------- */
const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JC = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MC = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => (parse(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -dow(s));
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const shortDate = s => JC[dow(s)] + ' ' + parse(s).getDate();
function relLabel(s) {
  const t = today();
  if (s === t) return "Aujourd'hui";
  if (s === addDays(t, 1)) return 'Demain';
  const d = parse(s);
  let r = JC[dow(s)] + ' ' + d.getDate() + ' ' + MC[d.getMonth()];
  if (d.getFullYear() !== new Date().getFullYear()) r += ' ' + d.getFullYear();
  return r;
}

/* ---------- Outils ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, one, many) => n + ' ' + (n > 1 ? many : one);
const ic = (d, s = 20, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const P = {
  check: 'M5 12.5l4.5 4.5L19 7.5', left: 'M15 6l-6 6 6 6', right: 'M9 6l6 6-6 6', down: 'M6 9l6 6 6-6', up: 'M6 15l6-6 6 6',
  plus: 'M12 5v14M5 12h14', close: 'M6 6l12 12M18 6L6 18',
  rep: 'M4 12a8 8 0 0 1 13.7-5.6L20 8.7M20 4v4.7h-4.7M20 12a8 8 0 0 1-13.7 5.6L4 15.3M4 20v-4.7h4.7',
  play: 'M8 5.5v13l10-6.5z', pencil: 'M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3zM14 7l3 3',
  todo: 'M4 6.5l1.5 1.5L8.5 5M4 12.5l1.5 1.5 3-3M4 18.5l1.5 1.5 3-3M12 7h8M12 13h8M12 19h8',
  bookmark: 'M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z'
};
const CHECK = ic(P.check, 15, 3);

let toastTO;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTO);
  toastTO = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------- Base de données « organisation » ---------- */
let db = null;
const S = { themes: [], tasks: [], lists: [], items: [], routines: [], meta: {} };

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function getAll(store) {
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(stores, fn) {
  if (!db) return Promise.resolve();
  return new Promise((res, rej) => {
    const t = db.transaction(stores, 'readwrite');
    fn(t);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
function save(store, obj) {
  const arr = S[store];
  const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  return tx([store], t => t.objectStore(store).put(obj)).catch(() => toast('Enregistrement impossible 😕'));
}
function removeMany(store, ids) {
  S[store] = S[store].filter(x => !ids.includes(x.id));
  return tx([store], t => ids.forEach(id => t.objectStore(store).delete(id))).catch(() => {});
}
function setMeta(key, value) {
  S.meta[key] = value;
  return tx(['meta'], t => t.objectStore('meta').put({ key, value })).catch(() => {});
}
async function loadAll() {
  for (const s of STORES) S[s] = await getAll(s);
  const meta = await getAll('meta');
  S.meta = {}; meta.forEach(m => { S.meta[m.key] = m.value; });
}

/* ---------- Répétitions ---------- */
const monthIdx = s => { const x = parse(s); return x.getFullYear() * 12 + x.getMonth(); };
const ord = n => n === 1 ? '1er' : n + 'e';
// Date de l'occurrence mensuelle dans le mois (y, m), selon le mode choisi

/* ---------- Fenêtres du bas ---------- */
const stack = [];
let useHistory = true;
const BAR_CLOSE = '<button type="button" class="btn primary" data-a="close">Fermer</button>';

function openSheet(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${h(opts.label || '')}"><div class="sheet-body"></div><div class="sheet-bar">${opts.bar || BAR_CLOSE}</div></div>`;
  const s = {
    wrap, el: $('.sheet', wrap), body: $('.sheet-body', wrap), render: opts.render, isStatic: !!opts.isStatic,
    update() { if (!this.render) return; const st = this.body.scrollTop; this.body.innerHTML = this.render(); this.body.scrollTop = st; }
  };
  $('.scrim', wrap).addEventListener('click', () => closeTop());
  $('#sheets').appendChild(wrap);
  stack.push(s);
  s.update();
  document.body.classList.add('locked');
  if (useHistory) { try { history.pushState({ sheet: stack.length }, ''); } catch (e) { useHistory = false; } }
  return s;
}
function popSheet() {
  const s = stack.pop(); if (!s) return;

}
function closeTop() {
  if (!stack.length) return;

    const s = stack[stack.length - 1];
    try { history.back(); } catch (e) { popSheet(); return; }
    setTimeout(() => { if (stack[stack.length - 1] === s) { useHistory = false; popSheet(); } }, 400);
  } else popSheet();
}

      <div class="chips">${qd(t0, "Aujourd'hui")}${qd(addDays(t0, 1), 'Demain')}</div>

        <div class="rowline wd-pick"><span class="muted">Tous les</span>${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x, i) => `<button type="button" class="chip" data-f="allwd" data-i="${i}" aria-label="Tous les ${JOURS[i].toLowerCase()}s de ce mois">${x}</button>`).join('')}</div></div>
      ${canRoutine(t) ? `<h3 class="sec-sub">Ajouter à une routine</h3>
      <div class="chips">${rs.map(r => { const on = r.steps.some(st => st.taskId === id); return `<button type="button" class="chip${on ? ' on' : ''}" data-f="rt" data-v="${r.id}" aria-pressed="${on}">${on ? ic(P.check, 14, 2.6) : ''}${h(r.emoji + ' ' + r.name)}</button>`; }).join('')}
        <button type="button" class="chip" data-f="rt-new">${ic(P.plus, 14, 2.2)}Nouvelle routine</button></div>` : ''}`;
    const ok = $('[data-f="ok"]', s.el); ok.textContent = n ? `Valider (${n})` : (initial.length ? 'Retirer les dates' : 'Valider');
    void multiStay;
  };
  const apply = () => {
    let t = S.tasks.find(x => x.id === id); if (!t) return;
    const days = [...sel].sort();
    if (!t.free && !keep && days.length <= 1) {
      save('tasks', { ...t, date: days[0] || null, routineRun: null });
      toast(days[0] ? `Prévu ${whenLabel(days[0])} 📅` : 'Remise sans date 📥');
      return;
    }
    if (!t.free) { t = { ...t, free: true, freeLog: t.freeLog || [], date: null, routineRun: null }; save('tasks', t); }
    const have = S.tasks.filter(x => x.srcId === t.id && !x.done && x.date && x.date >= t0);
    const gone = have.filter(x => !sel.has(x.date));
    if (gone.length) removeMany('tasks', gone.map(x => x.id));
    const add = days.filter(d => !have.some(x => x.date === d));
    add.forEach(d => makeInstance(t, d));
    toast(add.length ? `Prévue sur ${plural(add.length, 'jour', 'jours')} de plus 📅` : gone.length ? `${plural(gone.length, 'jour retiré', 'jours retirés')}` : 'Rien n\'a changé');
  };
  draw();
  s.el.addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const k = b.dataset.f;
    if (k === 'cancel') { closeTop(); return; }
    if (k === 'ok') { apply(); closeTop(); refresh(); return; }
    if (k === 'keep') keep = !keep;
    if (k === 'cal-move') { const x = parse(cm); x.setMonth(x.getMonth() + +b.dataset.s); cm = iso(x); }
    if (k === 'cald') { const v = b.dataset.v; sel.has(v) ? sel.delete(v) : sel.add(v); }
    if (k === 'allwd') {
      const i = +b.dataset.i, x = parse(cm), y = x.getFullYear(), m = x.getMonth();
      const ds = []; for (let j = 1; j <= dim(y, m); j++) { const d = iso(new Date(y, m, j)); if (dow(d) === i && d >= t0) ds.push(d); }
      const all = ds.length && ds.every(d => sel.has(d));
      ds.forEach(d => all ? sel.delete(d) : sel.add(d));
    }
    if (k === 'rt') {
      const r = S.routines.find(x => x.id === b.dataset.v); if (!r) return;
      const added = toggleInRoutine(r, id); refresh();
      toast(added ? `Ajoutée à ${r.emoji} ${r.name} ✨` : `Retirée de ${r.emoji} ${r.name}`);
    }
    if (k === 'rt-new') { openRoutineForm(null, [id], draw); return; }
    draw();
  });
}

function launchRoutine(id, onDate) {
  const r = S.routines.find(x => x.id === id); if (!r) return;

    const t0 = today(), runId = uid(), tag = { routineRun: runId, runDate: d, routineId: r.id };

      const free = S.tasks.find(x => x.free && norm(x.title) === norm(st.title));
      if (free) makeInstance(free, d, tag);

// Anciennes étapes écrites à la main → tâches « Libre » reliées
async function migrateRoutineSteps() {
  for (const r of S.routines) {
    if (!(r.steps || []).some(st => !st.taskId)) continue;
    const nr = JSON.parse(JSON.stringify(r));
    nr.steps = nr.steps.map(st => {

}

/* ---------- Minuteur (écran allumé, noir, économe) ---------- */
// Le minuteur suit un « plan » : les étapes chronométrées, ou N séries de M minutes, ou une durée simple.
// À la fin de chaque morceau, le téléphone vibre et sonne en boucle jusqu'à « Suivant » ou « Fini ».
let T = null, timerTO = null, shiftTO = null, ringTO = null, wake = null, audio = null;
const timerEl = $('#timer');
async function requestWake() {
  try { if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; }
}
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
const remaining = () => T ? (T.paused != null ? T.paused : T.endAt - Date.now()) : 0;
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return hh ? `${hh}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
}
function persistTimer() { setMeta('timer', T); }
function buildPlan(task, d) {
  const timed = (task.subs || []).filter(s => s.min > 0);
  if (timed.length) {
    const done = new Set(subDone(task, d));
    const todo = timed.filter(s => !done.has(s.id));
    const list = todo.length ? todo : timed;
    return list.map((s, i) => ({ label: s.title, pos: `${i + 1}/${list.length}`, ms: s.min * 60000, subId: s.id }));
  }
  if (task.seg && task.seg.n > 1) return Array.from({ length: task.seg.n }, (_, i) => ({ label: 'Série', pos: `${i + 1}/${task.seg.n}`, ms: task.seg.m * 60000 }));
  return [{ label: '', pos: '', ms: (task.duration || 0) * 60000 }];
}
function startTimer(task, d) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) { audio = null; }
  const plan = buildPlan(task, d || today());
  if (!plan.length || !plan[0].ms) return;
  T = { taskId: task.id, d: d || today(), title: task.title, plan, idx: 0, endAt: Date.now() + plan[0].ms, paused: null, ringing: false, min: false };
  drawTbar();
  persistTimer();
  showTimer();
}
function showTimer() {
  if (!T.plan) T.plan = [{ label: '', pos: '', ms: 0 }];
  if (T.idx == null) T.idx = 0;
  timerEl.hidden = false;
  $('.timer-task', timerEl).textContent = T.title;
  document.body.classList.add('locked');
  requestWake();
  tick(); shift();
}
function drawTimer() {
  const cur = T.plan[T.idx] || {};
  const seg = $('.timer-seg', timerEl);
  seg.textContent = T.ringing ? `⏰ Temps écoulé${cur.label ? ' · ' + cur.label : ''}${cur.pos ? ' ' + cur.pos : ''}` : `${cur.label}${cur.pos ? ' ' + cur.pos : ''}`;
  seg.hidden = !seg.textContent;
  timerEl.classList.toggle('paused', !T.ringing && T.paused != null);
  timerEl.classList.toggle('ring', !!T.ringing);
  $('.timer-btns.run', timerEl).hidden = !!T.ringing;
  $('.timer-btns.ringing', timerEl).hidden = !T.ringing;
  const last = T.idx >= T.plan.length - 1;
  const nx = T.plan[T.idx + 1];
  $('[data-t="next"]', timerEl).textContent = last ? 'Fini ✓' : `Suivant${nx && nx.label && nx.label !== 'Série' ? ' : ' + nx.label : ''} ▶`;
  $('[data-t="pause"]', timerEl).textContent = T.paused != null ? 'Reprendre' : 'Pause';
  $('.timer-leave', timerEl).hidden = !(T.paused != null && !T.ringing);
}
// Minuteur réduit (en pause) : petite barre en bas de l'app pour y revenir
const tbar = $('#tbar');
function minimizeTimer() {
  if (!T || T.paused == null) return;
  T.min = true; persistTimer();
  clearTimeout(timerTO); clearTimeout(shiftTO);
  timerEl.hidden = true; releaseWake();
  if (!stack.length) document.body.classList.remove('locked');
  drawTbar();
}
function drawTbar() {
  if (!T || !T.min) { tbar.hidden = true; document.body.classList.remove('has-tbar'); return; }
  const cur = T.plan[T.idx] || {};
  tbar.innerHTML = `<span class="tb-ico">${ic('M9 6v12M15 6v12', 18, 2.2)}</span><span class="tb-txt"><span class="tb-title">${h(T.title)}</span><span class="tb-sub">${cur.label ? h(cur.label + (cur.pos ? ' ' + cur.pos : '')) + ' · ' : ''}${fmt(remaining())} restantes</span></span><span class="chip on">${PLAY}Reprendre</span>`;
  tbar.setAttribute('aria-label', 'Reprendre le minuteur de ' + T.title);
  tbar.hidden = false; document.body.classList.add('has-tbar');
}
tbar.addEventListener('click', () => {
  if (!T) { drawTbar(); return; }
  T.min = false;
  if (T.paused != null) { T.endAt = Date.now() + T.paused; T.paused = null; }
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  persistTimer(); drawTbar(); showTimer();
});
function tick() {
  clearTimeout(timerTO);
  if (!T) return;
  if (T.ringing) { $('.timer-time', timerEl).textContent = '00:00'; drawTimer(); startRinging(); return; }
  const rem = remaining();
  if (rem <= 0) { T.ringing = true; persistTimer(); tick(); return; }
  $('.timer-time', timerEl).textContent = fmt(rem);
  drawTimer();
  if (T.paused == null) timerTO = setTimeout(tick, (rem % 1000) || 1000);
}
function shift() {
  clearTimeout(shiftTO);
  if (!T) return;
  const x = Math.round(Math.random() * 28 - 14), y = Math.round(Math.random() * 48 - 24);
  $('.timer-inner', timerEl).style.transform = `translate(${x}px,${y}px)`;
  shiftTO = setTimeout(shift, 60000);
}
function hideTimer() {
  clearTimeout(timerTO); clearTimeout(shiftTO); stopRinging();
  if (T) T.min = false;
  setTimeout(drawTbar, 0);
  timerEl.hidden = true;
  timerEl.classList.remove('ring');
  releaseWake();
  if (!stack.length) document.body.classList.remove('locked');
}
function beep() {
  try {
    if (!audio) return; audio.resume();
    const now = audio.currentTime;
    [0, 0.35, 0.7].forEach(off => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.35, now + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.25);
      o.connect(g); g.connect(audio.destination);
      o.start(now + off); o.stop(now + off + 0.3);
    });
  } catch (e) {}
}
function startRinging() {
  if (ringTO) return;
  const loop = () => { try { if (navigator.vibrate) navigator.vibrate([700, 300, 700]); } catch (e) {} beep(); };
  loop(); ringTO = setInterval(loop, 2000);
}
function stopRinging() {
  if (ringTO) { clearInterval(ringTO); ringTO = null; }
  try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
}
function nextPart() {
  stopRinging();
  const cur = T.plan[T.idx];
  if (cur && cur.subId) {
    const t = S.tasks.find(x => x.id === T.taskId);
    if (t && !subDone(t, T.d).includes(cur.subId)) toggleSub(t.id, T.d, cur.subId);
  }
  if (T.idx < T.plan.length - 1) {
    T.idx++; T.ringing = false; T.paused = null; T.endAt = Date.now() + T.plan[T.idx].ms;
    persistTimer(); tick();
    return;
  }
  const done = T; T = null; persistTimer(); hideTimer();
  const t = S.tasks.find(x => x.id === done.taskId);
  if (t && !isDone(t, done.d)) toggleTask(t.id, done.d);
  toast('Bravo, c\'est fait 🎉');
}
timerEl.addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b || !T) return;
  const k = b.dataset.t;
  if (k === 'next') { nextPart(); return; }
  if (k === 'leave') { minimizeTimer(); return; }
  if (k === 'stop') { stopRinging(); T = null; persistTimer(); hideTimer(); return; }
  if (k === 'pause') {
    if (T.paused != null) { T.endAt = Date.now() + T.paused; T.paused = null; requestWake(); }
    else { T.paused = T.endAt - Date.now(); }
  }
  if (k === 'plus') { if (T.paused != null) T.paused += 60000; else T.endAt += 60000; }
  persistTimer(); tick();
});

/* ---------- Cocher ---------- */
function setDone(nt, d, v) {
  const t0 = today();
  if (nt.free) {
    const log = new Set(nt.freeLog || []);
    if (v) { log.add(t0); nt.date = null; }
    else { const day = d && log.has(d) ? d : t0; log.delete(day); if (!nt.date && day === t0) nt.date = t0; }
    nt.freeLog = [...log].sort().slice(-60);
    return;
  }
  if (nt.rep) {
    const day = d || t0;
    const set = new Set(nt.doneDates || []);
    nt.caught = nt.caught || {};
    if (v) { set.add(day); if (day < t0) nt.caught[day] = t0; }
    else { set.delete(day); delete nt.caught[day]; }
    const cut = addDays(t0, -120);
    nt.doneDates = [...set].filter(x => x >= cut);
    Object.keys(nt.caught).forEach(k => { if (k < cut) delete nt.caught[k]; });
  } else {
    nt.done = v; nt.doneAt = v ? Date.now() : null;
    if (v && nt.date && nt.date < t0) nt.date = t0; // fait en retard : reste dans « Aujourd'hui »
  }
}
function toggleTask(id, d) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const before = remainingToday();
  if (t.free) { // cochée depuis To-do : faite aujourd'hui, le modèle reste
    const inst = makeInstance(t, today(), { done: true, doneAt: Date.now() });
    logSrc(inst, today(), true); refresh(); toast('Fait aujourd\'hui ✅'); return;
  }
  const nt = JSON.parse(JSON.stringify(t));
  const v = !isDone(t, d || today());
  setDone(nt, d, v);
  save('tasks', nt);
  if (nt.srcId) logSrc(nt, nt.date || today(), v);
  refresh();
  if (before > 0 && remainingToday() === 0) toast('Journée bouclée 🎉');
}
function toggleSub(id, d, sid) {
  const t = S.tasks.find(x => x.id === id); if (!t || !hasSubs(t)) return;
  const before = remainingToday();
  const nt = JSON.parse(JSON.stringify(t));
  const k = subKey(nt, d);
  nt.subDone = nt.subDone || {};
  const cur = new Set(nt.subDone[k] || []);
  if (cur.has(sid)) cur.delete(sid); else cur.add(sid);
  nt.subDone[k] = [...cur];
  if (nt.rep) { const cut = addDays(today(), -120); Object.keys(nt.subDone).forEach(x => { if (x < cut) delete nt.subDone[x]; }); }
  const all = nt.subs.every(x => cur.has(x.id));
  const was = isDone(nt, d || today());
  if (all && !was) setDone(nt, d, true);
  if (!all && was) setDone(nt, d, false);
  save('tasks', nt);
  if (nt.srcId && all !== was) logSrc(nt, nt.date || today(), all);
  refresh();
  if (before > 0 && remainingToday() === 0) toast('Journée bouclée 🎉');
  else if (all && !was) toast('Tout est coché, bravo 🎉');
}

/* ---------- Démarrage ---------- */
let lastDay = today();
function dayCheck() {
  const t = today();
  if (t !== lastDay) { lastDay = t; U.toggled.clear(); U.weekOffset = 0; U.selDay = t; refresh(); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  dayCheck();
  if (T) { requestWake(); tick(); }
});
setInterval(dayCheck, 60000);

async function start() {
  try { db = await openDB(); await loadAll(); } catch (e) { db = null; }
  for (const st of ['themes', 'lists']) {
    const fix = [];
    S[st].slice().sort(byOrder).forEach(x => { if (!x.color) { x.color = nextColor(S[st].filter(y => y.color)); fix.push(x); } });
    if (fix.length) await tx([st], t => fix.forEach(x => t.objectStore(st).put(x))).catch(() => {});
  }
  if (DEMO && !S.tasks.length && !S.themes.length && !S.lists.length) {
    const d = demoData();
    STORES.forEach(st => { S[st] = d[st]; });
    await tx(STORES, t => STORES.forEach(st => S[st].forEach(x => t.objectStore(st).put(x)))).catch(() => {});
  }
  await migrateRoutineSteps();
  for (const t of S.tasks.filter(x => x.free && (x.date || (x.freeLog || []).includes(today())))) {
    if (t.date) { const { routineRun, runDate, routineId } = t; makeInstance(t, t.date, routineRun ? { routineRun, runDate, routineId } : {}); }
    if ((t.freeLog || []).includes(today()) && !S.tasks.some(x => x.srcId === t.id && x.date === today() && x.done)) makeInstance(t, today(), { done: true, doneAt: Date.now() });
    await save('tasks', { ...S.tasks.find(x => x.id === t.id), date: null, routineRun: null });
  }
  renderHome();
  if (S.meta.timer) {
    T = S.meta.timer;
    if (T.min && T.paused != null) drawTbar(); else { T.min = false; showTimer(); }
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
start();
})();
