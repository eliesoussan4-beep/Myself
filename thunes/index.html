<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thunes</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --warn:#A8432C;
  --today:#e8962e; --today-soft:#fff1dc; --tomorrow:#7b5cd6; --tomorrow-soft:#efe9ff;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B;
    --today:#f0a648; --today-soft:#3b2c15; --tomorrow:#a58cf0; --tomorrow-soft:#2a2342;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B;
  --today:#f0a648; --today-soft:#3b2c15; --tomorrow:#a58cf0; --tomorrow-soft:#2a2342;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
:root{--plus:#2F7A4A;--moins:#B84A3E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plus:#7CC992;--moins:#E58A84}}
:root[data-theme="dark"]{--plus:#7CC992;--moins:#E58A84}
/* une couleur par carte de charges fixes */
:root{--k0:#C26A12;--k1:#2F7A4A;--k2:#7B5CD6;--k3:#2F4C78;--k4:#B84A3E;--k5:#1F7A6A;--k6:#A3477F;--k7:#8A6D1F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k0:#F0A648;--k1:#7CC992;--k2:#A58CF0;--k3:#8FB0E3;--k4:#E58A84;--k5:#5CCBB7;--k6:#E48CC4;--k7:#D9BC62}}
:root[data-theme="dark"]{--k0:#F0A648;--k1:#7CC992;--k2:#A58CF0;--k3:#8FB0E3;--k4:#E58A84;--k5:#5CCBB7;--k6:#E48CC4;--k7:#D9BC62}
.carte-c.ch{background:color-mix(in srgb,var(--k) 17%,var(--sunk))}
.carte-c.ch small,.carte-c.ch b{color:var(--k)}
.carte-c.ch .virer{background:color-mix(in srgb,var(--k) 20%,var(--surface));color:var(--k)}
.carte-c.ch .ch-l button{border-bottom:1px solid color-mix(in srgb,var(--k) 22%,transparent)}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:12px}
.tete{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.tete h1{font-size:clamp(26px,7vw,38px);font-weight:800;letter-spacing:-.025em}
.t{background:var(--sunk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.titre{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.titre b{font-family:var(--display);font-size:16px;font-weight:800}
.titre span,.titre button.lien{font-size:12px;font-weight:700;color:var(--denim);background:none;border:0;padding:0}
.vide{margin:0;font-size:14px;color:var(--muted)}
/* La cagnotte */
.cag{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:8px;padding:16px 12px}
.cag-b{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font:700 30px/1 var(--display);color:var(--ink)}
.pris{color:var(--today) !important;font-weight:700 !important}
.pot{border:0;text-align:left;justify-content:space-between;min-height:132px;color:var(--ink)}
.pot small{font-size:12px;font-weight:700;color:var(--muted)}
.pot b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.pot b.neg{color:var(--moins)}
.pot span{font-size:12px;font-weight:600;color:var(--muted)}
.su{background:color-mix(in srgb,#7B5CD6 14%,var(--sunk))}
.virer{border:0;border-radius:10px;background:var(--surface);color:var(--denim);font-size:12.5px;font-weight:700;padding:8px 6px;margin-top:4px}
.virer:disabled{opacity:.45}
.it.ro{cursor:default}
.duo.hautes .chif{border:0;text-align:left;padding:10px 14px}
.duo.hautes .chif b{font-size:20px}
.chif.manque{background:color-mix(in srgb,var(--today) 18%,var(--sunk))}
.carre{display:flex;flex-direction:column;gap:6px;min-width:0}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.car > *{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.carre .t,.carre1{aspect-ratio:1;box-sizing:border-box}
.pot{gap:4px !important;min-height:0 !important}
.pot b{font-size:22px !important}
.cagc{border:0;text-align:left;color:var(--ink);justify-content:space-between}
.cagc b{font-size:24px !important;white-space:nowrap}
.cagc b.neg{color:var(--moins)}
.carre1{border:0;text-align:left}
.pts{display:flex;justify-content:center;gap:5px}
.pts span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.pts span.on{background:var(--denim);width:14px;border-radius:3px}
.mvts{cursor:pointer;gap:6px}
/* En-tête comme les autres pages : la date, et les réglages */
.tete{margin:-8px 2px 0}
.voy-band{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-radius:12px;background:color-mix(in srgb,var(--denim) 16%,var(--sunk));color:var(--ink);font:700 13px var(--body);padding:8px 12px;text-align:left;flex:none}
.voy-band span{color:var(--denim);white-space:nowrap}
.tete h1{font-size:clamp(19px,5.7vw,40px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.reg{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
/* Les 4 cartes du haut : même taille, chacune sa couleur */
.duo.pots2 .chif{border:0;text-align:left;padding:10px 14px;justify-content:center;gap:2px !important;aspect-ratio:auto;height:100%;min-height:0}
.duo.pots2 .chif b{font-size:20px !important}
.duo.pots2 .carre{gap:6px}
.chif small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac1{--a:var(--k5)} .ac2{--a:var(--k3)} .ac3{--a:var(--k1)} .ac4{--a:var(--k0)}
.chif.ac1,.chif.ac2,.chif.ac3,.chif.ac4{background:color-mix(in srgb,var(--a) 15%,var(--sunk));box-shadow:inset 4px 0 0 var(--a)}
.chif.ac1 small,.chif.ac2 small,.chif.ac3 small,.chif.ac4 small{color:var(--a)}
.chif.manque{box-shadow:inset 4px 0 0 var(--today)}
.su{box-shadow:inset 4px 0 0 #7B5CD6}
.su small{color:#7B5CD6 !important}
.su-l{display:flex;align-items:center;justify-content:space-between;gap:6px}
.su-l .virer{margin:0;padding:5px 8px;font-size:12px}
.pts.cache{visibility:hidden}
.reg-l{display:flex;flex-direction:column;gap:6px}
.reg-l .it{background:var(--sunk)}
.pop .in{flex:none;min-height:46px;box-sizing:border-box;line-height:1.3;width:100%}
.pop .row .in{flex:1 1 auto;width:auto}
.pop .row .in.emo{flex:none;width:58px}
.mnav{display:flex;align-items:center;gap:4px;margin-left:auto;margin-right:8px}
.mnav em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);min-width:42px;text-align:center}
.mini.nav{width:26px;height:26px;font-size:16px}
.mini.nav:disabled{opacity:.3}
.tot-nav .mnav{margin:0;justify-content:center}
.tot-nav .mnav em.tot-t{min-width:0;font-family:var(--display);font-size:16px;font-weight:800;color:var(--ink)}
.cat-r{display:flex;gap:6px;align-items:stretch}
.cat-r .it{flex:1;min-width:0}
.cat-x{flex:none;width:44px;border:0;border-radius:12px;background:var(--sunk);color:var(--muted);font-size:15px}
.cat-l{max-height:46dvh;overflow-y:auto}
.cat-new{margin-top:8px}
.coul-l{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 0}
.coul{width:32px;height:32px;border-radius:50%;border:3px solid transparent;background:var(--k);padding:0;box-shadow:0 0 0 1px var(--line)}
.coul.on{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--k)}
.btn.plus{flex:none;width:46px;padding:0;font-size:22px}
.coche-l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.coche-l input{width:18px;height:18px;margin:0}
/* Octobre / Charges : le titre en haut, le chiffre en grand au milieu, les boutons dessous */
.carte-c.tot{align-items:stretch;justify-content:space-between !important;overflow:hidden}
.carte-c.tot > *{flex:none}
.carte-c.tot .tot-t{font-family:var(--display);font-size:16px;font-weight:800;color:var(--ink);text-align:center}
.carte-c.tot{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.carte-c.tot .tot-m b{color:var(--ink)}
.carte-c.tot .virer{background:var(--sunk);color:var(--ink)}
.seg{display:flex;gap:2px;width:100%;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:4px 0 2px}
.seg i{display:block;min-width:3px}
.tot-m{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.carte-c.tot .tot-m b{font-size:28px;line-height:1.05;white-space:nowrap}
.tot-m span{font-size:12px;font-weight:600;color:var(--muted)}
.carte-c.ch .emo{filter:none}
/* Tout l'écran, sans défiler : ce qui reste va aux Mouvements et au graphique */
main{min-height:100dvh;box-sizing:border-box}
/* Mouvements, Octobre/Charges et le graphique se partagent la hauteur qui reste (pas de défilement) */
.mvts{flex:.75 1 0;min-height:136px;overflow:hidden}
.mvts .it{padding:7px 12px}
.mvts .it .d{white-space:nowrap;width:50px}
/* Mouvements : une pastille de couleur (la catégorie), le libellé en gras et la date dessous, le montant à droite */
.it.mvl{gap:10px;padding:7px 10px 7px 7px;background:color-mix(in srgb,var(--k) 15%,var(--surface))}
.mv-ic{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;background:color-mix(in srgb,var(--k) 20%,transparent);color:var(--k);font-weight:800}
.mvl .n{display:flex;flex-direction:column;gap:0;line-height:1.2}
.mvl .n b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvl .n small{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvl .m{font-family:var(--display);font-size:15px}
.mvts .titre b{font-size:16px}
.mini.fac{color:var(--denim)}
.mvts .mini{width:28px;height:28px}
.mvts .mini-b{gap:5px}
.mvts .mnav{margin-right:6px}
/* Le volet des factures : il monte du bas */
dialog.volet{width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;max-height:94dvh;overflow:hidden;flex-direction:column}
dialog.volet[open]{display:flex;animation:monte .25s cubic-bezier(.2,.8,.2,1)}
@keyframes monte{from{transform:translateY(100%)}}
.vl-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.vl-h h2{font-size:21px}
.vl-c{overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px}
.vl-b{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.vl-b .btn{flex:1}
.vl-s{display:flex;flex-direction:column;gap:8px}
.vl-s > h3{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.vl-c label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.vl-c .in{flex:none;min-height:46px;box-sizing:border-box;width:100%;line-height:1.3;color:var(--ink);font-weight:600}
.pop .in{color:var(--ink)}
.vl-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.vl-g > label,.ms-g > label{min-width:0}
.vl-c input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%}
.cl-l{display:flex;flex-wrap:wrap;gap:6px}
.cl{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 14px;font-weight:700;font-size:14px}
.cl.on{background:var(--denim);border-color:var(--denim);color:var(--on-denim)}
.cl.neuf{border-style:dashed;color:var(--denim)}
.cl-fiche{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.45;color:var(--muted)}
.cl-fiche b{color:var(--ink)}
.lien{border:0;background:none;padding:0;color:var(--denim);font-weight:700;font-size:13.5px}
.cl-form{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ms{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ms-h{display:flex;gap:8px;align-items:center}
.ms-h .in{flex:1}
.ms-x{flex:none;width:40px;height:46px;border:0;border-radius:12px;background:var(--surface);color:var(--muted)}
.ms-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.ms-t{min-height:46px;display:flex;align-items:center;justify-content:flex-end;font-family:var(--display);font-weight:800;font-size:16px}
.ajout{border:1.5px dashed var(--line);background:none;border-radius:14px;padding:11px;font-weight:700;color:var(--denim)}
.vl-tot{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px}
.vl-tot b{font-family:var(--display);font-size:24px}
.vl-c details{background:var(--sunk);border-radius:14px;padding:0 12px}
.vl-c details summary{padding:12px 0;font-weight:700;cursor:pointer}
.vl-c details[open]{padding-bottom:12px}
.vl-c details > div{display:flex;flex-direction:column;gap:8px}
.vl-c .note{margin:0}
.duo.hautes .chif,.duo.pots2 .chif{min-height:74px;padding:12px 14px}
.duo.hautes .chif b,.duo.pots2 .chif b{font-size:23px !important}
.duo.cd{flex:.9 1 0;min-height:126px}
.duo.cd .carre{min-height:0}
.duo.cd .car{flex:1;min-height:0}
.duo.cd .carre .t{aspect-ratio:auto;height:auto}
.jours{flex:.85 1 0;min-height:118px;gap:6px}
/* Les deux boutons des factures, entre Octobre / Charges et les stats */
.fac-b{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:none}
.fbt{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;padding:11px 8px}
.fbt svg{color:var(--denim);flex:none}
.fac-m{display:flex;flex-direction:column;gap:6px}
.fac-m h3{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0;font-size:15px}
.fac-m h3 span{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted)}
.fac-l{max-height:58dvh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
/* petits écrans : tout se resserre pour tenir sans défiler */
@media (max-height:740px){
  main{gap:8px}
  .duo.hautes .chif,.duo.pots2 .chif{padding:8px 12px;min-height:56px}
  .duo.hautes .chif b,.duo.pots2 .chif b{font-size:18px !important}
  .mvts{min-height:92px}
  .mvts .it{padding:5px 10px}
  .duo.cd{min-height:124px}
  .tot-m span{display:none}
  .carte-c.tot{padding:8px 10px;gap:2px !important}
  .carte-c.tot .tot-t{font-size:14px}
  .carte-c.tot .tot-m b{font-size:24px !important}
  .carte-c.tot .virer{padding:5px 6px;margin-top:2px}
  .jours{min-height:92px}
  .jours .axe{display:none}
  main{gap:6px !important}
  .fac-b .fbt{padding:7px 6px;font-size:13px}
  .duo.cd{min-height:112px !important}
  .jours{min-height:76px !important}
  .mvts{min-height:84px !important}
  .duo.hautes .chif,.duo.pots2 .chif{min-height:50px !important}
}
.jours .bars{flex:1;height:auto;min-height:36px}
/* Le carrousel des stats */
/* (les points sous la carte, comme les autres carrousels) */
.jours{display:flex;flex-direction:column;gap:6px;padding:0;min-width:0}
.jours .car{flex:1;min-height:0;border-radius:16px;padding:0;gap:0;flex-direction:row;display:flex}
.jours .car > .sd{display:flex;flex-direction:column;gap:6px;padding:12px 14px;box-sizing:border-box;min-height:0}

.hb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px;min-height:0}
.hb > div{display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr) auto;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{display:block;height:8px;border-radius:4px;background:color-mix(in srgb,var(--k) 18%,transparent);overflow:hidden}
.hb em{display:block;height:100%;border-radius:4px;background:var(--k)}
.hb b{font-family:var(--display);font-weight:800;color:var(--k);white-space:nowrap}
.mb{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.mb > div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-height:0}
.mb i{display:block;width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--denim) 45%,transparent)}
.mb .on i{background:var(--denim)}
.mb b{font-size:10.5px;color:var(--muted)}
.mb span{font-size:10.5px;font-weight:700;color:var(--muted)}
.b4{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;align-content:center}
.b4 > div{display:flex;flex-direction:column}
.b4 b{font-family:var(--display);font-size:17px;font-weight:800;line-height:1.1}
.b4 span{font-size:11px;font-weight:600;color:var(--muted);line-height:1.2}
main{gap:10px}
.ch-r{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}

<body>

<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ================================================================
   « Thunes » : la cagnotte de ce que tu peux dépenser.
   Chaque mois : ce que tu te verses − les charges fixes − ce que tu mets de côté = à dépenser.
   Divisé par le nombre de jours du mois : chaque jour, la cagnotte gagne cette part.
   Les dépenses (−) et les rentrées (+) notées pendant le mois s'y ajoutent.
   Données : localStorage « thunes_v1 » (la sauvegarde globale de Mon quotidien la prend : préfixe thunes_).
   L'accueil de Mon quotidien lit la cagnotte ici (window.quotidienThunes.calcul) : un seul calcul.
   Les scènes de Backstage (localStorage « backstage_scenes_v1 ») : dépenses → cagnotte ; gains → cagnotte stand-up.
   ================================================================ */
const VERSION = 1, CLE = 'thunes_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const moisDe = d => iso(d).slice(0, 7);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
// ✈️ Pendant un voyage (bouton de l'accueil), tout s'affiche et se tape dans la devise du pays ; c'est rangé en euros
function voyageDevise(){
  if(sessionStorage.getItem('thunes_voir_eur') === '1') return null;
  try{ const t = iso(new Date()), l = JSON.parse(localStorage.getItem('thunes_voyages_v1') || '[]');
    const v = (Array.isArray(l) ? l : []).find(x => x.debut <= t && t <= x.fin);
    return v && v.devise && v.devise !== 'EUR' && v.taux > 0 ? v : null; }catch(e){ return null; }
}
const eur = (n, dec = true) => {
  const V = voyageDevise();
  if(V){ try{ return new Intl.NumberFormat('fr-FR', {style:'currency', currency:V.devise, currencyDisplay:'narrowSymbol', ...(dec ? {} : {minimumFractionDigits:0, maximumFractionDigits:0})}).format((Math.abs(n) < 0.005 ? 0 : n) * V.taux).replace('-', '−'); }catch(e){} }
  return (Math.abs(n) < 0.005 && (n = 0), n < 0 ? '−' : '') + Math.abs(n).toLocaleString('fr-FR', {minimumFractionDigits:dec ? 2 : 0, maximumFractionDigits:dec ? 2 : 0}) + ' €';
};
const versLocal = n => { const V = voyageDevise(); return V ? n * V.taux : n; };     // € → devise (pour pré-remplir un champ)
const versEuro = n => { const V = voyageDevise(); return V ? n / V.taux : n; };      // devise → € (ce qui est rangé)
const nombre = v => { const n = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const nomMois = m => new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleDateString('fr-FR', {month:'long'});

function lire(){ let d = null; try{ d = JSON.parse(localStorage.getItem(CLE) || 'null'); }catch(e){}
  d = {charges:[], epargne:0, versements:{}, mouvements:[], virements:[], ...(d && typeof d === 'object' ? d : {})};
  if(!d.cote) d.cote = {depart:0, depuis:moisDe(new Date())};
  if(!Array.isArray(d.categories)) d.categories = CATS_DEPART.map(([emoji, nom], i) => ({id:'c' + i, emoji, nom}));
  if(!Array.isArray(d.catCharges)) d.catCharges = [['🏠', 'Loyer'], ['📺', 'Abonnements'], ['💳', 'Paiements'], ['🛡️', 'Assurances'], ['📦', 'Autre']].map(([emoji, nom], i) => ({id:'k' + i, emoji, nom}));
  if(!Array.isArray(d.ajustements)) d.ajustements = [];
  return d; }
// Catégories de dépenses proposées au départ (tu peux les changer, en ajouter, en supprimer)
const CATS_DEPART = [['🍽️', 'Resto'], ['🛒', 'Courses'], ['🚇', 'Transport'], ['🎉', 'Sorties'], ['🛍️', 'Shopping'], ['💊', 'Santé'], ['🎁', 'Cadeaux'], ['📦', 'Autre']];
const kCat = k => `var(--k${k && k.coul != null ? k.coul : (Math.max(0, D.categories.indexOf(k)) + 3) % 8})`;
const catDe = (d, x) => x && x.c ? d.categories.find(c => c.id === x.c) : null;
// Le libellé d'un mouvement : « 🍽️ Resto · sushi » (ou l'ancien texte libre)
const libelle = (d, x) => { const c = catDe(d, x); return c ? `${c.emoji} ${c.nom}${x.l ? ' · ' + x.l : ''}` : (x.l || (x.m < 0 ? 'Dépense' : 'Rentrée')); };
function ecrire(d){ try{ localStorage.setItem(CLE, JSON.stringify(d)); }catch(e){ toast('Impossible d’enregistrer.'); } }
// Ce que tu te verses ce mois : celui du mois, sinon le dernier connu
function versement(d, m){ if(d.versements[m] != null) return {v:d.versements[m], connu:true}; const avant = Object.keys(d.versements).filter(k => k < m).sort().pop(); return {v:avant ? d.versements[avant] : 0, connu:false, depuis:avant}; }
// Les scènes notées dans Backstage : leurs dépenses sortent de la cagnotte ; leurs gains vont dans la cagnotte stand-up
function scenes(){ try{ const l = JSON.parse(localStorage.getItem('backstage_scenes_v1') || '[]'); return Array.isArray(l) ? l.filter(x => x && x.date) : []; }catch(e){ return []; } }
const moisSuivant = m => { const x = new Date(+m.slice(0, 4), +m.slice(5), 1); return x.getFullYear() + '-' + pad(x.getMonth() + 1); };
const nbJours = m => new Date(+m.slice(0, 4), +m.slice(5), 0).getDate();
// Le bilan d'un mois (sans le côté) : jusqu'au jour j inclus
// Les mois finis gardent les charges et l'épargne qu'ils avaient (voir figerMois) ; le mois en cours prend les réglages actuels
const figeDe = (d, m) => (d.figes || {})[m] || null;
const epDe = (d, m) => { const f = figeDe(d, m); return f ? +f.ep || 0 : +d.epargne || 0; };
const chargesDe = (d, m) => { const f = figeDe(d, m); return f ? +f.charges || 0 : d.charges.reduce((s, c) => s + (+c.montant || 0), 0); };
// Ce qui est mis de côté un mois donné jusqu'au jour j : un peu chaque jour (et, si tu as changé ton épargne en cours de mois, le nouveau rythme à partir de ce jour-là)
function epAcquis(d, m, j){
  const n = nbJours(m), e = epDe(d, m), p = (d.paliers || {})[m];
  const pj = p && p.epA != null ? (p.epJ != null ? p.epJ : p.j) : null;   // (le jour du changement compte déjà au nouveau rythme)
  return pj != null && j >= pj ? p.epA + e * (Math.min(j, n) - pj) / n : e * Math.min(j, n) / n;
}
// À chaque ouverture : on fige les mois finis (charges + épargne d'alors), pour qu'un changement plus tard ne soit pas rétroactif
function figerMois(d){
  const m = moisDe(new Date()), debut = d.debut || (d.cote && d.cote.depuis) || m; let chg = false;
  d.figes = d.figes || {};
  for(let x = debut; x < m; x = moisSuivant(x)) if(!d.figes[x]){ d.figes[x] = {charges:chargesDe(d, m), ep:+d.epargne || 0}; chg = true; }
  return chg;
}
function bilanMois(d, m, j, sc){
  const ver = versement(d, m), charges = chargesDe(d, m), ep = epDe(d, m), nbJ = nbJours(m);
  const budgetBrut = ver.v - charges - ep, budget = Math.max(0, budgetBrut);   // (versement 0, ou plus petit que charges + épargne : 0 par jour, jamais négatif)
  // Palier : quand tu changes ton versement, tes charges ou ton épargne en cours de mois, ce qui est déjà gagné ne bouge pas :
  // le reste du budget est réparti sur les jours qui restent (c'est le « par jour » qui change, pas la cagnotte).
  const p = d.paliers && d.paliers[m], reste = p ? nbJ - p.j : 0;
  const parJour = p ? (reste > 0 ? Math.max(0, (budget - p.acquis) / reste) : 0) : budget / nbJ;
  const acquis = x => !p ? parJour * x : x >= p.j ? p.acquis + parJour * Math.max(0, x - p.j) : p.acquis * x / Math.max(1, p.j);
  const mv = d.mouvements.filter(x => x.d.slice(0, 7) === m);
  const mvC = mv.filter(x => !x.su);   // (une dépense payée avec la cagnotte stand-up ne touche pas la cagnotte : elle compte quand même dans les stats)
  const depenses = -mvC.filter(x => x.m < 0).reduce((s, x) => s + x.m, 0), rentrees = mvC.filter(x => x.m > 0).reduce((s, x) => s + x.m, 0);
  const scM = sc.filter(x => x.date.slice(0, 7) === m), depScenes = 0;   // (les dépenses notées sur une scène restent dans Backstage : tu les notes toi-même ici, sinon doublon)
  const virs = (d.virements || []).filter(x => x.d.slice(0, 7) === m), vir = virs.reduce((s, x) => s + x.m, 0);
  const ajs = (d.ajustements || []).filter(x => x.d.slice(0, 7) === m), aj = ajs.reduce((s, x) => s + x.m, 0);   // « je réajuste ma cagnotte »
  const pios = (d.pioches || []).filter(x => x.d.slice(0, 7) === m), pio = pios.reduce((s, x) => s + x.m, 0);   // « je pioche dans mon côté »
  const brute = acquis(j) - depenses + rentrees - depScenes + vir + aj + pio;
  return {ver, charges, ep, budget, budgetBrut, parJour, nbJ, mv, depenses, rentrees, scM, depScenes, virs, vir, ajs, pios, brute, acq:acquis(j), finBrute:brute + acquis(nbJ) - acquis(j)};
}
function calcul(d, jour = new Date()){
  const m = moisDe(jour), j = jour.getDate(), sc = scenes();
  const b = bilanMois(d, m, j, sc);
  // La cagnotte peut être dans le rouge : rien n'est pris sur ton côté sans toi (c'est toi qui choisis de « piocher dans le côté »).
  // Elle continue d'un mois à l'autre : ce qui reste (ou manque) à la fin d'un mois passe au mois suivant.
  const cote = d.cote || {depart:0, depuis:m}, debut = d.debut || cote.depuis || m;
  let report = 0;
  for(let x = debut; x < m; x = moisSuivant(x)) report += bilanMois(d, x, nbJours(x), sc).brute;
  const priseCote = 0, cagnotte = report + b.brute;
  // Le côté : ce qu'il y avait au départ + ce que tu mets de côté chaque mois − ce que tu as choisi d'y piocher
  let total = +cote.depart || 0;
  for(let x = cote.depuis; x < m; x = moisSuivant(x)) total += epAcquis(d, x, nbJours(x));
  if(cote.depuis <= m) total += epAcquis(d, m, j);
  const coteNet = total - (d.pioches || []).reduce((a, x) => a + x.m, 0);
  // Le stand-up : tout ce que les scènes ont rapporté, moins ce que tu as viré dans la cagnotte
  const gainsSU = sc.reduce((s, x) => s + (+x.gains || 0), 0), viresSU = (d.virements || []).reduce((s, x) => s + x.m, 0), payeSU = -d.mouvements.filter(x => x.su).reduce((s, x) => s + x.m, 0);

  (e, dlg) => {
    const b = e.target.closest('[data-f]'); if(!b) return;
    const f = dlg.querySelector('form');
    if(b.dataset.f === 'non'){ dlg.close(); return; }
    if(b.dataset.f === 'coul'){ dlg.querySelectorAll('.coul').forEach(y => y.classList.toggle('on', y === b)); return; }

    if(b.dataset.f === 'sup'){ if(!confirm('Supprimer cette catégorie ? Les dépenses déjà notées gardent leur montant.')) return; D.categories = D.categories.filter(c => c.id !== x.id); ecrire(D); dlg.close(); render(); return; }

// Mettre la cagnotte à une valeur précise (un réajustement : la différence, qu'on corrige si le calcul bouge encore)
function poserCagnotte(d, v){
  for(let k = 0; k < 4; k++){
    const diff = Math.round((v - calcul(d).cagnotte) * 100) / 100; if(!diff) break;
    d.ajustements = [...(d.ajustements || []), {id:uid(), d:iso(new Date()), m:diff, v, t:Date.now()}];
  }
}
