<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thunes</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#E8EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#18202E; --muted:#636C7D; --line:#D3D8E0;
  --denim:#2F4C78; --denim-soft:#DCE4F0; --on-denim:#FFFFFF; --warn:#A8432C;
  --today:#e8962e; --today-soft:#fff1dc; --tomorrow:#7b5cd6; --tomorrow-soft:#efe9ff;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
    --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B;
    --today:#f0a648; --today-soft:#3b2c15; --tomorrow:#a58cf0; --tomorrow-soft:#2a2342;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1B212B; --sunk:#232A36; --ink:#E7EBF1; --muted:#98A1B1; --line:#2E3645;
  --denim:#8FB0E3; --denim-soft:#26344B; --on-denim:#0F1622; --warn:#E3826B;
  --today:#f0a648; --today-soft:#3b2c15; --tomorrow:#a58cf0; --tomorrow-soft:#2a2342;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
:root{--plus:#2F7A4A;--moins:#B84A3E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plus:#7CC992;--moins:#E58A84}}
:root[data-theme="dark"]{--plus:#7CC992;--moins:#E58A84}
/* une couleur par carte de charges fixes */
:root{--k0:#C26A12;--k1:#2F7A4A;--k2:#7B5CD6;--k3:#2F4C78;--k4:#B84A3E;--k5:#1F7A6A;--k6:#A3477F;--k7:#8A6D1F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k0:#F0A648;--k1:#7CC992;--k2:#A58CF0;--k3:#8FB0E3;--k4:#E58A84;--k5:#5CCBB7;--k6:#E48CC4;--k7:#D9BC62}}
:root[data-theme="dark"]{--k0:#F0A648;--k1:#7CC992;--k2:#A58CF0;--k3:#8FB0E3;--k4:#E58A84;--k5:#5CCBB7;--k6:#E48CC4;--k7:#D9BC62}
.carte-c.ch{background:color-mix(in srgb,var(--k) 17%,var(--sunk))}
.carte-c.ch small,.carte-c.ch b{color:var(--k)}
.carte-c.ch .ch-l button{border-bottom:1px solid color-mix(in srgb,var(--k) 22%,transparent)}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:12px}
.tete{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.tete h1{font-size:clamp(26px,7vw,38px);font-weight:800;letter-spacing:-.025em}
.t{background:var(--sunk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.titre{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.titre b{font-family:var(--display);font-size:16px;font-weight:800}
.titre span,.titre button.lien{font-size:12px;font-weight:700;color:var(--denim);background:none;border:0;padding:0}
.vide{margin:0;font-size:14px;color:var(--muted)}
/* La cagnotte */
.cag{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:8px;padding:16px 12px}
.cag-b{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font:700 30px/1 var(--display);color:var(--ink)}
.pris{color:var(--today) !important;font-weight:700 !important}
.pot{border:0;text-align:left;justify-content:space-between;min-height:132px;color:var(--ink)}
.pot small{font-size:12px;font-weight:700;color:var(--muted)}
.pot b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.pot b.neg{color:var(--moins)}
.pot span{font-size:12px;font-weight:600;color:var(--muted)}
.su{background:color-mix(in srgb,#7B5CD6 14%,var(--sunk))}
.virer{border:0;border-radius:10px;background:var(--surface);color:var(--denim);font-size:12.5px;font-weight:700;padding:8px 6px;margin-top:4px}
.virer:disabled{opacity:.45}
.it.ro{cursor:default}
.duo.hautes .chif{border:0;text-align:left;padding:10px 14px}
.duo.hautes .chif b{font-size:20px}
.chif.manque{background:color-mix(in srgb,var(--today) 18%,var(--sunk))}
.carre{display:flex;flex-direction:column;gap:6px;min-width:0}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.car > *{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.carre .t,.carre1{aspect-ratio:1;box-sizing:border-box}
.pot{gap:4px !important;min-height:0 !important}
.pot b{font-size:22px !important}
.cagc{border:0;text-align:left;color:var(--ink);justify-content:space-between}
.cagc b{font-size:24px !important;white-space:nowrap}
.cagc b.neg{color:var(--moins)}
.carre1{border:0;text-align:left}
.pts{display:flex;justify-content:center;gap:5px}
.pts span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.pts span.on{background:var(--denim);width:14px;border-radius:3px}
.mvts{cursor:pointer;gap:6px}
.mvts .pg{display:flex;flex-direction:column;gap:4px}
.mini-b{display:flex;gap:6px}
.mini{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px/1 var(--display);padding:0;display:flex;align-items:center;justify-content:center}
.carte-c{border:0;text-align:left;color:var(--ink);gap:3px !important;justify-content:flex-start}
.carte-c .emo{font-size:30px;line-height:1}
.carte-c small{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carte-c b{font-family:var(--display);font-size:22px;font-weight:800}
.carte-c > span:not(.emo){font-size:12px;font-weight:600;color:var(--muted)}
.carte-c.info{justify-content:space-between}
.carte-c .virer{margin-top:auto}
.ch-l{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0;flex:1;scrollbar-width:none}
.ch-l button{display:flex;justify-content:space-between;gap:6px;border:0;background:none;padding:3px 0;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left}
.ch-l span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-l em{font-style:normal;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--denim);background:color-mix(in srgb,var(--denim) 18%,var(--surface))}
.items.grand{max-height:55dvh}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 2px;min-width:0}
.cat span{font-size:22px;line-height:1}
.cat small{font-size:11.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.on{border-color:var(--denim);background:color-mix(in srgb,var(--denim) 18%,var(--surface));box-shadow:inset 0 0 0 1px var(--denim)}
.err{color:var(--moins);min-height:1em}
.in.emo{flex:none;width:58px;text-align:center;font-size:22px;padding:8px}
.chip.plus{color:var(--denim);border-style:dashed;background:none}
.cbars{display:flex;flex-direction:column;gap:7px}
.cbars > div{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 3.4em 2.4em;align-items:center;gap:8px;font-size:13px;font-weight:600}
.cbars span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbars i{display:block;height:9px;border-radius:5px;background:color-mix(in srgb,var(--denim) 16%,transparent);overflow:hidden}
.cbars i em{display:block;height:100%;border-radius:5px;background:var(--denim)}
.cbars b{text-align:right;font-weight:800}
.cbars small{text-align:right;color:var(--muted);font-size:11.5px}
.cag-c{text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}
.cag-c small{font-size:12px;font-weight:700;color:var(--muted)}
.cag-c b{font-family:var(--display);font-size:clamp(32px,10vw,44px);font-weight:800;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.cag-c b.neg{color:var(--moins)}
.cag-c span{font-size:12.5px;font-weight:600;color:var(--muted)}
/* Versement manquant */
.ask{background:color-mix(in srgb,var(--today) 18%,var(--sunk))}
.ask p{margin:0;font-weight:700}
.row{display:flex;gap:8px}
.in{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 12px;font-size:16px}
.btn{border:0;border-radius:12px;background:var(--denim);color:var(--on-denim);font-weight:700;padding:11px 16px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.rouge{background:var(--moins);color:var(--surface)}
/* Ce mois */
.lignes{display:flex;flex-direction:column}
.l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;font-size:14.5px}
.l span{color:var(--muted);font-weight:600}
.l b{font-weight:800;white-space:nowrap}
.l.tot{border-top:1px solid var(--line);margin-top:3px;padding-top:8px}
.l.tot b{font-family:var(--display);font-size:18px}
.jauge{height:8px;border-radius:4px;background:color-mix(in srgb,var(--denim) 16%,transparent);position:relative;overflow:hidden}
.jauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--denim)}
.jauge i.trop{background:var(--moins)}
.note{margin:0;font-size:12px;color:var(--muted)}
/* listes */
.items{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;overscroll-behavior:contain}
.it{display:flex;align-items:center;gap:10px;border:0;border-radius:12px;background:var(--surface);padding:10px 12px;text-align:left;width:100%}
.it .d{flex:none;width:44px;font-size:12px;font-weight:700;color:var(--muted)}
.it .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m{font-weight:800;white-space:nowrap}
.it .m.plus{color:var(--plus)} .it .m.moins{color:var(--ink)}
.it.ajl .m,.it.ajl .n{color:var(--muted)}
.ajout{border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--denim);font-weight:700;padding:11px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chif{display:flex;flex-direction:column;gap:2px}
.chif small{font-size:12px;font-weight:700;color:var(--muted)}
.chif b{font-family:var(--display);font-size:22px;font-weight:800}
/* graphique : dépenses par jour */
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;align-items:end;height:90px}
.bars i{display:block;border-radius:3px 3px 1px 1px;background:color-mix(in srgb,var(--denim) 45%,transparent);min-height:2px}
.bars i.auj{background:var(--today)}
.bars i.fut{background:var(--line);opacity:.5}
.axe{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
/* fenêtre au milieu */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,420px);border-radius:22px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,22,.5)}
dialog[open]{animation:popin .18s ease}
@keyframes popin{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.pop{padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px}
.pop h2{font-size:22px}
.pop label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.pied{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
</style>

<body>
<main id="app"></main>
<dialog id="pop"></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ================================================================
   « Thunes » : la cagnotte de ce que tu peux dépenser.
   Chaque mois : ce que tu te verses − les charges fixes − ce que tu mets de côté = à dépenser.
   Divisé par le nombre de jours du mois : chaque jour, la cagnotte gagne cette part.
   Les dépenses (−) et les rentrées (+) notées pendant le mois s'y ajoutent.
   Données : localStorage « thunes_v1 » (la sauvegarde globale de Mon quotidien la prend : préfixe thunes_).
   L'accueil de Mon quotidien lit la cagnotte ici (window.quotidienThunes.calcul) : un seul calcul.
   Les scènes de Backstage (localStorage « backstage_scenes_v1 ») : dépenses → cagnotte ; gains → cagnotte stand-up.
   ================================================================ */
const VERSION = 1, CLE = 'thunes_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const moisDe = d => iso(d).slice(0, 7);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const eur = (n, dec = true) => (Math.abs(n) < 0.005 && (n = 0), n < 0 ? '−' : '') + Math.abs(n).toLocaleString('fr-FR', {minimumFractionDigits:dec ? 2 : 0, maximumFractionDigits:dec ? 2 : 0}) + ' €';
const nombre = v => { const n = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const nomMois = m => new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleDateString('fr-FR', {month:'long'});

function lire(){ let d = null; try{ d = JSON.parse(localStorage.getItem(CLE) || 'null'); }catch(e){}
  d = {charges:[], epargne:0, versements:{}, mouvements:[], virements:[], ...(d && typeof d === 'object' ? d : {})};
  if(!d.cote) d.cote = {depart:0, depuis:moisDe(new Date())};
  if(!Array.isArray(d.categories)) d.categories = CATS_DEPART.map(([emoji, nom], i) => ({id:'c' + i, emoji, nom}));
  if(!Array.isArray(d.catCharges)) d.catCharges = [['🏠', 'Loyer'], ['📺', 'Abonnements'], ['💳', 'Paiements'], ['🛡️', 'Assurances'], ['📦', 'Autre']].map(([emoji, nom], i) => ({id:'k' + i, emoji, nom}));
  if(!Array.isArray(d.ajustements)) d.ajustements = [];
  return d; }
// Catégories de dépenses proposées au départ (tu peux les changer, en ajouter, en supprimer)
const CATS_DEPART = [['🍽️', 'Resto'], ['🛒', 'Courses'], ['🚇', 'Transport'], ['🎉', 'Sorties'], ['🛍️', 'Shopping'], ['💊', 'Santé'], ['🎁', 'Cadeaux'], ['📦', 'Autre']];
const catDe = (d, x) => x && x.c ? d.categories.find(c => c.id === x.c) : null;
// Le libellé d'un mouvement : « 🍽️ Resto · sushi » (ou l'ancien texte libre)
const libelle = (d, x) => { const c = catDe(d, x); return c ? `${c.emoji} ${c.nom}${x.l ? ' · ' + x.l : ''}` : (x.l || (x.m < 0 ? 'Dépense' : 'Rentrée')); };
function ecrire(d){ try{ localStorage.setItem(CLE, JSON.stringify(d)); }catch(e){ toast('Impossible d’enregistrer.'); } }
// Ce que tu te verses ce mois : celui du mois, sinon le dernier connu
function versement(d, m){ if(d.versements[m] != null) return {v:d.versements[m], connu:true}; const avant = Object.keys(d.versements).filter(k => k < m).sort().pop(); return {v:avant ? d.versements[avant] : 0, connu:false, depuis:avant}; }
// Les scènes notées dans Backstage : leurs dépenses sortent de la cagnotte ; leurs gains vont dans la cagnotte stand-up
function scenes(){ try{ const l = JSON.parse(localStorage.getItem('backstage_scenes_v1') || '[]'); return Array.isArray(l) ? l.filter(x => x && x.date) : []; }catch(e){ return []; } }
const moisSuivant = m => { const x = new Date(+m.slice(0, 4), +m.slice(5), 1); return x.getFullYear() + '-' + pad(x.getMonth() + 1); };
const nbJours = m => new Date(+m.slice(0, 4), +m.slice(5), 0).getDate();
// Le bilan d'un mois (sans le côté) : jusqu'au jour j inclus
function bilanMois(d, m, j, sc){
  const ver = versement(d, m), charges = d.charges.reduce((s, c) => s + (+c.montant || 0), 0), ep = +d.epargne || 0, nbJ = nbJours(m);
  const budget = ver.v - charges - ep;
  // Palier : quand tu changes ton versement, tes charges ou ton épargne en cours de mois, ce qui est déjà gagné ne bouge pas :
  // le reste du budget est réparti sur les jours qui restent (c'est le « par jour » qui change, pas la cagnotte).
  const p = d.paliers && d.paliers[m], reste = p ? nbJ - p.j : 0;
  const parJour = p ? (reste > 0 ? (budget - p.acquis) / reste : 0) : budget / nbJ;
  const acquis = x => !p ? parJour * x : x >= p.j ? (reste > 0 ? p.acquis + parJour * (x - p.j) : budget) : p.acquis * x / Math.max(1, p.j);
  const mv = d.mouvements.filter(x => x.d.slice(0, 7) === m);
  const depenses = -mv.filter(x => x.m < 0).reduce((s, x) => s + x.m, 0), rentrees = mv.filter(x => x.m > 0).reduce((s, x) => s + x.m, 0);
  const scM = sc.filter(x => x.date.slice(0, 7) === m), depScenes = scM.reduce((s, x) => s + (+x.depenses || 0), 0);
  const virs = (d.virements || []).filter(x => x.d.slice(0, 7) === m), vir = virs.reduce((s, x) => s + x.m, 0);
  const ajs = (d.ajustements || []).filter(x => x.d.slice(0, 7) === m), aj = ajs.reduce((s, x) => s + x.m, 0);   // « je réajuste ma cagnotte »
  const brute = acquis(j) - depenses + rentrees - depScenes + vir + aj;
  return {ver, charges, ep, budget, parJour, nbJ, mv, depenses, rentrees, scM, depScenes, virs, vir, ajs, brute, acq:acquis(j), finBrute:brute + acquis(nbJ) - acquis(j)};
}
function calcul(d, jour = new Date()){
  const m = moisDe(jour), j = jour.getDate(), sc = scenes();
  const b = bilanMois(d, m, j, sc);
  // Si, même en ajoutant ce qui va encore tomber, la cagnotte finirait le mois dans le rouge : la différence est prise sur ton côté
  const priseCote = Math.max(0, -b.finBrute), cagnotte = b.brute + priseCote;
  // Le côté : ce qu'il y avait au départ + ce que tu mets de côté chaque mois − ce qui a été pris (mois finis, puis ce mois-ci)
  const cote = d.cote || {depart:0, depuis:m};
  let total = +cote.depart || 0, prisAvant = 0;
  const premier = Object.keys(d.versements).sort()[0];
  for(let x = cote.depuis; x <= m; x = moisSuivant(x)){
    total += +d.epargne || 0;
    if(x < m && premier && x >= premier){ const bx = bilanMois(d, x, nbJours(x), sc); if(bx.brute < 0) prisAvant += -bx.brute; }   // (pas les mois d'avant ton premier versement)
  }
  const coteNet = total - prisAvant - priseCote;
  // Le stand-up : tout ce que les scènes ont rapporté, moins ce que tu as viré dans la cagnotte
  const gainsSU = sc.reduce((s, x) => s + (+x.gains || 0), 0), viresSU = (d.virements || []).reduce((s, x) => s + x.m, 0);
  return {m, j, ...b, priseCote, cagnotte, finMois:cagnotte + b.finBrute - b.brute, cote:coteNet, coteMois:+d.epargne || 0, standup:gainsSU - viresSU, gainsSU, viresSU};
}

    <div class="btns"><button type="button" class="btn sec" data-f="non">Annuler</button><button type="button" class="btn" data-f="ok">Enregistrer</button></div>`,
  (e, dlg) => { const b = e.target.closest('[data-f]'); if(!b) return; if(b.dataset.f === 'non'){ dlg.close(); return; }
    const v = nombre(String(dlg.querySelector('form').m.value).replace('−', '-')); if(v == null || (v < 0 && !negatif)) return; D = lire(); poser(D, Math.round(v * 100) / 100); ecrire(D); dlg.close(); render(); });
}
// Annuler un réajustement (de la cagnotte « aj », ou du côté « ajc ») depuis l'historique
function annulerAjustement(a, id){
  D = lire(); const l = a === 'aj' ? D.ajustements : (D.ajCote || []), x = l.find(y => y.id === id); if(!x) return;
  if(!confirm(`Annuler ce réajustement (${x.m < 0 ? '−' : '+'} ${eur(Math.abs(x.m))}) ?`)) return;
  if(a === 'aj') D.ajustements = l.filter(y => y.id !== id);
  else { D.ajCote = l.filter(y => y.id !== id); D.cote = {...D.cote, depart:(+D.cote.depart || 0) - x.m}; }
  ecrire(D); render(); toast('Réajustement annulé');
}
$('#app').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b || !b.dataset.a) return;
  const a = b.dataset.a, m = moisDe(new Date());
  if(a === 'tous-mv'){ fenetreTousMouvements(); return; }
  if(a === 'ajuster'){ fenetreNombre('Ta cagnotte aujourd’hui', Math.round(calcul(lire()).cagnotte * 100) / 100, (d, v) => { const diff = Math.round((v - calcul(d).cagnotte) * 100) / 100; if(diff) d.ajustements = [...(d.ajustements || []), {id:uid(), d:iso(new Date()), m:diff, v, t:Date.now()}]; }, true); return; }
  if(a === 'aj' || a === 'ajc'){ annulerAjustement(a, b.dataset.id); return; }
  if(a === 'moins') fenetreMouvement(-1);
  else if(a === 'plus') fenetreMouvement(1);
  else if(a === 'mv'){ const x = D.mouvements.find(y => y.id === b.dataset.id); if(x) fenetreMouvement(Math.sign(x.m) || -1, x); }
  else if(a === 'charge') fenetreCharge(b.dataset.id ? D.charges.find(y => y.id === b.dataset.id) : null);
  else if(a === 'cote') fenetreNombre('Ce que tu as de côté aujourd’hui', Math.round(calcul(lire()).cote * 100) / 100, (d, v) => { const diff = Math.round((v - calcul(d).cote) * 100) / 100; if(!diff) return; d.cote = {...d.cote, depart:(+d.cote.depart || 0) + diff}; d.ajCote = [...(d.ajCote || []), {id:uid(), d:iso(new Date()), m:diff, v, t:Date.now()}]; });
  else if(a === 'virer') fenetreVirement();
  else if(a === 'cat') fenetreCategorie(b.dataset.id ? D.categories.find(y => y.id === b.dataset.id) : null);
  else if(a === 'vir'){ const x = (D.virements || []).find(y => y.id === b.dataset.id); if(x) fenetreVirement(x); }
  else if(a === 'reg-ep') fenetreNombre('Mis de côté chaque mois', D.epargne, (d, v) => { if(v !== (+d.epargne || 0)){ palier(d); d.epargne = v; } });
  else if(a === 'reg-ver') fenetreNombre(`Je me verse en ${nomMois(m)}`, versement(D, m).v, (d, v) => { if(v !== versement(d, m).v || !versement(d, m).connu){ palier(d); d.versements[m] = v; } });
  else if(a === 'ver'){ const v = nombre($('#ver-in').value); if(v == null || v < 0){ $('#ver-in').focus(); return; } D = lire(); palier(D); D.versements[m] = Math.round(v * 100) / 100; ecrire(D); render(); }
});
// Si l'accueil de Mon quotidien note quelque chose, on se redessine
window.addEventListener('storage', e => { if(e.key === CLE || e.key === 'backstage_scenes_v1') render(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') render(); });
// Mon quotidien : toucher l'onglet ramène en haut ; et l'accueil peut ouvrir la fenêtre − / +
window.quotidienAccueil = () => { const d = $('#pop'); if(d.open) d.close(); render(); window.scrollTo(0, 0); };
window.quotidienThunes = {calcul:() => calcul(lire()), categories:() => lire().categories, libelle:x => libelle(lire(), x)};   // l'accueil de Mon quotidien lit la cagnotte ici (un seul calcul)
render();
</script>
